<head>

<style>

  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;

  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  .pop-leg-r { left: 54px; }
  .pop-arm { position: absolute; top: 34px; width: 24px; height: 15px; z-index: 1;

  .pop-note { position: absolute; left: 100px; width: 22px; height: 22px; opacity: 0; }
  .pop-note-1 { top: 2px; }
  .pop-note-2 { top: 10px; left: 122px; width: 16px; height: 16px; }

  /* ================= 哈士奇插画版 · 角色件 =================
     下面这组规则整段覆盖上面的方块版外观；方块版的 class 全部保留，
     因为时间轴引用的是元素变量不是 class，删 CSS 不会动动画。 */
  :root {
    --ink: #3A3540;
    --line: #4A4550;
    --fur-lit: #FDFBF7;
    --fg: #FFF8EE;

  .pop-shadow {

  .pop-hero { left: 152px; top: 52px; width: 176px; height: 146px; }

  /* 躯干：胸腔高光 + 斜向渐变 + 内外双阴影 */
  .pop-torso { position: absolute; left: 46px; top: 84px; width: 82px; height: 50px; z-index: 2;

    border: 2.5px solid var(--line); border-radius: 30px 30px 22px 22px;
    box-shadow: inset -5px -7px 12px rgba(58,53,64,.18), 2px 4px 9px rgba(26,24,32,.3);

  /* 腿 + 脚掌 + 趾垫 */
  .pop-leg { position: absolute; top: 126px; width: 21px; height: 26px; z-index: 2;

  .pop-paw { position: absolute; top: 140px; width: 22px; height: 15px; z-index: 3;

  .pop-toe { position: absolute; top: 144px; width: 3.6px; height: 3.6px; z-index: 4;

  .pop-leg-gap { position: absolute; left: 76px; top: 126px; width: 3px; height: 26px;

  /* 双臂：时间轴要摆动，所以保留 .pop-arm-l / -r 的元素与 transform-origin */
  .pop-arm { position: absolute; width: 26px; height: 15px; z-index: 1;
    background: linear-gradient(160deg, #F4EFE6 0%, #D4CCBD 100%);

  .pop-arm-r { top: 92px; left: 122px; transform-origin: 0 50%; transform: rotate(-22deg); }

  .pop-head { position: absolute; left: 32px; top: -8px; width: 104px; height: 106px; z-index: 5; }
  .pop-head svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* 尾巴：z-index 要高于躯干，否则整条压在身体后面 */
  .pop-tail { position: absolute; left: 116px; top: 86px; width: 48px; height: 26px; z-index: 3;
    background: linear-gradient(150deg, #F2EDE4 0%, #CCC4B5 100%);
    border: 2.5px solid var(--line); border-radius: 24px 24px 7px 24px;
    transform-origin: 8% 50%; transform: rotate(-36deg);
    box-shadow: 1px 3px 7px rgba(26,24,32,.3); }

  /* 待机音符跟着放大后的角色重新定位 */
  .pop-note { left: 156px; width: 24px; height: 24px; opacity: 0; color: #4A4550; }
  .pop-note-1 { top: 0; }
  .pop-note-2 { top: 12px; left: 178px; width: 18px; height: 18px; }

<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>

<script src="../templates/_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(() => {
  const FALLBACK = {"accent":"#FF6B35","accent2":"#2EC4B6","duration":3.4};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ac2', v.accent2 || FALLBACK.accent2);
  const dur = parseFloat(v.duration) || FALLBACK.duration;

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }

  // ——— 方块小角色：hero(上下呼吸) > rig(左右摇摆) > 四肢与身体 ———
  const shadow = put('div', 'pop-shadow');
  const hero = put('div', 'pop-hero');
  const rig = put('div', 'pop-rig', '', null, hero);
  const armL = put('div', 'pop-arm pop-arm-l', '', null, rig);
  const armR = put('div', 'pop-arm pop-arm-r', '', null, rig);
  // —— 角色件：躯干 / 腿 / 爪 / 尾 / 头（SVG 插画哈士奇）——
  put('div', 'pop-tail', '', null, rig);
  put('div', 'pop-torso', '', null, rig);
  put('div', 'pop-leg pop-leg-l', '', null, rig);
  put('div', 'pop-leg pop-leg-r', '', null, rig);
  put('div', 'pop-leg-gap', '', null, rig);
  put('div', 'pop-paw pop-paw-l', '', null, rig);
  put('div', 'pop-paw pop-paw-r', '', null, rig);
  put('div', 'pop-toe', 'left:57px', null, rig);
  put('div', 'pop-toe', 'left:65px', null, rig);
  put('div', 'pop-toe', 'left:85px', null, rig);
  put('div', 'pop-toe', 'left:93px', null, rig);
  const head = put('div', 'pop-head', '', null, rig);
  head.innerHTML = [
      '<svg viewBox="0 0 104 106" xmlns="http://www.w3.org/2000/svg">',
'  <defs>',
'    <radialGradient id="iFHead" cx="36%" cy="28%" r="78%">',
'      <stop offset="0%" stop-color="#FFFFFF"/>',
'      <stop offset="34%" stop-color="#F6F2EA"/>',
'      <stop offset="68%" stop-color="#E4DED2"/>',
'      <stop offset="100%" stop-color="#C3BBAB"/>',
'    </radialGradient>',
'    <linearGradient id="iFMask" x1="0.3" y1="0" x2="0.7" y2="1">',
'      <stop offset="0%" stop-color="#63636F"/>',
'      <stop offset="100%" stop-color="#3E3E4C"/>',
'    </linearGradient>',
'    <linearGradient id="iFEar" x1="0.2" y1="0" x2="0.8" y2="1">',
'      <stop offset="0%" stop-color="#DCA896"/>',
'      <stop offset="60%" stop-color="#BE8574"/>',
'      <stop offset="100%" stop-color="#9E6757"/>',
'    </linearGradient>',
'    <radialGradient id="iFIris" cx="36%" cy="30%" r="72%">',
'      <stop offset="0%" stop-color="#7A5A2E"/>',
'      <stop offset="55%" stop-color="#4A3520"/>',
'      <stop offset="100%" stop-color="#241B12"/>',
'    </radialGradient>',
'    <radialGradient id="iFNose" cx="34%" cy="22%" r="80%">',
'      <stop offset="0%" stop-color="#7C7889"/>',
'      <stop offset="45%" stop-color="#454250"/>',
'      <stop offset="100%" stop-color="#232228"/>',
'    </radialGradient>',
'    <linearGradient id="iFEarOut" x1="0.3" y1="0" x2="0.7" y2="1">',
'      <stop offset="0%" stop-color="#EDE8DE"/>',
'      <stop offset="70%" stop-color="#D2CABA"/>',
'      <stop offset="100%" stop-color="#B3AB9A"/>',
'    </linearGradient>',
'    <radialGradient id="iBlush" cx="50%" cy="50%" r="50%">',
'      <stop offset="0%" stop-color="#F2A79C" stop-opacity=".55"/>',
'      <stop offset="100%" stop-color="#F2A79C" stop-opacity="0"/>',
'    </radialGradient>',
'    <filter id="iSoft" x="-40%" y="-40%" width="180%" height="180%">',
'      <feDropShadow dx="2.4" dy="3.4" stdDeviation="2.6" flood-color="#221F28" flood-opacity="0.34"/>',
'    </filter>',
'    <filter id="iSheen" x="-30%" y="-30%" width="160%" height="160%">',
'      <feGaussianBlur stdDeviation="1.6"/>',
'    </filter>',
'  </defs>',
'  <g filter="url(#iSoft)">',
'    <path d="M18 34 L9 2 L40 19 Z" fill="url(#iFEarOut)" stroke="#4A4550" stroke-width="2.6" stroke-linejoin="round"/>',
'    <path d="M22 31 L18 10 L33 18 Z" fill="url(#iFEar)"/>',
'    <path d="M86 34 L95 2 L64 19 Z" fill="url(#iFEarOut)" stroke="#4A4550" stroke-width="2.6" stroke-linejoin="round"/>',
'    <path d="M82 31 L86 10 L71 18 Z" fill="url(#iFEar)"/>',
'  </g>',
'  <g filter="url(#iSoft)">',
'    <path d="M52 13 C74 13 92 29 92 52 C92 76 74 90 52 90 C30 90 12 76 12 52 C12 29 30 13 52 13 Z"',
'          fill="url(#iFHead)" stroke="#4A4550" stroke-width="2.6"/>',
'  </g>',
'  <path d="M52 14 C62 14 69 17 73 22 L57 27 L52 23 Z" fill="url(#iFMask)"/>',
'  <path d="M52 14 C42 14 35 17 31 22 L47 27 L52 23 Z" fill="url(#iFMask)"/>',
'  <path d="M32 29 C25 34 21 42 21 50 L31 50 C32 42 35 34 41 30 Z" fill="url(#iFMask)"/>',
'  <path d="M72 29 C79 34 83 42 83 50 L73 50 C72 42 69 34 63 30 Z" fill="url(#iFMask)"/>',
'  <path d="M48 31 L56 31 L55 54 L49 54 Z" fill="url(#iFMask)" opacity=".92"/>',
'  <g stroke="#B9B1A0" stroke-width="1.1" fill="none" opacity=".5" stroke-linecap="round">',
'    <path d="M20 56 Q22 63 25 69"/>',
'    <path d="M26 62 Q28 68 31 73"/>',
'    <path d="M34 66 Q36 72 39 76"/>',
'    <path d="M84 56 Q82 63 79 69"/>',
'    <path d="M78 62 Q76 68 73 73"/>',
'    <path d="M70 66 Q68 72 65 76"/>',
'  </g>',
'  <g filter="url(#iSheen)" opacity=".62">',
'    <ellipse cx="40" cy="27" rx="15" ry="7" fill="#FFFFFF" transform="rotate(-24 40 27)"/>',
'    <ellipse cx="66" cy="30" rx="9" ry="4.5" fill="#FFFFFF" transform="rotate(-16 66 30)"/>',
'  </g>',
'  <ellipse cx="33" cy="35" rx="6" ry="2.7" fill="#FAF7F1" opacity=".85" transform="rotate(-20 33 35)"/>',
'  <ellipse cx="71" cy="35" rx="6" ry="2.7" fill="#FAF7F1" opacity=".85" transform="rotate(20 71 35)"/>',
'  <ellipse cx="33" cy="48" rx="7" ry="8.2" fill="url(#iFIris)"/>',
'  <ellipse cx="71" cy="48" rx="7" ry="8.2" fill="url(#iFIris)"/>',
'  <circle cx="35.4" cy="44.6" r="2.7" fill="#FFFFFF" opacity=".95"/>',
'  <circle cx="73.4" cy="44.6" r="2.7" fill="#FFFFFF" opacity=".95"/>',
'  <circle cx="30.6" cy="51.4" r="1.3" fill="#FFFFFF" opacity=".5"/>',
'  <circle cx="68.6" cy="51.4" r="1.3" fill="#FFFFFF" opacity=".5"/>',
'  <path d="M26 45 Q33 38.5 40 45" stroke="#2B2731" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
'  <path d="M64 45 Q71 38.5 78 45" stroke="#2B2731" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
'  <path d="M42 56 Q52 50 62 56 Q59 68 52 69 Q45 68 42 56 Z" fill="url(#iFNose)"/>',
'  <ellipse cx="47" cy="57" rx="4" ry="2.4" fill="#FFFFFF" opacity=".55" transform="rotate(-14 47 57)"/>',
'  <ellipse cx="43.5" cy="62" rx="1.8" ry="2.6" fill="#17161C" opacity=".45"/>',
'  <ellipse cx="60.5" cy="62" rx="1.8" ry="2.6" fill="#17161C" opacity=".45"/>',
'  <path d="M52 69 L52 73" stroke="#2B2731" stroke-width="2.6" stroke-linecap="round"/>',
'  <path d="M40 73 Q46 80 52 73 Q58 80 64 73" fill="#8C4A50" stroke="#2B2731" stroke-width="2.4"',
'        stroke-linecap="round" stroke-linejoin="round"/>',
'  <path d="M45 75 Q52 79.5 59 75 Q52 83 45 75 Z" fill="#E4737C" opacity=".95"/>',
'  <ellipse cx="24" cy="62" rx="11" ry="8" fill="url(#iBlush)"/>',
'  <ellipse cx="80" cy="62" rx="11" ry="8" fill="url(#iBlush)"/>',
'  <path d="M40 88 Q52 95 64 88 L64 99 L40 99 Z" fill="#F7F4ED" stroke="#4A4550" stroke-width="2.4" stroke-linejoin="round"/>',
'  <g stroke="#C6BEAD" stroke-width="1" fill="none" opacity=".55" stroke-linecap="round">',
'    <path d="M46 91 L45 98"/>',
'    <path d="M52 92 L52 99"/>',
'    <path d="M58 91 L59 98"/>',
'  </g>',
'</svg>'

  ].join('\n');

  const note1 = put('div', 'pop-note pop-note-1', '', '♪', hero);
  const note2 = put('div', 'pop-note pop-note-2', '', '·', hero);
  note1.style.color = '#241C18';
  note2.style.color = '#241C18';

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  // 入场
  tl.fromTo(shadow, { opacity: 0, scale: .7 }, { opacity: .26, scale: 1, duration: .26, ease: 'power2.out' }, 0);
  tl.fromTo(hero, { scale: .5, opacity: 0, y: 16 },
    { scale: 1, opacity: 1, y: 0, duration: .32, ease: BBlocks.easing.commit() }, 0);

  // 循环段：repeat 用固定次数算出来，保证时间轴有限长、云渲染能扫完
  const loopStart = .34;
  const loopDur = Math.max(.6, dur - loopStart);
  const BREATH = .58, SWAY = .92, ARM = .74;
  const rBreath = Math.max(1, Math.round(loopDur / (BREATH * 2)));
  const rSway = Math.max(1, Math.round(loopDur / (SWAY * 2)));
  const rArm = Math.max(1, Math.round(loopDur / (ARM * 2)));

  // 上下微弹
  tl.to(hero, { y: -6, scaleY: 1.04, scaleX: .97, duration: BREATH, ease: BBlocks.easing.breathe(),
    yoyo: true, repeat: rBreath }, loopStart);

  // 身体轻微摇摆（摇的是 rig 层，四肢和躯干一起拧，方形本身不变形）
  tl.to(rig, { rotate: 2.6, duration: SWAY, ease: BBlocks.easing.breathe(), yoyo: true, repeat: rSway }, loopStart);

  // 手臂摆动（错开相位，像轻轻晃）
  tl.to(armL, { rotate: -16, duration: ARM, ease: BBlocks.easing.breathe(), yoyo: true, repeat: rArm }, loopStart);
  tl.to(armR, { rotate: 16, duration: ARM, ease: BBlocks.easing.breathe(), yoyo: true, repeat: rArm }, loopStart + ARM * .5);

  // 影子随呼吸轻微缩放
  tl.to(shadow, { scaleX: .9, scaleY: .85, duration: BREATH, ease: BBlocks.easing.breathe(),
    yoyo: true, repeat: rBreath }, loopStart);

  // 小音符飘起
  const noteTimes = [];
  let nt = loopStart + .5;
  while (nt < dur - .35) { noteTimes.push(nt); nt += .78; }
  noteTimes.forEach((t, i) => {
    const el = i % 2 ? note2 : note1;
    tl.fromTo(el, { opacity: 0, y: 6, scale: .5, rotate: -12 },
      { opacity: .8, y: -8, scale: 1, rotate: 10, duration: .3, ease: 'back.out(2.6)' }, t);
    tl.to(el, { opacity: 0, y: -22, duration: .32, ease: 'power2.in' }, t + .3);
  });

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
