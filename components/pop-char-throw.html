/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

  tl.to(shout, { opacity: 0, y: -14, duration: .18, ease: 'power2.in' }, 1.16);

  // 投完身体回正
  tl.to(hero, { scaleY: 1, scaleX: 1, y: 0, rotate: 0, duration: .24, ease: 'back.out(2.6)' }, .84);
  tl.to(armR, { rotate: 6, duration: .28, ease: 'back.out(2.4)' }, .82);
  tl.to(armL, { rotate: 0, duration: .28, ease: 'back.out(2.4)' }, .82);
  tl.to(shadow, { scaleX: 1, scaleY: 1, duration: .26, ease: 'back.out(2)' }, .82);

  // 1.54 落地压扁 → 弹起 → 再落地弹两下
  tl.to(cube, { scaleY: .70, scaleX: 1.28, duration: .08, ease: 'power2.out' }, 1.54);
  tl.to(cube, { scaleY: 1, scaleX: 1, duration: .1, ease: 'back.out(3.4)' }, 1.62);
  tl.to(cube, { y: GROUND - 21, duration: .16, ease: 'power2.out' }, 1.68);
  tl.to(cube, { y: GROUND, scaleY: .80, scaleX: 1.16, duration: .18, ease: 'power2.in' }, 1.84);
  tl.to(cube, { scaleY: 1, scaleX: 1, duration: .12, ease: 'back.out(3.6)' }, 2.02);
  tl.to(cube, { y: GROUND - 9, duration: .14, ease: 'power2.out' }, 2.14);
  tl.to(cube, { y: GROUND, scaleY: .86, scaleX: 1.08, duration: .15, ease: 'power2.in' }, 2.28);
  tl.to(cube, { scaleY: 1, scaleX: 1, duration: .14, ease: 'back.out(4)' }, 2.43);

  // 落地的扬尘
  tl.fromTo(ring, { scale: .24, opacity: .9 }, { scale: 1.8, opacity: 0, duration: .46, ease: 'power2.out' }, 1.54);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
