/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

  head.innerHTML = [
'<svg viewBox="0 0 104 106" xmlns="http://www.w3.org/2000/svg">',

'  </defs>',
'',
'  <!-- 立耳：外毛 + 内耳绒面，整体带柔影 -->',
'  <g filter="url(#soft)">',

  const waveArm = put('div', 'pop-wave-arm', '', null, hero);

  put('div', 'pop-palm', '', null, hand);
  put('div', 'pop-pad', 'left:11px;top:13px;width:6px;height:6px', null, hand);

  const tl = gsap.timeline({ paused: true });

    tl.to(arc1, { opacity: 0, duration: .14, ease: 'power2.in' }, at + .12);
    if (i === 1 || i === 3) {
      tl.fromTo(arc2, { opacity: 0, scaleX: .5 }, { opacity: .45, scaleX: 1, duration: .1, ease: 'power2.out' }, at + .02);
      tl.to(arc2, { opacity: 0, duration: .14, ease: 'power2.in' }, at + .12);
    }
    at += STEP;
  });

  tl.to(waveArm, { rotate: -92, duration: .2, ease: 'back.out(2.2)' }, at + .05);
  tl.to(hero, { rotate: -1.6, duration: .2, ease: 'back.out(2.2)' }, at + .05);
  tl.to(hi, { opacity: 0, y: -14, duration: .18, ease: 'power2.in' }, Math.max(at + .5, dur - .48));

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));

  tl.play(0);
})();
</script>
