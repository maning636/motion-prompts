<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"name","name":"姓名","type":"string","label":"姓名 / 主标题（≤6 字）","default":"李知遥"},
{"id":"role","name":"头衔","type":"string","label":"头衔 / 说明（≤14 字）","default":"独立播客主理人 · 每周三更新"},
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono 标签，≤8 字）","default":"HOST"},
{"id":"tag","name":"角标","type":"string","label":"角标（标题块上的 mono 大字，≤5 字）","default":"LIVE"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（标题块底色 / 凸点亮起色）","default":"#FFD429"},
{"id":"shadow","name":"阴影色","type":"color","label":"阴影色（深色直播画面用白 #FFFFFF，亮画面切 #0F0F0F）","default":"#FFFFFF"},
{"id":"brickColor","name":"配色包","type":"enum","label":"配色包（横条面色；与强调色撞色时自动退回墨条反白）","default":"mixed","options":[{"value":"yellow","label":"暖黄"},{"value":"pink","label":"桃粉"},{"value":"green","label":"薄荷"},{"value":"blue","label":"靛蓝"},{"value":"mixed","label":"墨条反白"}]},
{"id":"layout","name":"版式","type":"enum","label":"版式（标题块在横条右端 / 在横条左端）","default":"rail","options":[{"value":"rail","label":"标题块卡右端"},{"value":"corner","label":"标题块卡左端"}]},
{"id":"duration","name":"时长","type":"number","label":"时长（秒，5）","default":5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>底部横条推入</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 积木风 · 直播贴片 · 底部横条推入（透明底 1920×1080）
     底部一条 720×120 的横条从左沿轨道推入落位，标题块随后从上方压下来卡在横条一端，
     两块的 3px 描边在接缝处重叠成一条单线（基因 2）。标题块顶面立两枚凸点。
     透明底变体：--paper 全程不出现，满屏网点整块删掉，硬阴影走 --shadow 变量。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --mod:240px; --mod-h:120px; --shadow:#FFFFFF; --background:transparent; --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--background);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  .sh-s{box-shadow:4px 4px 0 var(--shadow)}
  .sh-l{box-shadow:8px 8px 0 var(--shadow)}

  /* 横条 720×120 */
  .rail{position:absolute;left:120px;top:864px;width:720px;height:120px;
    display:flex;align-items:center;gap:24px;padding:0 32px;background:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--shadow)}
  .rail .nm{flex:0 1 auto;font-size:56px;font-weight:900;line-height:1.06;letter-spacing:0;
    color:var(--white);white-space:nowrap}
  .rail .rl{flex:0 1 auto;margin-left:auto;font-family:var(--mono);font-size:26px;
    font-weight:700;letter-spacing:.04em;color:var(--white);white-space:nowrap}

  /* 标题块 240×120：与横条重叠 3px，接缝合成单线 */
  .head{position:absolute;left:837px;top:864px;width:240px;height:120px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  .head .eb{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.14em;
    color:var(--ink);white-space:nowrap}
  .head .tg{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:.04em;
    color:var(--ink);white-space:nowrap}

  /* 凸点 2 联，立在标题块顶面（width/height 必须同时写） */
  .studs{position:absolute;left:837px;top:804px;width:240px;height:60px}
</style>
</head>
<body>
<div id="stage">
  <div class="rail" id="rail">
    <span class="nm" id="name" data-fit-max="56" data-fit-min="26">李知遥</span>
    <span class="rl" id="role" data-fit-max="26" data-fit-min="15">独立播客主理人 · 每周三更新</span>
  </div>

  <div class="head" id="head">
    <span class="eb" id="eyebrow" data-fit-max="24" data-fit-min="14">HOST</span>
    <span class="tg" id="tag" data-fit-max="40" data-fit-min="20">LIVE</span>
  </div>

  <div class="studs" id="studs">
    <svg width="240" height="60" viewBox="0 0 240 60" fill="none" aria-hidden="true">
      <circle class="sc" id="s1" cx="60"  cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      <circle class="sc" id="s2" cx="180" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
    </svg>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['name', 'role', 'eyebrow', 'tag'].forEach(function (k) { set(k, v[k]); });

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var rs = document.documentElement.style;
  rs.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  rs.setProperty('--shadow', v.shadow || (isT ? '#FFFFFF' : '#0F0F0F'));
  if (v.accent) rs.setProperty('--accent', v.accent);
  var ACC = v.accent || '#FFD429';
  var SH = v.shadow || (isT ? '#FFFFFF' : '#0F0F0F');
  var SHADOW_L = '8px 8px 0 ' + SH;
  var SHADOW_S = '4px 4px 0 ' + SH;

  /* 配色包只管横条面色。标题块恒为强调色，两者撞色时横条自动退回墨条反白，
     保证同屏不出现两个同色块（基因 7）——这条是现算的，不靠用户自己配。 */
  var PACK = {
    yellow: '#FFD429', pink: '#FF5FA2', green: '#2FD07A',
    blue: '#3D7BFF', mixed: '#0F0F0F'
  };
  var face = PACK[v.brickColor] || PACK.mixed;
  if (face === ACC) face = '#0F0F0F';
  function inkOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return '#0F0F0F';
    var f = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * f(parseInt(h.slice(0, 2), 16)) +
            0.7152 * f(parseInt(h.slice(2, 4), 16)) +
            0.0722 * f(parseInt(h.slice(4, 6), 16));
    return L > 0.42 ? '#0F0F0F' : '#FFFFFF';
  }
  var rail = document.getElementById('rail');
  if (rail) {
    rail.style.background = face;
    ['nm', 'rl'].forEach(function (c) {
      var t = rail.querySelector('.' + c);
      if (t) t.style.color = inkOn(face);
    });
  }

  /* 版式：标题块卡在横条右端（默认）或左端，两块永远重叠 3px 合成单线缝。
     凸点跟着标题块走，位置按实测盒子算，不写死坐标。 */
  var layout = v.layout || 'rail';
  var head = document.getElementById('head');
  var studs = document.getElementById('studs');
  if (layout === 'corner') {
    if (head) head.style.left = '120px';
    if (rail) rail.style.left = '357px';
  }
  B.fitAll();
  var hr = head.getBoundingClientRect();
  if (studs) {
    studs.style.left = Math.round(hr.left) + 'px';
    studs.style.top = Math.round(hr.top) - 60 + 'px';
  }
  var circles = [].slice.call(document.querySelectorAll('#studs .sc'));

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var tl = B.tl();

  if (reduce) {
    /* 降级：横向推入与压影全撤掉。透明底禁用 opacity 淡出，只留 ≤8px 微位移。 */
    gsap.set('#rail',  { x: 0, y: 0, opacity: 1, boxShadow: SHADOW_L });
    gsap.set('#head',  { x: 0, y: 0, opacity: 1, boxShadow: SHADOW_L });
    gsap.set('#studs', { x: 0, y: 0, opacity: 1 });
    if (circles.length) gsap.set(circles, { attr: { fill: ACC } });
    tl.fromTo('#rail',  { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .50, ease: 'power3.out' }, 0);
    tl.fromTo('#head',  { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, .16);
    tl.fromTo('#studs', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .30);
    B.hold(tl, 1.10, 1.10);
    return;
  }

  var stageRect = document.getElementById('stage').getBoundingClientRect();

  /* 式 5 轨道推入：横条从左沿轨道推进终点格位，起点正好贴画布左沿 */
  var railBox = rail.getBoundingClientRect();
  var dx = Math.round(stageRect.left - railBox.left);
  tl.fromTo('#rail', { x: dx }, { x: 0, duration: 0.26, ease: 'power4.out' }, 0.00);
  tl.set('#rail', { boxShadow: '8px 11px 0 ' + SH, immediateRender: false }, 0.26);
  tl.to('#rail', { boxShadow: SHADOW_L, duration: 0.04, ease: 'steps(2)' }, 0.30);

  /* 标题块随后从上方压下来卡在横条一端 */
  var headBox = head.getBoundingClientRect();
  tl.fromTo('#head', { y: -Math.round(headBox.top - stageRect.top) },
    { y: 0, duration: 0.24, ease: 'power4.out' }, 0.52);
  tl.set('#head', { boxShadow: '8px 11px 0 ' + SH, immediateRender: false }, 0.76);
  tl.to('#head', { boxShadow: SHADOW_L, duration: 0.04, ease: 'steps(2)' }, 0.80);

  /* 两枚凸点逐个硬切亮起（式 8） */
  tl.set(circles, { attr: { fill: '#FFFFFF' }, immediateRender: false }, 1.00);
  circles.forEach(function (c, i) {
    tl.set(c, { attr: { fill: ACC }, immediateRender: false }, 1.04 + i * 0.14);
  });

  var introEnd = tl.duration();
  var TOTAL = Math.min(6, Math.max(4.5, Number(v.duration) || 5));
  var holdAt = Math.min(introEnd, TOTAL - 0.8);
  B.hold(tl, holdAt, Math.max(0.8, TOTAL - holdAt));
})();
</script>
</body></html>
