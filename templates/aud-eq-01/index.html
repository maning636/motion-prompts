<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"EQ / 中线均衡"},
  {"id":"titleA","name":"主标题 · 前段","type":"string","label":"主标题第一行（普通字）","default":"把低频放在"},
  {"id":"titleB","name":"主标题 · 彩色词块","type":"string","label":"主标题第二行（强调色块里的词）","default":"正中"},
  {"id":"sub","name":"副标题","type":"string","label":"副标题（一行短句）","default":"低频是胸腔，中频是字，高频是齿——三段各有落点"},
  {"id":"deck","name":"频段说明","type":"string","label":"底部频段 mono 说明","default":"20Hz · 1kHz · 20kHz"},
  {"id":"peaks","name":"音频包络","type":"string","label":"离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）","default":"439,665,101,267,614,80,374,608,792,89,199,484,86,861,184,326,341,427,635,766,86,240,614,318,368,134,614,83,1000,377,39,282,490,98,804,116,326,665,632,47,199,561,86,774,122,763,335,15"},
  {"id":"accent","name":"强调色","type":"color","label":"强调色（高频段柱 / 播放头 / 斜纹带）","default":"#3D7BFF"},
  {"id":"duration","name":"总时长","type":"number","label":"总时长（秒，须等于音轨长度 5.6）","default":5.6},
  {"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>中线均衡条 · 把低频放在正中</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 音频驱动族（第 2 批 · aud 族）· 中线镜像均衡条子型
     与 aud-wave-01 的差别不只是版式：波形件是「单向柱 + 播放线」，
     均衡件是**上下镜像**——低频坐在中线上，字重最重的一根刚好压住画面中线。
     音频路线与波形件完全一致（离线包络 + 时间轴纯函数 + 同源真音轨）。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-w{box-shadow:8px 8px 0 var(--white)}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--accent);color:var(--ink);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--ink);color:var(--yellow);padding:3px 14px;border-radius:9999px}
  .promo .parw{color:var(--ink);font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:40px 72px 34px}

  .hd{flex:0 0 auto;display:flex;align-items:baseline;gap:24px}
  .hd .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stack{flex:0 0 auto;margin-top:26px}
  .line{display:block;font-size:92px;font-weight:900;line-height:1.06;letter-spacing:0;
    color:var(--white);white-space:nowrap}
  .chip{display:inline-block;line-height:1;padding:0 20px;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .sub{margin-top:16px;font-size:30px;font-weight:700;line-height:1.4;letter-spacing:0;
    color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 均衡区：上下镜像，3px 中线是唯一分隔（BLOCKBRUT 基因 7） */
  .eq{flex:0 0 auto;position:relative;height:392px;margin-top:38px;display:flex;
    justify-content:space-between;align-items:center;padding:0 18px;overflow:hidden}
  .eq .col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .eq i{display:block;width:26px;height:8px;border-radius:9999px;background:var(--yellow)}
  .eq i.up{background:var(--accent)}
  .eq .mid{flex:0 0 auto;position:absolute;left:0;right:0;top:50%;height:var(--bw);
    background:var(--white);transform:translateY(-1.5px);z-index:4}

  /* 底部刻度尺：播放头是一枚在 mono 刻度上滑动的方块。
     它是 #stage 的直接子元素——motion-qc 的帧指纹只统计 #stage 直接子元素的
     内联样式长度，translateX 的连续小数就是「音频在动」的可计量证据。 */
  #head{position:absolute;left:72px;width:34px;height:34px;background:var(--accent);
    border:var(--bw) solid var(--white);z-index:6}

  .deck{flex:0 0 auto;margin-top:auto;display:flex;align-items:center;gap:24px;
    border-top:var(--bw) solid var(--white);padding-top:20px}
  .deck .dm{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.14em;
    color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck .ticks{flex:1 1 auto;display:flex;justify-content:space-between;min-width:0;
    border-bottom:var(--bw) dashed var(--white);padding-bottom:8px}
  .deck .ticks i{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.06em;
    color:var(--mute);font-style:normal;white-space:nowrap}
  .deck .tc{font-family:var(--mono);font-weight:900;font-size:26px;letter-spacing:.08em;
    color:var(--white);font-variant-numeric:tabular-nums;white-space:nowrap}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--white);color:var(--ink)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--blue)}
  .foot .fc{font-size:25px;font-weight:700;letter-spacing:0}

  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让所有内联样式改动
       都变成 0.01ms 过渡；#head 的 inline top 在降级分支里卡在旧值就是被抽帧审计逮到的。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }
  #head{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">NEW</span><span class="ptx">中线均衡条 · 上下镜像 + 刻度播放头</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="hd">
      <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">EQ / 中线均衡</span>
    </div>
    <div class="stack">
      <span class="line anim" id="titleA" data-fit-max="92" data-fit-min="46">把低频放在</span>
      <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="92" data-fit-min="46">正中</span></span>
      <p class="sub anim" id="sub" data-fit-max="30" data-fit-min="17">低频是胸腔，中频是字，高频是齿——三段各有落点</p>
    </div>
    <div class="eq" id="eq"><span class="mid"></span></div>
    <div class="deck">
      <span class="dm anim" id="deck" data-fit-max="24" data-fit-min="15">20Hz · 1kHz · 20kHz</span>
      <span class="ticks"><i>0s</i><i>1s</i><i>2s</i><i>3s</i><i>4s</i><i>5s</i></span>
      <span class="tc anim" id="tc">00:00 / 00:05</span>
    </div>
  </div>

  <div id="head"></div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fm">AUD / 2026</span><span class="fc">镜像到中线，低频才有重量</span>
  </div>
</div>
<!-- 音轨：与波形件同一条路线——页面挂同源音频供预览，渲染时由 hyperframes
     在 Node 侧按 src 离线取文件、裁剪、混流、封装进输出。 -->
<!-- [公开版] 原音轨 音轨 voice-02.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* 离线 RMS 包络：来自 音轨 voice-02.wav（未随仓分发），换音轨后用离线脚本重算这条数组。
     绝不接实时 AnalyserNode——无头渲染是逐帧 seek，媒体在采集模式下是 seek 不是 play。 */
  var FALLBACK_PEAKS = '439,665,101,267,614,80,374,608,792,89,199,484,86,861,184,326,341,427,635,766,86,240,614,318,368,134,614,83,1000,377,39,282,490,98,804,116,326,665,632,47,199,561,86,774,122,763,335,15';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','titleA','titleB','sub','deck'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var COLS = 24;
  var N = PEAKS.length;
  var MAXH = 176, MINH = 10;
  var SEG = WIN / N;
  /* 镜像频率栅格：中线正中间那根永远是最低频，两侧按对数间距铺开，
     所以「低频坐在正中」是布局算出来的，不是碰巧。 */
  var MIDCOL = Math.floor((COLS - 1) / 2);
  function bandGain(c) {
    var d = (c - MIDCOL) / MIDCOL;          // 0 = 正中，±1 = 两端
    return 1 - 0.42 * Math.abs(d);          // 两端压 42%，权重往中线聚
  }
  function colAt(c, k) {
    var idx = Math.floor(k * (N / (COLS / 3)) + c * (N / (COLS * 2.2))) % N;
    return Math.max(MINH, Math.round(PEAKS[idx] / 1000 * MAXH * bandGain(c)));
  }
  function colsAt(k) {
    var out = [];
    for (var c = 0; c < COLS; c++) out.push(colAt(c, k));
    return out;
  }

  var eq = document.getElementById('eq');
  var ups = [], dns = [];
  for (var c = 0; c < COLS; c++) {
    var col = document.createElement('span');
    col.className = 'col';
    var up = document.createElement('i');
    up.className = 'up';
    var dn = document.createElement('i');
    col.appendChild(up); col.appendChild(dn);
    eq.appendChild(col);
    ups.push(up); dns.push(dn);
  }

  B.fitAll();

  /* 播放头的起点贴着底部刻度尺的实际盒子量（建补间前量一次，不是回调里的测量） */
  var head = document.getElementById('head');
  var tr = document.querySelector('.deck .ticks').getBoundingClientRect();
  var sr = document.getElementById('stage').getBoundingClientRect();
  var SPAN = Math.max(10, tr.width - 34);
  head.style.left = (tr.left - sr.left) + 'px';
  head.style.top = (tr.bottom - sr.top + 10) + 'px';

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function pressW(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }

  if (reduce) {
    /* 降级：均衡条停成静态剪影（中线两侧对称的定格形状），播放头停在 62%，
       时间码停在 00:03。只保留 ≤8px 微位移淡入。 */
    var still = colsAt(Math.round(N * 0.62));
    gsap.set(ups, { height: function (i) { return still[i]; } });
    gsap.set(dns, { height: function (i) { return Math.max(MINH, Math.round(still[i] * 0.62)); } });
    gsap.set('#head', { x: SPAN * 0.62, y: 0, opacity: 1 });
    gsap.set('#tc', { textContent: '00:03 / 00:05' });
    tl.fromTo('#promo',  { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#main',   { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .12);
    tl.fromTo('#head',   { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .26);
    tl.fromTo('#stripe', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .34);
    tl.fromTo('#foot',   { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .42);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#eyebrow', 0.16, 0, -20, 0.22);
  slam('#titleA', 0.34, -34, -34, 0.28);
  slam('#lineB', 0.52, -34, -34, 0.28);
  pressW('#titleB', '8px 8px 0 ' + '#FFFFFF', 0.80);
  slam('#sub', 0.74, 0, -20, 0.24);
  slam('#eq', 0.88, 0, 24, 0.26);

  /* ---- 音频驱动：上下两排柱共用同一条时间轴 ---- */
  for (var k = 0; k < N; k++) {
    var hs = colsAt(k);
    var upFn = (function (h) { return function (i) { return h[i]; }; })(hs);
    var dnFn = (function (h) { return function (i) { return Math.max(MINH, Math.round(h[i] * 0.62)); }; })(hs);
    tl.to(ups, { height: upFn, duration: SEG, ease: 'none' }, k * SEG);
    tl.to(dns, { height: dnFn, duration: SEG, ease: 'none' }, k * SEG);
  }
  tl.fromTo('#head', { x: 0 }, { x: SPAN, duration: WIN, ease: 'none' }, 0);
  var tcEl = document.getElementById('tc');
  for (var s = 0; s <= Math.floor(WIN); s++) {
    var txt = '00:' + (s < 10 ? '0' + s : String(s)) + ' / 00:0' + Math.ceil(WIN);
    tl.set(tcEl, { textContent: txt }, s);
  }

  slam('#foot', 0.96, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.08);

  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
