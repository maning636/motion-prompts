     会把它整个替换掉。谁先加载谁的东西就没了，表现是 B.pack is not a function。 -->
<script src="../_lib/packs.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eb', v.eyebrow); set('h1', v.title);
  set('rt0', v.root); set('rt1', v.branchA); set('rt2', v.branchB);
  set('lt0', v.leafA1); set('lt1', v.leafA2);
  set('lt2', v.leafB1); set('lt3', v.leafB2);

  tl.fromTo('#eb', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .08);
  tl.fromTo('#r0', { opacity: 0, y: -24, scale: .96 },
      { opacity: 1, y: 0, scale: 1, duration: .5, ease: 'power3.out' }, .3);

  /* 两条分支从根节点往下长：连线先画，盒子后落。
     顺序反过来就会觉得盒子凭空冒出来。
     竖线用 scaleY、横线用 scaleX，原点在各自的上边/左边，
     所以 12 根线的出现顺序能直接读出树的生长方向。 */
  tl.fromTo('#r1', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .42 }, .66);
  tl.fromTo('#r2', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: .42 }, .8);
  ['#w1', '#w3', '#w4'].forEach(function (s, k) {
    tl.fromTo(s, { scaleY: 0, transformOrigin: '50% 0' },
        { scaleY: 1, duration: .34, ease: 'power2.out' }, .58 + k * .06);
  });
  tl.fromTo('#w2', { scaleX: 0, transformOrigin: '0% 50%' },
      { scaleX: 1, duration: .4, ease: 'power2.out' }, .7);
  var leaves = ['#l0', '#l1', '#l2', '#l3'];
  leaves.forEach(function (sel, k) {
    tl.fromTo(sel, { opacity: 0, y: 26, scale: .94 },
        { opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.8)' }, 1.16 + k * .13);
  });
  tl.fromTo('#w5', { scaleY: 0, transformOrigin: '50% 0' },
      { scaleY: 1, duration: .3, ease: 'power2.out' }, 1.1);
  tl.fromTo('#w9', { scaleY: 0, transformOrigin: '50% 0' },
      { scaleY: 1, duration: .3, ease: 'power2.out' }, 1.18);
  tl.fromTo('#w6', { scaleX: 0, transformOrigin: '0% 50%' },
      { scaleX: 1, duration: .32, ease: 'power2.out' }, 1.3);
  tl.fromTo('#w10', { scaleX: 0, transformOrigin: '0% 50%' },
      { scaleX: 1, duration: .32, ease: 'power2.out' }, 1.38);
  ['#w7', '#w8', '#w11', '#w12'].forEach(function (s, k) {
    tl.fromTo(s, { scaleY: 0, transformOrigin: '50% 0' },
        { scaleY: 1, duration: .26, ease: 'power2.out' }, 1.5 + k * .07);
  });
  tl.fromTo('#fline', { width: 0 }, { width: 200, duration: .5, ease: 'power3.out' }, 2.3);
  tl.fromTo('#foot', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5 }, 2.42);
  B.hold(tl, 3.7, .6);
  B.fitAll();

})();
</script>
