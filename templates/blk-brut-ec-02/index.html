<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","name":"主标题","type":"string","label":"主标题（中文大字，一行）","default":"今天下单只要这个数"},{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"FINAL / 到手价"},{"id":"badge","name":"角标","type":"string","label":"右上角胶囊角标","default":"已含运费险"},{"id":"price","name":"到手价","type":"number","label":"到手价（元）","default":129},{"id":"unit","name":"单位","type":"string","label":"计价单位（件 / 双 / 套）","default":"件"},{"id":"note","name":"口径说明","type":"string","label":"底部口径说明（一行 mono）","default":"含平台券 · 无需凑单 · 24 小时内发货"},{"id":"wasLabel","name":"对照标签","type":"string","label":"对照标签（价格牌下方的小标签）","default":"日常价 ¥199"},{"id":"accent","name":"强调色","type":"color","label":"强调色（价格牌底 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="中央纵向构图：顶部眉标行、中部一整块强调色价格牌压着巨型到手价数字，底部一条口径说明，落定后斜纹带匀速滚动">
<title>到手价大字牌 · 今天下单只要这个数</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-l{box-shadow:8px 8px 0 var(--ink)}
  .sh-xl{box-shadow:10px 10px 0 var(--ink)}

  /* 眉标行：左 mono 眉标 + 右胶囊角标，整块纸底，靠 3px 实线与主体分隔 */
  .hd{flex:0 0 auto;display:flex;align-items:center;gap:24px;
    padding:44px 88px 30px;border-bottom:var(--bw) solid var(--ink)}
  .hd .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em}
  .hd .bg{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;display:inline-flex;align-items:center;gap:14px;
    padding:8px 24px;border-radius:9999px;background:var(--ink);color:var(--yellow);
    font-size:24px;font-weight:700}

  /* 中央主体：中文大标题 + 整块价格牌，纵向居中 */
  .hero{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:40px;padding:44px 88px;
    border-bottom:var(--bw) solid var(--ink);overflow:hidden}
  .title{display:block;white-space:nowrap;font-weight:900;font-size:96px;
    line-height:1.06;letter-spacing:0;text-align:center}

  /* 价格牌：一整块强调色 + 3px 黑边 + 10px 硬阴影，数字压在里面 */
  .plate{display:flex;align-items:baseline;justify-content:center;gap:18px;
    padding:34px 96px 40px;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:10px 10px 0 var(--ink);
    max-width:100%}
  .cur{font-family:var(--mono);font-weight:900;font-size:96px;line-height:1;letter-spacing:0}
  .num{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:280px;line-height:.92;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .un{font-family:var(--mono);font-weight:700;font-size:44px;letter-spacing:.06em}

  .was{display:inline-flex;align-items:center;gap:16px;padding:10px 26px;
    background:var(--white);color:var(--ink);border:var(--bw) solid var(--ink);
    border-radius:9999px;font-size:26px;font-weight:700;white-space:nowrap;
    max-width:100%;overflow:hidden;text-overflow:ellipsis}

  /* 底部口径条：ink 底白字，整块反白（基因 10） */
  .meta{flex:0 0 auto;display:flex;align-items:center;gap:24px;
    padding:26px 88px;background:var(--ink);color:var(--white)}
  .meta .k{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .meta .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:28px;font-weight:700}

  /* 斜纹带：周期 10px + 10px，45° repeating */
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eb anim" id="eyebrow" data-fit-max="26" data-fit-min="16">FINAL / 到手价</span>
    <span class="bg anim" id="badge" data-fit-max="24" data-fit-min="15">已含运费险</span>
  </div>

  <div class="hero anim" id="hero">
    <div class="title anim" id="title" data-fit-max="96" data-fit-min="44">今天下单只要这个数</div>
    <div class="plate anim" id="plate">
      <span class="cur">¥</span>
      <span class="num anim" id="num" data-fit-max="280" data-fit-min="120">129</span>
      <span class="un" id="unit">件</span>
    </div>
    <span class="was anim" id="wasLabel" data-fit-max="26" data-fit-min="15">日常价 ¥199</span>
  </div>

  <div class="meta anim" id="meta">
    <span class="k">NOTE</span>
    <span class="tx anim" id="note" data-fit-max="28" data-fit-min="17">含平台券 · 无需凑单 · 24 小时内发货</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'badge', 'title', 'wasLabel', 'note', 'unit']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var price = Number(v.price);
  if (!isFinite(price)) price = 0;
  set('num', String(Math.round(price)));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#hero',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#meta',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',       0.00,   0, -34, 0.24);
  slam('#eyebrow',  0.12, -24, -20, 0.22);
  slam('#badge',    0.18,  24, -20, 0.22);
  slam('#title',    0.32, -28, -28, 0.26);
  /* 大面积弹入用 power3.out + from:.86，起始缩到 0.86 保住弹出观感，
     面积单调涨到末帧——back.out 的过冲峰会被 settle 挑中（blocks.js 警告） */
  tl.fromTo('#plate', { scale: .86, opacity: 0 },
      { scale: 1, opacity: 1, duration: .3, ease: 'power3.out' }, 0.54);
  tl.fromTo('#num', { y: 40 }, { y: 0, duration: .28, ease: 'power4.out' }, 0.72);
  shadowBounce('#plate', '10px 10px 0 ' + INK, 1.08);
  slam('#wasLabel', 1.20,   0, -20, 0.22);
  slam('#meta',     1.34,   0,  28, 0.26);
  slam('#note',     1.48, -24,  -20, 0.22);
  slam('#stripe',   1.60,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 1.84);

  var introEnd = 3.04;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
