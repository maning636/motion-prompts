<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（中央焦点上方的 mono 字）","default":"FREE SHIP / 包邮"},{"id":"bigNum","name":"运费数字","type":"number","label":"运费金额（元）","default":0},{"id":"bigUnit","name":"单位","type":"string","label":"数字后的单位","default":"元运费"},{"id":"c1","name":"条件 1","type":"string","label":"左上角条件","default":"满 99 全场包邮"},{"id":"c2","name":"条件 2","type":"string","label":"右上角条件","default":"不含偏远地区"},{"id":"c3","name":"条件 3","type":"string","label":"左下角条件","default":"48 小时内发出"},{"id":"c4","name":"条件 4","type":"string","label":"右下角条件","default":"破损包赔"},{"id":"note","name":"口径说明","type":"string","label":"底部口径说明（一行 mono）","default":"口径：单笔实付满 99 · 港澳台与新疆西藏另行计算"},{"id":"accent","name":"强调色","type":"color","label":"强调色（中央色块 / 斜纹带）","default":"#2FD07A"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="四角角标加中央焦点构图：画面四个角各压一枚包邮条件角标，中央一块强调色方牌压着巨型运费数字">
<title>包邮四角 · 满 99 全场包邮</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}

  /* 四角角标：直接子元素，各自贴角，互不重叠 */
  .corner{position:absolute;display:flex;align-items:center;gap:16px;
    padding:16px 32px;border:var(--bw) solid var(--ink);border-radius:9999px;
    box-shadow:6px 6px 0 var(--ink);font-size:30px;font-weight:900;
    white-space:nowrap;max-width:720px;overflow:hidden;text-overflow:ellipsis}
  .corner .sq{flex:0 0 auto;width:20px;height:20px;background:var(--ink);
    border-radius:4px}
  .c1{top:76px;left:88px;background:var(--white)}
  .c2{top:76px;right:88px;background:var(--yellow)}
  .c3{bottom:148px;left:88px;background:var(--white)}
  .c4{bottom:148px;right:88px;background:var(--ink);color:var(--accent);
      box-shadow:6px 6px 0 var(--accent)}
  .c4 .sq{background:var(--accent)}

  /* 中央焦点：一块强调色方牌 */
  .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:18px;
    padding:34px 88px 40px;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:10px 10px 0 var(--ink)}
  .mid .eb{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--ink)}
  .mid .row{display:flex;align-items:baseline;gap:20px}
  .mid .n{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:280px;line-height:.9;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .mid .u{font-family:var(--mono);font-weight:700;font-size:48px;letter-spacing:.06em}

  .note{position:absolute;left:0;right:0;bottom:80px;display:flex;
    align-items:center;justify-content:center;gap:20px;padding:0 88px}
  .note .sq{flex:0 0 auto;width:20px;height:20px;background:var(--ink);border-radius:4px}
  .note .tx{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{position:absolute;left:0;right:0;bottom:0;height:20px;
    border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="corner c1 anim" id="c1"><span class="sq"></span><span id="c1t" data-fit-max="30" data-fit-min="17">满 99 全场包邮</span></div>
  <div class="corner c2 anim" id="c2"><span class="sq"></span><span id="c2t" data-fit-max="30" data-fit-min="17">不含偏远地区</span></div>

  <div class="mid anim" id="mid">
    <span class="eb anim" id="eyebrow" data-fit-max="26" data-fit-min="16">FREE SHIP / 包邮</span>
    <div class="row">
      <span class="n anim" id="n" data-fit-max="280" data-fit-min="120">0</span>
      <span class="u" id="bigUnit">元运费</span>
    </div>
  </div>

  <div class="corner c3 anim" id="c3"><span class="sq"></span><span id="c3t" data-fit-max="30" data-fit-min="17">48 小时内发出</span></div>
  <div class="corner c4 anim" id="c4"><span class="sq"></span><span id="c4t" data-fit-max="30" data-fit-min="17">破损包赔</span></div>

  <div class="note anim" id="note">
    <span class="sq"></span>
    <span class="tx" id="noteTx" data-fit-max="24" data-fit-min="15">口径：单笔实付满 99 · 港澳台与新疆西藏另行计算</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'c1t', 'c2t', 'c3t', 'c4t', 'noteTx', 'bigUnit']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var n = Number(v.bigNum);
  if (!isFinite(n)) n = 0;
  set('n', String(Math.round(n)));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    gsap.set('#mid', { x: '-50%', y: '-50%' });
    tl.fromTo('#c1',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#c2',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .1);
    tl.fromTo('#mid', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .2);
    tl.fromTo('#c3',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .35);
    tl.fromTo('#c4',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .45);
    tl.fromTo('#note',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .55);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .65);
    B.hold(tl, 1.4, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  /* 四枚角标从各自角落斜向拍入，方向对角对称 */
  tl.fromTo('#c1', { x: -60, y: -40 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0.00);
  tl.fromTo('#c2', { x: 60, y: -40 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0.10);
  /* 大面积方牌：power3.out + from:.86，面积单调涨到末帧 */
  tl.fromTo('#mid', { scale: .86, opacity: 0 },
      { scale: 1, opacity: 1, duration: .3, ease: 'power3.out' }, 0.24);
  slam('#n',       0.52,   0, -28, 0.26);
  slam('#eyebrow', 0.62,   0, -20, 0.22);
  shadowBounce('#mid', '10px 10px 0 ' + INK, 0.82);
  tl.fromTo('#c3', { x: -60, y: 40 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0.86);
  tl.fromTo('#c4', { x: 60, y: 40 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0.96);
  slam('#note',   1.14,   0,  28, 0.26);
  slam('#stripe', 1.26,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.3, ease: 'none' }, 1.50);

  var introEnd = 2.80;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
