<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "POSTMORTEM / 复盘"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "这次出错的账要算清"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：分钟"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FF5FA2"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>漏斗 · 这次出错的账要算清</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{flex-direction:column;gap:12px;align-items:center;padding-bottom:26px}
  .lv{flex:1 1 0;width:100%;display:flex;align-items:center;border:var(--bw) solid var(--ink);
      border-radius:4px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;position:relative}
  .lv .nm{font-weight:900;font-size:30px;white-space:nowrap;padding:0 20px;flex:0 0 auto}
  /* 转化率压在层内。原先定位在 bottom:-20px，而层是 overflow:hidden，
     等于凭空声明了一个"看得见"的东西——版图上根本没有，而溢出检测又只报
     位置不报意图，只能靠人眼看出来。放在层内就没有这个矛盾。 */
  .lv .cv{flex:0 0 auto;margin:0 14px;font-family:var(--mono);font-size:14px;font-weight:700;
        letter-spacing:.04em;border:2px solid currentColor;border-radius:9999px;
        padding:3px 11px;white-space:nowrap;opacity:.9}
  .lv .v{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:40px;
        letter-spacing:-.02em;background:var(--ink);color:var(--paper);
        align-self:stretch;display:flex;align-items:center;padding:0 22px;
        font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
  .lv.deep .v{background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">POSTMORTEM / 复盘</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">这次出错的账要算清</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：分钟</div></div>
  <div class="body"><div class="blk lv" id="lv0" data-w="100" style="width:100%;background:var(--orange);color:var(--ink)"><span class="nm" id="l0">发现耗时</span><span class="v" id="v0" data-fit-max="40" data-fit-min="20">12</span></div><div class="blk lv deep" id="lv1" data-w="85" style="width:85%;background:var(--purple);color:var(--ink)"><span class="nm" id="l1">定位耗时</span><span class="cv" id="cv1">回升 383%</span><span class="v" id="v1" data-fit-max="40" data-fit-min="20">46</span></div><div class="blk lv" id="lv2" data-w="70" style="width:70%;background:var(--yellow);color:var(--ink)"><span class="nm" id="l2">修复耗时</span><span class="cv" id="cv2">转化 61%</span><span class="v" id="v2" data-fit-max="40" data-fit-min="20">28</span></div><div class="blk lv deep" id="lv3" data-w="55" style="width:55%;background:var(--pink);color:var(--ink)"><span class="nm" id="l3">验证耗时</span><span class="cv" id="cv3">转化 68%</span><span class="v" id="v3" data-fit-max="40" data-fit-min="20">19</span></div><div class="blk lv deep" id="lv4" data-w="40" style="width:40%;background:var(--blue);color:var(--ink)"><span class="nm" id="l4">复盘耗时</span><span class="cv" id="cv4">回升 184%</span><span class="v" id="v4" data-fit-max="40" data-fit-min="20">35</span></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  document.querySelectorAll('.lv').forEach(function (l, i) {
    var at = 0.1 + i * 0.08;
    B.in.grow(tl, l, l.getAttribute('data-w') + '%', at, { d: 0.42, ease: 'power3.out' });
    tl.from(l.querySelector('.cv'), { opacity: 0, scale: .7, duration: 0.3 }, at + 0.42 * 0.6);
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
