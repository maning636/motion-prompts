<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"n1","name":"上方姓名","type":"string","label":"上方发言人姓名（2–4 字）","default":"主持人"},{"id":"n2","name":"下方姓名","type":"string","label":"下方发言人姓名（2–4 字）","default":"李知遥"},{"id":"t1","name":"上方台词","type":"string","label":"上方台词（12–20 字）","default":"很多人做内容不是不努力，是没定标准"},{"id":"t2","name":"下方台词","type":"string","label":"下方台词（12–20 字）","default":"标准一换，方向就清楚了，剩下的都是执行"},{"id":"live","name":"发言标记","type":"string","label":"发言中标记（2–5 字）","default":"正在发言"},{"id":"accent","name":"强调色","type":"color","label":"强调色（当前发言人整块底色）","default":"#FFD429"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="双人对话条：上下两行同宽名牌 + 台词，当前发言行整块换成强调色并挂一枚 ink 发言中标记，两行自左右对撞入位">
<title>双人对话条 · 主持人 / 嘉宾</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 两行同宽同高，靠 3px 黑边与 16px 行距分层，不靠留白（基因 7） */
  .row{position:absolute;left:160px;width:1420px;height:152px;display:flex;align-items:stretch;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #qa{top:586px}
  #qb{top:754px}
  /* 当前发言行：整块换底色，不是半透明蒙版（基因 10） */
  #qb.is-on{background:var(--accent)}

  /* 名牌块：ink 底白字，压任何 footage 上都读得清 */
  .who{flex:0 0 250px;display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:var(--white);border-right:var(--bw) solid var(--ink)}
  .who span{display:block;font-size:56px;font-weight:900;line-height:1.04;letter-spacing:0;
    white-space:nowrap;overflow:hidden}

  /* 台词区：白底黑字（当前发言行随整块换底，字色恒 ink） */
  .say{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:24px;padding:0 34px}
  .say .tx{flex:1 1 auto;min-width:0;font-size:38px;font-weight:700;line-height:1.24;
    letter-spacing:0;color:var(--ink);white-space:nowrap;overflow:hidden}
  /* 发言中标记：无底无边无影的裸字符件 + 文字硬投影（§3.8 / §3.11 写法） */
  .flag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.1em;
    color:var(--ink);text-shadow:2px 2px 0 var(--white);white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div class="row" id="qa">
    <div class="who"><span id="n1" data-fit-max="56" data-fit-min="24">主持人</span></div>
    <div class="say"><span class="tx" id="t1" data-fit-max="38" data-fit-min="20">很多人做内容不是不努力，是没定标准</span></div>
  </div>
  <div class="row is-on" id="qb">
    <div class="who"><span id="n2" data-fit-max="56" data-fit-min="24">李知遥</span></div>
    <div class="say"><span class="tx" id="t2" data-fit-max="38" data-fit-min="20">标准一换，方向就清楚了，剩下的都是执行</span><span class="flag" id="live" data-fit-max="22" data-fit-min="14">正在发言</span></div>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['n1', 'n2', 't1', 't2', 'live'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉对撞与呼吸，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#qa', { x: 0, y: 0, opacity: 1 });
    gsap.set('#qb', { x: 0, y: 0, opacity: 1 });
    gsap.set('#n1', { y: 0 });
    gsap.set('#n2', { y: 0 });
    gsap.set('#live', { x: 0 });

    tl.fromTo('#qa', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#qb', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 2 · 对撞入位：上行自左、下行自右，两行错峰 0.12s，纯位移零 overshoot */
  tl.fromTo('#qa', { x: -90 },
      { x: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#qa', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#qa', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#qb', { x: 90 },
      { x: 0, duration: .26, ease: 'power4.out' }, .12)
    .fromTo('#qb', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#qb', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  /* 名牌与台词错开半格装上去，位移都在自身内边距内，不跨黑边 */
  tl.fromTo('#n1', { x: -20 }, { x: 0, duration: .2, ease: 'power4.out' }, .2);
  tl.fromTo('#t1', { x: -26 }, { x: 0, duration: .22, ease: 'power4.out' }, .26);
  tl.fromTo('#n2', { x: 20 },  { x: 0, duration: .2, ease: 'power4.out' }, .34);
  tl.fromTo('#t2', { x: 26 },  { x: 0, duration: .22, ease: 'power4.out' }, .4);
  /* 发言标记分格擦出（模 7）：steps(5) 是硬推进不是软补间 */
  tl.fromTo('#live', { x: 26, opacity: 0 },
      { x: 0, opacity: 1, duration: .3, ease: 'steps(5)' }, .62);

  /* 发言权切换：当前行匀速下压 6px 再回来，上行反向，两行的相对位移就是「换人说话」 */
  var T0 = 1.35;
  var REP = Math.max(1, Math.round((WIN - T0) / 1.1));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#qb', { y: 6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#qa', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
