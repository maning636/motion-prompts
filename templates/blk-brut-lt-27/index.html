<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"label","name":"预告标签","type":"string","label":"上方 mono 标签（4–12 字）","default":"NEXT / 下一节"},{"id":"title","name":"下节标题","type":"string","label":"下节标题（6–16 字，单行）","default":"下一节：怎么定价才不亏"},{"id":"sub","name":"副行","type":"string","label":"副行（8–20 字）","default":"讲完这节你就能自己开价"},{"id":"accent","name":"强调色","type":"color","label":"强调色（NEXT 色块 / 箭头方块）","default":"#FFD429"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="下节预告条：强调色 NEXT 方块压在 ink 预告条左端，右侧一枚黄色箭头方块收口，标签与副行错峰装上后三块做反向微位移">
<title>下节预告条 · 下一节 怎么定价才不亏</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 预告标签：ink 底黄字的小条，压在预告条正上方，几何固定 */
  #lb{position:absolute;left:96px;bottom:352px;width:420px;height:76px;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #label{display:block;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    line-height:1;color:var(--yellow);white-space:nowrap;overflow:hidden}

  /* 预告条：ink 底黄字通栏，长度让开右侧箭头方块（基因 10 / §3.10） */
  #nb{position:absolute;left:96px;bottom:152px;width:1456px;height:176px;
    display:flex;align-items:stretch;
    background:var(--ink);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  /* 左端 NEXT 色块：高饱和实色块压在 ink 条上，字恒 ink（§1.2 yellow 纪律） */
  .nx{flex:0 0 240px;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--ink);border-right:var(--bw) solid var(--ink);
    font-family:var(--mono);font-weight:900;font-size:56px;letter-spacing:.1em;line-height:1}
  .bd{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;
    gap:12px;padding:0 34px}
  #title{display:block;font-size:54px;font-weight:900;line-height:1.1;letter-spacing:0;
    color:var(--white);white-space:nowrap;overflow:hidden}
  #sub{display:block;font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.04em;
    line-height:1;color:var(--yellow);white-space:nowrap;overflow:hidden}

  /* 箭头方块：正方 + 3px 黑边 + 4px 直角，收口件，形状不随字号变 */
  #ar{position:absolute;right:96px;bottom:152px;width:176px;height:176px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #ar .g{font-family:var(--mono);font-weight:900;font-size:88px;line-height:1;color:var(--ink);
    text-shadow:3px 3px 0 var(--white)}
</style>
</head>
<body>
<div id="stage">
  <div id="lb"><span id="label" data-fit-max="26" data-fit-min="16">NEXT / 下一节</span></div>
  <div id="nb">
    <div class="nx">NEXT</div>
    <div class="bd">
      <span id="title" data-fit-max="54" data-fit-min="28">下一节：怎么定价才不亏</span>
      <span id="sub" data-fit-max="24" data-fit-min="16">讲完这节你就能自己开价</span>
    </div>
  </div>
  <div id="ar"><span class="g">→</span></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['label', 'title', 'sub'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉入位与反向微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#lb', { x: 0, y: 0, opacity: 1 });
    gsap.set('#nb', { x: 0, y: 0, opacity: 1 });
    gsap.set('#ar', { x: 0, y: 0, opacity: 1 });
    gsap.set('#title', { x: 0 });
    gsap.set('#sub', { x: 0 });

    tl.fromTo('#lb', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#nb', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 7 · 分格擦出：预告条自左分八格推出来 */
  tl.fromTo('#nb', { clipPath: 'inset(0 100% 0 0)' },
      { clipPath: 'inset(0 0% 0 0)', duration: .34, ease: 'steps(8)' }, 0)
    .fromTo('#nb', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#nb', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  /* 模 2 · 零件装上去：NEXT 色块、标题、副行错峰自左装上，纯位移 */
  tl.fromTo('.nx', { x: -30 }, { x: 0, duration: .22, ease: 'power4.out' }, .2);
  tl.fromTo('#title', { x: -30 }, { x: 0, duration: .24, ease: 'power4.out' }, .3);
  tl.fromTo('#sub', { x: -24 }, { x: 0, duration: .2, ease: 'power4.out' }, .4);

  /* 模 1 · 拍进来：标签条自上方落位，箭头方块自右拍入，两块各压 2 帧阴影 */
  tl.fromTo('#lb', { y: -34 },
      { y: 0, duration: .24, ease: 'power4.out' }, .22)
    .fromTo('#lb', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#lb', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#ar', { x: 60 },
      { x: 0, duration: .24, ease: 'power4.out' }, .34)
    .fromTo('#ar', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#ar', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#ar .g', { x: 26 }, { x: 0, duration: .2, ease: 'power4.out' }, .5);

  /* 三块错峰微位移：箭头方块上抬、预告条下压、标签反向，匀速往返 */
  var T0 = 1.4;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#ar', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#nb', { y: 5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#lb', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
