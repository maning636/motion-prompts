<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（本期主题标签）","default":"里程碑"},
{"id":"title","name":"主标题","type":"string","label":"主标题（8–16 字）","default":"四年里，我们只做到了一件事"},
{"id":"note","name":"口径","type":"string","label":"口径说明（单位与统计范围，必填）","default":"口径：年度累计 · 单位 条"},
{"id":"unit","name":"单位","type":"string","label":"单位（2–4 字）","default":"条"},
{"id":"v1","name":"数值一","type":"string","label":"第 1 年数值","default":"96"},
{"id":"year1","name":"年份一","type":"string","label":"第 1 年年份","default":"2023"},
{"id":"v2","name":"数值二","type":"string","label":"第 2 年数值","default":"180"},
{"id":"year2","name":"年份二","type":"string","label":"第 2 年年份","default":"2024"},
{"id":"v3","name":"数值三","type":"string","label":"第 3 年数值","default":"248"},
{"id":"year3","name":"年份三","type":"string","label":"第 3 年年份","default":"2025"},
{"id":"v4","name":"数值四","type":"string","label":"第 4 年数值","default":"320"},
{"id":"year4","name":"年份四","type":"string","label":"第 4 年年份","default":"2026"},

{"id":"brickColor","name":"配色包","type":"enum","label":"配色包（达标柱的面色）","default":"mixed","options":[{"value":"yellow","label":"暖黄"},{"value":"pink","label":"桃粉"},{"value":"green","label":"薄荷"},{"value":"blue","label":"靛蓝"},{"value":"mixed","label":"四色轮转"}]},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>里程碑柱阵</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 积木风 · 数据汇报 · 里程碑柱阵
     四根不同高度的柱子块从画布底部同时长起（power4.inOut 是全族唯一可用的一档 inOut），
     达标那根柱顶凸点硬切点亮、柱身压 2 帧，未达标的柱顶留一枚白凸点。
     柱高按数值现算并落在 120 / 240 / 360 三档上，柱宽只用 240，柱距只用 48。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --mod:240px; --mod-h:120px; --shadow:#0F0F0F; --background:var(--paper); --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--background);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  .blk-noise{background-image:radial-gradient(rgba(15,15,15,.12) 1px,transparent 1px);
    background-size:10px 10px}
  .sh-s{box-shadow:4px 4px 0 var(--shadow)}
  .sh-l{box-shadow:8px 8px 0 var(--shadow)}

  .promo{position:absolute;left:0;top:0;width:1920px;height:56px;display:flex;
    align-items:center;justify-content:space-between;padding:0 72px;
    background:var(--ink);color:var(--white);font-family:var(--mono);
    font-size:24px;font-weight:700;letter-spacing:.14em}
  .promo .pc{color:var(--accent)}

  .head{position:absolute;left:408px;top:132px;width:1104px;display:flex;
    flex-direction:column;gap:14px}
  .head .eb{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.14em;
    color:var(--ink);white-space:nowrap}
  .head .ti{font-size:56px;font-weight:900;line-height:1.2;letter-spacing:0;
    color:var(--ink);white-space:nowrap}
  .head .meta{display:flex;align-items:center;gap:20px;margin-top:4px}
  .head .note{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.04em;
    color:var(--ink);white-space:nowrap}
  .head .unit{flex:0 0 auto;padding:8px 20px;border:var(--bw) solid var(--ink);
    border-radius:9999px;background:var(--accent);color:var(--ink);
    font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.14em;
    white-space:nowrap}

  /* 柱阵：四根 240 宽柱，柱距 48，基线 y=800 */
  .cols{position:absolute;left:408px;top:300px;width:1104px;height:560px}
  .col{position:absolute;bottom:60px;width:240px;border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--shadow)}
  .col.b1{left:0}
  .col.b2{left:288px}
  .col.b3{left:576px}
  .col.b4{left:864px}
  .col .st{position:absolute;left:90px;top:16px;width:60px;height:60px;display:block}
  .val{position:absolute;width:240px;height:52px;display:flex;align-items:center;
    justify-content:center;font-family:var(--mono);font-size:44px;font-weight:900;
    letter-spacing:0;color:var(--ink);white-space:nowrap}
  .yr{position:absolute;top:568px;width:240px;height:48px;display:flex;
    align-items:center;justify-content:center;font-family:var(--mono);font-size:30px;
    font-weight:700;letter-spacing:.1em;color:var(--ink);white-space:nowrap}
  .yr.y1{left:0}
  .yr.y2{left:288px}
  .yr.y3{left:576px}
  .yr.y4{left:864px}
  /* 基线：满版区块之间靠 3px 实线分隔，不靠留白 */
  .base{position:absolute;left:408px;top:860px;width:1104px;height:3px;background:var(--ink)}

  .foot{position:absolute;left:0;bottom:0;width:1920px;height:64px;display:flex;
    align-items:center;justify-content:space-between;padding:0 72px;
    background:var(--ink);color:var(--white);font-family:var(--mono);
    font-size:26px;font-weight:700;letter-spacing:.1em}
  .foot em{font-style:normal;color:var(--accent)}
  .divline{position:absolute;left:0;bottom:64px;width:1920px;height:20px;
    border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="promo">
    <span class="pc">BRICK / 积木风</span>
    <span>里程碑 · 四柱长起</span>
  </div>

  <div class="head" id="head">
    <span class="eb" id="eyebrow" data-fit-max="30" data-fit-min="16">里程碑</span>
    <h1 class="ti" id="title" data-fit-max="56" data-fit-min="26">四年里，我们只做到了一件事</h1>
    <div class="meta">
      <span class="note" id="note" data-fit-max="26" data-fit-min="16">口径：年度累计 · 单位 条</span>
      <span class="unit" id="unit">条</span>
    </div>
  </div>

  <div class="cols" id="cols">
    <div class="col b1" id="b1">
      <svg class="st" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle class="sc" id="s1" cx="30" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      </svg>
    </div>
    <div class="col b2" id="b2">
      <svg class="st" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle class="sc" id="s2" cx="30" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      </svg>
    </div>
    <div class="col b3" id="b3">
      <svg class="st" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle class="sc" id="s3" cx="30" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      </svg>
    </div>
    <div class="col b4" id="b4">
      <svg class="st" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle class="sc" id="s4" cx="30" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      </svg>
    </div>

    <div class="val v1" id="n1" data-fit-max="44" data-fit-min="20">0</div>
    <div class="val v2" id="n2" data-fit-max="44" data-fit-min="20">0</div>
    <div class="val v3" id="n3" data-fit-max="44" data-fit-min="20">0</div>
    <div class="val v4" id="n4" data-fit-max="44" data-fit-min="20">0</div>

    <div class="yr y1" id="year1" data-fit-max="30" data-fit-min="16">2023</div>
    <div class="yr y2" id="year2" data-fit-max="30" data-fit-min="16">2024</div>
    <div class="yr y3" id="year3" data-fit-max="30" data-fit-min="16">2025</div>
    <div class="yr y4" id="year4" data-fit-max="30" data-fit-min="16">2026</div>
  </div>

  <div class="base"></div>

  <div class="divline"></div>
  <div class="foot">
    <span>DQ / 数据汇报</span>
    <span id="meta">柱 4 · 最高 0 · 达标 0</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['eyebrow', 'title', 'note', 'unit',
   'year1', 'year2', 'year3', 'year4'].forEach(function (k) { set(k, v[k]); });

  var rs = document.documentElement.style;
  if (v.accent) rs.setProperty('--accent', v.accent);
  var ACC = v.accent || '#FFD429';

  function num(s) {
    var m = String(s == null ? '' : s).replace(/,/g, '').match(/-?[\d.]+/);
    var n = m ? parseFloat(m[0]) : 0;
    return isFinite(n) ? Math.max(0, n) : 0;
  }
  var VALS = [num(v.v1), num(v.v2), num(v.v3), num(v.v4)];
  var VMAX = Math.max.apply(null, VALS.concat([1]));
  /* 柱高现算：先按最大值归一化到 3 档，再落到块高模数 120 / 240 / 360 上 */
  var STEPS = 3, STEP = 120;
  var HEIGHTS = VALS.map(function (x) {
    var k = Math.max(1, Math.round(x / VMAX * STEPS));
    return k * STEP;
  });
  /* 达标 = 数值最大的那根（并列取第一根），它拿主角色 + 亮起凸点 */
  var HIT = VALS.indexOf(VMAX);

  var PACK = {
    yellow: '#FFD429', pink: '#FF5FA2', green: '#2FD07A',
    blue: '#3D7BFF', mixed: '#FFD429'
  };
  var ROT = ['#FF5FA2', '#3D7BFF', '#2FD07A'];
  function inkOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return '#0F0F0F';
    var f = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * f(parseInt(h.slice(0, 2), 16)) +
            0.7152 * f(parseInt(h.slice(2, 4), 16)) +
            0.0722 * f(parseInt(h.slice(4, 6), 16));
    return L > 0.42 ? '#0F0F0F' : '#FFFFFF';
  }
  var hitFace = PACK[v.brickColor] || PACK.mixed;
  var BARS = ['#b1', '#b2', '#b3', '#b4'];
  var used = [hitFace], rot = 0;
  BARS.forEach(function (id, i) {
    var el = document.querySelector(id);
    if (!el) return;
    var face = i === HIT ? hitFace : null;
    if (!face) {
      while (used.indexOf(ROT[rot % ROT.length]) >= 0) rot++;
      face = ROT[rot % ROT.length];
      used.push(face);
    }
    el.style.background = face;
    el.style.height = HEIGHTS[i] + 'px';
  });

  /* 派生量：柱数 / 最高值 / 达标柱数 / 合计，标签与页脚全部现算 */
  ['n1', 'n2', 'n3', 'n4'].forEach(function (id, i) {
    var e = document.getElementById(id);
    if (e) e.textContent = String(VALS[i]);
  });
  var studs = [].slice.call(document.querySelectorAll('#cols .sc'));
  var sum = VALS.reduce(function (a, b) { return a + b; }, 0);
  var meta = document.getElementById('meta');
  if (meta) {
    meta.innerHTML = '柱 <em>' + BARS.length + '</em> · 最高 <em>' + VMAX + '</em> · 合计 <em>' +
      sum + '</em> · 达标 <em>1</em>';
  }
  /* 数值标签与柱顶对齐，柱高现算完直接落位 */
  BARS.forEach(function (id, i) {
    var bar = document.querySelector(id);
    var lab = document.getElementById('n' + (i + 1));
    if (!bar || !lab) return;
    lab.style.left = Math.round(bar.offsetLeft) + 'px';
    lab.style.bottom = Math.round(HEIGHTS[i] + 60 + 8) + 'px';
  });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：柱体长起与压影撤掉，直接给到终高 + ≤8px 微位移淡入 */
    BARS.forEach(function (sel, i) {
      var el = document.querySelector(sel);
      if (el) el.style.height = HEIGHTS[i] + 'px';
    });
    gsap.set('#head', { x: 0, y: 0, opacity: 1 });
    gsap.set('#cols', { x: 0, y: 0, opacity: 1 });
    gsap.set('#base', { x: 0, y: 0, opacity: 1 });
    gsap.set(studs[HIT] || [], { attr: { fill: ACC } });
    tl.fromTo('#head', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 0);
    tl.fromTo('#cols', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .60, ease: 'power3.out' }, .16);
    tl.fromTo('#base', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .30);
    B.hold(tl, 1.15, 1.05);
    return;
  }

  var SHADOW = '8px 8px 0 #0F0F0F';
  var stageRect = document.getElementById('stage').getBoundingClientRect();
  var promoEl = document.querySelector('.promo');
  var CEIL = promoEl ? Math.round(promoEl.getBoundingClientRect().bottom - stageRect.top) : 0;

  tl.fromTo('#head', { y: CEIL - Math.round(document.getElementById('head').getBoundingClientRect().top - stageRect.top) },
    { y: 0, duration: 0.26, ease: 'power4.out' }, 0.00);

  /* 四根柱子同时从基线长起。power4.inOut 是全族唯一可用的一档 inOut，
     这里用它是「长起来」而不是「搬过去」，起止都是零速，中间最快。 */
  var GROW = 1.0, GROW_AT = 0.45;
  BARS.forEach(function (sel, i) {
    tl.fromTo(sel, { height: 0 }, { height: HEIGHTS[i], duration: GROW, ease: 'power4.inOut' }, GROW_AT);
  });

  /* 达标柱落定压 2 帧，柱顶凸点硬切点亮；未达标的柱顶保持一枚白凸点 */
  var hitBar = BARS[HIT];
  tl.set(hitBar, { boxShadow: '8px 11px 0 #0F0F0F', immediateRender: false }, GROW_AT + GROW);
  tl.to(hitBar, { boxShadow: SHADOW, duration: 0.04, ease: 'steps(2)' }, GROW_AT + GROW + 0.04);
  tl.set(studs[HIT], { attr: { fill: ACC }, immediateRender: false }, GROW_AT + GROW + 0.20);

  /* 数值标签与年份标签依次顶起（式 4），全程单轴 */
  BARS.forEach(function (sel, i) {
    tl.fromTo('#n' + (i + 1), { y: 24 }, { y: 0, duration: 0.26, ease: 'power4.out' },
      GROW_AT + GROW + 0.24 + i * 0.08);
    tl.fromTo('#year' + (i + 1), { y: 24 }, { y: 0, duration: 0.26, ease: 'power4.out' },
      GROW_AT + GROW + 0.44 + i * 0.08);
  });

  var introEnd = tl.duration();
  var TOTAL = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  var holdAt = Math.min(introEnd, TOTAL - 0.8);
  B.hold(tl, holdAt, Math.max(0.8, TOTAL - holdAt));
})();
</script>
</body></html>
