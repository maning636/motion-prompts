<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"FULL CUT / 满减"},{"id":"title","name":"主标题","type":"string","label":"主标题（右侧说明列顶部的大字）","default":"这一档满减怎么用"},{"id":"threshold","name":"满减门槛","type":"number","label":"门槛金额（元）","default":300},{"id":"minus","name":"减免金额","type":"number","label":"每满门槛减免（元）","default":50},{"id":"rule1","name":"规则 1","type":"string","label":"规则第一行","default":"同一订单自动匹配，不需手动领"},{"id":"rule2","name":"规则 2","type":"string","label":"规则第二行","default":"可与平台券叠加，不与会员价叠加"},{"id":"rule3","name":"规则 3","type":"string","label":"规则第三行","default":"每单限用一次，退款后券不退回"},{"id":"cta","name":"按钮文案","type":"string","label":"按钮文案（唯一一处 CTA）","default":"去凑单"},{"id":"accent","name":"强调色","type":"color","label":"强调色（券面底 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="左券右说明构图：左侧一张大额满减券面，上下两块用虚线撕口隔开，右侧三行规则加一枚 CTA 按钮">
<title>满减券卡 · 这一档满减怎么用</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* 顶部反白通栏 */
  .top{flex:0 0 auto;height:66px;display:flex;align-items:center;gap:22px;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .top .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .top .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}

  /* 主体：左券面 + 右说明列 */
  .main{flex:1 1 auto;min-height:0;display:flex;gap:56px;
    padding:40px 72px 44px;overflow:hidden}

  /* 券面：白卡 + 10px 硬阴影，上下两块用 3px 虚线撕口隔开 */
  .coupon{flex:0 0 860px;display:flex;flex-direction:column;
    border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:10px 10px 0 var(--ink);background:var(--white);overflow:hidden}
  .half{flex:1 1 0;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px}
  .half.up{background:var(--white)}
  .half.dn{background:var(--accent);border-top:var(--bw) dashed var(--ink)}
  .half .k{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.14em}
  .half.up .k{color:var(--mute)}
  .half.dn .k{color:var(--ink)}
  .half .big{display:flex;align-items:baseline;gap:12px}
  .half .big .op{font-family:var(--mono);font-weight:900;font-size:72px;line-height:1}
  .half .big .n{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:196px;line-height:.92;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .half .hint{font-size:26px;font-weight:700;letter-spacing:0;color:var(--mute)}
  .half.dn .hint{color:var(--ink)}

  /* 右侧说明列 */
  .side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
    justify-content:center;gap:28px;overflow:hidden}
  .side .tt{display:block;white-space:nowrap;font-weight:900;font-size:64px;
    line-height:1.06;letter-spacing:0}
  .rules{display:flex;flex-direction:column;border-top:var(--bw) solid var(--ink)}
  .rule{display:flex;align-items:center;gap:20px;padding:20px 4px;
    border-bottom:var(--bw) solid var(--ink);min-width:0}
  .rule .no{flex:0 0 auto;font-family:var(--mono);font-weight:900;font-size:24px;
    color:var(--ink);background:var(--yellow);border:var(--bw) solid var(--ink);
    border-radius:4px;width:48px;height:48px;display:flex;align-items:center;
    justify-content:center}
  .rule .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:30px;font-weight:700;letter-spacing:0}
  /* 唯一一处 CTA */
  .cta{align-self:flex-start;display:inline-flex;align-items:center;gap:16px;
    padding:20px 44px;background:var(--green);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    font-size:36px;font-weight:900;letter-spacing:0;white-space:nowrap}

  .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:24px;padding:20px 72px;border-top:var(--bw) solid var(--ink)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--mute);white-space:nowrap;flex:0 0 auto}
  .foot .fc{font-size:24px;font-weight:700;letter-spacing:0;white-space:nowrap;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="tag anim" id="tag">CUT</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">FULL CUT / 满减</span>
  </div>

  <div class="main anim" id="main">
    <div class="coupon anim" id="coupon">
      <div class="half up">
        <span class="k">FULL / 满</span>
        <span class="big"><span class="op">¥</span><span class="n anim" id="thNum" data-fit-max="196" data-fit-min="88">300</span></span>
        <span class="hint">订单满这个数就触发</span>
      </div>
      <div class="half dn">
        <span class="k">CUT / 减</span>
        <span class="big"><span class="op">¥</span><span class="n anim" id="mnNum" data-fit-max="196" data-fit-min="88">50</span></span>
        <span class="hint">每满一次减一次</span>
      </div>
    </div>

    <div class="side">
      <div class="tt anim" id="title" data-fit-max="64" data-fit-min="34">这一档满减怎么用</div>
      <div class="rules">
        <div class="rule"><span class="no">01</span><span class="tx anim" id="rule1" data-fit-max="30" data-fit-min="17">同一订单自动匹配，不需手动领</span></div>
        <div class="rule"><span class="no">02</span><span class="tx anim" id="rule2" data-fit-max="30" data-fit-min="17">可与平台券叠加，不与会员价叠加</span></div>
        <div class="rule"><span class="no">03</span><span class="tx anim" id="rule3" data-fit-max="30" data-fit-min="17">每单限用一次，退款后券不退回</span></div>
      </div>
      <span class="cta anim" id="cta" data-fit-max="36" data-fit-min="20">去凑单</span>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="fm">CUT / 2026</span>
    <span class="fc anim" id="footNote" data-fit-max="24" data-fit-min="15">门槛与减免自动匹配，结算页可见</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'rule1', 'rule2', 'rule3', 'cta']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var th = Number(v.threshold), mn = Number(v.minus);
  if (!isFinite(th)) th = 0;
  if (!isFinite(mn)) mn = 0;
  /* 减免不许超过门槛，否则出现「满 100 减 300」这种自相矛盾的券 */
  mn = Math.max(0, Math.min(th, Math.round(mn)));
  set('thNum', String(th));
  set('mnNum', String(mn));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#top',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#main',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#top',     0.00,   0, -66, 0.26);
  slam('#eyebrow', 0.14, -24, -20, 0.22);
  /* 券面整张从左侧斜向拍入，落定后阴影压 2 帧再弹回 10px 档 */
  tl.fromTo('#coupon', { x: -90, y: -50 },
      { x: 0, y: 0, duration: .3, ease: 'power4.out' }, 0.36);
  shadowBounce('#coupon', '10px 10px 0 ' + INK, 0.70);
  slam('#thNum',  0.74,   0, -28, 0.26);
  slam('#mnNum',  0.98,   0, -28, 0.26);
  /* 右侧说明列自右画外切入，与左券面形成对向 */
  tl.fromTo('#title', { x: 90 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.86);
  tl.from('#rules .rule', { x: 50, duration: .22, ease: 'power4.out', stagger: .1 }, 1.08);
  slam('#cta',    1.52,   0, -28, 0.26);
  /* 模 3 按钮按下：位移量恒等于阴影偏移量（6px），阴影同步减半到 3px，1 帧完成不补间 */
  tl.set('#cta', { x: 6, y: 6, boxShadow: '3px 3px 0 ' + INK }, 2.04);
  tl.set('#cta', { x: 0, y: 0, boxShadow: '6px 6px 0 ' + INK }, 2.30);
  slam('#foot',   2.06,   0,  28, 0.26);
  slam('#stripe', 2.18,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.42);

  var introEnd = 3.62;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
