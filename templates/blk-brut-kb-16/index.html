<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"CHECKLIST / 逐条拍入"},
{"id":"title","name":"小标题","type":"string","label":"列表上方的小标题（一行，12–18 字）","default":"一条片子开拍前，我固定检查这四件事"},
{"id":"i1","name":"条目 1","type":"string","label":"第 1 条文案（8–16 字）","default":"第一句话能不能独立成立"},
{"id":"i2","name":"条目 2","type":"string","label":"第 2 条文案","default":"画面里有没有第二个重心"},
{"id":"i3","name":"条目 3","type":"string","label":"第 3 条文案","default":"结尾有没有留下一个具体动作"},
{"id":"i4","name":"条目 4","type":"string","label":"第 4 条文案","default":"静音看一遍还看得懂吗"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"条目 3–5 条 · 每条一个动作"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（编号方块 + 斜纹带）","default":"#FFD429"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>列表项逐条拍入 · 一条片子开拍前，我固定检查这四件事</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:46px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:22px}
  /* 中文小标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:82px;line-height:1.12;
    letter-spacing:0;padding-right:24px}

  /* 列表：整宽行，行间 3px 实线分隔（基因 7），每行左端一枚编号方块 */
  .list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;margin:34px 88px 0;border-top:var(--bw) solid var(--ink)}
  .row{display:flex;align-items:center;gap:28px;padding:18px 0;
    border-bottom:var(--bw) solid var(--ink)}
  .no{flex:0 0 auto;width:64px;height:64px;display:flex;align-items:center;
    justify-content:center;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    font-family:var(--mono);font-weight:700;font-size:26px}
  .row:nth-child(odd) .no{background:var(--accent)}
  .tx{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;font-size:42px;
    font-weight:700;line-height:1.2;letter-spacing:0}
  /* 行尾 3px 小方块：不做图标，只当「这条已就位」的实心记号 */
  .tail{flex:0 0 auto;width:26px;height:26px;background:var(--ink)}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">CHECKLIST / 逐条拍入</div>
    <div class="title anim" id="title" data-fit-max="82" data-fit-min="40">一条片子开拍前，我固定检查这四件事</div>
  </div>

  <div class="list anim" id="list">
    <div class="row anim"><span class="no">01</span><span class="tx" id="i1" data-fit-max="42" data-fit-min="21">第一句话能不能独立成立</span><span class="tail"></span></div>
    <div class="row anim"><span class="no">02</span><span class="tx" id="i2" data-fit-max="42" data-fit-min="21">画面里有没有第二个重心</span><span class="tail"></span></div>
    <div class="row anim"><span class="no">03</span><span class="tx" id="i3" data-fit-max="42" data-fit-min="21">结尾有没有留下一个具体动作</span><span class="tail"></span></div>
    <div class="row anim"><span class="no">04</span><span class="tx" id="i4" data-fit-max="42" data-fit-min="21">静音看一遍还看得懂吗</span><span class="tail"></span></div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">条目 3–5 条 · 每条一个动作</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'i1', 'i2', 'i3', 'i4', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#list',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.14);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.32);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.48);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  /* 模 7 分格揭示：列表顶边从左逐格画出 */
  tl.fromTo('#list', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.36, ease: 'steps(8)' }, 0.34);

  /* 逐条拍入：4 行错峰 0.16s，每行整行从左侧硬撞入，阴影落定压 2 帧再弹回 */
  var rows = document.querySelectorAll('#list .row');
  for (var i = 0; i < rows.length; i++) {
    var at = 0.56 + i * 0.16;
    tl.fromTo(rows[i], { x: -60 },
      { x: 0, duration: 0.26, ease: 'power4.out' }, at);
    var no = rows[i].querySelector('.no');
    tl.set(no, { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, at + 0.26);
    tl.to(no, { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.30);
  }

  slam('#footrow', 1.44, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.56);
  slam('#note',    1.70, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.84);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.18);

  var introEnd = 3.18;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
