<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"name","name":"姓名","type":"string","label":"姓名 / 主标题（≤6 字）","default":"李知遥"},
{"id":"role","name":"头衔","type":"string","label":"头衔 / 说明（≤16 字）","default":"独立播客主理人 · 每周三更新"},
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono 标签，≤8 字）","default":"HOST / 主理人"},
{"id":"tag","name":"角标","type":"string","label":"角标（白底 pill，2–6 字）","default":"LIVE"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（角标块底色 / 凸点亮起色）","default":"#FFD429"},
{"id":"shadow","name":"阴影色","type":"color","label":"阴影色（深色直播画面用白 #FFFFFF，亮画面切 #0F0F0F）","default":"#FFFFFF"},
{"id":"studMode","name":"凸点","type":"enum","label":"凸点（不显示 / 整排同时亮 / 逐枚硬切）","default":"scan","options":[{"value":"none","label":"不显示"},{"value":"top","label":"整排同时亮"},{"value":"scan","label":"逐枚硬切"}]},
{"id":"duration","name":"时长","type":"number","label":"时长（秒，5）","default":5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>角标块砸落</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 积木风 · 直播贴片 · 角标块砸落（透明底 1920×1080）
     左上角一枚 3px 纯黑边 + 可切白影的角标块从画外正上方砸落，落定压 2 帧后
     两枚凸点逐个亮起，块下再压一条 52×52 白底方块作落款。
     透明底变体（风格规范 §7）：--paper 全程不出现，满屏网点整块删掉，
     硬阴影走 --shadow 变量，明暗两种 footage 都能读。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --mod:240px; --mod-h:120px; --shadow:#FFFFFF; --background:transparent; --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--background);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  /* 阴影自写，不吃 blocks.css 的 --sh-l(10px)。X 恒等于 Y，第三值恒 0。 */
  .sh-s{box-shadow:4px 4px 0 var(--shadow)}
  .sh-l{box-shadow:8px 8px 0 var(--shadow)}

  /* 角标块：720×240 承重件 */
  .corner{position:absolute;left:96px;top:120px;width:720px;height:240px;
    display:flex;flex-direction:column;justify-content:center;gap:20px;padding:0 32px;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  .corner .top{display:flex;align-items:center;gap:20px}
  .corner .tag{flex:0 0 auto;padding:8px 18px;background:var(--white);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:9999px;
    font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.1em;
    white-space:nowrap}
  .corner .eb{flex:0 1 auto;font-family:var(--mono);font-size:26px;font-weight:700;
    letter-spacing:.14em;color:var(--ink);white-space:nowrap}
  .corner .nm{font-size:72px;font-weight:900;line-height:1.06;letter-spacing:0;
    color:var(--ink);white-space:nowrap}

  /* 头衔块：720×120，与角标块共边（margin-top:-3px 合成单线缝） */
  .roleblk{position:absolute;left:96px;top:357px;width:720px;height:120px;
    display:flex;align-items:center;padding:0 32px;background:var(--white);
    border:var(--bw) solid var(--ink);border-top:0;margin-top:-3px;border-radius:0 0 4px 4px;
    box-shadow:8px 8px 0 var(--shadow)}
  .roleblk .rl{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.04em;
    color:var(--ink);white-space:nowrap}

  /* 品牌落款：52×52 白底方块，叠在头衔块右下角的桌沿上 */
  .mark{position:absolute;left:96px;top:501px;width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--shadow);
    font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:0;color:var(--ink)}

  /* 凸点 2 联：直径 44px，中心距 120px。width/height 必须同时写 */
  .studs{position:absolute;left:544px;top:390px;width:240px;height:60px}
</style>
</head>
<body>
<div id="stage">
  <div class="corner" id="corner">
    <div class="top">
      <span class="tag" id="tag">LIVE</span>
      <span class="eb" id="eyebrow" data-fit-max="26" data-fit-min="16">HOST / 主理人</span>
    </div>
    <p class="nm" id="name" data-fit-max="72" data-fit-min="32">李知遥</p>
  </div>

  <div class="roleblk" id="roleblk">
    <span class="rl" id="role" data-fit-max="30" data-fit-min="16">独立播客主理人 · 每周三更新</span>
  </div>

  <div class="mark" id="mark">B</div>

  <div class="studs" id="studs">
    <svg width="240" height="60" viewBox="0 0 240 60" fill="none" aria-hidden="true">
      <circle class="sc" id="s1" cx="60"  cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      <circle class="sc" id="s2" cx="180" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
    </svg>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['name', 'role', 'eyebrow', 'tag'].forEach(function (k) { set(k, v[k]); });

  /* 透明底 preset：底色与阴影色都收进变量，JS 只改这两个（风格规范 §7.1 / §7.2 规则 A） */
  var isT = (v.exportMode || 'transparent') === 'transparent';
  var rs = document.documentElement.style;
  rs.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  rs.setProperty('--shadow', v.shadow || (isT ? '#FFFFFF' : '#0F0F0F'));
  if (v.accent) rs.setProperty('--accent', v.accent);
  var ACC = v.accent || '#FFD429';
  var SH = v.shadow || (isT ? '#FFFFFF' : '#0F0F0F');
  var SHADOW_L = '8px 8px 0 ' + SH;
  var SHADOW_S = '4px 4px 0 ' + SH;

  var studs = [].slice.call(document.querySelectorAll('#studs .sc'));
  var studMode = v.studMode || 'scan';
  var studWrap = document.getElementById('studs');
  if (studMode === 'none' && studWrap) studWrap.style.display = 'none';

  /* 落款方块的字由眉标首字母现算，用户不用多填一个字段 */
  var mark = document.getElementById('mark');
  if (mark) {
    var head = String(v.eyebrow == null ? '' : v.eyebrow).trim();
    mark.textContent = head ? head.charAt(0).toUpperCase() : 'B';
  }

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：砸落与压影全撤掉。透明底禁用 opacity 淡出，这里只给 ≤8px 微位移。 */
    gsap.set('#corner', { x: 0, y: 0, opacity: 1, boxShadow: SHADOW_L });
    gsap.set('#roleblk', { x: 0, y: 0, opacity: 1, boxShadow: SHADOW_L });
    gsap.set('#mark', { x: 0, y: 0, opacity: 1, boxShadow: SHADOW_S });
    if (studs.length) gsap.set(studs, { attr: { fill: ACC } });
    tl.fromTo('#corner',  { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .50, ease: 'power3.out' }, 0);
    tl.fromTo('#roleblk', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, .16);
    tl.fromTo('#studs',   { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .30);
    B.hold(tl, 1.10, 1.10);
    return;
  }

  var stageRect = document.getElementById('stage').getBoundingClientRect();
  function dropIn(sel) {
    var el = document.querySelector(sel);
    if (!el) return 0;
    return -Math.round(el.getBoundingClientRect().top - stageRect.top);
  }
  /* 式 1 砸落：起点正好贴画布上沿，保留「从画外砸下来」的读感又全程不越框 */
  function slam(sel, at, pressShadow, backShadow, d) {
    var dur = d || 0.26;
    tl.fromTo(sel, { y: dropIn(sel) }, { y: 0, duration: dur, ease: 'power4.out' }, at);
    tl.set(sel, { boxShadow: pressShadow, immediateRender: false }, at + dur);
    tl.to(sel, { boxShadow: backShadow, duration: 0.04, ease: 'steps(2)' }, at + dur + 0.04);
  }

  slam('#corner', 0.00, '8px 11px 0 ' + SH, SHADOW_L, 0.26);
  slam('#roleblk', 0.55, '8px 11px 0 ' + SH, SHADOW_L, 0.24);
  slam('#mark', 1.10, '4px 7px 0 ' + SH, SHADOW_S, 0.22);

  /* 落定后两枚凸点逐个亮起（式 8） */
  if (studMode !== 'none' && studs.length) {
    tl.set(studs, { attr: { fill: '#FFFFFF' }, immediateRender: false }, 1.58);
    if (studMode === 'top') {
      tl.set(studs, { attr: { fill: ACC }, immediateRender: false }, 1.62);
    } else {
      studs.forEach(function (c, i) {
        tl.set(c, { attr: { fill: ACC }, immediateRender: false }, 1.62 + i * 0.14);
      });
    }
  }

  var introEnd = tl.duration();
  var TOTAL = Math.min(6, Math.max(4.5, Number(v.duration) || 5));
  var holdAt = Math.min(introEnd, TOTAL - 0.8);
  B.hold(tl, holdAt, Math.max(0.8, TOTAL - holdAt));
})();
</script>
</body></html>
