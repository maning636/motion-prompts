<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"pname","name":"地点名","type":"string","label":"地点名（2–8 字）","default":"杭州 · 未来科技城"},{"id":"addr","name":"详细地址","type":"string","label":"详细地址（8–20 字）","default":"梦想小镇学术交流中心 3 号楼"},{"id":"live","name":"现场标记","type":"string","label":"绿色状态块上的 mono 字（2–4 字）","default":"现场"},{"id":"accent","name":"强调色","type":"color","label":"强调色（状态块底 / 定位角）","default":"#2FD07A"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="地点条：ink 定位板内嵌 3px 描边 SVG 定位针，右侧白底地点卡给地名与地址，最右一块绿色状态块标现场，三块自左依次拍入后错峰微位移">
<title>地点条 · 杭州 未来科技城</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 定位板：ink 底反白件，阴影走白（基因 10 / §7.2 规则 B） */
  #pin{position:absolute;left:120px;bottom:200px;width:120px;height:176px;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--white)}
  /* SVG 同时给宽高，只写 viewBox 会被浏览器替换成 300px 默认尺寸把底座撑破（规范 §11.3） */
  #pin svg{width:76px;height:76px;display:block}

  /* 地点卡：白底黑字，地名与地址两行，靠 3px 实线分隔（基因 7） */
  #lc{position:absolute;left:264px;bottom:200px;width:1080px;height:176px;
    display:flex;flex-direction:column;justify-content:center;padding:0 36px;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #pname{display:block;font-size:64px;font-weight:900;line-height:1.08;letter-spacing:0;
    color:var(--ink);white-space:nowrap;overflow:hidden}
  #lc .rule{height:3px;background:var(--ink);margin:16px 0 14px;flex:0 0 3px}
  #addr{display:block;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.04em;
    line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden}

  /* 现场状态块：高饱和块自带对比，是透明底的首选填充（§7.3.2） */
  #stt{position:absolute;left:1380px;bottom:200px;width:320px;height:176px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #stt .dot{width:34px;height:34px;background:var(--ink);border:var(--bw) solid var(--ink);
    border-radius:4px}
  #live{display:block;font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:.18em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="pin">
    <svg viewBox="0 0 24 24" width="76" height="76" aria-hidden="true">
      <path d="M12 2.6C7.6 2.6 4 6.2 4 10.6c0 5.4 8 10.8 8 10.8s8-5.4 8-10.8c0-4.4-3.6-8-8-8z"
            fill="#FFD429" stroke="#0F0F0F" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="12" cy="10.4" r="2.8" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
    </svg>
  </div>
  <div id="lc">
    <span id="pname" data-fit-max="64" data-fit-min="34">杭州 · 未来科技城</span>
    <div class="rule"></div>
    <span id="addr" data-fit-max="26" data-fit-min="16">梦想小镇学术交流中心 3 号楼</span>
  </div>
  <div id="stt"><span class="dot"></span><span id="live" data-fit-max="34" data-fit-min="20">现场</span></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['pname', 'addr', 'live'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉逐块拍入与错峰微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#pin', { x: 0, y: 0, opacity: 1 });
    gsap.set('#lc', { x: 0, y: 0, opacity: 1 });
    gsap.set('#stt', { x: 0, y: 0, opacity: 1 });
    gsap.set('#pname', { x: 0 });
    gsap.set('#addr', { x: 0 });

    tl.fromTo('#pin', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#lc', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 1 · 拍进来：三块自左依次斜向硬着陆，落定瞬间阴影压 2 帧再弹回原档 */
  tl.fromTo('#pin', { x: -64, y: -36 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#pin', { boxShadow: '8px 8px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F') },
      { boxShadow: '8px 11px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F'), duration: .04, ease: 'steps(2)' }, '<')
    .to('#pin', { boxShadow: '8px 8px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F'), duration: .04, ease: 'steps(2)' });
  tl.fromTo('#lc', { x: -64, y: -36 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, .14)
    .fromTo('#lc', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#lc', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#stt', { x: -64, y: -36 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, .28)
    .fromTo('#stt', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#stt', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });

  /* 模 2 · 零件装上去：地名、规则、地址、状态点错峰跟位，纯位移，opacity 恒为 1 */
  tl.fromTo('#pname', { x: -26 }, { x: 0, duration: .22, ease: 'power4.out' }, .34);
  tl.fromTo('#lc .rule', { x: -26 }, { x: 0, duration: .22, ease: 'power4.out' }, .42);
  tl.fromTo('#addr', { x: -26 }, { x: 0, duration: .22, ease: 'power4.out' }, .48);
  tl.fromTo('#stt .dot', { x: -20 }, { x: 0, duration: .2, ease: 'power4.out' }, .46);
  tl.fromTo('#live', { x: 20 }, { x: 0, duration: .2, ease: 'power4.out' }, .54);

  /* 模 8 · 色块闪切：状态点按固定节奏硬切一次再切回，收尾必须停在可见帧 */
  tl.set('#stt .dot', { opacity: 0, duration: 0 }, 1.6)
    .set('#stt .dot', { opacity: 1, duration: 0 }, 1.9);

  /* 三块错峰微位移：每块起步时间互不相同，匀速往返，零回弹 */
  var T0 = 2.0;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#pin', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#lc', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#stt', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
