<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"EXPERT / 专家观点"},
{"id":"who","name":"姓名","type":"string","label":"姓名（2–4 字）","default":"周思远"},
{"id":"role","name":"职务","type":"string","label":"职务（ink 头条里的 mono 行）","default":"CONTENT STRATEGY · 前电视台编导"},
{"id":"org","name":"机构","type":"string","label":"机构（底部 mono）","default":"叙事实验室"},
{"id":"q1","name":"观点上","type":"string","label":"观点第一行（12–18 字）","default":"观众不奖励复杂，他们奖励被说清楚"},
{"id":"q2","name":"观点下","type":"string","label":"观点第二行（12–18 字）","default":"把复杂留给制作者，把简单留给前 3 秒"},
{"id":"t1","name":"标签 1","type":"string","label":"底部标签 1（mono）","default":"NARRATIVE"},
{"id":"t2","name":"标签 2","type":"string","label":"底部标签 2（mono）","default":"CLARITY"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"观点为受访者原话摘录 · 经本人确认"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（头像块 + 斜纹带）","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>专家观点卡 · 观众不奖励复杂，他们奖励被说清楚</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-l{box-shadow:8px 8px 0 var(--ink)}
  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-w{box-shadow:8px 8px 0 var(--white)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}

  .body{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:30px 88px 0}
  .card{flex:1 1 auto;min-width:0;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column}
  /* 职务头：ink 底 + white 字，压在卡顶（基因 10 的整块反白） */
  .chead{background:var(--ink);color:var(--white);padding:20px 44px;display:flex;
    align-items:center;gap:22px}
  .role{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.10em;color:var(--yellow)}
  .who{flex:0 0 auto;font-size:34px;font-weight:900;color:var(--white);white-space:nowrap}

  .cbody{display:flex;gap:40px;padding:38px 44px 30px;align-items:flex-start}
  /* 头像：120×120 方块，accent 底 + 单字（§3.8 的 .av 语法，只有 4px 圆角） */
  .av{flex:0 0 auto;width:120px;height:120px;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    font-size:56px;font-weight:900}
  .ctext{flex:1 1 auto;min-width:0}
  /* 中文观点：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .ql{display:block;white-space:nowrap;font-weight:900;font-size:56px;line-height:1.34;
    letter-spacing:0;padding-right:20px}
  .cfoot{display:flex;align-items:center;gap:18px;padding:0 44px 32px}
  .tag{display:inline-block;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:8px 20px;border-radius:9999px;white-space:nowrap;
    background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--ink)}
  .org{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;color:var(--mute);white-space:nowrap}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">EXPERT / 专家观点</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="body anim" id="body">
    <div class="card anim" id="card">
      <div class="chead anim" id="chead">
        <span class="role anim" id="role" data-fit-max="24" data-fit-min="14">CONTENT STRATEGY · 前电视台编导</span>
        <span class="who anim" id="who" data-fit-max="34" data-fit-min="17">周思远</span>
      </div>
      <div class="cbody anim" id="cbody">
        <div class="av anim" id="av">周</div>
        <div class="ctext anim" id="ctext">
          <div class="ql anim" id="q1" data-fit-max="56" data-fit-min="28">观众不奖励复杂，他们奖励被说清楚</div>
          <div class="ql anim" id="q2" data-fit-max="56" data-fit-min="28">把复杂留给制作者，把简单留给前 3 秒</div>
        </div>
      </div>
      <div class="cfoot anim" id="cfoot">
        <span class="tag anim" id="t1" data-fit-max="22" data-fit-min="14">NARRATIVE</span>
        <span class="tag anim" id="t2" data-fit-max="22" data-fit-min="14">CLARITY</span>
        <span class="org anim" id="org" data-fit-max="22" data-fit-min="14">叙事实验室</span>
      </div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">观点为受访者原话摘录 · 经本人确认</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'role', 'who', 'q1', 'q2', 't1', 't2', 'org', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#body',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';
  function press(sel, at, col) {
    tl.set(sel, { boxShadow: '4px 7px 0 ' + (col || INK), immediateRender: false }, at);
    tl.to(sel, { boxShadow: '4px 4px 0 ' + (col || INK), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);

  slam('#body', 0.20,   0, -24, 0.28);
  /* 大面积卡：power3.out + from:.86，零过冲 */
  tl.fromTo('#card', { scale: 0.86 },
    { scale: 1, duration: 0.3, ease: 'power3.out' }, 0.32);
  slam('#chead', 0.50, -32, -24, 0.26);
  slam('#role',  0.62,   0, -16, 0.22);
  slam('#who',   0.70,  28, -16, 0.22);
  slam('#cbody', 0.84,   0, -20, 0.26);
  tl.fromTo('#av', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, 0.94);
  press('#av', 1.20, INK);
  slam('#q1',  1.06, -28, -20, 0.24);
  slam('#q2',  1.20, -28, -20, 0.24);
  slam('#cfoot', 1.44, 0, -18, 0.24);
  press('#t1', 1.68);
  press('#t2', 1.76);
  slam('#org', 1.90, 0, -16, 0.22);

  slam('#footrow', 2.10, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.22);
  slam('#note',     2.38, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.52);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.86);

  var introEnd = 3.86;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
