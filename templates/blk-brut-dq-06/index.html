<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"TOP5 / 排行榜"},
{"id":"title","name":"小标题","type":"string","label":"排行榜上方的小标题（一行，12–18 字）","default":"同题材里最能扛住推荐的五条"},
{"id":"r1","name":"第 1 名","type":"string","label":"第 1 名标签（4–8 字）","default":"拆账号"},
{"id":"n1","name":"数值 1","type":"number","label":"第 1 名数值","default":92},
{"id":"r2","name":"第 2 名","type":"string","label":"第 2 名标签","default":"改开头"},
{"id":"n2","name":"数值 2","type":"number","label":"第 2 名数值","default":78},
{"id":"r3","name":"第 3 名","type":"string","label":"第 3 名标签","default":"做合集"},
{"id":"n3","name":"数值 3","type":"number","label":"第 3 名数值","default":64},
{"id":"r4","name":"第 4 名","type":"string","label":"第 4 名标签","default":"砍时长"},
{"id":"n4","name":"数值 4","type":"number","label":"第 4 名数值","default":47},
{"id":"r5","name":"第 5 名","type":"string","label":"第 5 名标签","default":"换封面"},
{"id":"n5","name":"数值 5","type":"number","label":"第 5 名数值","default":31},
{"id":"unit","name":"单位","type":"string","label":"数值单位","default":"分"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚（口径）","default":"口径：近 30 天 · 同类内容 · 综合指数满分 100"},
{"id":"accent","name":"强调色","type":"color","label":"第 1 名色块 + 斜纹带","default":"#FFD429"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>排名列表 TOP5 · 同题材里最能扛住推荐的五条</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整块换底色（基因 10）：ink 底 + white 字，反白是整块替换，不叠蒙版 */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--white)}
  .sh-m{box-shadow:6px 6px 0 var(--white)}

  .hd{flex:0 0 auto;padding:42px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--accent);white-space:nowrap;flex:0 0 auto}
  /* 中文小标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:68px;line-height:1.14;
    letter-spacing:0;margin-top:16px;color:var(--white);padding-right:24px}

  /* 排行：每行 = 名次方块 + 标签 + 占比条 + 数值；行间用 3px 白实线分隔（基因 7） */
  .list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;padding:24px 88px 0}
  .row{display:flex;align-items:center;gap:26px;padding:14px 0;
    border-bottom:var(--bw) solid var(--paper)}
  .rk{flex:0 0 auto;width:62px;height:62px;display:flex;align-items:center;
    justify-content:center;background:var(--white);color:var(--ink);
    border:var(--bw) solid var(--paper);border-radius:4px;box-shadow:4px 4px 0 var(--white);
    font-family:var(--mono);font-weight:900;font-size:26px}
  .row.t1 .rk{background:var(--accent)}
  .nm{flex:0 0 300px;display:block;white-space:nowrap;font-size:40px;font-weight:900;
    line-height:1.2;letter-spacing:0;color:var(--white)}
  .track{flex:1 1 auto;min-width:0;height:26px;background:var(--ink);
    border:var(--bw) solid var(--paper)}
  .bar{display:block;height:20px;width:0;background:var(--paper)}
  .row.t1 .bar{background:var(--accent)}
  .val{flex:0 0 auto;display:flex;align-items:baseline;gap:6px}
  .vn{font-family:var(--mono);font-weight:900;font-size:44px;line-height:1;letter-spacing:0;
    font-variant-numeric:tabular-nums}
  .vu{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--accent)}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:26px 88px 40px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--white);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--paper)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--paper);
    border-bottom:var(--bw) solid var(--paper);
    background:repeating-linear-gradient(45deg,var(--paper) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">TOP5 / 排行榜</div>
    <div class="title anim" id="title" data-fit-max="68" data-fit-min="34">同题材里最能扛住推荐的五条</div>
  </div>

  <div class="list anim" id="list">
    <div class="row t1 anim"><span class="rk">01</span><span class="nm" id="r1" data-fit-max="40" data-fit-min="20">拆账号</span><span class="track anim" id="track1"><span class="bar" id="bar1"></span></span><span class="val"><span class="vn" id="vn1">92</span><span class="vu" id="unit">分</span></span></div>
    <div class="row anim"><span class="rk">02</span><span class="nm" id="r2" data-fit-max="40" data-fit-min="20">改开头</span><span class="track anim" id="track2"><span class="bar" id="bar2"></span></span><span class="val"><span class="vn" id="vn2">78</span><span class="vu">分</span></span></div>
    <div class="row anim"><span class="rk">03</span><span class="nm" id="r3" data-fit-max="40" data-fit-min="20">做合集</span><span class="track anim" id="track3"><span class="bar" id="bar3"></span></span><span class="val"><span class="vn" id="vn3">64</span><span class="vu">分</span></span></div>
    <div class="row anim"><span class="rk">04</span><span class="nm" id="r4" data-fit-max="40" data-fit-min="20">砍时长</span><span class="track anim" id="track4"><span class="bar" id="bar4"></span></span><span class="val"><span class="vn" id="vn4">47</span><span class="vu">分</span></span></div>
    <div class="row anim"><span class="rk">05</span><span class="nm" id="r5" data-fit-max="40" data-fit-min="20">换封面</span><span class="track anim" id="track5"><span class="bar" id="bar5"></span></span><span class="val"><span class="vn" id="vn5">31</span><span class="vu">分</span></span></div>
  </div>

  <div class="foot anim" id="foot">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">口径：近 30 天 · 同类内容 · 综合指数满分 100</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'r1', 'r2', 'r3', 'r4', 'r5', 'unit', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  function val(key) {
    var n = Number(v[key]);
    if (!isFinite(n) || n < 0) n = 0;
    return Math.round(n);
  }
  var vals = [val('n1'), val('n2'), val('n3'), val('n4'), val('n5')];
  var max = 0;
  for (var i = 0; i < vals.length; i++) if (vals[i] > max) max = vals[i];
  if (max <= 0) max = 1;
  for (var i = 0; i < vals.length; i++) set('vn' + (i + 1), String(vals[i]));

  var bars = ['#bar1', '#bar2', '#bar3', '#bar4', '#bar5'];
  var tracks = ['#track1', '#track2', '#track3', '#track4', '#track5'];

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：占比条直接给终宽 */
    for (var i = 0; i < bars.length; i++) {
      gsap.set(bars[i], { width: Math.round(vals[i] / max * 100) + '%' });
    }
    tl.fromTo('#hd',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#list', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#foot', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  slam('#list', 0.30,   0, -24, 0.28);

  /* 五行依次自左侧撞入；占比条用 grow 补 width（不能拿 wipe 去动 width:0 的元素） */
  var rows = document.querySelectorAll('#list .row');
  for (var i = 0; i < rows.length; i++) {
    var at = 0.54 + i * 0.16;
    tl.fromTo(rows[i], { x: -64 }, { x: 0, duration: 0.24, ease: 'power4.out' }, at);
    B.in.grow(tl, bars[i], Math.round(vals[i] / max * 100) + '%', at + 0.08,
      { d: 0.46, ease: 'power3.out' });
  }
  /* 模 9 阴影档位脉冲：第一名的名次方块换一次档再换回来，只在档位间 steps 跳 */
  var rk1 = rows[0].querySelector('.rk');
  tl.to(rk1, { boxShadow: '4px 7px 0 #FFFFFF', duration: 0.06, ease: 'steps(2)' }, 0.78);
  tl.to(rk1, { boxShadow: '4px 4px 0 #FFFFFF', duration: 0.06, ease: 'steps(2)' }, 0.84);

  slam('#foot', 1.86, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.98);
  slam('#note', 2.14, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.28);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 2.62);

  var introEnd = 3.42;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
