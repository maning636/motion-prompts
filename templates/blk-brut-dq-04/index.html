<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"SHARE / 占比条"},
{"id":"title","name":"小标题","type":"string","label":"占比条上方的小标题（一行，12–18 字）","default":"一周的时间都花在哪儿了"},
{"id":"l1","name":"条目 1","type":"string","label":"第 1 条标签（4–8 字）","default":"写稿"},
{"id":"p1","name":"占比 1","type":"number","label":"第 1 条占比（0–100）","default":34},
{"id":"l2","name":"条目 2","type":"string","label":"第 2 条标签","default":"拍摄"},
{"id":"p2","name":"占比 2","type":"number","label":"第 2 条占比（0–100）","default":26},
{"id":"l3","name":"条目 3","type":"string","label":"第 3 条标签","default":"剪辑"},
{"id":"p3","name":"占比 3","type":"number","label":"第 3 条占比（0–100）","default":22},
{"id":"l4","name":"条目 4","type":"string","label":"第 4 条标签","default":"改标题"},
{"id":"p4","name":"占比 4","type":"number","label":"第 4 条占比（0–100）","default":18},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚（口径）","default":"口径：上周实际计时 · 四舍五入到整数 · 合计 100%"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（第 1 条填充 + 斜纹带）","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>进度占比条 · 一周的时间都花在哪儿了</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:44px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文小标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:76px;line-height:1.14;
    letter-spacing:0;margin-top:18px;padding-right:24px}

  /* 占比条：上行标签 + 数值，下行 track + 填充条；行与行之间 3px 实线（基因 7） */
  .bars{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;padding:30px 88px 0}
  .item{padding:20px 0;border-top:var(--bw) solid var(--ink)}
  .item:last-child{border-bottom:var(--bw) solid var(--ink)}
  .row{display:flex;align-items:baseline;gap:20px;margin-bottom:14px}
  .lab{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;font-size:38px;
    font-weight:900;line-height:1.2;letter-spacing:0;padding-right:20px}
  .pc{flex:0 0 auto;font-family:var(--mono);font-weight:900;font-size:52px;line-height:1;
    letter-spacing:0}
  .pc .u{font-size:26px;margin-left:2px}
  .track{width:100%;height:44px;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;padding:0}
  /* 填充条初始 width:0，用 B.in.grow 拉开；不能拿 wipe 去动 width:0 的元素 */
  .fill{display:block;height:38px;width:0;background:var(--ink)}
  .fill.f1{background:var(--accent)}
  .fill.f2{background:var(--yellow)}
  .fill.f3{background:var(--green)}
  .fill.f4{background:var(--blue)}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">SHARE / 占比条</div>
    <div class="title anim" id="title" data-fit-max="76" data-fit-min="38">一周的时间都花在哪儿了</div>
  </div>

  <div class="bars anim" id="bars">
    <div class="item anim" id="item1">
      <div class="row"><span class="lab" id="l1" data-fit-max="38" data-fit-min="19">写稿</span><span class="pc"><span class="pv" id="v1">34</span><span class="u">%</span></span></div>
      <div class="track anim" id="track1"><span class="fill f1" id="fill1"></span></div>
    </div>
    <div class="item anim" id="item2">
      <div class="row"><span class="lab" id="l2" data-fit-max="38" data-fit-min="19">拍摄</span><span class="pc"><span class="pv" id="v2">26</span><span class="u">%</span></span></div>
      <div class="track anim" id="track2"><span class="fill f2" id="fill2"></span></div>
    </div>
    <div class="item anim" id="item3">
      <div class="row"><span class="lab" id="l3" data-fit-max="38" data-fit-min="19">剪辑</span><span class="pc"><span class="pv" id="v3">22</span><span class="u">%</span></span></div>
      <div class="track anim" id="track3"><span class="fill f3" id="fill3"></span></div>
    </div>
    <div class="item anim" id="item4">
      <div class="row"><span class="lab" id="l4" data-fit-max="38" data-fit-min="19">改标题</span><span class="pc"><span class="pv" id="v4">18</span><span class="u">%</span></span></div>
      <div class="track anim" id="track4"><span class="fill f4" id="fill4"></span></div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">口径：上周实际计时 · 四舍五入到整数 · 合计 100%</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'l1', 'l2', 'l3', 'l4', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  function pct(key) {
    var n = Number(v[key]);
    if (!isFinite(n)) n = 0;
    n = Math.max(0, Math.min(100, Math.round(n)));
    return n;
  }
  var pcts = [pct('p1'), pct('p2'), pct('p3'), pct('p4')];
  var fills = ['#fill1', '#fill2', '#fill3', '#fill4'];
  for (var i = 0; i < pcts.length; i++) {
    set('v' + (i + 1), String(pcts[i]));
  }

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：填充条直接给终宽，不做拉开 */
    for (var i = 0; i < fills.length; i++) {
      gsap.set(fills[i], { width: pcts[i] + '%' });
    }
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#bars',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  slam('#bars', 0.32,   0, -24, 0.28);

  /* 四条依次落位 + 填充条拉开。填充条初始 width:0，
     必须用 grow（补 width），用 wipe 只改 clip-path 会让条子压根不显示。 */
  var items = ['#item1', '#item2', '#item3', '#item4'];
  for (var i = 0; i < items.length; i++) {
    var at = 0.54 + i * 0.26;
    tl.fromTo(items[i], { x: -56 }, { x: 0, duration: 0.24, ease: 'power4.out' }, at);
    B.in.grow(tl, fills[i], pcts[i] + '%', at + 0.10, { d: 0.5, ease: 'power3.out' });
  }
  /* 模 9 阴影档位脉冲：最后一条停稳时给 track 换一次档再换回来，只在档位间 steps 跳 */
  tl.to('#track4', { boxShadow: '8px 8px 0 ' + INK, duration: 0.06, ease: 'steps(2)' }, 1.86);
  tl.to('#track4', { boxShadow: 'none', duration: 0.06, ease: 'steps(2)' }, 1.92);

  slam('#footrow', 2.24, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.36);
  slam('#note',    2.52, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.66);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 3.00);

  var introEnd = 3.80;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
