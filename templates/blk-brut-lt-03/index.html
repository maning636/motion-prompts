<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"label","name":"徽章文字","type":"string","label":"徽章文字（2–6 字）","default":"直播中"},{"id":"mark","name":"品牌方块","type":"string","label":"品牌方块缩写（1–3 个英文/数字）","default":"BB"},{"id":"note","name":"副行","type":"string","label":"副行 mono 小字","default":"每周三 20:00 更新"},{"id":"accent","name":"强调色","type":"color","label":"强调色（胶囊底）","default":"#FF5FA2"},{"id":"corner","name":"位置","type":"enum","label":"贴角位置（右上 / 左上）","default":"right","options":[{"label":"右上角","value":"right"},{"label":"左上角","value":"left"}]},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="贴角小徽章：品牌方块 + 胶囊状态牌 + mono 副行，拍入后靠匀速位移做机械呼吸，全程不缩放">
<title>角标徽章 · 直播中</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 全程不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 四档硬阴影，X 恒等于 Y，第三值恒 0（基因 2） */
  .sh-s {box-shadow:4px 4px 0 var(--shadow)}
  .sh-m {box-shadow:6px 6px 0 var(--shadow)}

  /* 三个件：52 方块 → 72 方块（1080p 缩放，形状不许换）+ 9999px 胶囊 + 副行条 */
  /* 三个文本都挂 data-fit，先给容器设上限宽度，fit() 才有可量的参照框；
     否则 auto 宽度的父级永远量到「文字刚好放得下」，收口形同虚设。 */
  .bdg{position:absolute;top:96px;max-width:600px;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
  .bdg.at-right{right:96px}
  .bdg.at-left {left:96px;align-items:flex-start}

  .row{display:flex;align-items:center;gap:14px}
  /* 品牌方块：正方 + 3px 黑边 + 4px 直角 + 硬阴影（§3.14 / 基因 3） */
  .mark{flex:0 0 auto;width:72px;height:72px;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);
      border-radius:4px;box-shadow:4px 4px 0 var(--shadow);
      font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.02em}
  /* 状态胶囊：唯一允许的 9999px 圆角（基因 3 / §3.2） */
  .pill{display:inline-flex;align-items:center;gap:14px;max-width:560px;padding:16px 34px;
      background:var(--accent);color:var(--ink);border:var(--bw) solid var(--ink);
      border-radius:9999px;box-shadow:4px 4px 0 var(--shadow);
      font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.08em;white-space:nowrap}
  /* 状态点：纯方块 + 3px 黑边，色块不许裸奔（基因 6 / §3.14 的方块写法） */
  .pill .dot{flex:0 0 auto;width:22px;height:22px;background:var(--yellow);
      border:var(--bw) solid var(--ink);border-radius:4px}
  .note{max-width:560px;padding:10px 24px;background:var(--ink);color:var(--white);white-space:nowrap;overflow:hidden;
      border:var(--bw) solid var(--ink);border-radius:9999px;box-shadow:4px 4px 0 var(--shadow);
      font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.1em;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div class="bdg at-right" id="bdg">
    <div class="row">
      <div class="mark"><span id="mark" data-fit-max="30" data-fit-min="12">BB</span></div>
      <div class="pill"><span class="dot"></span><span id="label" data-fit-max="26" data-fit-min="14">直播中</span></div>
    </div>
    <div class="note" id="note">每周三 20:00 更新</div>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* 透明底分支（风格规范 §7.5） */
  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  var atLeft = (v.corner || 'right') === 'left';
  var bdg = document.getElementById('bdg');
  bdg.className = atLeft ? 'bdg at-left' : 'bdg at-right';

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['label', 'mark', 'note'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  /* 品牌方块是定尺 72×72 的，参照框得指定成它自己，data-fit 走不到这一层 */
  B.fit('#mark', { max: 30, min: 12, box: '.mark' });
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉拍入与位移呼吸，只留终态 + ≤8px 微位移淡入（§13.5） */
    gsap.set('#bdg', { x: 0, y: 0, opacity: 1, boxShadow: 'none' });
    gsap.set('#mark', { x: 0, y: 0 });
    gsap.set('.pill', { x: 0, y: 0 });
    gsap.set('#note', { y: 0 });

    tl.fromTo('#bdg', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power2.out' }, 0);
    tl.fromTo('.row', { opacity: 0 },
        { opacity: 1, duration: .45, ease: 'power2.out' }, .06);
    tl.fromTo('.note', { opacity: 0 },
        { opacity: 1, duration: .45, ease: 'power2.out' }, .2);

    B.hold(tl, 1.25, 1.15);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';
  var dx = atLeft ? -40 : 40;

  /* 模 1 · 拍进来：从贴角斜向硬着陆，落定瞬间阴影压 2 帧再弹回原档。0.26s，零 overshoot。 */
  tl.fromTo('#bdg', { x: dx, y: -44 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#mark', { boxShadow: '4px 4px 0 ' + SH },
      { boxShadow: '4px 7px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#mark', { boxShadow: '4px 4px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  /* 胶囊跟在后面半格装上去，纯位移，opacity 恒为 1（模 2） */
  tl.fromTo('.pill', { x: dx * .5 },
      { x: 0, duration: .2, ease: 'power4.out' }, .16);

  /* 位移呼吸：靠匀速往返的 y 位移，不碰 scale。
     刻意不用 sine.inOut + repeat:-1 + yoyo（§4.4 明令禁止的漂浮循环），
     也不用 back/elastic —— 这里是机械节拍器，不是软糖。
     repeat 必须是有限的：repeat:-1 会把 tl.duration() 撑到 1e10s，settle 取帧直接失效。 */
  var T0 = .95;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);   /* 一个来回摊成 REP 段，正好在 WIN 收尾 */
  tl.to('#bdg', { y: -6, duration: half, ease: 'none',
      repeat: REP * 2 - 1, yoyo: true }, T0);
  /* 副行错开半拍起步、少走半拍，两层的相对位移就是「在呼吸」的读感来源 */
  tl.to('#note', { y: -4, duration: half, ease: 'none',
      repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
