<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"GIFT / 买赠"},{"id":"title","name":"主标题","type":"string","label":"主标题（顶部反白条上的一行大字）","default":"买一件，送三样"},{"id":"goodsName","name":"主商品","type":"string","label":"主商品名称","default":"重磅纯棉圆领卫衣"},{"id":"goodsNote","name":"主商品说明","type":"string","label":"主商品说明（一行）","default":"同 SKU 同规格 · 下单即赠，不用额外付款"},{"id":"giftTitle","name":"赠品区标题","type":"string","label":"赠品区标题","default":"买即赠"},{"id":"gift1","name":"赠品 1","type":"string","label":"第一件赠品名称","default":"陶瓷马克杯"},{"id":"gift2","name":"赠品 2","type":"string","label":"第二件赠品名称","default":"纯棉船袜"},{"id":"gift3","name":"赠品 3","type":"string","label":"第三件赠品名称","default":"帆布收纳袋"},{"id":"giftQty","name":"每种数量","type":"number","label":"每种赠品数量（件）","default":1},{"id":"note","name":"底部说明","type":"string","label":"底部说明（一行 mono）","default":"赠品随主商品同单发出 · 赠完即止不补发"},{"id":"accent","name":"强调色","type":"color","label":"强调色（赠品一色条 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="商品加赠品网格构图：上部一条主商品卡压住画面，下部三格赠品卡并排，每格顶部一色 14px 色条，下方反白说明条收尾">
<title>买即赠三格 · 买一件，送三样</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* 顶部反白标题条 */
  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 72px;height:78px;
    background:var(--ink);color:var(--white)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .tt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:40px;font-weight:900;letter-spacing:0}
  .hd .eb{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-weight:700;
    font-size:24px;letter-spacing:.14em;color:var(--yellow)}

  /* 主商品条：整宽白卡，名称左置、说明右置 */
  .goods{flex:0 0 auto;display:flex;align-items:center;gap:30px;
    padding:30px 72px;background:var(--white);border-bottom:var(--bw) solid var(--ink)}
  .goods .sw{flex:0 0 auto;width:96px;height:96px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:900;font-size:34px;color:var(--ink)}
  .goods .nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:48px;font-weight:900;letter-spacing:0}
  .goods .nt{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-size:28px;font-weight:700;
    color:var(--mute)}

  /* 赠品区标题：mono 小标题 + 3px 实线 */
  .gHead{flex:0 0 auto;display:flex;align-items:center;gap:20px;padding:24px 72px 16px}
  .gHead .k{flex:0 0 auto;font-size:34px;font-weight:900;letter-spacing:0;white-space:nowrap}
  .gHead .line{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .gHead .c{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.1em;color:var(--mute);white-space:nowrap}

  /* 三格赠品：顶部一色条 + 白卡 + 名称 + 数量方块 */
  .gifts{flex:1 1 auto;min-height:0;display:flex;gap:26px;padding:8px 72px 34px}
  .gift{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    border:var(--bw) solid var(--ink);border-radius:4px;overflow:hidden;
    background:var(--white)}
  .gift .bar{flex:0 0 auto;height:16px;border-bottom:var(--bw) solid var(--ink);
    background:var(--accent)}
  .gift.g2 .bar{background:var(--green)}
  .gift.g3 .bar{background:var(--blue)}
  .gift .in{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;padding:26px 22px}
  .gift .idx{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--mute)}
  .gift .nm{display:block;white-space:nowrap;font-weight:900;font-size:46px;
    letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    text-align:center}
  .gift .qty{flex:0 0 auto;display:inline-flex;align-items:center;gap:12px;
    padding:8px 22px;background:var(--ink);color:var(--yellow);
    border:var(--bw) solid var(--ink);border-radius:4px;
    font-family:var(--mono);font-weight:900;font-size:28px;letter-spacing:0}
  /* 深底上的件用 8px 白影（§7.2 规则 B） */
  .gift .qty{box-shadow:4px 4px 0 var(--white)}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:22px 72px;
    border-top:var(--bw) solid var(--ink);background:var(--ink);color:var(--white)}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--white);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.08em}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="tag">GIFT</span>
    <span class="tt anim" id="title" data-fit-max="40" data-fit-min="22">买一件，送三样</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">GIFT / 买赠</span>
  </div>

  <div class="goods anim" id="goods">
    <span class="sw anim" id="swatch">01</span>
    <span class="nm anim" id="goodsName" data-fit-max="48" data-fit-min="26">重磅纯棉圆领卫衣</span>
    <span class="nt anim" id="goodsNote" data-fit-max="28" data-fit-min="16">同 SKU 同规格 · 下单即赠，不用额外付款</span>
  </div>

  <div class="gHead anim" id="gHead">
    <span class="k anim" id="giftTitle" data-fit-max="34" data-fit-min="20">买即赠</span>
    <span class="line"></span>
    <span class="c anim" id="giftTotal">共 3 类</span>
  </div>

  <div class="gifts anim" id="gifts">
    <div class="gift anim" id="giftA">
      <div class="bar"></div>
      <div class="in">
        <span class="idx">GIFT 01</span>
        <span class="nm anim" id="gift1" data-fit-max="46" data-fit-min="24">陶瓷马克杯</span>
        <span class="qty anim" id="qty1">× 1</span>
      </div>
    </div>
    <div class="gift g2 anim" id="giftB">
      <div class="bar"></div>
      <div class="in">
        <span class="idx">GIFT 02</span>
        <span class="nm anim" id="gift2" data-fit-max="46" data-fit-min="24">纯棉船袜</span>
        <span class="qty anim" id="qty2">× 1</span>
      </div>
    </div>
    <div class="gift g3 anim" id="giftC">
      <div class="bar"></div>
      <div class="in">
        <span class="idx">GIFT 03</span>
        <span class="nm anim" id="gift3" data-fit-max="46" data-fit-min="24">帆布收纳袋</span>
        <span class="qty anim" id="qty3">× 1</span>
      </div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">赠品随主商品同单发出 · 赠完即止不补发</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'goodsName', 'goodsNote', 'giftTitle', 'gift1', 'gift2', 'gift3', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 每种赠品的数量只填一次，三格与合计都由它推出 */
  var qty = Number(v.giftQty);
  if (!isFinite(qty)) qty = 1;
  qty = Math.max(1, Math.round(qty));
  set('qty1', '× ' + qty);
  set('qty2', '× ' + qty);
  set('qty3', '× ' + qty);
  set('giftTotal', '共 3 类 · 合计 ' + (3 * qty) + ' 件');

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#goods', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#gifts', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .5);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .62);
    B.hold(tl, 1.3, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',      0.00,   0, -78, 0.26);
  slam('#title',   0.14, -28, -24, 0.26);
  slam('#eyebrow', 0.20,  24, -20, 0.22);
  /* 主商品条自左画外切入 */
  tl.fromTo('#goods', { x: -120 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.38);
  slam('#swatch',   0.58, -28, -28, 0.24);
  shadowBounce('#swatch', '6px 6px 0 ' + INK, 0.82);
  slam('#goodsName',0.70,   0, -24, 0.24);
  slam('#goodsNote',0.80,  24, -20, 0.22);
  slam('#gHead',    0.94,   0, -20, 0.22);
  slam('#giftTitle',1.02, -24, -18, 0.2);
  /* 三格赠品自下错峰落位 */
  tl.from('#gifts .gift', { y: 56, duration: .28, ease: 'power4.out', stagger: .12 }, 1.12);
  slam('#gift1', 1.42,   0, -20, 0.22);
  slam('#gift2', 1.54,   0, -20, 0.22);
  slam('#gift3', 1.66,   0, -20, 0.22);
  slam('#foot',   1.84,   0,  28, 0.26);
  slam('#note',   1.96, -24, -20, 0.22);
  slam('#stripe', 2.06,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.30);

  var introEnd = 3.50;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
