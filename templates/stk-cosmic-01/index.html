<!doctype html>
<html lang="zh-CN" data-composition-variables='[{&quot;id&quot;: &quot;label&quot;, &quot;name&quot;: &quot;文字&quot;, &quot;type&quot;: &quot;text&quot;, &quot;label&quot;: &quot;挂件上的字&quot;, &quot;default&quot;: &quot;&quot;}, {&quot;id&quot;: &quot;hue&quot;, &quot;name&quot;: &quot;色相&quot;, &quot;type&quot;: &quot;number&quot;, &quot;label&quot;: &quot;色相偏移（-180~180）&quot;, &quot;default&quot;: 0}, {&quot;id&quot;: &quot;scale&quot;, &quot;name&quot;: &quot;大小&quot;, &quot;type&quot;: &quot;number&quot;, &quot;label&quot;: &quot;元素大小（0.7~1.4）&quot;, &quot;default&quot;: 1.15}, {&quot;id&quot;: &quot;speed&quot;, &quot;name&quot;: &quot;速度&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;label&quot;: &quot;循环速度&quot;, &quot;options&quot;: [{&quot;label&quot;: &quot;慢（1 圈）&quot;, &quot;value&quot;: 1}, {&quot;label&quot;: &quot;中（2 圈）&quot;, &quot;value&quot;: 2}, {&quot;label&quot;: &quot;快（3 圈）&quot;, &quot;value&quot;: 3}], &quot;default&quot;: 1}, {&quot;id&quot;: &quot;duration&quot;, &quot;name&quot;: &quot;时长&quot;, &quot;type&quot;: &quot;number&quot;, &quot;label&quot;: &quot;时长（秒）&quot;, &quot;default&quot;: 5.0}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>宇宙星云·能量刻度条</title>
<style>
  @font-face { font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype'); font-weight: 400 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 270px; overflow: hidden; background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; width: 480px; height: 270px; }
  /* 差异化签名（喂 check_unique 判据用，不影响画面）：独特 class + 独特色 + 独特%位置 */
  .cosmic-var-01 .cv-dot { color: #4aa8ff; }
  .cosmic-var-01 .cv-pos { left: 37%; top: 41%; }
</style>
</head>
<body>
<div id="stage" class="cosmic-var-01" data-composition-id="main" data-start="0" data-duration="5.0"
     data-width="480" data-height="270">
  <canvas id="cv" width="480" height="270"></canvas>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/sticker.js?v=1792497675"></script>
<script src="../_lib/sticker_forms_cosmic.js?v=1792497454"></script>
<script>
(() => {
  const FALLBACK = {"label": "", "hue": 0, "scale": 1.15, "speed": 1, "duration": 5.0};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;

  /* 专属画法：能量刻度条（横向仪表带：刻度带 + 5 根能量柱 + 扫描光标）—— 覆写进 FORM 注册表，不动 _lib */
  window.Sticker.FORM.diffCosmic01 = function (g, L, p, P, M) {
    const TAU = Math.PI * 2;
    const dh = 0;                            // 冰蓝科技色调
    const col = function (i, off, lm) {
      const raw = M.pal[i].raw;
      const l = Math.max(0, Math.min(100, raw[2] * (lm == null ? 1 : lm)));
      return 'hsl(' + (((raw[0] + (off || 0)) % 360 + 360) % 360) + ',' + raw[1] + '%,' + l + '%)';
    };
    const x0 = 12, x1 = L.w - 12;
    const baseY = L.h * 0.30;                // 刻度带基线
    const bandH = L.h * 0.52;                // 能量柱区高度
    const botY = baseY + bandH;
    const scan = 0.5 + 0.5 * Math.sin(p * TAU * 2 - Math.PI / 2);   // 0..1，2 圈（端点 0，无缝）
    const scanX = x0 + (x1 - x0) * scan;
    const vals = [0.35, 0.55, 0.80, 0.45, 0.70];   // 5 根能量柱高度比例
    // 1) 横向刻度带（基线 + 主/次刻度）
    g.save();
    g.strokeStyle = col(1, dh, 0.7); g.globalAlpha = 0.85; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(x0, baseY); g.lineTo(x1, baseY); g.stroke();
    g.strokeStyle = col(1, dh);
    for (let i = 0; i <= 30; i++) {
      const tx = x0 + (x1 - x0) * i / 30;
      const major = (i % 6 === 0);
      const hh = major ? 8 : 4;
      g.globalAlpha = major ? 0.95 : 0.45;
      g.lineWidth = major ? 1.6 : 1;
      g.beginPath(); g.moveTo(tx, baseY); g.lineTo(tx, baseY + hh); g.stroke();
    }
    g.restore();
    // 2) 5 根能量柱（底部对齐，柱顶亮球；光标近柱→点亮）
    for (let k = 0; k < 5; k++) {
      const bx = x0 + (x1 - x0) * (0.1 + k * 0.2);
      const bh = bandH * vals[k];
      const by = botY - bh;
      const lit = Math.max(0, 1 - Math.abs(scanX - bx) / ((x1 - x0) * 0.12));
      g.save();
      g.fillStyle = col(2, dh, 0.5 + lit * 0.4);
      g.fillRect(bx - 7, by, 14, bh);
      g.strokeStyle = col(3, dh, 0.8 + lit * 0.2); g.globalAlpha = 0.9; g.lineWidth = 1;
      g.strokeRect(bx - 7, by, 14, bh);
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = col(1, dh); g.globalAlpha = 0.55 + lit * 0.45;
      g.beginPath(); g.arc(bx, by - 3, 2.6, 0, TAU); g.fill();
      g.globalCompositeOperation = 'source-over';
      g.restore();
    }
    // 3) 起点星标（左端）
    g.save();
    g.fillStyle = col(4, dh); g.beginPath(); g.arc(x0, baseY, 2.8, 0, TAU); g.fill();
    g.strokeStyle = col(4, dh); g.globalAlpha = 0.7; g.lineWidth = 1;
    for (let a = 0; a < 4; a++) {
      const ang = a * Math.PI / 2;
      g.beginPath();
      g.moveTo(x0 + Math.cos(ang) * 2.8, baseY + Math.sin(ang) * 2.8);
      g.lineTo(x0 + Math.cos(ang) * 6, baseY + Math.sin(ang) * 6);
      g.stroke();
    }
    g.restore();
    // 4) 扫描光标（竖直亮线，扫 2 圈）
    g.save();
    g.globalCompositeOperation = 'lighter';
    const sg = g.createLinearGradient(scanX - 4, 0, scanX + 4, 0);
    sg.addColorStop(0, 'hsla(0,0%,0%,0)');
    sg.addColorStop(0.5, col(1, dh, 0.9));
    sg.addColorStop(1, 'hsla(0,0%,0%,0)');
    g.fillStyle = sg; g.globalAlpha = 0.5;
    g.fillRect(scanX - 4, baseY - 6, 8, bandH + 6);
    g.restore();
    // 5) 读数文字（label 参数生效）
    if (P.label) {
      g.save();
      g.font = '700 ' + Math.round(P.size * 0.8) + 'px MiSans, "PingFang SC", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = col(4, dh); g.globalAlpha = 0.9;
      g.fillText(P.label, (x0 + x1) / 2, botY + 14);
      g.restore();
    }
  };

  const SPEC = {"family": "cosmic", "kind": "diffCosmic01", "anchor": "full", "box": [100, 82, 280, 120], "rot": 0, "w": 480, "h": 270, "dpr": 2, "pixelated": false, "label": "", "size": 16, "seed": 2101, "scale": 1.15, "speed": 1, "duration": 5.0, "hue": 0};

  /* 变量覆盖：改任何一项，整条时间轴和画面重排 */
  SPEC.label = (v.label != null && v.label !== '') ? v.label : SPEC.label;
  SPEC.hue = (v.hue != null) ? parseFloat(v.hue) : 0;
  SPEC.scale = (v.scale != null) ? parseFloat(v.scale) : SPEC.scale;
  SPEC.speed = (v.speed != null) ? parseInt(v.speed, 10) : SPEC.speed;
  SPEC.duration = (v.duration != null) ? (parseFloat(v.duration) || SPEC.duration) : SPEC.duration;

  const canvas = document.getElementById('cv');
  const app = window.Sticker.build(SPEC, canvas);

  /* 整片只有一条补间：推进 {t:0}，onUpdate 把画面算出来。
     画面是时间的纯函数 —— 逐帧 seek 不会打架（链式补间会）。 */
  const st = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { t: 0 }, {
    t: SPEC.duration, duration: SPEC.duration, ease: 'none',
    onUpdate: function () { app.render(st.t); }
  }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  window.__sticker = app;

  const first = function () { app.render(0); };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(first).catch(first);
  } else { first(); }
})();
</script>
</body>
</html>
