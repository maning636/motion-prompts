<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"CHECKLIST / 打勾卡"},
{"id":"title","name":"小标题","type":"string","label":"打勾卡上方的小标题（一行，12–18 字）","default":"发布前最后四件事，做完再点发送"},
{"id":"i1","name":"条目 1","type":"string","label":"第 1 条（8–16 字）","default":"第一帧就有画面，不是黑场"},
{"id":"i2","name":"条目 2","type":"string","label":"第 2 条","default":"文案里没有需要跳读的长句"},
{"id":"i3","name":"条目 3","type":"string","label":"第 3 条","default":"字幕和口播一字不差"},
{"id":"i4","name":"条目 4","type":"string","label":"第 4 条","default":"结尾有一个明确的下一步"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"打勾是硬切换 · 不做打勾动画"},
{"id":"accent","name":"强调色","type":"color","label":"打勾后的方块底色 + 斜纹带","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Checklist 打勾卡 · 发布前最后四件事</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:42px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文小标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:68px;line-height:1.14;
    letter-spacing:0;margin-top:16px;padding-right:24px}

  /* 清单：每行 = 64×64 空方框 + 一行文案；打勾后框变强调色、勾字符 1 帧出现 */
  .list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;padding:24px 88px 0}
  .row{display:flex;align-items:center;gap:32px;padding:20px 0;
    border-top:var(--bw) solid var(--ink)}
  .row:last-child{border-bottom:var(--bw) solid var(--ink)}
  .box{flex:0 0 auto;width:64px;height:64px;display:flex;align-items:center;
    justify-content:center;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:4px 4px 0 var(--ink)}
  /* 勾字符：初始隐藏，打勾那一帧 1 帧硬切出现（模 8 色块闪切，不做打勾动画） */
  .tick{display:none;font-family:var(--mono);font-weight:900;font-size:38px;line-height:1;
    color:var(--ink)}
  .no{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.08em;color:var(--mute)}
  /* 中文条目用 sans（基因 9），700 字重 + 44px */
  .tx{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;font-size:44px;
    font-weight:700;line-height:1.24;letter-spacing:0;padding-right:20px}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">CHECKLIST / 打勾卡</div>
    <div class="title anim" id="title" data-fit-max="68" data-fit-min="34">发布前最后四件事，做完再点发送</div>
  </div>

  <div class="list anim" id="list">
    <div class="row anim" id="row1"><span class="box anim" id="box1"><span class="tick" id="tick1">✓</span></span><span class="no">01</span><span class="tx" id="i1" data-fit-max="44" data-fit-min="22">第一帧就有画面，不是黑场</span></div>
    <div class="row anim" id="row2"><span class="box anim" id="box2"><span class="tick" id="tick2">✓</span></span><span class="no">02</span><span class="tx" id="i2" data-fit-max="44" data-fit-min="22">文案里没有需要跳读的长句</span></div>
    <div class="row anim" id="row3"><span class="box anim" id="box3"><span class="tick" id="tick3">✓</span></span><span class="no">03</span><span class="tx" id="i3" data-fit-max="44" data-fit-min="22">字幕和口播一字不差</span></div>
    <div class="row anim" id="row4"><span class="box anim" id="box4"><span class="tick" id="tick4">✓</span></span><span class="no">04</span><span class="tx" id="i4" data-fit-max="44" data-fit-min="22">结尾有一个明确的下一步</span></div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">打勾是硬切换 · 不做打勾动画</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'i1', 'i2', 'i3', 'i4', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var boxes = ['#box1', '#box2', '#box3', '#box4'];
  var ticks = ['#tick1', '#tick2', '#tick3', '#tick4'];
  var rows = ['#row1', '#row2', '#row3', '#row4'];
  var AC = '#2FD07A';

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：四个勾全部落终态，直接读成品 */
    for (var i = 0; i < boxes.length; i++) {
      gsap.set(boxes[i], { backgroundColor: AC });
      gsap.set(ticks[i], { display: 'block' });
    }
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#list',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  slam('#list', 0.30,   0, -24, 0.28);

  /* 四行依次自左撞入；每行落定后打勾：方块换底 + 勾字符 1 帧硬切出现 */
  for (var i = 0; i < rows.length; i++) {
    var at = 0.54 + i * 0.24;
    tl.fromTo(rows[i], { x: -64 }, { x: 0, duration: 0.26, ease: 'power4.out' }, at);
    var chk = at + 0.30;
    tl.set(boxes[i], { backgroundColor: AC, immediateRender: false }, chk);
    tl.set(ticks[i], { display: 'block', immediateRender: false }, chk);
    tl.set(boxes[i], { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, chk);
    tl.to(boxes[i], { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, chk + 0.04);
  }

  slam('#footrow', 1.90, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.02);
  slam('#note',    2.18, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.32);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.66);

  var introEnd = 3.66;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
