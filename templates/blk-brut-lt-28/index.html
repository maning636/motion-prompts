<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"label","name":"热线标签","type":"string","label":"号码上方 mono 标签（2–6 字）","default":"咨询热线"},{"id":"tel","name":"电话号码","type":"string","label":"电话号码（8–16 字）","default":"400-820-8820"},{"id":"hours","name":"服务时间","type":"string","label":"服务时间（6–14 字）","default":"工作日 9:00–18:00"},{"id":"accent","name":"强调色","type":"color","label":"强调色（服务时间块底）","default":"#FF5FA2"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="热线电话条：绿色方块内 3px 描边话筒 SVG，中段白底卡给出 mono 大号码，右侧粉色服务时间块，三块自左依次拍入后错峰微位移">
<title>热线电话条 · 400-820-8820</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 电话方块：正方 + 3px 黑边 + 4px 直角，绿色是「接单/可用」状态色（§1.2 green 纪律） */
  #ph{position:absolute;left:120px;bottom:200px;width:176px;height:176px;
    display:flex;align-items:center;justify-content:center;
    background:var(--green);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  /* SVG 同时给宽高，只写 viewBox 会被浏览器替换成 300px 默认尺寸把方块撑破（规范 §11.3） */
  #ph svg{width:96px;height:96px;display:block}

  /* 号码卡：白底黑字，号码用 mono + tabular-nums（基因 9） */
  #pc{position:absolute;left:332px;bottom:200px;width:1088px;height:176px;
    display:flex;flex-direction:column;justify-content:center;padding:0 36px;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #label{display:block;font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.14em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}
  #tel{display:block;margin-top:14px;font-family:var(--mono);font-weight:900;font-size:76px;
    line-height:1;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;white-space:nowrap;overflow:hidden}

  /* 服务时间块：高饱和实色块，压任何 footage 上都读得清（§7.3.2） */
  #hs{position:absolute;left:1456px;bottom:200px;width:304px;height:176px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #hs .lb{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.16em;line-height:1;
    color:var(--ink)}
  #hours{display:block;padding:0 22px;font-size:32px;font-weight:900;line-height:1.16;letter-spacing:0;
    color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="ph">
    <svg viewBox="0 0 24 24" width="96" height="96" aria-hidden="true">
      <path d="M6.6 3.2 9 2.4c.7-.2 1.4.2 1.6.9l1 3.2c.2.6 0 1.3-.6 1.6L9.4 9c-.3.2-.4.5-.3.8a12 12 0 0 0 5.1 5.1c.3.1.6 0 .8-.3l1.6-1.6c.3-.5 1-.7 1.6-.5l3.2 1c.7.2 1.1.9.9 1.6l-.8 2.4c-.2.7-.8 1.1-1.5 1.1C11 18.6 5.4 13 5.4 4.7c0-.7.4-1.3 1.2-1.5z"
            fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3" stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="pc">
    <span id="label" data-fit-max="24" data-fit-min="14">咨询热线</span>
    <span id="tel" data-fit-max="76" data-fit-min="40">400-820-8820</span>
  </div>
  <div id="hs"><span class="lb">SERVICE</span><span id="hours" data-fit-max="32" data-fit-min="20">工作日 9:00–18:00</span></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['label', 'tel', 'hours'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉逐块拍入与错峰微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#ph', { x: 0, y: 0, opacity: 1 });
    gsap.set('#pc', { x: 0, y: 0, opacity: 1 });
    gsap.set('#hs', { x: 0, y: 0, opacity: 1 });
    gsap.set('#tel', { x: 0 });
    gsap.set('#hours', { x: 0 });

    tl.fromTo('#ph', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#pc', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 1 · 拍进来：三块自左依次斜向硬着陆，落定瞬间阴影压 2 帧再弹回原档 */
  var blocks = ['#ph', '#pc', '#hs'];
  blocks.forEach(function (sel, i) {
    var at = i * .14;
    tl.fromTo(sel, { x: -64, y: -36 },
        { x: 0, y: 0, duration: .26, ease: 'power4.out' }, at)
      .fromTo(sel, { boxShadow: '8px 8px 0 ' + SH },
        { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<' + at)
      .to(sel, { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<' + at);
  });

  /* 模 2 · 零件装上去：标签、号码、服务时间错峰跟位，纯位移，opacity 恒为 1 */
  tl.fromTo('#label', { x: -24 }, { x: 0, duration: .2, ease: 'power4.out' }, .3);
  tl.fromTo('#tel', { x: -30 }, { x: 0, duration: .22, ease: 'power4.out' }, .36);
  tl.fromTo('#hs .lb', { x: -18 }, { x: 0, duration: .2, ease: 'power4.out' }, .44);
  tl.fromTo('#hours', { x: 22 }, { x: 0, duration: .2, ease: 'power4.out' }, .5);

  /* 模 8 · 色块闪切：话筒方块底色按固定节奏换一次再换回，收尾停在绿色 */
  tl.set('#ph', { backgroundColor: '#FFD429', duration: 0 }, 1.7)
    .set('#ph', { backgroundColor: '#3D7BFF', duration: 0 }, 2.5)
    .set('#ph', { backgroundColor: '#2FD07A', duration: 0 }, 3.3);

  /* 三块错峰微位移：每块起步时间互不相同，匀速往返，零回弹 */
  var T0 = 2.0;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#ph', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#pc', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#hs', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
