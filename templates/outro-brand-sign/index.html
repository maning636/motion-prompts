    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

    <style>

@font-face{font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;src:local('MiSans');font-weight:100 1000;font-display:swap}

*{ box-sizing: border-box;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 110px 150px; overflow: hidden; display: flex; flex-direction: column; justify-content: center;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}

      .grid-bg{ position: absolute; inset: 0; opacity: .5;
        background-image: linear-gradient(rgba(244,239,231,.05) 2px, transparent 2px),
                          linear-gradient(90deg, rgba(244,239,231,.05) 2px, transparent 2px);
        background-size: 96px 96px;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .corner{ position: absolute; width: 120px; height: 120px; border: 6px solid var(--accent);font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .corner.tl{ left: 64px; top: 64px; border-right: none; border-bottom: none;}
      .corner.br{ right: 64px; bottom: 64px; border-left: none; border-top: none;}

      .brand-row{ display: flex; align-items: center; gap: 28px; margin: 0 0 30px;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .logo{ width: 108px; height: 108px; border-radius: 22px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex: none;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .logo svg{ width: 60px; height: 60px;}
      .brand-name{ font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-size: 84px; font-weight: 700; letter-spacing: .01em; color: var(--fg); line-height: 1;font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;}
      .seal{ font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif; font-size: 24px; letter-spacing: .24em; color: rgba(244,239,231,.5); border: 2px solid rgba(244,239,231,.24); border-radius: 9999px; padding: 10px 24px; white-space: nowrap; align-self: center;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}

      .slogan{ font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-size: 62px; font-weight: 700; line-height: 1.24; letter-spacing: -.01em; color: rgba(244,239,231,.94); margin: 0 0 34px; max-width: 1420px;font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;}
      .slogan em{ font-style: normal; color: var(--accent);font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;}

      .bullets{ display: flex; flex-direction: column; gap: 20px; margin: 0 0 60px; padding: 0; list-style: none;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .bullets li{ display: flex; align-items: center; gap: 18px; font-size: 34px; color: rgba(244,239,231,.78);font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .bullets li::before{ content: ''; width: 14px; height: 14px; background: var(--accent); flex: none; transform: rotate(45deg);font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}

      .contact-row{ display: flex; align-items: center; gap: 32px; border-top: 4px solid rgba(244,239,231,.16); padding-top: 40px; margin-top: auto;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .contact{ display: inline-flex; align-items: center; gap: 16px; background: var(--accent); color: #101014; border-radius: 12px; padding: 20px 38px; box-shadow: 10px 10px 0 rgba(0,0,0,.5);font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-size: 38px; font-weight: 700;font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;}
      .contact svg{ width: 30px; height: 30px;}
      .qr{ width: 108px; height: 108px; border: 4px solid rgba(244,239,231,.3); border-radius: 12px; flex: none;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="grid-bg"></div>
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="corner tl"></div><div class="corner br"></div>
        <div class="brand-row">
          <span class="logo" id="logo">
            <svg viewBox="0 0 24 24"><path d="M4 19V7l8-4 8 4v12" stroke="#101014" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M8 19v-6h8v6" stroke="#101014" stroke-width="2.2" fill="none"/></svg>
          </span>
          <span class="brand-name" id="brandName">磐石智能</span>
          <span class="seal" id="seal">SINCE 2019</span>
        </div>
        <h1 class="slogan" id="slogan"></h1>
        <ul class="bullets" id="bullets"></ul>
        <div class="contact-row">
          <span class="contact" id="contact">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18v12H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span id="contactTxt">hello@panrock.cn</span>
          </span>
          <span class="qr" id="qr"></span>
        </div>
      </section>
    </div>
    <script>
      const fallback = { brand: "磐石智能", slogan: "把复杂系统做成<em>可运维的部件</em>", contact: "hello@panrock.cn", bullets: "7 年工业沉淀 · 200+ 交付项目 · 全国 31 省服务网", seal: "SINCE 2019", accent: "#2FD07A", background: "#101014", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      const root = document.getElementById("root");
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#101014");
      root.style.backgroundColor = v.background;
      root.style.setProperty("--accent", v.accent ?? "#2FD07A");
      root.style.setProperty("--fg", v.foreground ?? "#F4EFE7");
      document.getElementById("brandName").textContent = v.brand;
      document.getElementById("seal").textContent = v.seal;
      document.getElementById("contactTxt").textContent = v.contact;
      // 口号允许内嵌 <em> 做强调，其余走 textContent 防注入
      const sloganEl = document.getElementById("slogan");
      const rawSlogan = String(v.slogan ?? "");
      if (/<em>/.test(rawSlogan)) { sloganEl.innerHTML = rawSlogan; }
      else { sloganEl.textContent = rawSlogan; }

      const bl = document.getElementById("bullets");
      String(v.bullets || "").split(/[·|]/).map(s => s.trim()).filter(Boolean)
        .forEach(t => { const li = document.createElement("li"); li.textContent = t; bl.appendChild(li); });

      // 品牌名逐字入场：用 span 包住，好做错峰
      const nameEl = document.getElementById("brandName");
      const nameText = nameEl.textContent;
      nameEl.textContent = "";
      const chars = [...nameText].map(ch => {
        const s = document.createElement("span");
        s.style.display = "inline-block";
        s.textContent = ch;
        nameEl.appendChild(s);
        return s;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(".corner", { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.8)", stagger: 0.12 }, 0.05);
      tl.fromTo("#logo", { opacity: 0, x: -60, rotate: -18 },
        { opacity: 1, x: 0, rotate: 0, duration: 0.7, ease: "back.out(2)" }, 0.22);
      tl.fromTo(chars, { opacity: 0, y: 40, rotate: -8 },
        { opacity: 1, y: 0, rotate: 0, duration: 0.6, ease: "back.out(1.6)", stagger: 0.07 }, 0.34);
      tl.fromTo("#seal", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 0.9);
      tl.fromTo(".slogan", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.68, ease: "power4.out" }, 0.85);
      tl.fromTo(".bullets li", { opacity: 0, x: -34 },
        { opacity: 1, x: 0, duration: 0.52, ease: "power3.out", stagger: 0.1 }, 1.35);
      tl.fromTo(".contact", { opacity: 0, y: -46, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "back.out(1.9)" }, 1.95);
      tl.fromTo("#qr", { opacity: 0, rotate: -14, scale: 0.8 },
        { opacity: 1, rotate: 0, scale: 1, duration: 0.6, ease: "back.out(2.2)" }, 2.15);
      tl.to("#logo", { rotate: -5, duration: 0.34, ease: "sine.inOut", yoyo: true, repeat: 5 }, 2.5);
      tl.to(".contact", { scale: 1.04, duration: 0.36, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.6);
      tl.to(".scene", { opacity: 0, duration: 0.45, ease: "power2.in" }, 4.55);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
