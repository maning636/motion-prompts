<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"state","name":"直播状态","type":"string","label":"直播状态文字（2–5 字）","default":"直播中"},{"id":"views","name":"观看人数","type":"number","label":"观看人数（只决定显示值）","default":12800},{"id":"unit","name":"人数单位","type":"string","label":"人数单位（1–2 字）","default":"人在线"},{"id":"like","name":"点赞文案","type":"string","label":"点赞文案（4–10 字）","default":"点赞 1.2w"},{"id":"accent","name":"强调色","type":"color","label":"强调色（状态胶囊底）","default":"#FF5FA2"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="直播状态贴：胶囊状态牌内状态方块按固定节奏硬切闪烁，下方在线人数整数跳到设定值、点赞胶囊分格擦出，三块错峰微位移">
<title>直播状态贴 · 直播中</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 状态胶囊：9999px 圆角 + 高饱和填充 + 3px 黑边（§3.2 徽章纪律） */
  #lv{position:absolute;left:96px;top:96px;width:340px;height:104px;
    display:flex;align-items:center;gap:16px;padding:0 30px;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:9999px;
    box-shadow:8px 8px 0 var(--shadow)}
  /* 状态方块：纯方块 + 3px 黑边，色块不许裸奔（基因 6） */
  #lv .dot{flex:0 0 auto;width:26px;height:26px;background:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px}
  #state{display:block;font-family:var(--mono);font-weight:900;font-size:40px;letter-spacing:.06em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}

  /* 在线人数卡：白底黑字，数字用 mono + tabular-nums（基因 9） */
  #vw{position:absolute;left:96px;top:232px;width:480px;height:132px;
    display:flex;align-items:center;gap:18px;padding:0 30px;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #vwv{display:block;font-family:var(--mono);font-weight:900;font-size:84px;line-height:1;
    letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;white-space:nowrap;overflow:hidden}
  #unit{display:block;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.06em;
    line-height:1.14;color:var(--ink);white-space:nowrap;overflow:hidden}

  /* 点赞胶囊：位置错开往右下偏一格，排成一条斜的挂件序列而不是一条整齐的栏 */
  #lk{position:absolute;left:612px;top:248px;width:340px;height:104px;
    display:flex;align-items:center;justify-content:center;
    background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:9999px;
    box-shadow:8px 8px 0 var(--shadow)}
  #like{display:block;font-family:var(--mono);font-weight:900;font-size:36px;letter-spacing:.04em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="lv"><span class="dot"></span><span id="state" data-fit-max="40" data-fit-min="24">直播中</span></div>
  <div id="vw"><span id="vwv">0</span><span id="unit" data-fit-max="26" data-fit-min="16">人在线</span></div>
  <div id="lk"><span id="like" data-fit-max="36" data-fit-min="22">点赞 1.2w</span></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['state', 'unit', 'like'].forEach(function (k) { set(k, v[k]); });

  function group(n) {
    var s = String(Math.round(Math.abs(n)));
    var out = '';
    for (var i = 0; i < s.length; i++) {
      if (i > 0 && (s.length - i) % 3 === 0) out += ',';
      out += s[i];
    }
    return (n < 0 ? '-' : '') + out;
  }
  /* 观看人数只决定显示值；展示窗口写死 1.4s，绝不用人数推算时间轴长度 */
  var VIEWS = Math.max(0, Number(v.views) || 0);
  var eV = document.getElementById('vwv');
  if (eV) eV.textContent = group(0);

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：人数直接给终值，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#lv', { x: 0, y: 0, opacity: 1 });
    gsap.set('#vw', { x: 0, y: 0, opacity: 1 });
    gsap.set('#lk', { x: 0, y: 0, opacity: 1 });
    gsap.set('#vwv', { textContent: group(VIEWS) });
    gsap.set('#lv .dot', { opacity: 1 });

    tl.fromTo('#lv', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#vw', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 1 · 拍进来：状态胶囊自左上斜向硬着陆，落定瞬间阴影压 2 帧再弹回原档 */
  tl.fromTo('#lv', { x: -60, y: -40 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#lv', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#lv', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });

  /* 模 7 · 分格擦出：人数卡与点赞胶囊自左依次分六格推出来 */
  tl.fromTo('#vw', { clipPath: 'inset(0 100% 0 0)' },
      { clipPath: 'inset(0 0% 0 0)', duration: .32, ease: 'steps(6)' }, .18);
  tl.fromTo('#lk', { clipPath: 'inset(0 100% 0 0)' },
      { clipPath: 'inset(0 0% 0 0)', duration: .3, ease: 'steps(6)' }, .42);

  /* 模 4 · 整数跳数：在线人数 steps 跳到位，展示窗口写死 1.4s，
     onUpdate 只写 textContent，绝不做 DOM 测量（规范 §15 回调专项） */
  var n = { v: 0 };
  tl.to(n, { v: VIEWS, duration: 1.4, ease: 'steps(14)',
      onUpdate: function () { if (eV) eV.textContent = group(n.v); } }, .34);

  /* 模 8 · 色块闪切：状态方块按固定节奏硬切闪三下，收尾必须停在可见帧 */
  var dot = '#lv .dot';
  tl.set(dot, { opacity: 0, duration: 0 }, 1.0).set(dot, { opacity: 1, duration: 0 }, 1.28)
    .set(dot, { opacity: 0, duration: 0 }, 1.56).set(dot, { opacity: 1, duration: 0 }, 1.84)
    .set(dot, { opacity: 0, duration: 0 }, 2.12).set(dot, { opacity: 1, duration: 0 }, 2.4);

  /* 三块错峰微位移：每块起步时间互不相同，匀速往返，零回弹 */
  var T0 = 2.3;
  var REP = Math.max(1, Math.round((WIN - T0) / .8));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#lv', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#vw', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#lk', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
