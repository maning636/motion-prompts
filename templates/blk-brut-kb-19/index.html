<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"PULLQUOTE / 引文开场"},

{"id":"q2","name":"引文下","type":"string","label":"引文第二行（12–18 字）","default":"你是在替陌生人省一次犹豫"},
{"id":"whoTx","name":"署名","type":"string","label":"署名（中文姓名 / 账号名）","default":"老陈"},
{"id":"role","name":"身份","type":"string","label":"身份（mono 英文 / 职务）","default":"CREATOR · 12 万粉"},

{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>引文式开场 · 你不是在拍视频，你是在替陌生人省一次犹豫</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF; --card:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-xl{box-shadow:10px 10px 0 var(--ink)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:46px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}

  /* 引文卡：整版 hero 主视觉卡用 sh-xl（规范 §1.4 档位分配） */
  .card{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:36px 88px 0}
  .qcard{flex:1 1 auto;min-width:0;display:flex;gap:44px;align-items:stretch;
    background:var(--card);color:var(--ink);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:10px 10px 0 var(--ink);padding:46px 56px 40px}
  /* 大号装饰字符用文字硬投影，不是 box-shadow（§3.8） */
  .qm{flex:0 0 auto;width:120px;display:flex;align-items:flex-start;justify-content:center;
    font-family:var(--mono);font-weight:900;font-size:120px;line-height:.8;
    color:var(--accent);text-shadow:2px 2px 0 var(--ink)}
  .qbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
  /* 中文引文：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .ql{display:block;white-space:nowrap;font-weight:900;font-size:62px;line-height:1.26;
    letter-spacing:0;padding-right:20px}
  .who{display:flex;align-items:center;gap:20px;margin-top:34px;padding-top:26px;
    border-top:var(--bw) solid var(--ink)}
  .av{flex:0 0 auto;width:64px;height:64px;display:flex;align-items:center;
    justify-content:center;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    font-size:32px;font-weight:900}
  .nm{display:block;font-size:32px;font-weight:900;letter-spacing:0}
  .rl{display:block;margin-top:4px;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:32px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .footrow .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">PULLQUOTE / 引文开场</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="card anim" id="card">
    <div class="qcard anim" id="qcard">
      <span class="qm anim" id="qm">&ldquo;</span>
      <div class="qbody">
        <div class="ql anim" id="q1" data-fit-max="62" data-fit-min="30">你不是在拍视频，</div>
        <div class="ql anim" id="q2" data-fit-max="62" data-fit-min="30">你是在替陌生人省一次犹豫</div>
        <div class="who anim" id="whoBox">
          <div class="av anim" id="av">陈</div>
          <div>
            <span class="nm anim" id="whoTx" data-fit-max="32" data-fit-min="16">老陈</span>
            <span class="rl anim" id="role" data-fit-max="22" data-fit-min="14">CREATOR · 12 万粉</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">引自第 9 期口播 · 03:12</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'q1', 'q2', 'whoTx', 'role', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  if (v.card) document.documentElement.style.setProperty('--card', v.card);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#card',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd', 0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);
  slam('#card', 0.20, -40, -24, 0.28);

  /* 大面积引文卡：power3.out + from:.86，面积单调涨到末帧，settle 必然挑中成品帧 */
  tl.fromTo('#qcard', { scale: 0.86 },
    { scale: 1, duration: 0.3, ease: 'power3.out' }, 0.32);

  slam('#qm', 0.62, -24, -24, 0.24);
  slam('#q1', 0.74,   0, -22, 0.26);
  slam('#q2', 0.90,   0, -22, 0.26);
  /* 模 1 拍进来：署名块落定瞬间阴影压 2 帧再弹回原档 */
  tl.set('#av', { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, 1.20);
  tl.to('#av', { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, 1.24);
  slam('#whoBox', 1.16, 0, -18, 0.24);
  slam('#footrow', 1.56, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.68);
  slam('#note', 1.82, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.96);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.30);

  var introEnd = 3.30;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
