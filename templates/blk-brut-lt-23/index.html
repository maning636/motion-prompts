<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"kind","name":"轨头条","type":"string","label":"轨头上方方块里的 mono 字（2–6 字）","default":"TAGS"},{"id":"t1","name":"话题一","type":"string","label":"话题一（2–6 字）","default":"#AI效率"},{"id":"t2","name":"话题二","type":"string","label":"话题二（2–6 字）","default":"#内容方法"},{"id":"t3","name":"话题三","type":"string","label":"话题三（2–6 字）","default":"#一人公司"},{"id":"accent","name":"强调色","type":"color","label":"强调色（方块底 / 第二个话题）","default":"#FFD429"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="话题标签条：ink 长轨内三枚 pill 标签依次自左错峰装上，轨头上方一枚强调色方块先落位，三层做反向微位移">
<title>话题标签条 · TAGS</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 轨头方块：正方感的小色块 + 3px 黑边 + 4px 直角，压在长轨正上方（基因 3 / §3.14） */
  #kb{position:absolute;left:96px;bottom:352px;width:224px;height:120px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #kind{display:block;font-family:var(--mono);font-weight:900;font-size:38px;letter-spacing:.16em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}

  /* 长轨：ink 底黄字，pill 压在上面靠自身 3px 黑边读出来（基因 10 / §7.3.3） */
  #rl{position:absolute;left:96px;bottom:200px;width:1728px;height:128px;
    display:flex;align-items:center;gap:24px;padding:0 30px;
    background:var(--ink);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  .tag{flex:0 1 auto;max-width:520px;padding:16px 32px;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:9999px;
    font-family:var(--mono);font-weight:700;font-size:36px;letter-spacing:.04em;line-height:1;
    color:var(--ink);white-space:nowrap;overflow:hidden}
  .tag.is-hi{background:var(--accent)}
</style>
</head>
<body>
<div id="stage">
  <div id="kb"><span id="kind" data-fit-max="38" data-fit-min="22">TAGS</span></div>
  <div id="rl">
    <span class="tag is-hi" id="t1" data-fit-max="36" data-fit-min="22">#AI效率</span>
    <span class="tag" id="t2" data-fit-max="36" data-fit-min="22">#内容方法</span>
    <span class="tag" id="t3" data-fit-max="36" data-fit-min="22">#一人公司</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['kind', 't1', 't2', 't3'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉落位与错峰微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#kb', { x: 0, y: 0, opacity: 1 });
    gsap.set('#rl', { x: 0, y: 0, opacity: 1 });
    gsap.set('#t1', { x: 0 });
    gsap.set('#t2', { x: 0 });

    tl.fromTo('#kb', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#rl', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 1 · 拍进来：轨头方块自左上斜向硬着陆，落定瞬间阴影压 2 帧再弹回原档 */
  tl.fromTo('#kb', { x: -64, y: -40 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#kb', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#kb', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  /* 模 7 · 分格擦出：长轨自左分八格推出来 */
  tl.fromTo('#rl', { clipPath: 'inset(0 100% 0 0)' },
      { clipPath: 'inset(0 0% 0 0)', duration: .34, ease: 'steps(8)' }, .12);
  /* 模 2 · 零件装上去：三枚标签错峰自左装上，纯位移，opacity 恒为 1 */
  tl.fromTo('#t1', { x: -34 }, { x: 0, duration: .2, ease: 'power4.out' }, .3);
  tl.fromTo('#t2', { x: -34 }, { x: 0, duration: .2, ease: 'power4.out' }, .4);
  tl.fromTo('#t3', { x: -34 }, { x: 0, duration: .2, ease: 'power4.out' }, .5);
  tl.fromTo('#kind', { x: -20 }, { x: 0, duration: .2, ease: 'power4.out' }, .18);

  /* 两层反向微位移：轨头上抬、长轨下压，匀速往返，零回弹 */
  var T0 = 1.1;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#kb', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#rl', { y: 5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
