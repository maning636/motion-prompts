<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"cap","name":"扫码说明","type":"string","label":"二维码下方大字（4–8 字）","default":"扫码进群"},{"id":"note","name":"补充说明","type":"string","label":"mono 补充说明（6–14 字）","default":"关注领完整资料"},{"id":"accent","name":"强调色","type":"color","label":"强调色（说明条底 / 定位角块）","default":"#2FD07A"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="二维码角标：白底方块内 7×7 定位格阵由行列坐标算出、逐格自左上落位，下方说明条分格擦出后与二维码做反向微位移">
<title>二维码角标 · 扫码进群</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 二维码位：定尺 360×360 白底方块 + 3px 黑边 + 8px 硬阴影（§3.15 .ph 的纪律：只用白底方格） */
  #qr{position:absolute;left:96px;bottom:152px;width:360px;height:360px;padding:26px;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #grid{display:grid;grid-template-columns:repeat(7,38px);grid-template-rows:repeat(7,38px);
    gap:5px;width:302px;height:302px}
  #grid i{position:relative;display:block;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px}
  /* 定位角：三个角上的空心方块，内芯用 ::after 画，外圈形状不许换（§3.14 同一套纪律） */
  #grid i.a::after{content:"";position:absolute;left:8px;top:8px;right:8px;bottom:8px;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px}
  /* 图案块：实色格，白底黑边，一格都不换形状 */
  #grid i.d{background:var(--ink)}

  /* 说明条：与二维码底边留 12px 缝，靠 3px 实线而不是留白分隔（基因 7） */
  #qc{position:absolute;left:96px;bottom:76px;width:360px;height:64px;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:var(--yellow);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #note{display:block;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.1em;
    line-height:1;color:var(--yellow);white-space:nowrap;overflow:hidden}
  /* 二维码正上方的一行大字，独立成件，不压在二维码上 */
  #hd{position:absolute;left:96px;bottom:536px;width:360px;height:96px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #cap{display:block;font-size:56px;font-weight:900;line-height:1;letter-spacing:0;color:var(--ink);
    white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="hd"><div id="cap" data-fit-max="56" data-fit-min="28">扫码进群</div></div>
  <div id="qr"><div id="grid"></div></div>
  <div id="qc"><div id="note" data-fit-max="22" data-fit-min="14">关注领完整资料</div></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['cap', 'note'].forEach(function (k) { set(k, v[k]); });

  /* 方格阵完全由行列坐标算出，绝不用 Math.random——每次渲染必须长得一模一样。
     三个角各占 3×3 定位区，其余格按 (row*7+col*13)%5 的固定序列点亮。 */
  var grid = document.getElementById('grid');
  if (grid) {
    var html = '';
    for (var row = 0; row < 7; row++) {
      for (var col = 0; col < 7; col++) {
        var cls = '';
        var corner = (row < 3 && col < 3) || (row < 3 && col > 3) || (row > 3 && col < 3);
        if (corner) cls = 'a';
        else if ((row * 7 + col * 13) % 5 < 2) cls = 'd';
        html += '<i class="' + cls + '"></i>';
      }
    }
    grid.innerHTML = html;
  }

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉逐格落位与反向微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#hd', { x: 0, y: 0, opacity: 1 });
    gsap.set('#qr', { x: 0, y: 0, opacity: 1 });
    gsap.set('#qc', { x: 0, y: 0, opacity: 1 });

    tl.fromTo('#hd', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#qr', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 7 · 分格揭示：二维码位自右分六格推出来 */
  tl.fromTo('#qr', { clipPath: 'inset(0 0 0 100%)' },
      { clipPath: 'inset(0 0 0 0%)', duration: .32, ease: 'steps(6)' }, 0);
  tl.fromTo('#hd', { x: -64 },
      { x: 0, duration: .26, ease: 'power4.out' }, .12)
    .fromTo('#hd', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#hd', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });

  /* 模 2 · 零件装上去：方格逐格自左上角装到位，0.014s 错峰，纯位移，opacity 恒为 1 */
  tl.fromTo('#grid i', { x: -14, y: -14 },
      { x: 0, y: 0, duration: .18, ease: 'power4.out', stagger: .014 }, .16);
  /* 说明条自左分六格擦出 */
  tl.fromTo('#qc', { clipPath: 'inset(0 100% 0 0)' },
      { clipPath: 'inset(0 0% 0 0)', duration: .3, ease: 'steps(6)' }, .86);
  tl.fromTo('#note', { x: 24 }, { x: 0, duration: .2, ease: 'power4.out' }, 1.06);

  /* 三层反向微位移：说明条下压、二维码与标题上抬，匀速往返，零回弹 */
  var T0 = 1.5;
  var REP = Math.max(1, Math.round((WIN - T0) / 1.0));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#qc', { y: 6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#qr', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#hd', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
