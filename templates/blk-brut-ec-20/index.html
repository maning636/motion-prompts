<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"UPGRADE / 升级对比"},{"id":"title","name":"主标题","type":"string","label":"主标题（黑条上的一行 900 白字）","default":"同一件外套，我们改了三处"},{"id":"beforeLabel","name":"升级前标签","type":"string","label":"升级前行的标签","default":"升级前"},{"id":"afterLabel","name":"升级后标签","type":"string","label":"升级后行的标签","default":"升级后"},{"id":"metric","name":"指标名","type":"string","label":"指标名称","default":"抗起球等级"},{"id":"beforeVal","name":"升级前值","type":"number","label":"升级前数值","default":2},{"id":"afterVal","name":"升级后值","type":"number","label":"升级后数值","default":4},{"id":"metric2","name":"第二指标名","type":"string","label":"第二指标名称","default":"缩水率"},{"id":"beforeVal2","name":"升级前值 2","type":"number","label":"升级前第二项数值","default":6},{"id":"afterVal2","name":"升级后值 2","type":"number","label":"升级后第二项数值","default":2},{"id":"note","name":"口径说明","type":"string","label":"口径说明（一行 mono）","default":"口径：同批次同色号送检 · 检测标准 GB/T 2660"},{"id":"accent","name":"强调色","type":"color","label":"强调色（升级后行 / 斜纹带）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="上下前后对比构图：升级前行白底、升级后行压强调色，中间一条满宽实线加一枚上升箭头方块，两行各列两个指标">
<title>升级前后对比 · 同一件外套，我们改了三处</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 72px;height:74px;
    background:var(--ink);color:var(--white)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:38px;font-weight:900;letter-spacing:0;text-align:right}

  /* 前后两行：结构完全对称，只换底色与字重，差异一眼可读 */
  .row{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:48px;
    padding:0 72px;overflow:hidden}
  .row.before{background:var(--white);border-bottom:0}
  .row.after{background:var(--accent);color:var(--ink)}
  .row .lb{flex:0 0 260px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .row .lb .k{display:block;white-space:nowrap;font-size:44px;font-weight:900;
    letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .row .lb .c{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.14em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .row.before .lb .c{color:var(--mute)}
  .cell2{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px;
    padding:0 40px;border-left:var(--bw) solid var(--ink)}
  .cell2 .k{display:block;white-space:nowrap;font-size:30px;font-weight:700;
    letter-spacing:0;color:var(--mute);max-width:100%;overflow:hidden;
    text-overflow:ellipsis}
  .row.after .cell2 .k{color:var(--ink)}
  .cell2 .v{display:flex;align-items:baseline;gap:16px}
  .cell2 .n{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:124px;line-height:.94;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .row.before .cell2 .n{color:var(--mute)}
  /* 升级侧的提升片：ink 底白字 + 白色硬影（深件规则 B） */
  .cell2 .rise{align-self:flex-start;padding:8px 20px;background:var(--ink);
    color:var(--yellow);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:4px 4px 0 var(--white);
    font-family:var(--mono);font-weight:900;font-size:30px;letter-spacing:0;
    white-space:nowrap}

  /* 中间：满宽实线 + 居中上升箭头方块 */
  .arrow{flex:0 0 auto;position:relative;height:0;border-top:var(--bw) solid var(--ink);
    display:flex;align-items:center;justify-content:center}
  .arrow .up{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);
    width:120px;height:120px;display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:var(--accent);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--accent);
    font-family:var(--mono);font-weight:900;font-size:56px;line-height:1}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:24px 72px 28px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="tag">UP</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">UPGRADE / 升级对比</span>
    <span class="tt anim" id="title" data-fit-max="38" data-fit-min="20">同一件外套，我们改了三处</span>
  </div>

  <div class="row before anim" id="before">
    <span class="lb">
      <span class="k anim" id="beforeLabel" data-fit-max="44" data-fit-min="24">升级前</span>
      <span class="c anim">BEFORE / 上一代</span>
    </span>
    <span class="cell2">
      <span class="k anim" id="metric" data-fit-max="30" data-fit-min="17">抗起球等级</span>
      <span class="n anim" id="beforeVal" data-fit-max="124" data-fit-min="56">2</span>
    </span>
    <span class="cell2">
      <span class="k anim" id="metric2" data-fit-max="30" data-fit-min="17">缩水率</span>
      <span class="n anim" id="beforeVal2" data-fit-max="124" data-fit-min="56">6%</span>
    </span>
  </div>

  <div class="arrow anim" id="arrow"><span class="up anim" id="up">↑</span></div>

  <div class="row after anim" id="after">
    <span class="lb">
      <span class="k anim" id="afterLabel" data-fit-max="44" data-fit-min="24">升级后</span>
      <span class="c anim">AFTER / 这一代</span>
    </span>
    <span class="cell2">
      <span class="k anim" id="metricB" data-fit-max="30" data-fit-min="17">抗起球等级</span>
      <span class="n anim" id="afterVal" data-fit-max="124" data-fit-min="56">4</span>
      <span class="rise anim" id="rise1">翻倍</span>
    </span>
    <span class="cell2">
      <span class="k anim" id="metric2B" data-fit-max="30" data-fit-min="17">缩水率</span>
      <span class="n anim" id="afterVal2" data-fit-max="124" data-fit-min="56">2%</span>
      <span class="rise anim" id="rise2">−4pt</span>
    </span>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：同批次同色号送检 · 检测标准 GB/T 2660</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'beforeLabel', 'afterLabel', 'metric', 'metric2',
   'metricB', 'metric2B', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 提升幅度由两个数算出，不允许手动再写一遍结论 */
  var b1 = Number(v.beforeVal), a1 = Number(v.afterVal);
  if (!isFinite(b1)) b1 = 0;
  if (!isFinite(a1)) a1 = 0;
  set('beforeVal', String(Math.round(b1)));
  set('afterVal', String(Math.round(a1)));
  set('rise1', b1 > 0 && a1 >= b1 * 2 ? '翻倍'
      : (a1 - b1 >= 0 ? '+' + Math.round(a1 - b1) : String(Math.round(a1 - b1))));

  var b2 = Number(v.beforeVal2), a2 = Number(v.afterVal2);
  if (!isFinite(b2)) b2 = 0;
  if (!isFinite(a2)) a2 = 0;
  set('beforeVal2', String(Math.round(b2)) + '%');
  set('afterVal2', String(Math.round(a2)) + '%');
  var d2 = Math.round(a2 - b2);
  set('rise2', (d2 > 0 ? '+' : '') + d2 + 'pt');

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    gsap.set('#up', { x: '-50%', y: '-50%' });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#before',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .12);
    tl.fromTo('#arrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .28);
    tl.fromTo('#after', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .42);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .58);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .7);
    B.hold(tl, 1.5, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd',    0.00,   0, -74, 0.26);
  slam('#eyebrow',0.14, -24, -20, 0.22);
  slam('#title', 0.20,  24, -20, 0.24);
  /* 升级前自上、升级后自下夹向中间，形成「被夹住改造」的方向感 */
  tl.fromTo('#before', { y: -70 }, { y: 0, duration: .28, ease: 'power4.out' }, 0.42);
  tl.fromTo('#after',  { y: 70 },  { y: 0, duration: .28, ease: 'power4.out' }, 0.62);
  tl.fromTo('#arrow', { scaleX: 0, transformOrigin: 'center center' },
      { scaleX: 1, duration: .3, ease: 'power4.out' }, 0.80);
  tl.fromTo('#up', { scale: .86, opacity: 0 },
      { scale: 1, opacity: 1, duration: .28, ease: 'power3.out' }, 0.90);
  slam('#beforeLabel', 1.10,   0, -24, 0.24);
  slam('#afterLabel',  1.18,   0,  24, 0.24);
  slam('#beforeVal',   1.26,   0, -24, 0.24);
  slam('#afterVal',    1.36,   0,  24, 0.24);
  slam('#beforeVal2',  1.42,   0, -24, 0.24);
  slam('#afterVal2',   1.52,   0,  24, 0.24);
  slam('#rise1',       1.66,   0, -20, 0.22);
  slam('#rise2',       1.74,   0, -20, 0.22);
  slam('#foot',        1.88,   0,  28, 0.26);
  slam('#note',        2.00, -24, -20, 0.22);
  slam('#stripe',      2.10,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.34);

  var introEnd = 3.54;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
