<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"QUESTION / 提问开场"},
{"id":"q1","name":"问句上","type":"string","label":"问句第一行（8–11 字）","default":"你有没有想过，"},
{"id":"q2","name":"问句下","type":"string","label":"问句第二行（8–11 字）","default":"为什么你剪到第 8 版才顺"},
{"id":"alab","name":"答案眉标","type":"string","label":"答案区 mono 眉标","default":"ANSWER / 答案是"},
{"id":"ans","name":"答案","type":"string","label":"答案（一行，10–16 字）","default":"因为前七版你都在改画面，没改句子"},
{"id":"accent","name":"强调色","type":"color","label":"问号方块 + 斜纹带","default":"#3D7BFF"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>提问式开场 · 为什么你剪到第 8 版才顺</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  /* 深底专用阴影档位（规则 B：承载底色是深色，阴影换成白） */
  .sh-w{box-shadow:8px 8px 0 var(--white)}

  .qtop{flex:0 0 auto;padding:46px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}

  /* 问句区：纸底两行大字 + 一枚问号方块 */
  .qmain{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:0 88px}
  .qbox{flex:1 1 0;min-width:0}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .ql{display:block;white-space:nowrap;font-weight:900;font-size:130px;
    line-height:1.12;letter-spacing:0;padding-right:24px}
  .qmark{flex:0 0 auto;width:180px;height:180px;margin-left:52px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);
    font-family:var(--mono);font-weight:900;font-size:118px;line-height:1}

  /* 3px 实线当分隔（基因 7），不靠留白分段 */
  .divider{flex:0 0 auto;border-top:var(--bw) solid var(--ink)}

  /* 答案区：整块换底色（基因 10），ink 底 + white 字 */
  .abottom{flex:0 0 auto;background:var(--ink);color:var(--white);padding:38px 88px 44px}
  .alab{display:block;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--accent);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-bottom:18px}
  .ans{display:block;white-space:nowrap;font-weight:900;font-size:52px;line-height:1.26;
    letter-spacing:0;color:var(--white);padding-right:24px}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="qtop anim" id="qtop">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">QUESTION / 提问开场</span>
  </div>

  <div class="qmain anim" id="qmain">
    <div class="qbox">
      <div class="ql anim" id="q1" data-fit-max="130" data-fit-min="62">你有没有想过，</div>
      <div class="ql anim" id="q2" data-fit-max="130" data-fit-min="62">为什么你剪到第 8 版才顺</div>
    </div>
    <div class="qmark anim" id="qmark" data-fit-max="118" data-fit-min="56">?</div>
  </div>

  <div class="divider anim" id="divider"></div>

  <div class="abottom anim" id="abottom">
    <span class="alab anim" id="alab" data-fit-max="26" data-fit-min="16">ANSWER / 答案是</span>
    <div class="ans anim" id="ans" data-fit-max="52" data-fit-min="26">因为前七版你都在改画面，没改句子</div>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'q1', 'q2', 'alab', 'ans'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#qtop',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#qmain',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#divider', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.3);
    tl.fromTo('#abottom', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.42);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';
  function shadowBounce(sel, rest, at, col) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + (col || INK), immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#qtop',    0.00, -28, -20, 0.24);
  slam('#qmain',   0.14,   0, -24, 0.28);
  slam('#q1',      0.28, -40, -40, 0.26);
  slam('#q2',      0.44, -40, -40, 0.26);
  tl.fromTo('#qmark', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, 0.62);
  shadowBounce('#qmark', '8px 8px 0 ' + INK, 0.88);

  /* 模 7 分格揭示：分隔线从左逐格推出 */
  tl.fromTo('#divider', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.34, ease: 'steps(8)' }, 1.02);

  /* 答案区整块从下方硬离画方向压进来，1 帧之内完成换底（基因 10 的整块替换） */
  slam('#abottom', 1.20, 0, 48, 0.28);
  slam('#alab',    1.36, 0, -16, 0.22);
  slam('#ans',     1.50, 0, -20, 0.26);

  var introEnd = 2.06;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
