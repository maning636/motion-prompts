<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "眉标（mono + 大字距，≤12 字）", "default": "EQ / 频段"}, {"id": "titleA", "name": "主标题 · 前段", "type": "string", "label": "主标题第一行（普通字，≤6 字）", "default": "低频坐中线，"}, {"id": "titleB", "name": "主标题 · 彩色词块", "type": "string", "label": "主标题第二行（强调色块里的词，≤4 字）", "default": "两端收着"}, {"id": "sub", "name": "副标题", "type": "string", "label": "副标题（一行短句，≤24 字）", "default": "中频最宽，两端各压一档，重量自然落在正中"}, {"id": "deck", "name": "频段说明", "type": "string", "label": "底部 mono 说明（≤18 字）", "default": "LOW · MID · HIGH"}, {"id": "peaks", "name": "音频包络", "type": "string", "label": "离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）", "default": "591,447,705,346,907,401,629,857,464,586,646,764,371,662,857,333,637,1000,388,637,840,388,608,658,684,342,620,835,346,603,1000,354,608,835,392,612,747,603,401,624,835,350,620,996,354,679,743,515"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色（中频段柱 / 游标 / 底部频段名）", "default": "#FFD429"}, {"id": "duration", "name": "总时长", "type": "number", "label": "总时长（秒，须等于音轨长度 5.6）", "default": 5.6}, {"id": "exportMode", "name": "导出格式", "type": "enum", "label": "Format", "default": "mp4", "hidden": true, "options": [{"value": "mp4", "label": "MP4"}, {"value": "webm", "label": "WebM"}, {"value": "transparent", "label": "透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>贯穿游标频段栅格 · 三个频段各说各的</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让**所有内联样式改动**
       都变成 0.01ms 的过渡——本族每条都有 JS 写死的内联几何（播放头 left/top、
       峰值保持线 bottom），降级分支里会卡在 CSS 旧值不动，渲染出错误位置，
       而 motion-qc 只看最终帧出框、不看降级分支的几何正确性，全绿也照样错。
       补上 transition-property:none 与 animation-name:none 才是完整写法。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }

  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#9A9A9A; --bw:3px;
    --zone:rgba(255,255,255,.05);
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--white);color:var(--ink);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--ink);color:var(--yellow);padding:3px 14px;border-radius:9999px}
  .promo .parw{color:var(--accent);font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:40px 72px 34px}

  .hd{flex:0 0 auto;height:32px;line-height:32px}
  .hd .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--yellow);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stack{flex:0 0 auto;margin-top:24px}
  .line{display:block;font-size:88px;font-weight:900;line-height:1.05;white-space:nowrap}
  .chip{display:inline-block;line-height:1;padding:0 18px;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .sub{min-width:0;margin-top:14px;font-size:29px;font-weight:700;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 频段栅格：三块背景分区 + 32 组上下镜像柱 + 一条贯穿全高的游标 */
  .eq{flex:0 0 auto;position:relative;margin-top:32px;height:400px}
  .zones{position:absolute;left:0;right:0;top:0;height:100%;display:flex;gap:10px}
  .zones .z{flex:1 1 0;min-width:0;background:var(--zone);
    border:var(--bw) solid var(--white);border-radius:4px}
  .zones .z.cen{background:rgba(255,212,41,.10)}
  .cols{position:absolute;left:0;right:0;top:0;height:100%;display:flex;
    justify-content:space-between;align-items:center;padding:0 22px}
  .cols .col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .cols i{display:block;width:22px;height:8px;border-radius:9999px;background:var(--yellow)}
  .cols i.dn{background:var(--white)}
  .mid{position:absolute;left:0;right:0;top:50%;height:var(--bw);background:var(--white);
    transform:translateY(-1.5px);z-index:4}

  #head{position:absolute;left:72px;top:0;width:5px;height:400px;background:var(--accent);z-index:6}
  #head .cap{position:absolute;left:-8px;top:-9px;width:21px;height:21px;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px}

  .freq{flex:0 0 auto;margin-top:auto;display:flex;gap:10px;padding-top:20px;
    border-top:var(--bw) solid var(--white)}
  .freq span{flex:1 1 0;min-width:0;font-family:var(--mono);font-weight:900;font-size:24px;
    letter-spacing:.16em;text-align:center;padding:10px 4px;border-radius:4px;
    border:var(--bw) solid var(--white);color:var(--white);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .freq span.hi{background:var(--accent);color:var(--ink)}

  .stripe{flex:0 0 auto;height:20px;
    background:repeating-linear-gradient(45deg,var(--accent) 0 10px,var(--ink) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--white);color:var(--ink)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--blue)}
  .foot .fc{font-size:25px;font-weight:700;white-space:nowrap}

  #head,#head .cap{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">BAND</span><span class="ptx" id="deck">频段栅格 · 贯穿游标 + 三段分区</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="hd">
      <span class="eyebrow anim" id="eyebrow">EQ / 频段</span>
    </div>
    <div class="stack">
      <span class="line anim" id="titleA" data-fit-max="88" data-fit-min="44">低频坐中线，</span>
      <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="88" data-fit-min="44">两端收着</span></span>
      <p class="sub anim" id="sub" data-fit-max="29" data-fit-min="15">中频最宽，两端各压一档，重量自然落在正中</p>
    </div>
    <div class="eq" id="eq">
      <div class="zones"><span class="z"></span><span class="z cen"></span><span class="z"></span></div>
      <div class="cols" id="cols"></div>
      <span class="mid"></span>
    </div>
    <div class="freq" id="freq"><span id="zf0">LOW</span><span class="hi" id="zf1">MID</span><span id="zf2">HIGH</span></div>
  </div>

  <div id="head"><span class="cap"></span></div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fm">AUD / 2026</span><span class="fc">游标贯穿三段，不在底部当小方块</span>
  </div></div>
<!-- [公开版] 原音轨 音轨 voice-04.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* ---------- 音频包络：offline RMS，烘在 peaks 变量里 ----------
     这份数组来自 音轨 voice-04.wav（未随仓分发） 的离线解码（RMS，48 桶，归一到 0–1000），
     由 离线包络脚本（未随仓分发） 算出，同时落一份
     assets/voice-04.peaks.json 作溯源。
     换音轨：换 wav → 重跑离线脚本 → 把新数组填进 peaks → 同步 duration 与
     <audio data-duration>。这是一条显式的、算一次的步骤，不是缺陷。
     为什么绝不接实时 AnalyserNode：无头渲染是逐帧 seek 采样，媒体在采集模式下
     是 seek 不是 play（hyperframes runtime 的 allowLiveTimelineSeek 在
     __HF_RENDER_CAPTURE_MODE 下为 false），探针接在暂停的元素上读到的不是
     「此刻在放什么」；motion-qc 的探针同样是无序 seek。 */
  var FALLBACK_PEAKS = '591,447,705,346,907,401,629,857,464,586,646,764,371,662,857,333,637,1000,388,637,840,388,608,658,684,342,620,835,346,603,1000,354,608,835,392,612,747,603,401,624,835,350,620,996,354,679,743,515';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);
  function peakAt(k) {
    return PEAKS[Math.max(0, Math.min(PEAKS.length - 1, k))];
  }

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','titleA','titleB','sub','deck'].forEach(function (k) { set(k, v[k]); });


  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 音频窗口：时间轴总长严格等于音轨长度，尾部留 0.6s 静音 + 定格。
     禁止用变量值推算总长（数值填大会撞 SMOKE_TOO_LONG）。 */
  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var N = PEAKS.length;

  var COLS = 32, MAXH = 168, MINH = 10, STEPS = N, SEG = WIN / STEPS, SPREAD = N / COLS;
  var MIDCOL = Math.floor((COLS - 1) / 2);

  /* 三段分区权重：中频 1.00、低频 0.78、高频 0.86。
     「低频坐在正中」不是碰巧——权重函数把柱高往画面正中聚。 */
  function zoneGain(c) {
    if (c < MIDCOL - 5) return 0.78;
    if (c <= MIDCOL + 5) return 1.00;
    return 0.86;
  }
  function upAt(c, k) {
    var idx = Math.floor(k + c * SPREAD) % N;
    return Math.max(MINH, Math.round(PEAKS[idx] / 1000 * MAXH * zoneGain(c)));
  }
  function dnAt(c, k) {
    return Math.max(MINH, Math.round(upAt(c, k) * 0.62));
  }

  var cols = document.getElementById('cols');
  var ups = [], dns = [];
  for (var c = 0; c < COLS; c++) {
    var col = document.createElement('span');
    col.className = 'col';
    var up = document.createElement('i'); up.className = 'up';
    var dn = document.createElement('i'); dn.className = 'dn';
    col.appendChild(up); col.appendChild(dn);
    cols.appendChild(col);
    ups.push(up); dns.push(dn);
  }

  B.fitAll();

  var head = document.getElementById('head');
  var wr = document.getElementById('eq').getBoundingClientRect();
  var sr = document.getElementById('stage').getBoundingClientRect();
  var SPAN = Math.max(10, wr.width - 5);
  head.style.left = (wr.left - sr.left) + 'px';
  head.style.top = (wr.top - sr.top) + 'px';
  head.style.height = wr.height + 'px';

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function press(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }
  function fadeInReduce(ids, start) {
    for (var i = 0; i < ids.length; i++) {
      tl.fromTo(ids[i], { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: i === ids.length - 1 ? .6 : .5, ease: 'power3.out' },
        start + i * 0.08);
    }
  }

  if (reduce) {
    var still = Math.round(N * 0.62);
    gsap.set(ups, { height: (function (k) { return function (i) { return upAt(i, k); }; })(still) });
    gsap.set(dns, { height: (function (k) { return function (i) { return dnAt(i, k); }; })(still) });
    gsap.set('#head', { x: SPAN * 0.62, y: 0, opacity: 1 });
    fadeInReduce(['#promo', '#main', '#head', '#stripe', '#foot'], 0);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#eyebrow', 0.16, 0, -20, 0.22);
  slam('#titleA', 0.34, -34, -34, 0.28);
  slam('#lineB', 0.52, -34, -34, 0.28);
  press('#titleB', '8px 8px 0 ' + '#FFFFFF', 0.80);
  slam('#sub', 0.72, 0, -20, 0.24);
  slam('#eq', 0.88, 0, 24, 0.26);

  for (var k = 0; k < STEPS; k++) {
    tl.to(ups, { height: (function (kk) { return function (i) { return upAt(i, kk); }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.to(dns, { height: (function (kk) { return function (i) { return dnAt(i, kk); }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
  }
  tl.fromTo('#head', { x: 0 }, { x: SPAN, duration: WIN, ease: 'none' }, 0);

  /* 游标走到哪一列，哪一段的频段名就填强调色——同一时刻算出来的，不另开时间轴 */
  var fz = [document.getElementById('zf0'), document.getElementById('zf1'),
            document.getElementById('zf2')];
  var fcol = [];
  for (var z = 0; z < 3; z++) {
    var rect = fz[z].getBoundingClientRect();
    fcol.push((rect.left + rect.width / 2 - sr.left) / Math.max(1, SPAN));
  }
  function paintZone(x) {
    for (var z = 0; z < 3; z++) {
      var on = x >= fcol[z] - (z === 2 ? 0 : 1 / 3);
      fz[z].className = z === 1 ? 'hi' : '';
      fz[z].style.background = on ? 'var(--accent)' : 'transparent';
      fz[z].style.color = on ? '#0F0F0F' : '#FFFFFF';
    }
  }
  paintZone(0);
  for (var kk2 = 0; kk2 <= STEPS; kk2++) {
    tl.call((function (q) { return function () { paintZone(q / STEPS); }; })(kk2), null, kk2 * SEG);
  }

  slam('#foot', 0.96, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.08);

  /* 收尾：音频窗口走完后补一段静止，时间轴总长恰好等于音轨长度，
     样片视频与音轨严丝合缝，最后一拍是「已播完」的定格画面。 */
  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
