<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"BLOCK / 小标题 + 正文块"},
{"id":"title","name":"主标题","type":"string","label":"主标题（一行，12–18 字）","default":"一个段落只放一个信息"},
{"id":"h1","name":"小标题 1","type":"string","label":"左侧小标题 1（4–8 字）","default":"标题给结论"},
{"id":"b1","name":"正文块 1","type":"string","label":"右侧正文块 1（18–30 字）","default":"观众滑动的时候只读标题，标题必须自己站得住。"},
{"id":"h2","name":"小标题 2","type":"string","label":"左侧小标题 2（4–8 字）","default":"正文给证据"},
{"id":"b2","name":"正文块 2","type":"string","label":"右侧正文块 2（18–30 字）","default":"正文的作用是让标题可信，不是让标题变长。"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"竖向遮罩揭示 · 自上而下"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（小标题色块 + 斜纹带）","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>小标题加正文块 · 一个段落只放一个信息</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:44px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文主标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{flex:0 1 auto;min-width:0;display:block;white-space:nowrap;font-weight:900;
    font-size:64px;line-height:1.12;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}

  /* 主体：左列小标题 + 右列正文块，逐组点亮 */
  .cols{flex:1 1 auto;min-height:0;display:flex;gap:56px;padding:36px 88px 0}
  .lcol{flex:0 0 460px;display:flex;flex-direction:column;gap:26px}
  .lab{display:flex;align-items:center;gap:18px;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    padding:14px 18px}
  .lab i{display:block;flex:0 0 auto;width:26px;height:26px;background:var(--accent);
    border:var(--bw) solid var(--ink)}
  /* 小标题用 sans（基因 9：中文标题走 sans），900 字重 */
  .lab b{display:block;flex:1 1 auto;min-width:0;white-space:nowrap;font-weight:900;
    font-size:34px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}

  .rcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:26px}
  /* 遮罩揭示：父级 overflow:hidden，子级自上而下落到 0 */
  .rev{flex:1 1 0;min-height:0;overflow:hidden;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    padding:22px 28px}
  .rev .bt{display:block;white-space:nowrap;font-size:38px;font-weight:700;line-height:1.3;
    letter-spacing:0}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">BLOCK / 小标题 + 正文块</span>
    <span class="title anim" id="title" data-fit-max="64" data-fit-min="32">一个段落只放一个信息</span>
  </div>

  <div class="cols anim" id="cols">
    <div class="lcol anim" id="lcol">
      <div class="lab anim" id="lab1"><i></i><b id="h1" data-fit-max="34" data-fit-min="17">标题给结论</b></div>
      <div class="lab anim" id="lab2"><i></i><b id="h2" data-fit-max="34" data-fit-min="17">正文给证据</b></div>
    </div>
    <div class="rcol anim" id="rcol">
      <div class="rev"><div class="bt anim" id="b1" data-fit-max="38" data-fit-min="19">观众滑动的时候只读标题，标题必须自己站得住。</div></div>
      <div class="rev"><div class="bt anim" id="b2" data-fit-max="38" data-fit-min="19">正文的作用是让标题可信，不是让标题变长。</div></div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">竖向遮罩揭示 · 自上而下</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'h1', 'b1', 'h2', 'b2', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：遮罩揭示整体落终态 */
    gsap.set('#b1', { yPercent: 0, y: 0 });
    gsap.set('#b2', { yPercent: 0, y: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#cols',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';
  function press(sel, at) {
    tl.set(sel, { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#cols', 0.14,   0, -24, 0.28);
  slam('#lcol', 0.28, -40,   0, 0.26);
  slam('#lab1', 0.36, -28, -28, 0.24);
  press('#lab1', 0.60);
  slam('#rcol', 0.44, 40, 0, 0.26);

  /* 竖向遮罩揭示：子级自上而下落到 0，零模糊伪影、零回弹 */
  tl.fromTo('#b1', { yPercent: 112 },
    { yPercent: 0, duration: 0.5, ease: 'power4.out' }, 0.76);

  slam('#lab2', 1.14, -28, -28, 0.24);
  press('#lab2', 1.38);
  tl.fromTo('#b2', { yPercent: 112 },
    { yPercent: 0, duration: 0.5, ease: 'power4.out' }, 1.28);

  slam('#footrow', 1.96, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.08);
  slam('#note',    2.22, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.36);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.70);

  var introEnd = 3.70;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
