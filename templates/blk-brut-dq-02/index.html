<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"BEFORE AFTER / 双数据"},
{"id":"leftLab","name":"左侧标签","type":"string","label":"左侧标签（mono + 中文）","default":"BEFORE / 改造前"},
{"id":"leftNum","name":"左数字","type":"number","label":"左侧数字（mono 整数跳变）","default":21},
{"id":"leftUnit","name":"左单位","type":"string","label":"左侧单位","default":"条"},
{"id":"leftSub","name":"左说明","type":"string","label":"左侧说明（中文）","default":"月更，攒到发不动为止"},
{"id":"rightLab","name":"右侧标签","type":"string","label":"右侧标签","default":"AFTER / 改造后"},
{"id":"rightNum","name":"右数字","type":"number","label":"右侧数字（mono 整数跳变）","default":21},
{"id":"rightUnit","name":"右单位","type":"string","label":"右侧单位","default":"条"},
{"id":"rightSub","name":"右说明","type":"string","label":"右侧说明（中文）","default":"每周两条，把选题拆成了固定节拍"},
{"id":"vs","name":"对比符","type":"string","label":"中间方块字符（1 字）","default":"→"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚（口径）","default":"口径：连续 12 周 · 同平台同账号 · 未投放"},
{"id":"accent","name":"强调色","type":"color","label":"右侧数据卡底 + 斜纹带","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>双数据对比卡 · 改造前 21 条，改造后 21 条</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-l{box-shadow:8px 8px 0 var(--ink)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}

  /* 主体：两张数据卡一左一右，中间一枚 ink 底方块；左卡白底、右卡 accent 底（规范：卡片一色一变） */
  .body{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:0;padding:34px 88px 0}
  .card{flex:1 1 0;min-width:0;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);padding:40px 44px 36px}
  .card.r{margin-left:-3px;background:var(--accent)}
  .clab{display:block;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.10em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:22px}
  .cnum{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:150px;line-height:1;letter-spacing:0}
  .cdigits{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .cnum .u{font-size:40px;margin-left:10px;font-family:var(--sans);font-weight:900}
  .csub{display:block;margin-top:20px;padding-top:18px;border-top:var(--bw) solid var(--ink);
    font-size:30px;font-weight:700;line-height:1.36;letter-spacing:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  .vs{flex:0 0 auto;width:130px;height:130px;display:flex;align-items:center;
    justify-content:center;background:var(--ink);color:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--ink);
    font-family:var(--mono);font-weight:900;font-size:72px;line-height:1}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:32px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">BEFORE AFTER / 双数据</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="body anim" id="body">
    <div class="card anim" id="cardL">
      <span class="clab anim" id="leftLab" data-fit-max="24" data-fit-min="14">BEFORE / 改造前</span>
      <div class="cnum anim" id="leftNum" data-fit-max="150" data-fit-min="72"><span class="cdigits" id="leftDigits">21</span><span class="u" id="leftUnit">条</span></div>
      <div class="csub anim" id="leftSub" data-fit-max="30" data-fit-min="15">月更，攒到发不动为止</div>
    </div>
    <div class="vs anim" id="vs" data-fit-max="72" data-fit-min="36">→</div>
    <div class="card r anim" id="cardR">
      <span class="clab anim" id="rightLab" data-fit-max="24" data-fit-min="14">AFTER / 改造后</span>
      <div class="cnum anim" id="rightNum" data-fit-max="150" data-fit-min="72"><span class="cdigits" id="rightDigits">21</span><span class="u" id="rightUnit">条</span></div>
      <div class="csub anim" id="rightSub" data-fit-max="30" data-fit-min="15">每周两条，把选题拆成了固定节拍</div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">口径：连续 12 周 · 同平台同账号 · 未投放</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'leftLab', 'leftUnit', 'leftSub', 'rightLab', 'rightUnit', 'rightSub',
   'vs', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  function num(key) {
    var n = Number(v[key]);
    if (!isFinite(n)) n = 0;
    return Math.round(n);
  }
  var lt = num('leftNum'), rt = num('rightNum');
  var ld = document.getElementById('leftDigits'), rd = document.getElementById('rightDigits');

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：两个数字都直接落终值，不做跳变 */
    ld.textContent = String(lt);
    rd.textContent = String(rt);
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#body',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  /* 模 4 数字跳变：steps(n) 让数字以整数跳。计数按先后错开，两组不是同一拍停的 */
  function count(el, to, at, dur, steps) {
    el.textContent = '0';
    var c = { v: 0 };
    tl.to(c, {
      v: to, duration: dur, ease: 'steps(' + steps + ')',
      onUpdate: function () { el.textContent = String(Math.round(c.v)); },
      onComplete: function () { el.textContent = String(to); }
    }, at);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);

  slam('#body',  0.20,   0, -24, 0.28);
  slam('#cardL', 0.34, -48, -32, 0.28);
  slam('#cardR', 0.34,  48, -32, 0.28);
  tl.fromTo('#vs', { scale: 0.86 },
    { scale: 1, duration: 0.24, ease: 'power3.out' }, 0.62);

  slam('#leftLab',  0.72, -24, -20, 0.22);
  count(ld, lt, 0.94, 1.0, 12);
  slam('#leftSub', 1.96,   0, -16, 0.22);
  slam('#rightLab', 0.82,  24, -20, 0.22);
  count(rd, rt, 1.04, 1.1, 14);
  slam('#rightSub', 2.16,  0, -16, 0.22);

  /* 模 9 阴影档位脉冲：两张卡各自停稳的瞬间换一次档再换回来 */
  tl.to('#cardL', { boxShadow: '10px 10px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 1.92);
  tl.to('#cardL', { boxShadow: '8px 8px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 1.98);
  tl.to('#cardR', { boxShadow: '10px 10px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 2.12);
  tl.to('#cardR', { boxShadow: '8px 8px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 2.18);

  slam('#footrow', 2.52, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.64);
  slam('#note',     2.80, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.94);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 3.28);

  var introEnd = 4.08;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
