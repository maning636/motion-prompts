<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"VERTICAL / 竖排氛围"},
{"id":"title","name":"竖排标题","type":"string","label":"竖排中文标题（6–9 字，自上而下）","default":"只做一件事的人"},
{"id":"en","name":"竖排英文","type":"string","label":"右侧竖排 mono 英文标签","default":"ONE THING AT A TIME"},
{"id":"desc","name":"说明","type":"string","label":"右侧说明句（一行，12–20 字）","default":"竖排不是装饰，是把读者的眼睛从上往下按在一条线上"},
{"id":"tag","name":"标签","type":"string","label":"胶囊标签（2–6 字）","default":"SLOW"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"竖排 · 上到下 · 右到左起列"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（标签 + 斜纹带）","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>竖排氛围标题 · 只做一件事的人</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}

  /* 主体：左一列竖排中文 + 右一列说明，列与列之间是 3px 实线而不是留白（基因 7） */
  .vwrap{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;
    gap:72px;padding:34px 88px 0}
  .vcol{flex:0 0 auto;height:100%;writing-mode:vertical-rl;text-orientation:upright;
    display:flex;align-items:flex-start;justify-content:flex-start;
    font-weight:900;font-size:112px;line-height:1.1;letter-spacing:0;color:var(--ink)}
  .vsep{flex:0 0 auto;width:3px;background:var(--ink)}

  .side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:space-between;padding:6px 0 20px}
  /* align-self:flex-start —— 竖排件必须自己收窄，
     默认的 stretch 会把它拉成整列宽，文字就贴到最右边去了 */
  .ven{display:block;align-self:flex-start;writing-mode:vertical-rl;
    text-orientation:upright;height:520px;
    font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.16em;
    color:var(--mute);white-space:nowrap}
  /* 中文说明用 sans（基因 9），字号 36px，右对齐落到列底 */
  .desc{display:block;white-space:nowrap;font-size:36px;font-weight:700;line-height:1.4;
    letter-spacing:0;align-self:flex-end;padding-right:8px}
  .tagrow{display:flex;align-items:center;gap:20px;align-self:flex-end}
  .tag{display:inline-block;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:9px 22px;border-radius:9999px;white-space:nowrap;
    background:var(--accent);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--ink)}
  .sq{width:26px;height:26px;background:var(--ink)}

  .bot{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:26px 88px 40px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .bot .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">VERTICAL / 竖排氛围</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="vwrap anim" id="vwrap">
    <div class="vcol anim" id="title" data-fit-max="112" data-fit-min="60" data-fit-axis="y">只做一件事的人</div>
    <span class="vsep anim" id="vsep"></span>
    <div class="side anim" id="side">
      <span class="ven anim" id="en" data-fit-max="26" data-fit-min="16">ONE THING AT A TIME</span>
      <div class="desc anim" id="desc" data-fit-max="36" data-fit-min="18">竖排不是装饰，是把眼睛按在一条线上</div>
      <div class="tagrow anim" id="tagrow">
        <span class="sq anim" id="sq"></span>
        <span class="tag anim" id="tag" data-fit-max="22" data-fit-min="14">SLOW</span>
      </div>
    </div>
  </div>

  <div class="bot anim" id="bot">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">竖排 · 上到下 · 右到左起列</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'en', 'desc', 'tag', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#vwrap', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#bot',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd',    0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);

  slam('#vwrap', 0.22,   0, -24, 0.28);
  /* 竖排标题：自上而下逐段压入，位移走 Y 轴、零回弹 */
  tl.fromTo('#title', { y: -48 },
    { y: 0, duration: 0.28, ease: 'power4.out' }, 0.36);
  /* 模 7 分格揭示：列分隔线自上而下逐格画出 */
  tl.fromTo('#vsep', { scaleY: 0, transformOrigin: 'center top' },
    { scaleY: 1, duration: 0.36, ease: 'steps(8)' }, 0.52);
  slam('#en', 0.62, 28, -20, 0.26);
  slam('#desc', 0.82, 0, -18, 0.24);
  slam('#sq', 1.02, -20, -20, 0.22);
  slam('#tag', 1.10, -28, -28, 0.24);
  tl.set('#tag', { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, 1.34);
  tl.to('#tag', { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, 1.38);

  slam('#bot', 1.50, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.62);
  slam('#note', 1.76, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.90);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.24);

  var introEnd = 3.24;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
