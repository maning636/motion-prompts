<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"COUNTER / 数字 + 短句"},
{"id":"num","name":"大数字","type":"number","label":"大数字（mono 整数跳变）","default":7},
{"id":"unit","name":"单位","type":"string","label":"数字右侧单位（1–3 字）","default":"版"},
{"id":"lab","name":"数字说明","type":"string","label":"数字下方说明（中文，用 sans）","default":"才剪出一条能发的片子"},
{"id":"l1","name":"短句 1","type":"string","label":"右侧短句第 1 行","default":"第一版是在证明自己行"},
{"id":"l2","name":"短句 2","type":"string","label":"右侧短句第 2 行","default":"第七版是在替观众省时间"},
{"id":"l3","name":"短句 3","type":"string","label":"右侧短句第 3 行","default":"第八版你终于开始删句子"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚（口径）","default":"单位：版 · 同一条片子的实际迭代次数"},
{"id":"accent","name":"强调色","type":"color","label":"数字卡底色 + 斜纹带","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>数字加短句 · 剪到第 7 版才顺</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-l{box-shadow:8px 8px 0 var(--ink)}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:46px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}

  /* 主体：左 1/3 大数字卡 + 右 2/3 三行短句 */
  .body{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:64px;padding:0 88px}
  .stat{flex:0 0 720px;background:var(--accent);color:var(--ink);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);padding:44px 44px 40px}
  .numrow{display:block}
  .num{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:190px;line-height:1;letter-spacing:0}
  .digits{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .num .u{font-size:44px;margin-left:12px;font-family:var(--sans);font-weight:900}
  .lab{display:block;margin-top:18px;font-size:32px;font-weight:700;line-height:1.4;
    letter-spacing:0}

  .side{flex:1 1 0;min-width:0}
  .ln{display:flex;align-items:flex-start;gap:20px;padding:16px 0}
  .ln + .ln{border-top:var(--bw) solid var(--ink)}
  /* 序号小方块：52×52 白底 mono（流程卡的编号块语法，浅底用 ink 阴影） */
  .num2{flex:0 0 auto;width:52px;height:52px;display:flex;align-items:center;
    justify-content:center;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    font-family:var(--mono);font-weight:700;font-size:22px}
  .tx{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;font-size:38px;
    font-weight:700;line-height:1.34;letter-spacing:0;padding-top:4px}

  .footrow{flex:0 0 auto;padding:0 88px 44px;display:flex;align-items:center;gap:22px}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .note{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.12em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">COUNTER / 数字 + 短句</span>
  </div>

  <div class="body anim" id="body">
    <div class="stat anim" id="stat">
      <div class="numrow"><div class="num anim" id="num" data-fit-max="190" data-fit-min="90"><span class="digits" id="digits">7</span><span class="u" id="unit">版</span></div></div>
      <div class="lab anim" id="lab" data-fit-max="32" data-fit-min="16">才剪出一条能发的片子</div>
    </div>
    <div class="side anim" id="side">
      <div class="ln anim"><span class="num2">01</span><span class="tx" id="l1" data-fit-max="38" data-fit-min="19">第一版是在证明自己行</span></div>
      <div class="ln anim"><span class="num2">02</span><span class="tx" id="l2" data-fit-max="38" data-fit-min="19">第七版是在替观众省时间</span></div>
      <div class="ln anim"><span class="num2">03</span><span class="tx" id="l3" data-fit-max="38" data-fit-min="19">第八版你终于开始删句子</span></div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">单位：版 · 同一条片子的实际迭代次数</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'unit', 'lab', 'l1', 'l2', 'l3', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var target = Number(v.num);
  if (!isFinite(target)) target = 0;
  target = Math.round(target);
  var digits = document.getElementById('digits');

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：大数字直接落终值，不做跳变 */
    digits.textContent = String(target);
    tl.fromTo('#top',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#body',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#top',  0.00,   0, -20, 0.24);
  slam('#body', 0.14,   0, -24, 0.28);
  slam('#stat', 0.26, -40, -40, 0.28);
  slam('#lab',  0.46,   0, -16, 0.22);

  /* 模 4 数字跳变：steps(14) 让数字以整数跳，不做小数滚动；
     写进独立的 .digits 节点而不是 textContent —— 后者会把同级的「版」一起抹掉。
     表格数字保证位宽不变，settle 才不会被抖动骗到中途帧。 */
  digits.textContent = '0';
  var counter = { v: 0 };
  tl.to(counter, {
    v: target, duration: 1.1, ease: 'steps(14)',
    onUpdate: function () { digits.textContent = String(Math.round(counter.v)); },
    onComplete: function () { digits.textContent = String(target); }
  }, 0.42);

  /* 模 9 阴影档位脉冲：数字停稳的瞬间换一次档再换回来，只在档位间 steps 跳 */
  tl.to('#stat', { boxShadow: '10px 10px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 1.52);
  tl.to('#stat', { boxShadow: '8px 8px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 1.58);

  slam('#side', 1.68,   0, -20, 0.26);
  slam('#l1',   1.80, -28,   0, 0.22);
  slam('#l2',   1.92, -28,   0, 0.22);
  slam('#l3',   2.04, -28,   0, 0.22);
  slam('#footrow', 2.24, 0,  24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.34);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.48);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.82);

  var introEnd = 4.02;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
