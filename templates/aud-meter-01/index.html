<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "眉标（mono + 大字距，≤12 字）", "default": "METER / 环形"}, {"id": "titleA", "name": "主标题 · 前段", "type": "string", "label": "主标题第一行（普通字，≤6 字）", "default": "这一段，"}, {"id": "titleB", "name": "主标题 · 彩色词块", "type": "string", "label": "主标题第二行（强调色块里的词，≤4 字）", "default": "音量超标"}, {"id": "level", "name": "参考电平", "type": "number", "label": "刻度盘参考电平（dBFS，0 到 0，越接近 0 越贴顶；只改刻度，不改指针逻辑）", "default": -3}, {"id": "peakHold", "name": "峰值保持", "type": "number", "label": "峰值保持秒数（0.3–1.5，只影响保持标记的停留时长）", "default": 0.8}, {"id": "peaks", "name": "音频包络", "type": "string", "label": "离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）", "default": "99,252,78,277,18,362,21,376,39,465,131,351,358,138,638,67,603,298,213,830,106,613,582,14,1000,408,25,996,142,560,989,135,798,443,287,777,99,546,181,404,273,135,277,131,202,71,152,14"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色（超过参考电平的刻度 / 峰值保持标记）", "default": "#FF5FA2"}, {"id": "duration", "name": "总时长", "type": "number", "label": "总时长（秒，须等于音轨长度 5.6）", "default": 5.6}, {"id": "exportMode", "name": "导出格式", "type": "enum", "label": "Format", "default": "mp4", "hidden": true, "options": [{"value": "mp4", "label": "MP4"}, {"value": "webm", "label": "WebM"}, {"value": "transparent", "label": "透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>环形电平表 · 这一段音量到哪了</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让**所有内联样式改动**
       都变成 0.01ms 的过渡——本族每条都有 JS 写死的内联几何（播放头 left/top、
       峰值保持线 bottom），降级分支里会卡在 CSS 旧值不动，渲染出错误位置，
       而 motion-qc 只看最终帧出框、不看降级分支的几何正确性，全绿也照样错。
       补上 transition-property:none 与 animation-name:none 才是完整写法。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }

  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#9A9A9A; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--yellow);color:var(--ink);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--ink);color:var(--white);padding:3px 14px;border-radius:9999px}
  .promo .parw{font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:74px;
    padding:20px 72px 30px}

  /* 环形刻度盘：56 根刻度均匀绕一圈，刻度长度 = f(t)。
     刻度靠「元素中心落在半径 R 的圆上 + 绕自身中心旋转」实现，
     高度变化不会让圆心飘走——这是这类环形表最容易做错的地方。 */
  .ring{flex:0 0 auto;position:relative;width:600px;height:600px}
  .ring .tick{position:absolute;left:50%;top:calc(50% - 246px);width:11px;
    transform-origin:50% 50%;border-radius:9999px;background:var(--white)}
  .ring .tick.hot{background:var(--accent)}
  .ring .hub{position:absolute;left:50%;top:50%;width:330px;height:330px;
    transform:translate(-50%,-50%);border:var(--bw) solid rgba(255,255,255,.45);
    border-radius:9999px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px}
  .ring .db{font-family:var(--mono);font-weight:900;font-size:92px;letter-spacing:.02em;
    line-height:1;font-variant-numeric:tabular-nums}
  .ring .unit{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.16em;
    color:var(--accent)}
  .ring .ref{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.1em;
    color:var(--mute)}

  .right{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:26px}
  .hd .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--yellow);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stack .line{display:block;font-size:80px;font-weight:900;line-height:1.05;white-space:nowrap}
  .stack .chip{display:inline-block;line-height:1;padding:0 18px;background:var(--accent);
    color:var(--ink);border:var(--bw) solid var(--white);border-radius:4px;
    box-shadow:8px 8px 0 var(--white)}
  .stack .sub{min-width:0;font-size:29px;font-weight:700;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 历史包络：48 段整段都在画，观众能看到这一条音轨整体有多重 */
  .hist{position:relative;height:56px;display:flex;align-items:flex-end;
    justify-content:space-between;padding:0 2px;border-bottom:var(--bw) solid var(--white)}
  .hist i{display:block;width:16px;height:6px;border-radius:9999px;background:rgba(255,255,255,.34)}
  .hist i.on{background:var(--accent)}
  #hold{position:absolute;left:0;bottom:0;width:7px;height:0;background:var(--accent);z-index:5}
  .scale{display:flex;align-items:center;gap:22px}
  .scale .sc{flex:1 1 auto;display:flex;justify-content:space-between;min-width:0;
    border-bottom:var(--bw) dashed rgba(255,255,255,.55);padding-bottom:8px}
  .scale .sc i{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.06em;
    color:var(--mute);font-style:normal;white-space:nowrap}
  .scale .refdb{font-family:var(--mono);font-weight:900;font-size:26px;letter-spacing:.06em;
    color:var(--yellow);white-space:nowrap;font-variant-numeric:tabular-nums}

  .stripe{flex:0 0 auto;height:20px;
    background:repeating-linear-gradient(45deg,var(--accent) 0 10px,var(--ink) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--white);color:var(--ink)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--pink)}
  .foot .fc{font-size:25px;font-weight:700;white-space:nowrap}
  #hold{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">dBFS</span><span class="ptx">环形电平表 · 峰值保持 + 分贝读数</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="ring" id="ring">
      <div class="hub"><span class="db" id="db">-60</span><span class="unit">dBFS</span></div>
    </div>
    <div class="right">
      <div class="hd">
        <span class="eyebrow anim" id="eyebrow">METER / 环形</span>
      </div>
      <div class="stack">
        <span class="line anim" id="titleA" data-fit-max="80" data-fit-min="40">这一段，</span>
        <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="80" data-fit-min="40">音量超标</span></span>
        <p class="sub anim" id="sub" data-fit-max="29" data-fit-min="15">峰值卡在参考线上方，掉不下去</p>
        <p class="sub anim" id="sub2">电平读数与历史包络同由这条音轨的离线包络算出</p>
      </div>
      <div class="hist anim" id="hist"></div>
      <div class="scale anim" id="scale">
        <span class="refdb" id="refdb">REF -3 dB</span>
        <span class="sc"><i>-60</i><i>-40</i><i>-20</i><i>-12</i><i>-6</i><i>0</i></span>
      </div>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fm">AUD / 2026</span><span class="fc">读数不是标上去的，是按包络算的</span>
  </div></div>
<!-- [公开版] 原音轨 音轨 voice-05.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* ---------- 音频包络：offline RMS，烘在 peaks 变量里 ----------
     这份数组来自 音轨 voice-05.wav（未随仓分发） 的离线解码（RMS，48 桶，归一到 0–1000），
     由 离线包络脚本（未随仓分发） 算出，同时落一份
     assets/voice-05.peaks.json 作溯源。
     换音轨：换 wav → 重跑离线脚本 → 把新数组填进 peaks → 同步 duration 与
     <audio data-duration>。这是一条显式的、算一次的步骤，不是缺陷。
     为什么绝不接实时 AnalyserNode：无头渲染是逐帧 seek 采样，媒体在采集模式下
     是 seek 不是 play（hyperframes runtime 的 allowLiveTimelineSeek 在
     __HF_RENDER_CAPTURE_MODE 下为 false），探针接在暂停的元素上读到的不是
     「此刻在放什么」；motion-qc 的探针同样是无序 seek。 */
  var FALLBACK_PEAKS = '99,252,78,277,18,362,21,376,39,465,131,351,358,138,638,67,603,298,213,830,106,613,582,14,1000,408,25,996,142,560,989,135,798,443,287,777,99,546,181,404,273,135,277,131,202,71,152,14';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);
  function peakAt(k) {
    return PEAKS[Math.max(0, Math.min(PEAKS.length - 1, k))];
  }

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','titleA','titleB'].forEach(function (k) { set(k, v[k]); });
  var REFDB = Math.max(-24, Math.min(0, Number(v.level) || -3));   /* 参考电平 */
  var HOLD = Math.max(0.3, Math.min(1.5, Number(v.peakHold) || 0.8)); /* 峰值保持秒数 */


  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 音频窗口：时间轴总长严格等于音轨长度，尾部留 0.6s 静音 + 定格。
     禁止用变量值推算总长（数值填大会撞 SMOKE_TOO_LONG）。 */
  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var N = PEAKS.length;

  var TICKS = 56, MINH = 8, MAXH = 56, RADIUS = 246, SWEEP = 280;
  var STEPS = N, SEG = WIN / STEPS;

  /* 刻度长度只看时间桶 k 与刻度序号 i。一个 cos 调制让一圈刻度有明暗纹理，
     但振幅主体仍然只由包络决定——不会变成装饰花纹。 */
  function tickLen(i, k) {
    var mod = 0.72 + 0.28 * Math.abs(Math.cos(i * 0.7));
    return MINH + Math.round(peakAt(k) / 1000 * (MAXH - MINH) * mod);
  }
  function dbAt(k) { return -60 + Math.round(60 * peakAt(k) / 1000); }
  /* 峰值保持：取 [k−HOLD·N/WIN, k] 区间的最大值——仍然是 t 的纯函数
     （对一段固定输入取滑动最大值，不是有状态的累加器）。 */
  function holdLen(k) {
    var back = Math.round(HOLD / SEG);
    var m = 0;
    for (var j = Math.max(0, k - back); j <= k; j++) if (peakAt(j) > m) m = peakAt(j);
    return MINH + Math.round(m / 1000 * (MAXH - MINH));
  }

  var ring = document.getElementById('ring');
  var ticks = [];
  for (var i = 0; i < TICKS; i++) {
    var t = document.createElement('span');
    t.className = 'tick';
    t.style.transform = 'rotate(' + (-SWEEP / 2 + i * SWEEP / (TICKS - 1)) + 'deg)';
    ring.appendChild(t); ticks.push(t);
  }
  var hist = document.getElementById('hist'), hbars = [];
  for (var b = 0; b < N; b++) {
    var h = document.createElement('i');
    h.style.height = Math.max(6, Math.round(PEAKS[b] / 1000 * 50)) + 'px';
    hist.appendChild(h); hbars.push(h);
  }
  document.getElementById('refdb').textContent = 'REF ' + REFDB + ' dB';

  B.fitAll();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function press(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }
  function fadeInReduce(ids, start) {
    for (var i = 0; i < ids.length; i++) {
      tl.fromTo(ids[i], { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: i === ids.length - 1 ? .6 : .5, ease: 'power3.out' },
        start + i * 0.08);
    }
  }

  var dbEl = document.getElementById('db');
  var holdEl = document.getElementById('hold');
  var histR = hist.getBoundingClientRect();
  var hot = Math.max(0, Math.min(TICKS - 1, Math.round((REFDB + 60) / 60 * (TICKS - 1))));
  for (var i = 0; i < TICKS; i++) ticks[i].className = i >= hot ? 'tick hot' : 'tick';

  function paintPeak(k) {
    for (var b = 0; b < N; b++) hbars[b].className = b <= k ? 'on' : '';
  }

  if (reduce) {
    var still = Math.round(N * 0.62);
    gsap.set(ticks, { height: (function (k) { return function (i) { return tickLen(i, k); }; })(still) });
    gsap.set(dbEl, { textContent: String(dbAt(still)) });
    gsap.set(holdEl, { height: holdLen(still) + 'px' });
    paintPeak(still);
    fadeInReduce(['#promo', '#main', '#stripe', '#foot'], 0);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#main', 0.12, 0, 24, 0.30);
  slam('#eyebrow', 0.30, 0, -20, 0.22);
  slam('#titleA', 0.44, -34, -34, 0.28);
  slam('#lineB', 0.58, -34, -34, 0.28);
  press('#titleB', '8px 8px 0 ' + '#FFFFFF', 0.86);
  slam('#sub', 0.74, 0, -20, 0.24);
  slam('#sub2', 0.82, 0, -20, 0.24);
  slam('#hist', 0.90, 0, 18, 0.24);
  slam('#scale', 0.98, 0, 18, 0.24);

  /* ---- 音频驱动 ---- */
  for (var k = 0; k < STEPS; k++) {
    tl.to(ticks, { height: (function (kk) { return function (i) { return tickLen(i, kk); }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.set(dbEl, { textContent: String(dbAt(k)) }, k * SEG);
    tl.to(holdEl, { height: (function (kk) { return function () { return holdLen(kk) + 'px'; }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.call((function (kk) { return function () { paintPeak(kk); }; })(k), null, k * SEG);
  }
  tl.fromTo('#ring', { rotate: -24 }, { rotate: 0, duration: 0.5, ease: 'power3.out' }, 0.12);

  slam('#foot', 0.98, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.10);

  /* 收尾：音频窗口走完后补一段静止，时间轴总长恰好等于音轨长度，
     样片视频与音轨严丝合缝，最后一拍是「已播完」的定格画面。 */
  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
