<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"MATERIAL / 成分卖点"},{"id":"title","name":"主标题","type":"string","label":"主标题（中文大字，一行）","default":"四个数字，直接决定手感"},{"id":"c1","name":"成分 1","type":"string","label":"第一格成分名","default":"长绒棉"},{"id":"n1","name":"含量 1","type":"number","label":"第一格含量（%）","default":96},{"id":"d1","name":"成分 1 说明","type":"string","label":"第一格说明","default":"纤维更长，绒感更少掉毛"},{"id":"c2","name":"成分 2","type":"string","label":"第二格成分名","default":"莱赛尔"},{"id":"n2","name":"含量 2","type":"number","label":"第二格含量（%）","default":3},{"id":"d2","name":"成分 2 说明","type":"string","label":"第二格说明","default":"负责垂坠与吸湿，快干不闷"},{"id":"c3","name":"成分 3","type":"string","label":"第三格成分名","default":"氨纶"},{"id":"n3","name":"含量 3","type":"number","label":"第三格含量（%）","default":1},{"id":"d3","name":"成分 3 说明","type":"string","label":"第三格说明","default":"只加 1%，回弹不受限"},{"id":"c4","name":"成分 4","type":"string","label":"第四格成分名","default":"植物染色"},{"id":"n4","name":"含量 4","type":"number","label":"第四格含量（%）","default":100},{"id":"d4","name":"成分 4 说明","type":"string","label":"第四格说明","default":"全程植物染，无重金属残留"},{"id":"note","name":"口径说明","type":"string","label":"口径说明（一行 mono）","default":"口径：含量取自吊牌实测 · 检测报告编号 FB-2026-0871"},{"id":"accent","name":"强调色","type":"color","label":"强调色（第一格顶条 / 斜纹带）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":6},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="成分标牌横排构图：顶部反白条与大标题行，下方四枚成分标牌并排，每枚顶部一条 16px 分类色条，中部压着含量大数字">
<title>成分卖点标牌 · 四个数字，直接决定手感</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .top{flex:0 0 auto;height:66px;display:flex;align-items:center;gap:22px;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .top .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .top .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}

  .head{flex:0 0 auto;padding:30px 72px 26px;border-bottom:var(--bw) solid var(--ink);
    display:flex;align-items:center;gap:26px}
  .head .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:900;font-size:72px;letter-spacing:0}

  /* 四枚标牌：顶部一色条 + 白卡 + 含量大数字 + 成分名 + 说明 */
  .cards{flex:1 1 auto;min-height:0;display:flex;gap:24px;padding:32px 72px 34px}
  .card{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    border:var(--bw) solid var(--ink);border-radius:4px;overflow:hidden;
    background:var(--white);box-shadow:8px 8px 0 var(--ink)}
  .card .bar{flex:0 0 auto;height:16px;border-bottom:var(--bw) solid var(--ink);
    background:var(--accent)}
  .card.c2 .bar{background:var(--pink)}
  .card.c3 .bar{background:var(--green)}
  .card.c4 .bar{background:var(--blue)}
  .card .in{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px 20px}
  .card .idx{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.14em;color:var(--mute)}
  .card .n{display:flex;align-items:baseline;gap:8px}
  .card .n b{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:132px;line-height:.9;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .card .n i{font-family:var(--mono);font-style:normal;font-weight:700;font-size:44px;
    letter-spacing:.06em}
  .card .nm{display:block;white-space:nowrap;font-size:40px;font-weight:900;
    letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .card .ds{display:block;white-space:nowrap;font-size:24px;font-weight:500;
    letter-spacing:0;color:var(--mute);max-width:100%;overflow:hidden;
    text-overflow:ellipsis;text-align:center}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:0 72px 22px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="tag">FABRIC</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">MATERIAL / 成分卖点</span>
  </div>

  <div class="head anim" id="head">
    <span class="tt anim" id="title" data-fit-max="72" data-fit-min="34">四个数字，直接决定手感</span>
  </div>

  <div class="cards anim" id="cards">
    <div class="card anim" id="cardA">
      <div class="bar"></div>
      <div class="in">
        <span class="idx">01</span>
        <span class="n"><b class="anim" id="n1" data-fit-max="132" data-fit-min="60">96</b><i>%</i></span>
        <span class="nm anim" id="c1" data-fit-max="40" data-fit-min="22">长绒棉</span>
        <span class="ds anim" id="d1" data-fit-max="24" data-fit-min="15">纤维更长，绒感更少掉毛</span>
      </div>
    </div>
    <div class="card c2 anim" id="cardB">
      <div class="bar"></div>
      <div class="in">
        <span class="idx">02</span>
        <span class="n"><b class="anim" id="n2" data-fit-max="132" data-fit-min="60">3</b><i>%</i></span>
        <span class="nm anim" id="c2" data-fit-max="40" data-fit-min="22">莱赛尔</span>
        <span class="ds anim" id="d2" data-fit-max="24" data-fit-min="15">负责垂坠与吸湿，快干不闷</span>
      </div>
    </div>
    <div class="card c3 anim" id="cardC">
      <div class="bar"></div>
      <div class="in">
        <span class="idx">03</span>
        <span class="n"><b class="anim" id="n3" data-fit-max="132" data-fit-min="60">1</b><i>%</i></span>
        <span class="nm anim" id="c3" data-fit-max="40" data-fit-min="22">氨纶</span>
        <span class="ds anim" id="d3" data-fit-max="24" data-fit-min="15">只加 1%，回弹不受限</span>
      </div>
    </div>
    <div class="card c4 anim" id="cardD">
      <div class="bar"></div>
      <div class="in">
        <span class="idx">04</span>
        <span class="n"><b class="anim" id="n4" data-fit-max="132" data-fit-min="60">100</b><i>%</i></span>
        <span class="nm anim" id="c4" data-fit-max="40" data-fit-min="22">植物染色</span>
        <span class="ds anim" id="d4" data-fit-max="24" data-fit-min="15">全程植物染，无重金属残留</span>
      </div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：含量取自吊牌实测 · 检测报告编号 FB-2026-0871</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'c1', 'd1', 'c2', 'd2', 'c3', 'd3', 'c4', 'd4', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  ['n1', 'n2', 'n3', 'n4'].forEach(function (id) {
    var n = Number(v[id]);
    set(id, String(isFinite(n) ? Math.max(0, Math.round(n)) : 0));
  });

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#top',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#head',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .12);
    tl.fromTo('#cards', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .26);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .44);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .6);
    B.hold(tl, 1.35, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#top',   0.00,   0, -66, 0.26);
  slam('#eyebrow',0.14, -24, -20, 0.22);
  slam('#head',  0.26,   0, -26, 0.26);
  slam('#title', 0.36, -28, -24, 0.26);
  /* 模 2 硬着陆：四枚标牌自下错峰落位，纯位移，opacity 恒为 1 */
  tl.from('#cards .card', { y: 60, duration: .28, ease: 'power4.out', stagger: .12 }, 0.56);
  shadowBounce('#cardA', '8px 8px 0 ' + INK, 1.02);
  shadowBounce('#cardB', '8px 8px 0 ' + INK, 1.10);
  slam('#n1', 0.84,    0, -26, 0.26);
  slam('#n2', 0.96,    0, -26, 0.26);
  slam('#n3', 1.08,    0, -26, 0.26);
  slam('#n4', 1.20,    0, -26, 0.26);
  tl.from('#cards .nm', { y: -18, duration: .2, ease: 'power4.out', stagger: .12 }, 1.30);
  tl.from('#cards .ds', { y: -16, duration: .2, ease: 'power4.out', stagger: .12 }, 1.42);
  slam('#foot',    1.76,   0,  28, 0.26);
  slam('#note',    1.88, -24, -20, 0.22);
  slam('#stripe',  1.98,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.22);

  var introEnd = 3.42;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
