<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"hm","name":"时分","type":"string","label":"时:分（5 个字符，如 20:00）","default":"20:00"},{"id":"sec","name":"秒数","type":"number","label":"秒（0–59，决定秒针跳到哪里）","default":48},{"id":"tz","name":"时区","type":"string","label":"时区标记（2–6 字）","default":"UTC+8"},{"id":"date","name":"日期","type":"string","label":"日期行（6–14 字）","default":"10 月 13 日 周一"},{"id":"accent","name":"强调色","type":"color","label":"强调色（时区方块 / 秒数）","default":"#FFD429"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="时间条：右上角 ink 时钟块内 mono 时分 + 强调色秒数，秒数按整数硬跳到设定值，右侧黄色时区方块与下方白色日期条依次分格擦出后错峰微位移">
<title>时间条 · 20:00</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 时钟块：ink 底反白件，阴影走白（基因 10 / §7.2 规则 B） */
  #ck{position:absolute;right:96px;top:96px;width:420px;height:200px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--ink);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--white)}
  #hm{display:block;font-family:var(--mono);font-weight:900;font-size:104px;line-height:1;
    letter-spacing:0;color:var(--white);font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;white-space:nowrap;overflow:hidden}
  /* 秒数压在高饱和块上，深底上永远读得清（§7.3.3） */
  #ss{display:block;padding:8px 14px;background:var(--accent);border:var(--bw) solid var(--ink);
    border-radius:4px;font-family:var(--mono);font-weight:900;font-size:64px;line-height:1;
    letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;white-space:nowrap}

  /* 时区方块：正方 + 3px 黑边 + 4px 直角，形状不随字号变 */
  #tzb{position:absolute;right:540px;top:96px;width:200px;height:200px;
    display:flex;align-items:center;justify-content:center;
    background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #tz{display:block;font-family:var(--mono);font-weight:700;font-size:48px;letter-spacing:.04em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}

  /* 日期条：白底黑字，与时钟块之间靠 3px 实线而不是留白分隔（基因 7） */
  #dt{position:absolute;right:96px;top:320px;width:420px;height:100px;
    display:flex;align-items:center;justify-content:center;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #date{display:block;font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.08em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="tzb"><span id="tz" data-fit-max="48" data-fit-min="26">UTC+8</span></div>
  <div id="ck"><span id="hm" data-fit-max="104" data-fit-min="56">20:00</span><span id="ss">00</span></div>
  <div id="dt"><span id="date" data-fit-max="30" data-fit-min="18">10 月 13 日 周一</span></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['hm', 'tz', 'date'].forEach(function (k) { set(k, v[k]); });

  /* 秒数只决定显示到哪一格，展示窗口写死 1.6s，绝不用秒数推算时间轴长度 */
  var SEC = Math.max(0, Math.min(59, Number(v.sec) || 0));
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  var eSS = document.getElementById('ss');
  if (eSS) eSS.textContent = pad2(SEC);

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：秒数直接给终值，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#tzb', { x: 0, y: 0, opacity: 1 });
    gsap.set('#ck', { x: 0, y: 0, opacity: 1 });
    gsap.set('#dt', { x: 0, y: 0, opacity: 1 });
    gsap.set('#ss', { textContent: pad2(SEC) });

    tl.fromTo('#tzb', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#ck', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 1 · 拍进来：时钟块与时区方块自右上斜向硬着陆，落定瞬间阴影压 2 帧再弹回原档 */
  tl.fromTo('#ck', { x: 64, y: -44 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#ck', { boxShadow: '8px 8px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F') },
      { boxShadow: '8px 11px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F'), duration: .04, ease: 'steps(2)' }, '<')
    .to('#ck', { boxShadow: '8px 8px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F'), duration: .04, ease: 'steps(2)' });
  tl.fromTo('#tzb', { x: 64, y: -44 },
      { x: 0, y: 0, duration: .26, ease: 'power4.out' }, .12)
    .fromTo('#tzb', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#tzb', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });

  /* 模 4 · 整数硬跳：秒数 steps(12) 跳到设定值，onUpdate 只写 textContent，不做 DOM 测量 */
  var RUN = 1.6;
  var n = { v: 0 };
  tl.to(n, { v: SEC, duration: RUN, ease: 'steps(12)',
      onUpdate: function () { if (eSS) eSS.textContent = pad2(Math.round(n.v)); } }, .3);

  /* 模 7 · 分格擦出：日期条自右分六格推出来 */
  tl.fromTo('#dt', { clipPath: 'inset(0 0 0 100%)' },
      { clipPath: 'inset(0 0 0 0%)', duration: .3, ease: 'steps(6)' }, .5);
  tl.fromTo('#date', { x: 24 }, { x: 0, duration: .2, ease: 'power4.out' }, .7);

  /* 三块错峰微位移：秒数块内部分钟自左装上去，其余三层各走一段匀速往返 */
  tl.fromTo('#hm', { x: -24 }, { x: 0, duration: .2, ease: 'power4.out' }, .26);
  var T0 = 2.1;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#ck', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#tzb', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#dt', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
