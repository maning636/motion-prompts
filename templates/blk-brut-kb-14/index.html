<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"TYPING / 打字机"},
{"id":"text","name":"打出的正文","type":"string","label":"逐字打出的中文句子（18–30 字）","default":"先写完这句话，再决定要不要配图。"},
{"id":"l1","name":"输出行 1","type":"string","label":"卡内下方 mono 输出行 1（提示符由模板补，变量里不要写大于号）","default":"画面为句子服务，不是反过来"},
{"id":"l2","name":"输出行 2","type":"string","label":"卡内下方 mono 输出行 2（提示符由模板补，变量里不要写大于号）","default":"一条片子里只留一个视觉重心"},
{"id":"note","name":"底部注脚","type":"string","label":"底部 mono 注脚","default":"整段揭示总时长封顶 800ms"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（光标 + 眉标）","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>打字机效果 · 先写完这句话，再决定要不要配图</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整块换底色（基因 10）：ink 底 + white 字，反白是整块替换，不叠蒙版 */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-l{box-shadow:8px 8px 0 var(--white)}
  .sh-s{box-shadow:4px 4px 0 var(--white)}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:46px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--accent);white-space:nowrap;flex:0 0 auto}
  .tagpill{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    padding:7px 18px;border-radius:9999px;white-space:nowrap;
    background:var(--white);color:var(--ink);border:var(--bw) solid var(--white);
    box-shadow:4px 4px 0 var(--white)}

  /* 终端卡：白底方块压在 ink 上，卡自身是浅底 → 阴影用 ink（规则 B 反过来看承载底色） */
  .console{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:0 88px}
  .term{flex:1 1 auto;min-width:0;background:var(--white);color:var(--ink);
    border:var(--bw) solid var(--paper);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    padding:48px 56px 44px}
  .bar{display:flex;align-items:center;gap:12px;padding-bottom:24px;
    border-bottom:var(--bw) solid var(--ink)}
  .bar i{display:block;width:22px;height:22px;border:var(--bw) solid var(--ink);border-radius:4px}
  .bar i:nth-child(1){background:var(--pink)}
  .bar i:nth-child(2){background:var(--yellow)}
  .bar i:nth-child(3){background:var(--green)}
  .bar span{margin-left:12px;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 中文正文用 sans（基因 9：mono 只承担编号 / 数字 / 英文缩写 / 标签） */
  .typed{display:block;white-space:nowrap;font-size:56px;font-weight:900;line-height:1.34;
    letter-spacing:0;margin:34px 0 30px;padding-right:20px}
  .ch{display:inline-block}
  .cursor{display:inline-block;width:20px;height:52px;margin-left:10px;
    vertical-align:-8px;background:var(--accent);border:var(--bw) solid var(--ink)}

  .outs{padding-top:26px;border-top:var(--bw) solid var(--ink)}
  .out{display:block;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.04em;line-height:1.7;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;opacity:1}

  .bot{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--white);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--paper)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="top anim" id="top">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">TYPING / 打字机</span>
    <span class="tagpill anim" id="tagpill" data-fit-max="22" data-fit-min="14">UTF-8 · ZH</span>
  </div>

  <div class="console anim" id="console">
    <div class="term anim" id="term">
      <div class="bar anim" id="bar"><i></i><i></i><i></i><span>NOTES.TXT</span></div>
      <div class="typed" id="typed"><span id="text">先写完这句话，再决定要不要配图。</span><span class="cursor" id="cursor"></span></div>
      <div class="outs anim" id="outs">
        <span class="out anim" id="l1" data-fit-max="26" data-fit-min="14">&gt; 画面为句子服务，不是反过来</span>
        <span class="out anim" id="l2" data-fit-max="26" data-fit-min="14">&gt; 一条片子里只留一个视觉重心</span>
      </div>
    </div>
  </div>

  <div class="bot anim" id="bot">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">整段揭示总时长封顶 800ms</span>
    <span class="rule anim" id="rule"></span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'tagpill', 'text', 'note'].forEach(function (k) { set(k, v[k]); });
  /* 终端提示符由模板补：变量里不带 > ，否则 > 会把 <html> 属性提前截断 */
  function setCmd(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = '> ' + val; }
  setCmd('l1', v.l1); setCmd('l2', v.l2);
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 逐字切分：JS 切 span，不引额外库。切完再 fitAll，量到的才是最终 DOM。 */
  function splitChars(el) {
    var txt = el.textContent;
    el.textContent = '';
    for (var i = 0; i < txt.length; i++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = txt.charAt(i);
      el.appendChild(s);
    }
    return el.querySelectorAll('.ch');
  }
  var typedEl = document.getElementById('text');
  var chars = typedEl ? splitChars(typedEl) : [];

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：整串一次落定，光标常亮，不做逐字步进也不做闪烁 */
    gsap.set(chars, { opacity: 1, y: 0 });
    gsap.set('#cursor', { opacity: 1 });
    tl.fromTo('#top',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#console', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#bot',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#top',     0.00,   0, -20, 0.24);
  slam('#console', 0.12, -40, -24, 0.28);
  slam('#bar',     0.28, -20, -20, 0.22);

  /* 打字机：steps(1) = 全程保持起始值、只在末帧跳一格，
     读起来就是机械的逐字键入，而不是连续淡入。整串错峰 0.055s。 */
  tl.fromTo(chars, { opacity: 0 },
    { opacity: 1, duration: 0.05, ease: 'steps(1)', stagger: 0.055 }, 0.44);

  /* 光标闪烁：**有限**段（repeat 5 + yoyo 共 6 次），yoyo 收尾回到常亮 */
  tl.to('#cursor', { opacity: 0, duration: 0.08, ease: 'none',
    repeat: 5, yoyo: true }, 1.28);

  /* 输出行分格揭示：steps(3) 逐格点亮，模拟终端回显 */
  tl.fromTo('#l1', { opacity: 0 }, { opacity: 1, duration: 0.24, ease: 'steps(3)' }, 1.72);
  tl.fromTo('#l2', { opacity: 0 }, { opacity: 1, duration: 0.24, ease: 'steps(3)' }, 1.94);

  slam('#bot',  2.20, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.32);
  slam('#note', 2.44, 0, -16, 0.22);

  var introEnd = 2.96;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
