<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"mark","name":"头像字","type":"string","label":"头像位大字（1–2 字）","default":"李"},{"id":"nm","name":"姓名","type":"string","label":"嘉宾姓名（2–4 字）","default":"李知遥"},{"id":"role","name":"身份","type":"string","label":"身份 / 头衔（6–14 字）","default":"独立播客主理人 · 12 期播客"},{"id":"bio","name":"一句介绍","type":"string","label":"一句介绍（14–24 字）","default":"把复杂方法讲成能落地的三步"},{"id":"accent","name":"强调色","type":"color","label":"强调色（姓名块 / 头像位底）","default":"#FF5FA2"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="嘉宾介绍条：左侧强调色头像方块 + 右侧三层信息带（身份 / 姓名 / 一句介绍），头像与信息带自左右对撞入位，头像块做一次阴影档位脉冲">
<title>嘉宾介绍条 · 李知遥</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 头像位：正方 + 3px 黑边 + 4px 直角，不换圆角不换形（基因 3） */
  #pf{position:absolute;left:96px;bottom:152px;width:320px;height:320px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #mark{display:block;font-size:180px;font-weight:900;line-height:1;letter-spacing:0;color:var(--ink);
    white-space:nowrap;overflow:hidden}

  /* 信息带：三层横条，层间靠 3px 实线分隔（基因 7） */
  #gb{position:absolute;left:448px;bottom:152px;width:1376px;height:320px;
    display:flex;flex-direction:column;box-shadow:8px 8px 0 var(--shadow)}
  .r1{display:flex;align-items:center;justify-content:space-between;gap:24px;
    background:var(--ink);color:var(--white);border:var(--bw) solid var(--ink);border-radius:4px 4px 0 0;
    padding:12px 30px}
  #role{display:block;font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.06em;
    line-height:1.1;white-space:nowrap;overflow:hidden}
  .kind{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow);white-space:nowrap}
  .r2{background:var(--accent);border:var(--bw) solid var(--ink);border-top:0;margin-top:-3px}
  #nm{display:block;font-size:96px;font-weight:900;line-height:1.04;letter-spacing:0;color:var(--ink);
    padding:14px 30px 16px;white-space:nowrap;overflow:hidden}
  .r3{background:var(--white);border:var(--bw) solid var(--ink);border-top:0;margin-top:-3px;
    border-radius:0 0 4px 4px}
  #bio{display:block;font-size:34px;font-weight:700;line-height:1.3;letter-spacing:0;color:var(--ink);
    padding:20px 30px 24px;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="pf"><span id="mark" data-fit-max="180" data-fit-min="72">李</span></div>
  <div id="gb">
    <div class="r1">
      <span id="role" data-fit-max="24" data-fit-min="14">独立播客主理人 · 12 期播客</span>
      <span class="kind">GUEST</span>
    </div>
    <div class="r2"><div id="nm" data-fit-max="96" data-fit-min="44">李知遥</div></div>
    <div class="r3"><div id="bio" data-fit-max="34" data-fit-min="18">把复杂方法讲成能落地的三步</div></div>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['mark', 'nm', 'role', 'bio'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  /* 头像位是定尺 320×320 的方块，参照框得指定成它自己，data-fit 才量得到 */
  B.fit('#mark', { max: 180, min: 72, box: '#pf' });
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉对撞与脉冲，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#pf', { x: 0, y: 0, opacity: 1 });
    gsap.set('#gb', { x: 0, y: 0, opacity: 1 });
    gsap.set('#nm', { x: 0 });
    gsap.set('#bio', { x: 0 });

    tl.fromTo('#pf', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#gb', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 2 · 对撞入位：头像自左、信息带自右，两块落定瞬间阴影各压 2 帧再弹回原档 */
  tl.fromTo('#pf', { x: -70 },
      { x: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#pf', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#pf', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#gb', { x: 70 },
      { x: 0, duration: .26, ease: 'power4.out' }, .1)
    .fromTo('#gb', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#gb', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });

  /* 三层信息错峰自左装上去，全部纯位移，opacity 恒为 1 */
  tl.fromTo('#role', { x: -24 }, { x: 0, duration: .2, ease: 'power4.out' }, .24);
  tl.fromTo('#nm',   { x: -30 }, { x: 0, duration: .22, ease: 'power4.out' }, .3);
  tl.fromTo('#bio',  { x: -30 }, { x: 0, duration: .22, ease: 'power4.out' }, .38);
  tl.fromTo('.kind', { x: 26 },  { x: 0, duration: .2, ease: 'power4.out' }, .34);

  /* 模 9 · 阴影档位脉冲：只在档位之间跳，不做连续缩放（规范 §4.2 模 9） */
  tl.to('#pf', { boxShadow: '8px 11px 0 ' + SH, duration: .06, ease: 'steps(2)' }, 1.0)
    .to('#pf', { boxShadow: '8px 8px 0 ' + SH, duration: .06, ease: 'steps(2)' })
    .to('#pf', { boxShadow: '8px 11px 0 ' + SH, duration: .06, ease: 'steps(2)' })
    .to('#pf', { boxShadow: '8px 8px 0 ' + SH, duration: .06, ease: 'steps(2)' });

  /* 头像大字匀速位差：机械节拍器式的往返位移，不碰 scale */
  var T0 = 1.5;
  var REP = Math.max(1, Math.round((WIN - T0) / 1.0));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#mark', { y: -8, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
