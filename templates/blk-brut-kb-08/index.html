<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"sideL","name":"左侧标签","type":"string","label":"左侧胶囊标签（mono + 中文）","default":"SWAP / 换词"},
{"id":"title","name":"主标题","type":"string","label":"主标题前半（会自动接上 A 词，不要把 A 词写进来）","default":"与其把内容做得"},
{"id":"wordA","name":"A 词","type":"string","label":"先出现的词（2–5 字）","default":"更多"},
{"id":"title2","name":"主标题后半","type":"string","label":"换词之后的后半句（会自动接上 B 词）","default":"不如把一条"},
{"id":"wordB","name":"B 词","type":"string","label":"换上去的词（2–5 字，比 A 词更重）","default":"讲透"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"硬切换 · 不做交叉淡入"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（侧标 + 斜纹带）","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>标题换词 · 与其把内容做得更多，不如把一条讲透</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 满版 yellow：整版底只允许 yellow 和 pink（风格规范基因表） */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--yellow);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  /* 侧标：左右两枚 mono 胶囊，压住版心不让人读成一整块 */
  .rail{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:48px 88px 0;gap:24px}
  .side{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.12em;padding:8px 20px;border-radius:9999px;
    background:var(--white);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--ink)}
  .side.acc{background:var(--accent)}

  /* 换词舞台：上下两行，A 词 / B 词在同一格叠放，硬切不交叉 */
  .stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:0 88px}
  .swapbox{position:relative;width:100%}
  .line{display:block;white-space:nowrap;font-weight:900;font-size:118px;
    line-height:1.16;letter-spacing:0;padding-right:24px}
  .slot{position:relative;display:inline-block;isolation:isolate;vertical-align:baseline}
  /* A 词 = 白底方块，B 词 = 强调色方块，都撞 3px 黑边（基因 6：孤立色块即错误） */
  .slot i{position:absolute;left:-14px;right:-14px;bottom:-6px;height:64%;z-index:-1;
    border:var(--bw) solid var(--ink);border-radius:4px;display:block}
  .slotA i{background:var(--white)}
  .slotB i{background:var(--accent)}
  #wordB{opacity:0}
  .slotB{opacity:0}

  .footrow{flex:0 0 auto;padding:0 88px 48px;display:flex;align-items:center;gap:22px}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .note{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.12em}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="rail anim" id="rail">
    <span class="side anim" id="sideL" data-fit-max="22" data-fit-min="14">SWAP / 换词</span>
    <span class="side acc anim" id="sideR" data-fit-max="22" data-fit-min="14">硬切 · 1 帧</span>
  </div>

  <div class="stagewrap anim" id="stagewrap">
    <div class="swapbox">
      <div class="line anim" id="lineA" data-fit-max="118" data-fit-min="56"><span id="title">与其把内容做得</span><span class="slot slotA" id="slotA"><i></i><span id="wordA">更多</span></span></div>
      <div class="line anim" id="lineB" data-fit-max="118" data-fit-min="56"><span id="title2">不如把一条</span><span class="slot slotB" id="slotB"><i></i><span id="wordB">讲透</span></span></div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <div class="rule anim" id="rule"></div>
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">硬切换 · 不做交叉淡入</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['sideL', 'sideR', 'title', 'title2', 'wordA', 'wordB', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：换词直接落在 B 词终态，不做硬切那一拍 */
    gsap.set('#slotB', { opacity: 1, y: 0, scale: 1 });
    gsap.set('#slotA', { opacity: 0, y: 0, scale: 1 });
    tl.fromTo('#rail',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#stagewrap',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';
  /* 模 1 拍进来：落定瞬间阴影压 2 帧再弹回原档 */
  function shadowBounce(sel, at) {
    tl.set(sel, { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  /* 模 7 分格揭示：底部斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 0);

  slam('#sideL', 0.10, -28, -28, 0.24);
  shadowBounce('#sideL', 0.34);
  slam('#sideR', 0.22,  28, -28, 0.24);
  shadowBounce('#sideR', 0.46);

  slam('#lineA', 0.46, -28, -28, 0.26);
  slam('#lineB', 0.62, -28, -28, 0.26);

  /* 大面积色块用 power3.out + from:.86：面积单调涨到末帧，
     settle 取的「面积最大」那一帧必然是成品帧（blocks.js 对 back.out 的警告）。 */
  tl.fromTo('#slotA', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, 0.86);

  /* 模 8 色块闪切 + 模 10 硬停：换词 1 帧完成，不做交叉淡入、不做滚动 */
  var SWAP = 1.66;
  tl.set('#slotB', { opacity: 1, immediateRender: false }, SWAP);
  tl.set('#slotA', { opacity: 0, immediateRender: false }, SWAP);
  tl.fromTo('#slotB', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, SWAP);

  slam('#footrow', 2.02, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.26, ease: 'power4.out' }, 2.14);
  slam('#note',    2.28, 0, -16, 0.22);

  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.42);

  var introEnd = 3.62;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
