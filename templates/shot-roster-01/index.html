<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "counterLabel", "type": "string", "label": "计数说明", "default": "条素材已积累"}, {"id": "card1", "type": "string", "label": "卡1", "default": "爆款标题库 v3"}, {"id": "card2", "type": "string", "label": "卡2", "default": "口播文案 12 篇"}, {"id": "card3", "type": "string", "label": "卡3", "default": "封面图 36 张"}, {"id": "card4", "type": "string", "label": "卡4", "default": "配音片段 8 条"}, {"id": "card5", "type": "string", "label": "卡5", "default": "成片预设 5 套"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

    <style>
@font-face{font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;src:local('MiSans');font-weight:100 1000;font-display:swap}
@font-face{font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;src:local('MEBHeiHeiTi');font-weight:100 1000;font-display:swap}
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif; }
.num{ font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; }

#cnt{ position:absolute; left:0; right:0; top:110px; text-align:center; font-size:44px; color:var(--fg); opacity:0; }
#cnt b{ color:var(--accent); font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-size:56px; margin-right:14px; }
#stack{ position:absolute; left:600px; top:180px; width:720px; height:820px; }
.sc{ position:absolute; left:0; width:720px; height:140px; border-radius:18px; background:#17171F;
  border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; padding:0 36px; font-size:30px;
  color:rgba(255,255,255,.85); opacity:0; box-shadow:0 32px 64px rgba(0,0,0,.5); }
.sc .hl{ position:absolute; left:36px; top:72%; width:0%; height:34%; max-height:20px; background:var(--accent); opacity:.35; border-radius:6px; }
#glaze{ position:absolute; top:0; bottom:0; width:420px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:rotate(14deg); mix-blend-mode:overlay; left:-700px; }
#glz{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
<div id="cnt"><b id="cn">0</b><span id="cl"></span></div><div id="stack"><div class="sc" id="c1"><div class="hl"></div><span class="ct"></span></div><div class="sc" id="c2"><div class="hl"></div><span class="ct"></span></div><div class="sc" id="c3"><div class="hl"></div><span class="ct"></span></div><div class="sc" id="c4"><div class="hl"></div><span class="ct"></span></div><div class="sc" id="c5"><div class="hl"></div><span class="ct"></span></div></div><div id="glz"><div id="glaze"></div></div>
    </div>
    <script>
      const FB = {"counterLabel": "条素材已积累", "card1": "爆款标题库 v3", "card2": "口播文案 12 篇", "card3": "封面图 36 张", "card4": "配音片段 8 条", "card5": "成片预设 5 套", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#cl').textContent=v.counterLabel||'';
for(let i=1;i<=5;i++) $('#c'+i+' .ct').textContent=v['card'+i]||'';
// 预备拍：计数器先亮起归零微缩
tl.fromTo('#cnt',{opacity:0,scale:.96},{opacity:1,scale:1,duration:F(6)},F(12));
const CUES=[18,30,42,54,66];
CUES.forEach((cue,idx)=>{
  const i=idx+1, finalY=640-idx*96, tilt=i%2?2:-2;
  const c=$('#c'+i);
  tl.set(c,{top:finalY+'px'},F(cue));
  tl.fromTo(c,{opacity:0,y:600,rotation:tilt,scale:1.06},
    {opacity:1,y:0,rotation:0,scale:1,duration:F(22),ease:'power3.out'},F(cue));
  tl.to(c,{boxShadow:'0 2px 8px rgba(0,0,0,.5)',duration:F(6)},F(cue+16));
  // 落地压弹整摞 6px / 8f（预备拍已过的后续卡才压）
  if(i>1){ tl.to('#stack',{y:6,duration:F(4),yoyo:true,repeat:1,ease:'sine.inOut'},F(cue+18)); }
  // 计数同步跳格
  tl.call(((n)=>()=>{$('#cn').textContent=n;})(i),[],F(cue+20));
  tl.fromTo('#cn',{scale:1.25},{scale:1,duration:F(6)},F(cue+20));
  // 高亮条滞后 3f 长出（40% 宽）
  tl.to('#c'+i+' .hl',{width:'40%',opacity:.35,duration:F(7),ease:'power2.out'},F(cue+25));
});
// glaze 扫光整摞一次
tl.fromTo('#glaze',{left:'-700px'},{left:'2600px',duration:F(14),ease:'power1.inOut'},F(82));
tl.to({},{duration:F(24)},F(96));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
