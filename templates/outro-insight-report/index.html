/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="top"><span class="dot" id="dot"></span><span class="top-txt">季度复盘 · 结论页</span></div>
        <h1 class="headline" id="headline">三件事说清 Q3</h1>
        <div class="metric">
          <div class="metric-block">
            <p class="metric-label" id="metricLabel">月活</p>
            <div style="display:flex;align-items:baseline;">
              <span class="metric-num" id="metricNum">0</span><span class="metric-unit">万</span>
            </div>
          </div>
          <span class="metric-delta" id="metricDelta">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 16l6-6 4 4 6-7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="metricDeltaTxt">+23.7%</span>
          </span>
        </div>
        <div class="next-row">
          <span class="next-tag" id="nextTag">NEXT</span>
          <span class="next-txt" id="nextTxt">下期拆解留存曲线</span>
        </div>
      </section>
    </div>
    <script>
      const fallback = { headline: "三件事说清 Q3", metricLabel: "月活", metricValue: 86.4, metricDelta: "+23.7%", next: "下期拆解留存曲线", accent: "#3D7BFF", background: "#0F1115", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      const root = document.getElementById("root");
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#0F1115");
      root.style.backgroundColor = v.background;
      root.style.setProperty("--accent", v.accent ?? "#3D7BFF");
      root.style.setProperty("--fg", v.foreground ?? "#F4EFE7");
      document.getElementById("headline").textContent = v.headline;
      document.getElementById("metricLabel").textContent = v.metricLabel;
      document.getElementById("metricDeltaTxt").textContent = v.metricDelta;
      document.getElementById("nextTxt").textContent = v.next;

      const target = Number(v.metricValue) || 0;
      const numEl = document.getElementById("metricNum");
      const counter = { n: 0 };
      function paintNum() { numEl.textContent = counter.n.toFixed(1); }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(".top", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.08);
      tl.fromTo(".headline", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.72, ease: "power4.out" }, 0.2);
      tl.fromTo(".metric", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.72);
      tl.to(counter, { n: target, duration: 1.35, ease: "power2.out", onUpdate: paintNum }, 0.8);
      tl.fromTo(".metric-delta", { opacity: 0, scale: 0.8, x: -20 },
        { opacity: 1, scale: 1, x: 0, duration: 0.5, ease: "back.out(2)" }, 1.62);
      tl.fromTo(".next-row", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.9);
      tl.fromTo("#dot", { scale: 0.2 }, { scale: 1, duration: 0.5, ease: "back.out(2.6)" }, 0.08);
      tl.to("#dot", { scale: 1.5, duration: 0.34, ease: "sine.inOut", yoyo: true, repeat: 5 }, 2.6);
      tl.to(".next-tag", { opacity: 0.45, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.8);
      tl.to(".scene", { opacity: 0, duration: 0.45, ease: "power2.in" }, 4.55);

      window.__timelines.main = tl;
    </script>
