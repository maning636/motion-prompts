<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"CONCLUSION / 报告结论"},
{"id":"rno","name":"报告编号","type":"string","label":"报告编号（mono pill）","default":"RPT-2026-07"},
{"id":"title","name":"报告名","type":"string","label":"报告名（一行，14–20 字）","default":"内容供给侧调研 · 第三期结论"},
{"id":"c1","name":"结论 1","type":"string","label":"第 1 条结论（一行，12–18 字）","default":"产量已经不是瓶颈，稳定更新才是"},
{"id":"c2","name":"结论 2","type":"string","label":"第 2 条结论","default":"选题重复三次以上才会形成记忆点"},
{"id":"c3","name":"结论 3","type":"string","label":"第 3 条结论","default":"能被记住的系列都有一句固定的口头禅"},
{"id":"org","name":"署名","type":"string","label":"署名机构（mono）","default":"内容观察室 · 2026.10"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"结论为原报告摘要 · 全文见报告页"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（编号块 + 斜纹带）","default":"#FFD429"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>报告结论卡 · 内容供给侧调研第三期结论</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整块换底色（基因 10）：ink 底 + white 字，反白是整块替换，不叠蒙版 */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-w{box-shadow:8px 8px 0 var(--white)}
  .sh-s{box-shadow:4px 4px 0 var(--white)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:44px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--accent);white-space:nowrap;flex:0 0 auto}
  .rno{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:8px 18px;border-radius:9999px;
    background:var(--white);color:var(--ink);border:var(--bw) solid var(--paper);
    box-shadow:4px 4px 0 var(--white)}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--paper)}

  /* 报告名：一行大字，压在顶栏下面 */
  .rname{flex:0 0 auto;padding:26px 88px 0}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .rt{display:block;white-space:nowrap;font-weight:900;font-size:96px;line-height:1.14;
    letter-spacing:0;color:var(--white);padding-right:24px}

  /* 三条结论：每条 = 编号方块 + 一行大字，行间用 3px 白实线分隔（基因 7） */
  .list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;padding:26px 88px 0}
  .item{display:flex;align-items:center;gap:30px;padding:22px 0;
    border-bottom:var(--bw) solid var(--paper)}
  .no{flex:0 0 auto;width:64px;height:64px;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--paper);border-radius:4px;box-shadow:4px 4px 0 var(--white);
    font-family:var(--mono);font-weight:900;font-size:26px}
  /* 中文结论：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .tx{display:block;white-space:nowrap;font-weight:900;font-size:68px;line-height:1.2;
    letter-spacing:0;color:var(--white);padding-right:20px}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:26px 88px 42px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--white);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .org{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;color:var(--accent)}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--paper)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--paper);
    border-bottom:var(--bw) solid var(--paper);
    background:repeating-linear-gradient(45deg,var(--paper) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">CONCLUSION / 报告结论</span>
    <span class="rno anim" id="rno" data-fit-max="22" data-fit-min="14">RPT-2026-07</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="rname anim" id="rnameBox">
    <div class="rt anim" id="title" data-fit-max="96" data-fit-min="46">内容供给侧调研 · 第三期结论</div>
  </div>

  <div class="list anim" id="list">
    <div class="item anim"><span class="no">01</span><span class="tx" id="c1" data-fit-max="68" data-fit-min="34">产量已经不是瓶颈，稳定更新才是</span></div>
    <div class="item anim"><span class="no">02</span><span class="tx" id="c2" data-fit-max="68" data-fit-min="34">选题重复三次以上才会形成记忆点</span></div>
    <div class="item anim"><span class="no">03</span><span class="tx" id="c3" data-fit-max="68" data-fit-min="34">能被记住的系列都有一句固定的口头禅</span></div>
  </div>

  <div class="foot anim" id="foot">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">结论为原报告摘要 · 全文见报告页</span>
    <span class="rule anim" id="ruleBot"></span>
    <span class="org anim" id="org" data-fit-max="22" data-fit-min="14">内容观察室 · 2026.10</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'rno', 'title', 'c1', 'c2', 'c3', 'note', 'org']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#rnameBox',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#list',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.3);
    tl.fromTo('#foot',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.46);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.6);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var WHITE = '#FFFFFF';

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#rno', 0.14, 28, -28, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.14);
  slam('#rnameBox', 0.28,   0, -24, 0.28);
  slam('#title',    0.40, -40, -40, 0.28);

  /* 三条结论逐条自左撞入，每条落定后编号块阴影压 2 帧再弹回（模 1 拍进来） */
  var items = document.querySelectorAll('#list .item');
  var txes = ['#c1', '#c2', '#c3'];
  for (var i = 0; i < items.length; i++) {
    var at = 0.82 + i * 0.22;
    tl.fromTo(items[i], { x: -70 }, { x: 0, duration: 0.26, ease: 'power4.out' }, at);
    tl.fromTo(txes[i], { y: -20 }, { y: 0, duration: 0.22, ease: 'power4.out' }, at + 0.06);
    var no = items[i].querySelector('.no');
    tl.set(no, { boxShadow: '4px 7px 0 ' + WHITE, immediateRender: false }, at + 0.26);
    tl.to(no, { boxShadow: '4px 4px 0 ' + WHITE, duration: 0.04, ease: 'steps(2)' }, at + 0.30);
  }

  slam('#foot', 1.86, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.98);
  slam('#note', 2.12, 0, -16, 0.22);
  slam('#org',  2.24, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.38);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.72);

  var introEnd = 3.72;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
