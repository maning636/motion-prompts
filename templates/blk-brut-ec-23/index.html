<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"PICK / 规格选择"},{"id":"title","name":"主标题","type":"string","label":"主标题（黑条上的一行 900 白字）","default":"先选颜色，再选尺码"},{"id":"g1Label","name":"第一组标签","type":"string","label":"第一组标签（颜色）","default":"颜色 / COLOR"},{"id":"c1","name":"颜色 1","type":"string","label":"第一个颜色","default":"燕麦白"},{"id":"c2","name":"颜色 2","type":"string","label":"第二个颜色","default":"雾霾蓝"},{"id":"c3","name":"颜色 3","type":"string","label":"第三个颜色","default":"墨绿"},{"id":"c4","name":"颜色 4","type":"string","label":"第四个颜色","default":"砖红"},{"id":"g2Label","name":"第二组标签","type":"string","label":"第二组标签（尺码）","default":"尺码 / SIZE"},{"id":"s1","name":"尺码 1","type":"string","label":"第一个尺码","default":"S"},{"id":"s2","name":"尺码 2","type":"string","label":"第二个尺码","default":"M"},{"id":"s3","name":"尺码 3","type":"string","label":"第三个尺码","default":"L"},{"id":"s4","name":"尺码 4","type":"string","label":"第四个尺码","default":"XL"},{"id":"s5","name":"尺码 5","type":"string","label":"第五个尺码","default":"2XL"},{"id":"selColor","name":"选中颜色","type":"string","label":"当前选中的颜色（须与上面的颜色之一同名）","default":"雾霾蓝"},{"id":"selSize","name":"选中尺码","type":"string","label":"当前选中的尺码（须与上面的尺码之一同名）","default":"L"},{"id":"note","name":"口径说明","type":"string","label":"口径说明（一行 mono）","default":"口径：色差以实物为准 · 建议按胸围选大一码"},{"id":"accent","name":"强调色","type":"color","label":"强调色（选中格 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="规格宫格构图：上下两组选择器，上组四枚颜色方格、下组五枚尺码方格，选中项整块换强调色并挂一枚对勾角标">
<title>规格选择宫格 · 先选颜色，再选尺码</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 72px;height:74px;
    background:var(--ink);color:var(--white)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:38px;font-weight:900;letter-spacing:0;text-align:right}

  /* 两组选择器：标签行 + 方格行，组间 3px 实线 */
  .grp{flex:1 1 0;min-height:0;display:flex;flex-direction:column;
    padding:24px 72px 0;border-bottom:var(--bw) solid var(--ink)}
  .grp .lb{flex:0 0 auto;display:flex;align-items:center;gap:20px;padding-bottom:18px}
  .grp .lb .k{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--mute)}
  .grp .lb .line{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .cells{flex:1 1 auto;min-height:0;display:flex;gap:26px;padding-bottom:24px}
  /* 方格：正方 + 3px 黑边 + 4px 直角；选中项整块换强调色 */
  .cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;position:relative;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:6px 6px 0 var(--ink);overflow:hidden}
  .cell .t{display:block;white-space:nowrap;font-weight:900;font-size:44px;
    letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    text-align:center;padding:0 16px}
  .cell .k{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.12em;color:var(--mute);max-width:100%;overflow:hidden;
    text-overflow:ellipsis;padding:0 16px}
  .cell.on{background:var(--accent);box-shadow:10px 10px 0 var(--ink)}
  .cell.on .k{color:var(--ink)}
  /* 对勾角标：ink 底方块，压在格子右上角 */
  .cell .ck{position:absolute;right:0;top:0;width:60px;height:60px;
    display:flex;align-items:center;justify-content:center;background:var(--ink);
    color:var(--accent);border-left:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);border-radius:0 0 0 4px;
    font-family:var(--mono);font-weight:900;font-size:32px;line-height:1;display:none}
  .cell.on .ck{display:flex}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:22px 72px 28px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="tag">PICK</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">PICK / 规格选择</span>
    <span class="tt anim" id="title" data-fit-max="38" data-fit-min="20">先选颜色，再选尺码</span>
  </div>

  <div class="grp anim" id="grp1">
    <div class="lb anim" id="lb1">
      <span class="k anim" id="g1Label" data-fit-max="26" data-fit-min="16">颜色 / COLOR</span>
      <span class="line"></span>
    </div>
    <div class="cells anim" id="cells1">
      <div class="cell anim" id="c1"><span class="t" id="c1t">燕麦白</span><span class="k">C01</span><span class="ck">✓</span></div>
      <div class="cell anim" id="c2"><span class="t" id="c2t">雾霾蓝</span><span class="k">C02</span><span class="ck">✓</span></div>
      <div class="cell anim" id="c3"><span class="t" id="c3t">墨绿</span><span class="k">C03</span><span class="ck">✓</span></div>
      <div class="cell anim" id="c4"><span class="t" id="c4t">砖红</span><span class="k">C04</span><span class="ck">✓</span></div>
    </div>
  </div>

  <div class="grp anim" id="grp2">
    <div class="lb anim" id="lb2">
      <span class="k anim" id="g2Label" data-fit-max="26" data-fit-min="16">尺码 / SIZE</span>
      <span class="line"></span>
    </div>
    <div class="cells anim" id="cells2">
      <div class="cell anim" id="s1"><span class="t" id="s1t">S</span><span class="k">165/88A</span><span class="ck">✓</span></div>
      <div class="cell anim" id="s2"><span class="t" id="s2t">M</span><span class="k">170/94A</span><span class="ck">✓</span></div>
      <div class="cell anim" id="s3"><span class="t" id="s3t">L</span><span class="k">176/100A</span><span class="ck">✓</span></div>
      <div class="cell anim" id="s4"><span class="t" id="s4t">XL</span><span class="k">182/106A</span><span class="ck">✓</span></div>
      <div class="cell anim" id="s5"><span class="t" id="s5t">2XL</span><span class="k">188/112A</span><span class="ck">✓</span></div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：色差以实物为准 · 建议按胸围选大一码</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'g1Label', 'g2Label',
   'c1t', 'c2t', 'c3t', 'c4t', 's1t', 's2t', 's3t', 's4t', 's5t', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 选中态由「选中项」变量与格内文案比对得出，不允许单独再加一个高亮开关变量 */
  function mark(group, want, ids) {
    var hit = null;
    ids.forEach(function (pair, i) {
      var cell = document.getElementById(pair[0]);
      var txt = document.getElementById(pair[1]);
      var on = want != null && want !== '' && txt && txt.textContent === want;
      if (on) { hit = cell; cell.className = 'cell on'; }
      else if (cell) { cell.className = 'cell'; }
      return i;
    });
    return hit;
  }
  var hitColor = mark('1', v.selColor,
      [['c1', 'c1t'], ['c2', 'c2t'], ['c3', 'c3t'], ['c4', 'c4t']]);
  var hitSize = mark('2', v.selSize,
      [['s1', 's1t'], ['s2', 's2t'], ['s3', 's3t'], ['s4', 's4t'], ['s5', 's5t']]);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#grp1', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .14);
    tl.fromTo('#grp2', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .32);
    tl.fromTo('#foot', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .5);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .64);
    B.hold(tl, 1.4, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd',      0.00,   0, -74, 0.26);
  slam('#eyebrow', 0.14, -24, -20, 0.22);
  slam('#title',   0.20,  24, -20, 0.24);
  slam('#grp1',    0.36,   0, -28, 0.26);
  slam('#g1Label', 0.50, -24, -18, 0.2);
  /* 模 2 硬着陆：颜色格自下逐格落位，纯位移，opacity 恒为 1 */
  tl.from('#cells1 .cell', { y: 44, duration: .26, ease: 'power4.out', stagger: .09 }, 0.60);
  slam('#grp2',    1.06,   0, -28, 0.26);
  slam('#g2Label', 1.20, -24, -18, 0.2);
  tl.from('#cells2 .cell', { y: 44, duration: .26, ease: 'power4.out', stagger: .08 }, 1.30);
  /* 选中项落定后阴影在 6px / 10px 两档间 steps 跳一次（模 9） */
  if (hitColor) {
    tl.to(hitColor, { boxShadow: '6px 6px 0 ' + INK, duration: .06, ease: 'steps(2)' }, 1.18);
    tl.to(hitColor, { boxShadow: '10px 10px 0 ' + INK, duration: .06, ease: 'steps(2)' }, 1.24);
  }
  if (hitSize) {
    tl.to(hitSize, { boxShadow: '6px 6px 0 ' + INK, duration: .06, ease: 'steps(2)' }, 1.78);
    tl.to(hitSize, { boxShadow: '10px 10px 0 ' + INK, duration: .06, ease: 'steps(2)' }, 1.84);
  }
  slam('#foot',    1.94,   0,  28, 0.26);
  slam('#note',    2.06, -24, -20, 0.22);
  slam('#stripe',  2.16,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.1, ease: 'none' }, 2.40);

  var introEnd = 3.50;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
