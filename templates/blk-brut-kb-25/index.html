<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"FOLLOW / 关注引导"},
{"id":"t1","name":"大字上","type":"string","label":"大字第一行（5–9 字）","default":"觉得有用，"},
{"id":"t2","name":"大字下","type":"string","label":"大字第二行（5–9 字）","default":"就顺手关注一下"},
{"id":"act1","name":"动作 1","type":"string","label":"动作胶囊 1（2–4 字）","default":"点赞"},
{"id":"act2","name":"动作胶囊 2","type":"string","label":"动作胶囊 2","default":"收藏"},
{"id":"act3","name":"动作胶囊 3","type":"string","label":"动作胶囊 3","default":"关注"},
{"id":"handle","name":"账号","type":"string","label":"账号名（mono）","default":"@积木社BLOCKBRUT"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"每周二更新 · 不发广告"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（动作胶囊 + 斜纹带）","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>结尾关注引导卡 · 觉得有用，就顺手关注一下</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-l{box-shadow:8px 8px 0 var(--ink)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}

  .main{flex:1 1 auto;min-height:0;display:flex;align-items:center;
    gap:72px;padding:30px 88px 0}
  .lbox{flex:1 1 auto;min-width:0}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .tl{display:block;white-space:nowrap;font-weight:900;font-size:118px;line-height:1.16;
    letter-spacing:0;padding-right:20px}
  .acts{display:flex;align-items:center;gap:20px;margin-top:38px}
  /* 动作胶囊：一排贴纸只允许一个裸字符重音，这里不放裸字符，三个都是胶囊 */
  .act{display:inline-block;font-size:30px;font-weight:700;padding:11px 26px;
    border-radius:9999px;white-space:nowrap;background:var(--white);color:var(--ink);
    border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
  .act.g{background:var(--accent)}

  /* 二维码位：纯 div 拼的方格位，不引图表/图片库，也不引生成库 */
  .rbox{flex:0 0 380px;display:flex;flex-direction:column;align-items:center;gap:20px}
  .qr{width:380px;height:380px;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);padding:22px;
    display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);
    gap:6px}
  .qr i{display:block;background:var(--paper)}
  .qr i.on{background:var(--ink)}
  .handle{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.06em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:32px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">FOLLOW / 关注引导</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="main anim" id="main">
    <div class="lbox anim" id="lbox">
      <div class="tl anim" id="t1" data-fit-max="118" data-fit-min="58">觉得有用，</div>
      <div class="tl anim" id="t2" data-fit-max="118" data-fit-min="58">就顺手关注一下</div>
      <div class="acts anim" id="acts">
        <span class="act anim" id="act1" data-fit-max="30" data-fit-min="15">点赞</span>
        <span class="act anim" id="act2" data-fit-max="30" data-fit-min="15">收藏</span>
        <span class="act g anim" id="act3" data-fit-max="30" data-fit-min="15">关注</span>
      </div>
    </div>
    <div class="rbox anim" id="rbox">
      <div class="qr anim" id="qr"></div>
      <span class="handle anim" id="handle" data-fit-max="24" data-fit-min="14">@积木社BLOCKBRUT</span>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">每周二更新 · 不发广告</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 't1', 't2', 'act1', 'act2', 'act3', 'handle', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 二维码位：纯 div 拼的方格。图案由行列坐标算出来，**不用 Math.random**——
     渲染器可能乱序刷帧，随机图案每次重渲都不一样，预览就不可信了。 */
  var qr = document.getElementById('qr');
  if (qr) {
    var html = '';
    for (var r = 0; r < 7; r++) {
      for (var c = 0; c < 7; c++) {
        var on = false;
        var corner = [[0, 0], [0, 4], [4, 0]];
        for (var k = 0; k < corner.length; k++) {
          var dr = r - corner[k][0], dc = c - corner[k][1];
          if (dr >= 0 && dr < 3 && dc >= 0 && dc < 3) {
            on = (dr === 0 || dc === 0 || dr === 2 || dc === 2 || (dr === 1 && dc === 1));
          }
        }
        if (!on) on = ((r * 3 + c * 5 + r * c) % 4 === 0);
        html += '<i class="' + (on ? 'on' : '') + '"></i>';
      }
    }
    qr.innerHTML = html;
  }
  var cells = qr ? qr.querySelectorAll('i') : [];

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：二维码格直接落终态，不做逐格点亮 */
    gsap.set(cells, { scaleX: 1, opacity: 1 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#main',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);

  slam('#main', 0.20,   0, -24, 0.28);
  slam('#t1',   0.34, -40, -40, 0.26);
  slam('#t2',   0.50, -40, -40, 0.26);
  slam('#acts', 0.70,   0, -20, 0.26);
  slam('#act1', 0.80, -28, -28, 0.24);
  slam('#act2', 0.90, -28, -28, 0.24);
  slam('#act3', 1.00, -28, -28, 0.24);

  slam('#rbox', 0.78, 40, -24, 0.28);
  /* 模 7 分格揭示：二维码位整块从右逐格推出 */
  tl.fromTo('#qr', { clipPath: 'inset(0 0 0 100%)' },
    { clipPath: 'inset(0 0 0 0%)', duration: 0.36, ease: 'steps(8)' }, 0.94);
  slam('#handle', 1.30, 0, -16, 0.22);

  slam('#footrow', 1.58, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.70);
  slam('#note',     1.84, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.98);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.32);

  var introEnd = 3.32;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
