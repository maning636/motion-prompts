<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"RESULT / 成果"},{"id":"num","name":"大数字","type":"number","label":"大数字（mono 整数跳变）","default":128},{"id":"lab","name":"数字说明","type":"string","label":"数字下方说明（中文，用 sans）","default":"个品牌换上了这套骨架"},{"id":"title","name":"主标题","type":"string","label":"主标题（一行）","default":"同一个团队，交付周期砍掉一半"},{"id":"sub","name":"副标题","type":"string","label":"副标题（一行短句）","default":"数字不说谎，过程才敢复用"},{"id":"accent","name":"强调色","type":"color","label":"强调色（黄/粉/绿/蓝）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>数据跳数 · 同一个团队，交付周期砍掉一半</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0
     （风格规范 §8 交付骨架自己就把眉标写成 26px = 13×2），即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-l{box-shadow:8px 8px 0 var(--ink)}
  .sh-xl{box-shadow:10px 10px 0 var(--ink)}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--ink);color:var(--white);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--yellow);color:var(--ink);padding:3px 14px;border-radius:9999px}
  .promo .parw{color:var(--yellow);font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    padding:52px 88px 56px}

  .eyebrow{display:block;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px;white-space:nowrap;
    min-width:0;overflow:hidden;text-overflow:ellipsis}

  /* 中文大字：一行一块、nowrap，交给 B.fit() 按容器实测缩放，绝不写死 font-size。
     字距取 0——中文收紧会粘连（iart 拆解 §7.9 明确要求推翻负字距）。 */
  .tline{display:block;white-space:nowrap;font-weight:900;font-size:96px;line-height:1.1;
    letter-spacing:0}
  .rule{flex:0 0 auto;width:100%;margin:30px 0 0;border-top:var(--bw) solid var(--ink)}

  .row{flex:0 0 auto;margin-top:auto;display:flex;align-items:center;gap:64px}

  /* 大数据卡：数字压在实色块上、近黑字（黄/粉/绿/蓝四个强调色上都过对比） */
  .stat{flex:0 0 880px;background:var(--accent);color:var(--ink);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);padding:44px 44px 40px}
  /* .num 必须是块级，B.fit() 才量得到真实文字宽度；父级 .numrow 是纯块，
     clientWidth 正好等于卡片内容宽，缩放判断不掺水。 */
  .numrow{display:block}
  .num{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:152px;line-height:1.02;letter-spacing:0}
  .digits{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .num .px{font-size:48px;margin-left:10px}
  .lab{display:block;margin-top:16px;font-size:34px;font-weight:700;line-height:1.4;
    letter-spacing:0}

  .side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
  .sub{display:block;white-space:nowrap;font-size:34px;font-weight:700;line-height:1.5;
    letter-spacing:0}
  .note{display:block;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.12em;color:var(--mute);white-space:nowrap;min-width:0;
    overflow:hidden;text-overflow:ellipsis}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:22px 88px;background:var(--ink);color:var(--white)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow)}
  .foot .fc{font-size:26px;font-weight:700;letter-spacing:0}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="promo anim" id="promo">
    <span class="ptag">RESULT</span><span class="ptx">成果展示开场 · 整数跳变 + 主标题</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">RESULT / 成果</span>
    <div class="tline anim" id="title" data-fit-max="96" data-fit-min="44">同一个团队，交付周期砍掉一半</div>
    <div class="rule anim" id="rule"></div>

    <div class="row">
      <div class="stat anim" id="stat">
        <div class="numrow"><div class="num anim" id="num" data-fit-max="152" data-fit-min="72"><span class="digits" id="digits">128</span><span class="px">+</span></div></div>
        <div class="lab anim" id="lab" data-fit-max="34" data-fit-min="18">个品牌换上了这套骨架</div>
      </div>
      <div class="side">
        <div class="sub anim" id="sub" data-fit-max="34" data-fit-min="18">数字不说谎，过程才敢复用</div>
        <div class="note anim" id="note" data-fit-max="22" data-fit-min="14">单位：个 · 统计口径 2026</div>
      </div>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>

  <div class="foot anim" id="foot">
    <span class="fm">COUNT / 2026</span><span class="fc">积木社 · 数据不说谎</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'lab', 'title', 'sub'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var target = Number(v.num);
  if (!isFinite(target)) target = 0;
  target = Math.round(target);
  var digits = document.getElementById('digits');

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级分支必须给完整成品画面：大数字直接落终值，不做跳变 */
    digits.textContent = String(target);
    tl.fromTo('.promo', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('.main',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.15);
    tl.fromTo('.stripe', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.35);
    tl.fromTo('.foot',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  /* 模 4 数字跳变：steps(22) 让数字以整数跳，不做小数滚动；字始终 mono。
     写进独立的 .digits 节点而不是 textContent —— 后者会把同级的「+」一起抹掉。
     表格数字（tabular-nums）保证位宽不变，settle 才不会被抖动骗到中途帧。 */
  digits.textContent = '0';
  var counter = { v: 0 };
  tl.to(counter, {
    v: target, duration: 1.2, ease: 'steps(22)',
    onUpdate: function () { digits.textContent = String(Math.round(counter.v)); },
    onComplete: function () { digits.textContent = String(target); }
  }, 0.82);

  slam('#promo',   0.00,   0, -56, 0.26);
  slam('#eyebrow', 0.14,   0, -20, 0.22);
  slam('#title',   0.30, -28, -28, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.26, ease: 'power4.out' }, 0.56);
  slam('#stat',    0.70, -28, -28, 0.26);
  /* 模 9 阴影档位脉冲：数字停稳的瞬间换一次档再换回来，只在档位间 steps 跳 */
  tl.to('#stat', { boxShadow: '10px 10px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 2.02);
  tl.to('#stat', { boxShadow: '8px 8px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 2.08);
  slam('#lab',     2.18,   0, -20, 0.22);
  slam('#sub',     2.22,   0, -20, 0.24);
  slam('#note',    2.28,   0, -20, 0.22);
  slam('#foot',    2.40,   0,  24, 0.26);
  /* 模 6：条纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.50);

  var introEnd = 3.70;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
