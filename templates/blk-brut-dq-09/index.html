<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"COMMENT / 评论区"},
{"id":"name","name":"用户名","type":"string","label":"评论者昵称（中文 / 英文，2–10 字）","default":"镜头前的leman"},
{"id":"time","name":"时间","type":"string","label":"评论时间（mono）","default":"2 小时前 · 来自 iPhone"},
{"id":"text","name":"评论正文","type":"string","label":"评论正文（18–34 字）","default":"看了 12 期才发现我一直是在给句子配画面，顺序反了"},
{"id":"likes","name":"点赞数","type":"string","label":"点赞数（mono）","default":"2.4k"},
{"id":"reply","name":"作者回复","type":"string","label":"作者回复（12–24 字）","default":"这条我会单独做一期讲顺序问题"},
{"id":"tag1","name":"标签 1","type":"string","label":"底部标签 1（mono）","default":"TOP COMMENT"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"已获授权展示 · 内容未做删改"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（点赞胶囊 + 斜纹带）","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>评论区引用 · 看了 12 期才发现我一直是在给句子配画面</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-l{box-shadow:8px 8px 0 var(--ink)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  /* 评论区计数：ink 底方块，深底上阴影换白（规则 B） */
  .cnt{flex:0 0 auto;background:var(--ink);color:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:4px 4px 0 var(--ink);padding:7px 20px;
    font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    white-space:nowrap}

  .body{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:30px 88px 0}

  /* 主评论条：白底方块压纸底 —— 文字必须坐在自己的衬底上（iart §7 lower-thirds 纪律） */
  .cmt{flex:1 1 auto;min-width:0;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);padding:38px 44px 32px;
    display:flex;gap:32px;align-items:flex-start}
  /* 头像：72×72 方块，只有 4px 圆角（基因 3） */
  .av{flex:0 0 auto;width:72px;height:72px;display:flex;align-items:center;
    justify-content:center;background:var(--blue);color:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    font-size:32px;font-weight:900}
  .cmain{flex:1 1 auto;min-width:0}
  .crow{display:flex;align-items:baseline;gap:20px}
  .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:32px;font-weight:900;letter-spacing:0;flex:1 1 auto;min-width:0}
  .tm{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.08em;color:var(--mute)}
  /* 中文评论用 sans（基因 9），900 字重 + 46px */
  .tx{display:block;margin-top:20px;white-space:nowrap;font-size:46px;font-weight:900;
    line-height:1.34;letter-spacing:0;padding-right:16px}
  .cfoot{display:flex;align-items:center;gap:18px;margin-top:26px;padding-top:22px;
    border-top:var(--bw) solid var(--ink)}
  .likes{display:inline-block;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.08em;padding:8px 20px;border-radius:9999px;white-space:nowrap;
    background:var(--accent);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--ink)}
  .reply{display:inline-block;font-size:26px;font-weight:700;padding:8px 20px;
    border-radius:9999px;white-space:nowrap;background:var(--paper);color:var(--ink);
    border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
  .tag{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;white-space:nowrap;color:var(--mute)}

  /* 作者回复块：ink 底 + white 字，整块换底不叠蒙版（基因 10） */
  .ans{flex:0 0 auto;background:var(--ink);color:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);padding:28px 32px;
    display:flex;flex-direction:column;gap:14px}
  .alab{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--accent);white-space:nowrap}
  .atx{font-size:32px;font-weight:700;line-height:1.36;letter-spacing:0;color:var(--white);
    white-space:nowrap}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">COMMENT / 评论区</span>
    <span class="rule anim" id="ruleTop"></span>
    <span class="cnt anim" id="cnt">1,284 条</span>
  </div>

  <div class="body anim" id="body">
    <div class="cmt anim" id="cmt">
      <div class="av anim" id="av">镜</div>
      <div class="cmain anim" id="cmain">
        <div class="crow anim" id="crow">
          <span class="nm anim" id="name" data-fit-max="32" data-fit-min="16">镜头前的leman</span>
          <span class="tm anim" id="time" data-fit-max="22" data-fit-min="14">2 小时前 · 来自 iPhone</span>
        </div>
        <div class="tx anim" id="text" data-fit-max="46" data-fit-min="22">看了 12 期才发现我一直是在给句子配画面，顺序反了</div>
        <div class="cfoot anim" id="cfoot">
          <span class="likes anim" id="likes" data-fit-max="22" data-fit-min="14">2.4k</span>
          <span class="reply anim" id="reply" data-fit-max="26" data-fit-min="13">这条我会单独做一期讲顺序问题</span>
          <span class="tag anim" id="tag1" data-fit-max="22" data-fit-min="14">TOP COMMENT</span>
        </div>
      </div>
    </div>
    <div class="ans anim" id="ansBox">
      <span class="alab anim" id="ansLab">AUTHOR / 作者回复</span>
      <span class="atx anim" id="ansTx" data-fit-max="32" data-fit-min="16">已经加进下期选题</span>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">已获授权展示 · 内容未做删改</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'cnt', 'name', 'time', 'text', 'likes', 'reply', 'tag1', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#body',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';
  function press(sel, at) {
    tl.set(sel, { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);
  slam('#cnt', 0.16, 32, -28, 0.24);

  slam('#body', 0.24,   0, -24, 0.28);
  /* 大面积评论条：power3.out + from:.86，零过冲 */
  tl.fromTo('#cmt', { scale: 0.86 },
    { scale: 1, duration: 0.3, ease: 'power3.out' }, 0.36);
  tl.fromTo('#av', { scale: 0.86 },
    { scale: 1, duration: 0.24, ease: 'power3.out' }, 0.60);
  press('#av', 0.84);
  slam('#cmain', 0.60,   0, -20, 0.26);
  slam('#name',  0.72, -24, -20, 0.22);
  slam('#time',  0.80,  24, -20, 0.22);
  /* 评论正文遮罩揭示：父级限高，子级自上而下落到 0 */
  tl.fromTo('#text', { yPercent: 110 },
    { yPercent: 0, duration: 0.5, ease: 'power4.out' }, 0.92);
  slam('#cfoot', 1.34,   0, -18, 0.24);
  press('#likes', 1.58);
  press('#reply', 1.66);
  slam('#tag1', 1.80, 0, -16, 0.22);

  slam('#ansBox', 0.90, 40, -24, 0.28);
  slam('#ansLab', 1.06, 0, -16, 0.22);
  slam('#ansTx',  1.18, 0, -18, 0.24);

  slam('#footrow', 2.06, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.18);
  slam('#note',     2.34, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.48);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.82);

  var introEnd = 3.82;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
