<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="阶梯双档构图：两档左右并置，普通版矮一截白底、旗舰版抬高压强调色并带推荐角标，两档各列三行权益，底部长脚注">
<title>版本阶梯对比 · 两个版本，差价只在一处</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:26px;
    padding:36px 72px 28px;border-bottom:var(--bw) solid var(--ink)}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--mute)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:900;font-size:60px;letter-spacing:0}
  .hd .dl{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:12px 26px;background:var(--ink);color:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--accent);
    font-family:var(--mono);font-weight:900;font-size:34px;letter-spacing:.04em}

  /* 阶梯：两档底边对齐，右档整体抬高，错落就是价值差的可视化 */
  .ladder{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;
    gap:36px;padding:34px 72px 38px;overflow:hidden}
  .tier{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    border:var(--bw) solid var(--ink);border-radius:4px;overflow:hidden}
  .tierA{height:76%;background:var(--white);box-shadow:8px 8px 0 var(--ink)}
  .tierB{height:100%;background:var(--accent);color:var(--white);
    box-shadow:10px 10px 0 var(--ink);position:relative}
  .tier .hd2{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:18px;padding:18px 32px;border-bottom:var(--bw) solid var(--ink);
    font-size:38px;font-weight:900;letter-spacing:0;min-width:0}
  .tierA .hd2{background:var(--paper);color:var(--ink)}
  .tierB .hd2{background:var(--ink);color:var(--accent)}
  .tier .price{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;
    padding:22px 32px 26px}
  .tier .price .cur{font-family:var(--mono);font-weight:900;font-size:52px;line-height:1}
  .tier .price .n{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:132px;line-height:.94;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .tier .per{flex:0 0 auto;padding:0 32px 18px;font-size:26px;font-weight:700;
    letter-spacing:0;color:var(--mute);white-space:nowrap}
  .tierB .per{color:var(--white)}
  .tier .list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    border-top:var(--bw) solid var(--ink)}
  .tier .li{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:18px;
    padding:0 32px;border-bottom:var(--bw) solid var(--ink);min-width:0}
  .tier .li:last-child{border-bottom:0}
  .tier .li .sq{flex:0 0 auto;width:20px;height:20px;background:var(--ink);
    border-radius:4px}
  .tierB .li .sq{background:var(--white)}
  .tier .li .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:30px;font-weight:700;letter-spacing:0}
  .best{flex:0 0 auto;padding:8px 20px;background:var(--ink);color:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--white);
    font-family:var(--mono);font-weight:900;font-size:24px;letter-spacing:.08em;
    white-space:nowrap}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:22px 72px 28px;
    background:var(--ink);color:var(--white)}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--white);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eb anim" id="eyebrow" data-fit-max="26" data-fit-min="16">TIER / 版本对比</span>
    <span class="tt anim" id="title" data-fit-max="60" data-fit-min="32">两个版本，差价只在一处</span>
    <span class="dl anim" id="diff">差价 ¥100</span>
  </div>

  <div class="ladder anim" id="ladder">
    <div class="tier tierA anim" id="tierA">
      <div class="hd2"><span class="anim" id="basicLabel" data-fit-max="38" data-fit-min="20">普通版</span></div>
      <div class="price"><span class="cur">¥</span><span class="n anim" id="basicPrice" data-fit-max="132" data-fit-min="60">299</span></div>
      <span class="per anim">基础配置</span>
      <div class="list">
        <div class="li"><span class="sq"></span><span class="tx anim" id="basic1" data-fit-max="30" data-fit-min="17">基础面料</span></div>
        <div class="li"><span class="sq"></span><span class="tx anim" id="basic2" data-fit-max="30" data-fit-min="17">标准版包装</span></div>
        <div class="li"><span class="sq"></span><span class="tx anim" id="basic3" data-fit-max="30" data-fit-min="17">7 天无理由</span></div>
      </div>
    </div>

    <div class="tier tierB anim" id="tierB">
      <div class="hd2">
        <span class="anim" id="flagLabel" data-fit-max="38" data-fit-min="20">旗舰版</span>
        <span class="best anim" id="bestTag" data-fit-max="24" data-fit-min="14">推荐</span>
      </div>
      <div class="price"><span class="cur">¥</span><span class="n anim" id="flagPrice" data-fit-max="132" data-fit-min="60">399</span></div>
      <span class="per anim">升级配置</span>
      <div class="list">
        <div class="li"><span class="sq"></span><span class="tx anim" id="flag1" data-fit-max="30" data-fit-min="17">升级面料</span></div>
        <div class="li"><span class="sq"></span><span class="tx anim" id="flag2" data-fit-max="30" data-fit-min="17">礼盒包装 + 贺卡</span></div>
        <div class="li"><span class="sq"></span><span class="tx anim" id="flag3" data-fit-max="30" data-fit-min="17">30 天无忧换</span></div>
      </div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：两版同批次同色号 · 差价只含配置差不含溢价</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'basicLabel', 'flagLabel',
   'basic1', 'basic2', 'basic3', 'flag1', 'flag2', 'flag3', 'bestTag', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 差价由两个价算出，不允许手动再写一遍 */
  var a = Number(v.basicPrice), b = Number(v.flagPrice);
  if (!isFinite(a)) a = 0;
  if (!isFinite(b)) b = 0;
  var diff = Math.round(b - a);
  set('basicPrice', String(a));
  set('flagPrice', String(b));
  set('diff', (diff >= 0 ? '差价 ¥' : '差价 −¥') + Math.abs(diff));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#ladder', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F', WHT = '#FFFFFF';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at, sh) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + sh, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',      0.00,   0, -34, 0.24);
  slam('#eyebrow', 0.12, -24, -20, 0.22);
  slam('#title',   0.20, -28, -24, 0.26);
  slam('#diff',    0.28,  24, -20, 0.22);
  /* 两档从下方硬落位，旗舰版最后落、落得最重 */
  tl.fromTo('#tierA', { y: 90 }, { y: 0, duration: .3, ease: 'power4.out' }, 0.44);
  tl.fromTo('#tierB', { y: 120 }, { y: 0, duration: .3, ease: 'power4.out' }, 0.60);
  shadowBounce('#tierA', '8px 8px 0 ' + INK, 0.76);
  shadowBounce('#tierB', '10px 10px 0 ' + INK, 0.92);
  slam('#basicLabel', 0.82,    0, -22, 0.22);
  slam('#basicPrice', 0.92,    0, -26, 0.26);
  slam('#flagLabel',  1.00,    0, -22, 0.22);
  slam('#flagPrice',  1.10,    0, -26, 0.26);
  slam('#bestTag',    1.18,   24, -20, 0.22);
  tl.from('#tierA .li', { x: -40, duration: .22, ease: 'power4.out', stagger: .08 }, 1.10);
  tl.from('#tierB .li', { x: 40, duration: .22, ease: 'power4.out', stagger: .08 }, 1.26);
  slam('#foot',    1.62,   0,  28, 0.26);
  slam('#note',    1.74, -24, -20, 0.22);
  slam('#stripe',  1.84,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.08);

  var introEnd = 3.28;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
