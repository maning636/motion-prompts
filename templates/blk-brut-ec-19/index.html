<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"VERSUS / 同类对比"},{"id":"title","name":"主标题","type":"string","label":"主标题（黑条上的一行 900 白字）","default":"同样一件外套，差在哪三处"},{"id":"leftLabel","name":"左侧名","type":"string","label":"左侧 · 名称","default":"同类常见款"},{"id":"rightLabel","name":"右侧名","type":"string","label":"右侧 · 名称","default":"这一件"},{"id":"k1","name":"对比项 1","type":"string","label":"第一项名称","default":"面料克重"},{"id":"a1","name":"左侧值 1","type":"string","label":"左侧第一项值","default":"180 g"},{"id":"b1","name":"右侧值 1","type":"string","label":"右侧第一项值","default":"320 g"},{"id":"k2","name":"对比项 2","type":"string","label":"第二项名称","default":"缝制工艺"},{"id":"a2","name":"左侧值 2","type":"string","label":"左侧第二项值","default":"单线锁边"},{"id":"b2","name":"右侧值 2","type":"string","label":"右侧第二项值","default":"双线包缝"},{"id":"k3","name":"对比项 3","type":"string","label":"第三项名称","default":"色牢度测试"},{"id":"a3","name":"左侧值 3","type":"string","label":"左侧第三项值","default":"未检测"},{"id":"b3","name":"右侧值 3","type":"string","label":"右侧第三项值","default":"4 级不褪"},{"id":"note","name":"口径说明","type":"string","label":"底部口径说明（一行 mono）","default":"口径：同价位段同类目横评 · 数据取自同批检测报告"},{"id":"accent","name":"强调色","type":"color","label":"强调色（右侧色块 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":6},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="竖向对撞双栏：左右两栏各列三行对比项，中间一枚白色 VS 方块硬切在接缝上，右侧整栏压强调色并带一枚推荐角标">
<title>我们 vs 别家 · 同样一件外套，差在哪三处</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 72px;height:80px;
    background:var(--ink);color:var(--white)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:40px;font-weight:900;letter-spacing:0;text-align:right}

  /* 主体：两栏竖向对撞，中缝白色 VS 方块 */
  .duo{flex:1 1 auto;min-height:0;display:flex;position:relative;overflow:hidden}
  .side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    border-right:var(--bw) solid var(--ink);background:var(--white)}
  .side:last-of-type{border-right:0;background:var(--accent)}
  .side .nm{flex:0 0 auto;display:flex;align-items:center;padding:18px 32px;
    border-bottom:var(--bw) solid var(--ink);white-space:nowrap;
    font-size:36px;font-weight:900;letter-spacing:0;max-width:100%;overflow:hidden;
    text-overflow:ellipsis}
  .sideA .nm{background:var(--paper);color:var(--ink)}
  .sideB .nm{background:var(--ink);color:var(--accent)}
  .rows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .r{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:space-between;
    gap:20px;padding:0 32px;border-bottom:var(--bw) solid var(--ink);min-width:0}
  .r:last-child{border-bottom:0}
  .r .k{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:26px;font-weight:700;letter-spacing:0;color:var(--mute)}
  .r .v{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:44px;letter-spacing:0;max-width:60%;overflow:hidden;
    text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .sideA .r .v{color:var(--mute)}

  .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
    width:130px;height:130px;display:flex;align-items:center;justify-content:center;
    background:var(--white);color:var(--ink);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink);
    font-family:var(--mono);font-weight:900;font-size:42px;letter-spacing:.02em}
  .win{position:absolute;right:0;top:0;z-index:6;background:var(--ink);color:var(--accent);
    border:var(--bw) solid var(--ink);border-top:0;box-shadow:6px 6px 0 var(--accent);
    font-family:var(--mono);font-weight:900;font-size:24px;padding:10px 20px;
    border-radius:0 0 0 4px;letter-spacing:.08em}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:22px 72px;
    border-top:var(--bw) solid var(--ink)}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="tag">VS</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">VERSUS / 同类对比</span>
    <span class="tt anim" id="title" data-fit-max="40" data-fit-min="22">同样一件外套，差在哪三处</span>
  </div>

  <div class="duo anim" id="duo">
    <div class="side sideA anim" id="sideA">
      <div class="nm"><span id="leftLabel" data-fit-max="36" data-fit-min="19">同类常见款</span></div>
      <div class="rows">
        <div class="r"><span class="k" id="k1a" data-fit-max="26" data-fit-min="14">面料克重</span><span class="v" id="a1" data-fit-max="44" data-fit-min="22">180 g</span></div>
        <div class="r"><span class="k" id="k2a" data-fit-max="26" data-fit-min="14">缝制工艺</span><span class="v" id="a2" data-fit-max="44" data-fit-min="22">单线锁边</span></div>
        <div class="r"><span class="k" id="k3a" data-fit-max="26" data-fit-min="14">色牢度测试</span><span class="v" id="a3" data-fit-max="44" data-fit-min="22">未检测</span></div>
      </div>
    </div>

    <div class="side sideB anim" id="sideB">
      <div class="nm"><span id="rightLabel" data-fit-max="36" data-fit-min="19">这一件</span></div>
      <div class="rows">
        <div class="r"><span class="k" id="k1b" data-fit-max="26" data-fit-min="14">面料克重</span><span class="v" id="b1" data-fit-max="44" data-fit-min="22">320 g</span></div>
        <div class="r"><span class="k" id="k2b" data-fit-max="26" data-fit-min="14">缝制工艺</span><span class="v" id="b2" data-fit-max="44" data-fit-min="22">双线包缝</span></div>
        <div class="r"><span class="k" id="k3b" data-fit-max="26" data-fit-min="14">色牢度测试</span><span class="v" id="b3" data-fit-max="44" data-fit-min="22">4 级不褪</span></div>
      </div>
    </div>

    <div class="vs anim" id="vs">VS</div>
    <div class="win anim" id="win">推荐</div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：同价位段同类目横评 · 数据取自同批检测报告</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'leftLabel', 'rightLabel',
   'a1', 'a2', 'a3', 'b1', 'b2', 'b3', 'note']
    .forEach(function (k) { set(k, v[k]); });
  /* 对比项名称左右两列共用同一个变量，一扇多出同步写两列 */
  set('k1a', v.k1); set('k1b', v.k1);
  set('k2a', v.k2); set('k2b', v.k2);
  set('k3a', v.k3); set('k3b', v.k3);
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    gsap.set('#vs', { x: '-50%', y: '-50%' });
    tl.fromTo('#hd',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#duo',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',    0.00,   0, -80, 0.26);
  slam('#eyebrow',0.14, -24, -20, 0.22);
  slam('#title', 0.20,  24, -20, 0.24);
  /* 两栏从左右画外对向切入 */
  tl.fromTo('#sideA', { x: -140 }, { x: 0, duration: .3, ease: 'power4.out' }, 0.42);
  tl.fromTo('#sideB', { x: 140 },  { x: 0, duration: .3, ease: 'power4.out' }, 0.42);
  slam('#leftLabel',  0.72, -24, -20, 0.22);
  slam('#rightLabel', 0.76,  24, -20, 0.22);
  /* 模 2 硬着陆：三行对比项自各自方向切入，纯位移，opacity 恒为 1 */
  document.querySelectorAll('#sideA .r').forEach(function (r, i) {
    tl.from(r, { x: -46, duration: .22, ease: 'power4.out' }, 0.90 + i * 0.10);
  });
  document.querySelectorAll('#sideB .r').forEach(function (r, i) {
    tl.from(r, { x: 46, duration: .22, ease: 'power4.out' }, 0.90 + i * 0.10);
  });
  tl.fromTo('#vs', { scale: .86, opacity: 0 },
      { scale: 1, opacity: 1, duration: .28, ease: 'power3.out' }, 0.86);
  shadowBounce('#vs', '8px 8px 0 ' + INK, 1.16);
  slam('#win',     1.34,   0, -24, 0.24);
  slam('#foot',    1.46,   0,  28, 0.26);
  slam('#note',    1.58, -24, -20, 0.22);
  slam('#stripe',  1.68,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 1.92);

  var introEnd = 3.12;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
