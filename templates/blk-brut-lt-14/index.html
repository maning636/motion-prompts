<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"n1","name":"评论一署名","type":"string","label":"第一条评论署名（2–6 字）","default":"观众 0371"},{"id":"t1","name":"评论一","type":"string","label":"第一条评论（10–20 字）","default":"这句我昨天就收藏了，太实用"},{"id":"n2","name":"评论二署名","type":"string","label":"第二条评论署名","default":"观众 1284"},{"id":"t2","name":"评论二","type":"string","label":"第二条评论（10–20 字）","default":"已经按这个标准重做了一遍选题"},{"id":"n3","name":"评论三署名","type":"string","label":"第三条评论署名","default":"观众 5590"},{"id":"t3","name":"评论三","type":"string","label":"第三条评论（10–20 字）","default":"第三种方法我试了，交付快一半"},{"id":"accent","name":"强调色","type":"color","label":"强调色（头像方块底）","default":"#FF5FA2"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="弹幕贴：三条错开右端位置的评论块逐条自右拍入，头像方块换三种高饱和色，靠匀速反向微位移制造不断有话冒出来的读感">
<title>弹幕贴 · 观众留言</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 三条评论右端各不相同、宽度各不相同，排成一条不对齐的留言流 */
  .dm{position:absolute;height:112px;display:flex;align-items:stretch;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #d1{right:96px;bottom:560px;width:900px}
  #d2{right:150px;bottom:436px;width:846px}
  #d3{right:120px;bottom:312px;width:876px}

  /* 头像位：正方 + 3px 黑边 + 4px 直角，三块换三种高饱和色但形状完全一致 */
  .av{flex:0 0 106px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;border-right:var(--bw) solid var(--ink);background:var(--accent)}
  #d2 .av{background:var(--yellow)}
  #d3 .av{background:var(--blue)}
  .av b{display:block;font-family:var(--mono);font-weight:700;font-size:30px;line-height:1;
    letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden}
  .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;
    gap:6px;padding:0 26px}
  .tx .who{display:block;font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.08em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}
  .tx .msg{display:block;font-size:36px;font-weight:900;line-height:1.14;letter-spacing:0;
    color:var(--ink);white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div class="dm" id="d1">
    <div class="av"><b>0371</b></div>
    <div class="tx"><span class="who" id="n1" data-fit-max="21" data-fit-min="13">观众 0371</span><span class="msg" id="t1" data-fit-max="36" data-fit-min="20">这句我昨天就收藏了，太实用</span></div>
  </div>
  <div class="dm" id="d2">
    <div class="av"><b>1284</b></div>
    <div class="tx"><span class="who" id="n2" data-fit-max="21" data-fit-min="13">观众 1284</span><span class="msg" id="t2" data-fit-max="36" data-fit-min="20">已经按这个标准重做了一遍选题</span></div>
  </div>
  <div class="dm" id="d3">
    <div class="av"><b>5590</b></div>
    <div class="tx"><span class="who" id="n3" data-fit-max="21" data-fit-min="13">观众 5590</span><span class="msg" id="t3" data-fit-max="36" data-fit-min="20">第三种方法我试了，交付快一半</span></div>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['n1', 't1', 'n2', 't2', 'n3', 't3'].forEach(function (k) { set(k, v[k]); });
  /* 头像方块上的 mono 编号直接从署名里取数字派生，署名改了头像跟着改，不留第二个真源 */
  ['n1', 'n2', 'n3'].forEach(function (k) {
    var who = document.getElementById(k);
    if (!who || !who.parentElement) return;
    var av = who.parentElement.parentElement.querySelector('.av b');
    if (!av) return;
    var digits = String(who.textContent || '').replace(/\D/g, '');
    av.textContent = digits ? digits.slice(-4) : 'LIVE';
  });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉逐条拍入与错峰微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#d1', { x: 0, y: 0, opacity: 1 });
    gsap.set('#d2', { x: 0, y: 0, opacity: 1 });
    gsap.set('#d3', { x: 0, y: 0, opacity: 1 });
    gsap.set('#t1', { x: 0 });
    gsap.set('#t2', { x: 0 });
    gsap.set('#t3', { x: 0 });

    tl.fromTo('#d1', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#d2', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 7 · 分格擦出：三条评论依次自右分六格推出来，0.34s 一条，读成「话在往外冒」 */
  var ids = ['#d1', '#d3', '#d2'];
  var texts = ['#t1', '#t3', '#t2'];
  ids.forEach(function (sel, i) {
    var at = i * .34;
    tl.fromTo(sel, { clipPath: 'inset(0 0 0 100%)' },
        { clipPath: 'inset(0 0 0 0%)', duration: .32, ease: 'steps(6)' }, at)
      .fromTo(sel, { boxShadow: '8px 8px 0 ' + SH },
        { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<' + at)
      .to(sel, { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<' + at);
    tl.fromTo(texts[i], { x: 24 }, { x: 0, duration: .2, ease: 'power4.out' }, at + .2);
  });

  /* 模 8 · 色块闪切：三条头像底色按固定节奏换一次，读成状态灯在轮转 */
  var avs = ['#d1 .av', '#d2 .av', '#d3 .av'];
  tl.set(avs[0], { backgroundColor: '#FFD429', duration: 0 }, 1.6)
    .set(avs[1], { backgroundColor: '#FF5FA2', duration: 0 }, 1.6)
    .set(avs[2], { backgroundColor: '#2FD07A', duration: 0 }, 1.6)
    .set(avs[0], { backgroundColor: '#3D7BFF', duration: 0 }, 2.5)
    .set(avs[1], { backgroundColor: '#FFD429', duration: 0 }, 2.5)
    .set(avs[2], { backgroundColor: '#FF5FA2', duration: 0 }, 2.5);

  /* 三层错峰微位移：每条各走一段匀速往返，起步时间互不相同 */
  var T0 = 1.9;
  var REP = Math.max(1, Math.round((WIN - T0) / .8));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#d1', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#d3', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#d2', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
