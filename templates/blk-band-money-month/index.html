<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "REVENUE / 月度账"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "把收入拆开看才不慌"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：万元"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#3D7BFF"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>上下分带 · 把收入拆开看才不慌</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{flex-direction:column;gap:26px}
  .band{flex:0 0 300px;display:flex;gap:0;border:var(--bw) solid var(--ink);
        border-radius:4px;overflow:hidden;box-shadow:9px 9px 0 var(--ink)}
  .cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:12px;border-right:var(--bw) solid var(--ink);padding:0 12px}
  .cell:last-child{border-right:0}
  .cell .v{font-family:var(--mono);font-weight:700;font-size:104px;line-height:.86;
        letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cell .k{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.1em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .detail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  /* color:var(--ink) 不能省：#stage.on-ink 把整台文字设成纸色，
     .dr 只给 background:var(--white) 不给 color 时，纸色 #FFF6E5 印在
     #FFFFFF 上是 1.07:1 —— 明细行的标签和数值整行隐形。 */
  .dr{flex:1 1 0;display:flex;align-items:center;gap:22px;border:var(--bw) solid var(--ink);
        border-radius:4px;background:var(--white);color:var(--ink);padding:0 26px;min-height:0;
        box-shadow:5px 5px 0 var(--ink)}
  .dr .sw{flex:0 0 20px;height:20px;border:var(--bw) solid var(--ink)}
  .dr .k{font-weight:900;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dr .tk{flex:1 1 auto;height:16px;min-width:50px;position:relative;overflow:hidden;
        border:var(--bw) solid var(--ink);background:var(--paper)}
  .dr .tk i{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
  .dr .v{font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:-.03em;
        font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">REVENUE / 月度账</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">把收入拆开看才不慌</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：万元</div></div>
  <div class="body">
    <div class="band" id="band"><div class="cell" id="c0" style="background:var(--yellow);color:var(--ink)"><span class="v" id="bv0" data-fit-max="104" data-fit-min="44">7.8</span><span class="k" id="bk0" data-fit-max="19" data-fit-min="12">总收入</span></div><div class="cell" id="c1" style="background:var(--blue);color:var(--ink)"><span class="v" id="bv1" data-fit-max="104" data-fit-min="44">41%</span><span class="k" id="bk1" data-fit-max="19" data-fit-min="12">主业占比</span></div><div class="cell" id="c2" style="background:var(--green);color:var(--ink)"><span class="v" id="bv2" data-fit-max="104" data-fit-min="44">59%</span><span class="k" id="bk2" data-fit-max="19" data-fit-min="12">副业占比</span></div><div class="cell" id="c3" style="background:var(--pink);color:var(--ink)"><span class="v" id="bv3" data-fit-max="104" data-fit-min="44">+23%</span><span class="k" id="bk3" data-fit-max="19" data-fit-min="12">月环比</span></div><div class="cell" id="c4" style="background:var(--orange);color:var(--ink)"><span class="v" id="bv4" data-fit-max="104" data-fit-min="44">14</span><span class="k" id="bk4" data-fit-max="19" data-fit-min="12">现金储备</span></div></div>
    <div class="detail" id="detail"><div class="dr" id="d0"><span class="sw" style="background:var(--yellow)"></span><span class="k" id="k0" data-fit-max="19" data-fit-min="12">主业交付</span><span class="tk"><i id="t0" style="background:var(--yellow)"></i></span><span class="v" id="v0" data-fit-max="104" data-fit-min="44">3.2</span></div><div class="dr" id="d1"><span class="sw" style="background:var(--blue)"></span><span class="k" id="k1" data-fit-max="19" data-fit-min="12">内容分成</span><span class="tk"><i id="t1" style="background:var(--blue)"></i></span><span class="v" id="v1" data-fit-max="104" data-fit-min="44">1.4</span></div><div class="dr" id="d2"><span class="sw" style="background:var(--green)"></span><span class="k" id="k2" data-fit-max="19" data-fit-min="12">咨询顾问</span><span class="tk"><i id="t2" style="background:var(--green)"></i></span><span class="v" id="v2" data-fit-max="104" data-fit-min="44">2.1</span></div><div class="dr" id="d3"><span class="sw" style="background:var(--pink)"></span><span class="k" id="k3" data-fit-max="19" data-fit-min="12">培训场次</span><span class="tk"><i id="t3" style="background:var(--pink)"></i></span><span class="v" id="v3" data-fit-max="104" data-fit-min="44">0.8</span></div><div class="dr" id="d4"><span class="sw" style="background:var(--orange)"></span><span class="k" id="k4" data-fit-max="19" data-fit-min="12">杂项</span><span class="tk"><i id="t4" style="background:var(--orange)"></i></span><span class="v" id="v4" data-fit-max="104" data-fit-min="44">0.3</span></div></div>
  </div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  B.in.pop(tl, '.band', 0.1, { d: 0.8, from: .9, ease: 'power3.out' });
  document.querySelectorAll('.cell').forEach(function (c, i) {
    B.in.slideX(tl, c, 0.24 + i * 0.15, { from: 30, d: 0.8 * 0.7 });
  });
  document.querySelectorAll('.dr').forEach(function (r, i) {
    B.in.slideX(tl, r, 0.5 + i * 0.15, { from: 50, d: 0.8 * 0.7 });
  });
  var sh = [0.132, 0.695, 1.0, 0.39, 0.237];
  document.querySelectorAll('.dr .tk i').forEach(function (e, i) {
    B.in.grow(tl, e, Math.max(6, (sh[i] || 0) * 100) + '%', 0.8 + i * 0.15, { d: 0.8 });
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
