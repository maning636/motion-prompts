<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"titleA","name":"墙块标题","type":"string","label":"墙块标题（正在散掉的那一期，≤10 字）","default":"正在收尾的一期"},
{"id":"titleB","name":"露出标题","type":"string","label":"露出标题（下一期，≤10 字）","default":"下一期正在拆的题"},
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono 标签，≤8 字）","default":"NEXT"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（露出标题块底色 / 眉标块底色）","default":"#FF5FA2"},
{"id":"brickColor","name":"配色包","type":"enum","label":"配色包（块墙的起转色，决定整面墙的色序）","default":"mixed","options":[{"value":"yellow","label":"暖黄起转"},{"value":"pink","label":"桃粉起转"},{"value":"green","label":"薄荷起转"},{"value":"blue","label":"靛蓝起转"},{"value":"mixed","label":"暖黄起转"}]},
{"id":"studMode","name":"凸点","type":"enum","label":"凸点（不显示 / 整排同时亮 / 逐枚硬切）","default":"scan","options":[{"value":"none","label":"不显示"},{"value":"top","label":"整排同时亮"},{"value":"scan","label":"逐枚硬切"}]},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，转场档 6）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>积木拆散露题</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 积木风 · 转场与镜头 · 积木拆散露题（6s）
     一面铺满 100% 画布的完整块墙（4×9 = 36 块，480×120）从第 1.4s 起逐块向外抛散
     （式 9，power3.in 加速离画），中心露出下一场的标题块，标题块上方两枚凸点硬切点亮。
     抛散的块在落定期起点前就整块撤出画面——motion-qc 的出框扫描只看后 24%，
     设计性的「飞出去」不能留在定格帧里。
     满版 ink 底是全族唯一允许的例外（《规范》§7.3），墙上的块一律 sh-w 白影。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --mod:240px; --mod-h:120px; --shadow:#FFFFFF; --background:var(--ink); --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--background);color:var(--white);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  .sh-w{box-shadow:8px 8px 0 var(--white)}
  .sh-xl{box-shadow:10px 10px 0 var(--white)}

  /* 露出的标题块：720×240 承重件，压在拆散后空出来的中心 */
  .next{position:absolute;left:600px;top:420px;width:720px;height:240px;
    display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 32px;
    background:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:10px 10px 0 var(--white)}
  .next .eb{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.14em;
    line-height:1;color:var(--ink);white-space:nowrap}
  .next .ti{font-size:52px;font-weight:900;line-height:1.12;letter-spacing:0;
    color:var(--ink);white-space:nowrap}

  /* 凸点 2 联，立在露出标题块顶面（width/height 必须同时写） */
  .studs{position:absolute;left:840px;top:360px;width:240px;height:60px}

  /* 块墙：4 列 × 9 行 = 36 块 480×120，铺满 1920×1080（100% 画布） */
  .wall{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;
    display:grid;grid-template-columns:repeat(4,480px);grid-auto-rows:120px;
    background:var(--ink)}
  .br{border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    display:flex;align-items:center;padding:0 28px;overflow:hidden}
  .wall .ta{grid-column:1;grid-row:5}
  .br .ti3{font-size:44px;font-weight:900;line-height:1.1;letter-spacing:0;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div class="next" id="next">
    <span class="eb" id="eyebrow" data-fit-max="26" data-fit-min="14">NEXT</span>
    <span class="ti" id="titleB" data-fit-max="52" data-fit-min="22">下一期正在拆的题</span>
  </div>

  <div class="studs" id="studs">
    <svg width="240" height="60" viewBox="0 0 240 60" fill="none" aria-hidden="true">
      <circle class="sc" id="s1" cx="60"  cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      <circle class="sc" id="s2" cx="180" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
    </svg>
  </div>

  <div class="wall" id="wall">
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br ta"><span class="ti3" id="titleA" data-fit-max="44" data-fit-min="18">正在收尾的一期</span></div>
    <div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['eyebrow', 'titleA', 'titleB'].forEach(function (k) { set(k, v[k]); });

  var rs = document.documentElement.style;
  if (v.accent) rs.setProperty('--accent', v.accent);
  var ACC = v.accent || '#FF5FA2';

  /* 块墙色序：固定四色轮转（黄 → 粉 → 蓝 → 绿），brickColor 只决定从哪一色起转 */
  var ROT = ['#FFD429', '#FF5FA2', '#3D7BFF', '#2FD07A'];
  var START = { yellow: 0, mixed: 0, pink: 1, blue: 2, green: 3 };
  var s0 = START[v.brickColor] == null ? 0 : START[v.brickColor];
  function inkOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return '#0F0F0F';
    var f = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * f(parseInt(h.slice(0, 2), 16)) +
            0.7152 * f(parseInt(h.slice(2, 4), 16)) +
            0.0722 * f(parseInt(h.slice(4, 6), 16));
    return L > 0.42 ? '#0F0F0F' : '#FFFFFF';
  }
  /* 墙块标题取轮转里既不是强调色也不是黄色（留给品牌色）的那一色 */
  var taFace = ROT[(s0 + 2) % 4];
  if (taFace === ACC || taFace === '#FFD429') taFace = '#FFFFFF';

  var wall = document.getElementById('wall');
  var bricks = [].slice.call(document.querySelectorAll('#wall .br'));
  bricks.forEach(function (el, i) {
    var face = el.classList.contains('ta') ? taFace : ROT[(s0 + i) % 4];
    el.style.background = face;
    var t = el.querySelector('.ti3');
    if (t) t.style.color = inkOn(face);
  });

  var studs = [].slice.call(document.querySelectorAll('#studs .sc'));
  var studMode = v.studMode || 'scan';
  var studWrap = document.getElementById('studs');
  if (studMode === 'none' && studWrap) studWrap.style.display = 'none';

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：整面墙的抛散是典型的 reduced-motion 场景，直接撤掉；
       终态就是「墙已散、标题块已露」，画面完整可读。 */
    gsap.set(bricks, { visibility: 'hidden' });
    gsap.set('#next', { x: 0, y: 0, opacity: 1, boxShadow: '10px 10px 0 #FFFFFF' });
    gsap.set('#studs', { x: 0, y: 0, opacity: 1 });
    if (studs.length) gsap.set(studs, { attr: { fill: '#FFD429' } });
    tl.fromTo('#next',  { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 0);
    tl.fromTo('#studs', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .50, ease: 'power3.out' }, .16);
    tl.fromTo('#wall',  { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .30);
    B.hold(tl, 1.15, 1.05);
    return;
  }

  var stageRect = document.getElementById('stage').getBoundingClientRect();
  var cx = stageRect.width / 2, cy = stageRect.height / 2;

  /* 式 9 拆散：每块按自己相对画布中心的方位角向外抛散，power3.in 加速离画。
     抛散距离写死 1600×1100，保证 36 块全部离开画面。 */
  var BREAK_AT = 1.40, FLY = 0.60, STAG = 0.02;
  bricks.forEach(function (el, i) {
    var r = el.getBoundingClientRect();
    var bx = r.left - stageRect.left + r.width / 2;
    var by = r.top - stageRect.top + r.height / 2;
    var a = Math.atan2(by - cy, bx - cx);
    var at = BREAK_AT + i * STAG;
    tl.to(el, { x: Math.cos(a) * 1600, y: Math.sin(a) * 1100,
      duration: FLY, ease: 'power3.in' }, at);
  });
  var scatterEnd = BREAK_AT + (bricks.length - 1) * STAG + FLY;
  /* 抛散完就把整面墙撤出画面：落定期的定格帧里不能留一堆停在画布外的块 */
  tl.set(bricks, { visibility: 'hidden', immediateRender: false }, scatterEnd + 0.08);

  /* 标题块自下顶出（式 4），承重件用 sh-xl */
  var nextEl = document.getElementById('next');
  tl.fromTo('#next', { y: 240 }, { y: 0, duration: 0.26, ease: 'power4.out' }, scatterEnd + 0.20);
  tl.set('#next', { boxShadow: '10px 13px 0 #FFFFFF', immediateRender: false }, scatterEnd + 0.46);
  tl.to('#next', { boxShadow: '10px 10px 0 #FFFFFF', duration: 0.04, ease: 'steps(2)' }, scatterEnd + 0.50);

  /* 标题块上方两枚凸点硬切点亮（式 8） */
  if (studMode !== 'none' && studs.length) {
    tl.set(studs, { attr: { fill: '#FFFFFF' }, immediateRender: false }, scatterEnd + 0.62);
    if (studMode === 'top') {
      tl.set(studs, { attr: { fill: '#FFD429' }, immediateRender: false }, scatterEnd + 0.66);
    } else {
      studs.forEach(function (c, i) {
        tl.set(c, { attr: { fill: '#FFD429' }, immediateRender: false }, scatterEnd + 0.66 + i * 0.14);
      });
    }
  }

  var introEnd = tl.duration();
  var TOTAL = Math.min(6.5, Math.max(5.5, Number(v.duration) || 6));
  var holdAt = Math.min(introEnd, TOTAL - 1.2);
  B.hold(tl, holdAt, Math.max(1.2, TOTAL - holdAt));
})();
</script>
</body></html>
