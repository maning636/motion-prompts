<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"l1","name":"规格一标签","type":"string","label":"规格一标签（2–5 字）","default":"材质"},{"id":"v1","name":"规格一值","type":"string","label":"规格一值（3–10 字）","default":"进口铜版纸"},{"id":"l2","name":"规格二标签","type":"string","label":"规格二标签（2–5 字）","default":"尺寸"},{"id":"v2","name":"规格二值","type":"string","label":"规格二值（3–10 字）","default":"210 × 148"},{"id":"l3","name":"规格三标签","type":"string","label":"规格三标签（2–5 字）","default":"重量"},{"id":"v3","name":"规格三值","type":"string","label":"规格三值（3–10 字）","default":"480 克"},{"id":"accent","name":"强调色","type":"color","label":"强调色（第二列色块底）","default":"#3D7BFF"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="规格参数贴：三列等宽等高参数卡，每列一枚强调色编号方块压 mono 标签、下方 900 参数值，三列自左依次分格擦出后错峰微位移">
<title>规格参数贴 · 材质 / 尺寸 / 重量</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 三列几何完全对称：560px 宽、24px 列距，左起 96px */
  .sp{position:absolute;bottom:200px;width:560px;height:300px;
    display:flex;flex-direction:column;justify-content:center;gap:20px;padding:0 32px;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #c1{left:96px}
  #c2{left:680px}
  #c3{left:1264px}

  /* 标签行：编号方块 + mono 标签，方块是纯方块 + 3px 黑边，形状三列一致 */
  .row{display:flex;align-items:center;gap:20px}
  .num{flex:0 0 auto;width:68px;height:68px;display:flex;align-items:center;justify-content:center;
    background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:4px;
    font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;color:var(--ink)}
  #c2 .num{background:var(--accent)}
  #c3 .num{background:var(--green)}
  .sp .lb{display:block;font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.1em;
    line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}
  /* 参数值：900 大字，字号是标签的 1.6 倍以上（iart §7 停留帧判据） */
  .sp .val{display:block;font-size:52px;font-weight:900;line-height:1.08;letter-spacing:0;
    color:var(--ink);white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div class="sp" id="c1">
    <div class="row"><span class="num">01</span><span class="lb" id="l1" data-fit-max="30" data-fit-min="18">材质</span></div>
    <span class="val" id="v1" data-fit-max="52" data-fit-min="28">进口铜版纸</span>
  </div>
  <div class="sp" id="c2">
    <div class="row"><span class="num">02</span><span class="lb" id="l2" data-fit-max="30" data-fit-min="18">尺寸</span></div>
    <span class="val" id="v2" data-fit-max="52" data-fit-min="28">210 × 148</span>
  </div>
  <div class="sp" id="c3">
    <div class="row"><span class="num">03</span><span class="lb" id="l3" data-fit-max="30" data-fit-min="18">重量</span></div>
    <span class="val" id="v3" data-fit-max="52" data-fit-min="28">480 克</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['l1', 'v1', 'l2', 'v2', 'l3', 'v3'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉擦出与错峰微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#c1', { x: 0, y: 0, opacity: 1 });
    gsap.set('#c2', { x: 0, y: 0, opacity: 1 });
    gsap.set('#c3', { x: 0, y: 0, opacity: 1 });
    gsap.set('#v1', { x: 0 });
    gsap.set('#v2', { x: 0 });

    tl.fromTo('#c1', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#c2', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 7 · 分格擦出：三列自左依次分六格推出来，错峰 0.18s */
  var cols = ['#c1', '#c2', '#c3'];
  cols.forEach(function (sel, i) {
    var at = i * .18;
    tl.fromTo(sel, { clipPath: 'inset(0 100% 0 0)' },
        { clipPath: 'inset(0 0% 0 0)', duration: .32, ease: 'steps(6)' }, at)
      .fromTo(sel, { boxShadow: '8px 8px 0 ' + SH },
        { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<' + at)
      .to(sel, { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<' + at);
  });

  /* 模 2 · 零件装上去：标签与参数值错峰自下装上，纯位移，opacity 恒为 1 */
  tl.fromTo('#l1', { y: 22 }, { y: 0, duration: .2, ease: 'power4.out' }, .24);
  tl.fromTo('#l2', { y: 22 }, { y: 0, duration: .2, ease: 'power4.out' }, .42);
  tl.fromTo('#l3', { y: 22 }, { y: 0, duration: .2, ease: 'power4.out' }, .6);
  tl.fromTo('#v1', { y: 26 }, { y: 0, duration: .22, ease: 'power4.out' }, .32);
  tl.fromTo('#v2', { y: 26 }, { y: 0, duration: .22, ease: 'power4.out' }, .5);
  tl.fromTo('#v3', { y: 26 }, { y: 0, duration: .22, ease: 'power4.out' }, .68);
  tl.fromTo('.num', { y: -20 }, { y: 0, duration: .2, ease: 'power4.out' }, .3);

  /* 三列错峰微位移：每列起步时间互不相同，匀速往返，零回弹 */
  var T0 = 1.5;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#c1', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#c2', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#c3', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
