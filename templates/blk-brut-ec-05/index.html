<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","name":"主标题","type":"string","label":"主标题（顶部眉标行下的一行大字）","default":"同一个 SKU，会员价低一档"},{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"MEMBER / 会员价"},{"id":"dayLabel","name":"日常价标签","type":"string","label":"第一栏标签","default":"日常价"},{"id":"memberLabel","name":"会员价标签","type":"string","label":"第二栏标签","default":"会员价"},{"id":"saveLabel","name":"差额标签","type":"string","label":"第三栏标签","default":"会员省下"},{"id":"dayPrice","name":"日常价","type":"number","label":"日常价（元）","default":259},{"id":"memberPrice","name":"会员价","type":"number","label":"会员价（元）","default":189},{"id":"vipNote","name":"会员条件","type":"string","label":"第三栏下方的小字（会员门槛）","default":"年卡 ¥99 · 首月免费体验"},{"id":"accent","name":"强调色","type":"color","label":"强调色（中间一栏底 / 斜纹带）","default":"#3D7BFF"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":6},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="左中右三栏会员价卡：日常价、会员价、省下多少并排三列，中间一栏抬高并压强调色，第三栏反白给出省额与折扣率">
<title>会员价三栏 · 同一个 SKU，会员价低一档</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:baseline;gap:26px;
    padding:44px 72px 34px;border-bottom:var(--bw) solid var(--ink)}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--mute)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:900;font-size:56px;letter-spacing:0}

  /* 三栏：中间一栏整体上移，视觉重心落在会员价上 */
  .trio{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;
    gap:26px;padding:40px 72px 46px;overflow:hidden}
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    border:var(--bw) solid var(--ink);border-radius:4px;overflow:hidden}
  .col .hd2{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    padding:16px 20px;border-bottom:var(--bw) solid var(--ink);
    white-space:nowrap;min-width:0;font-size:30px;font-weight:900;letter-spacing:0}
  .col .body2{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;padding:26px 20px}
  .col .p{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:124px;line-height:1;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .col .cap{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.1em;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  .colA{background:var(--white);box-shadow:8px 8px 0 var(--ink)}
  .colA .hd2{background:var(--paper)}
  .colA .p{color:var(--mute)}

  /* 中间一栏：抬高 + 10px 硬阴影 + 整块强调色，是唯一重音 */
  .colB{background:var(--accent);color:var(--white);box-shadow:10px 10px 0 var(--ink);
    margin-top:-34px;margin-bottom:14px}
  .colB .hd2{background:var(--ink);color:var(--accent);border-bottom-color:var(--ink)}
  .colB .cap{color:var(--white)}

  .colC{background:var(--ink);color:var(--white)}
  .colC .hd2{background:var(--yellow);color:var(--ink);border-bottom-color:var(--white)}
  .colC .p{font-size:104px;color:var(--yellow)}
  .colC .cap{color:var(--white)}
  .colC .small{white-space:nowrap;font-size:22px;font-weight:700;letter-spacing:0;
    color:var(--white);max-width:100%;overflow:hidden;text-overflow:ellipsis}

  .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:24px;padding:22px 72px;background:var(--ink);color:var(--white)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow);white-space:nowrap;flex:0 0 auto}
  .foot .fc{font-size:26px;font-weight:700;letter-spacing:0;white-space:nowrap;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eb anim" id="eyebrow" data-fit-max="26" data-fit-min="16">MEMBER / 会员价</span>
    <span class="tt anim" id="title" data-fit-max="56" data-fit-min="28">同一个 SKU，会员价低一档</span>
  </div>

  <div class="trio anim" id="trio">
    <div class="col colA anim" id="colA">
      <div class="hd2"><span id="dayLabel" data-fit-max="30" data-fit-min="17">日常价</span></div>
      <div class="body2">
        <span class="p anim" id="dayPrice" data-fit-max="124" data-fit-min="56">¥259</span>
        <span class="cap anim" id="dayCap">NON-MEMBER</span>
      </div>
    </div>

    <div class="col colB anim" id="colB">
      <div class="hd2"><span id="memberLabel" data-fit-max="30" data-fit-min="17">会员价</span></div>
      <div class="body2">
        <span class="p anim" id="memberPrice" data-fit-max="124" data-fit-min="56">¥189</span>
        <span class="cap anim" id="memberCap">MEMBER ONLY</span>
      </div>
    </div>

    <div class="col colC anim" id="colC">
      <div class="hd2"><span id="saveLabel" data-fit-max="30" data-fit-min="17">会员省下</span></div>
      <div class="body2">
        <span class="p anim" id="saveAmt" data-fit-max="104" data-fit-min="48">¥70</span>
        <span class="cap anim" id="offPct">OFF 27%</span>
        <span class="small anim" id="vipNote" data-fit-max="22" data-fit-min="13">年卡 ¥99 · 首月免费体验</span>
      </div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="fm">MEMBER / 2026</span>
    <span class="fc">开通即享 · 会员价与活动价不叠加</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'dayLabel', 'memberLabel', 'saveLabel', 'vipNote']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 省额与折扣率都由两个价算出，不手抄第三遍 */
  var day = Number(v.dayPrice), mem = Number(v.memberPrice);
  if (!isFinite(day)) day = 0;
  if (!isFinite(mem)) mem = 0;
  var save = Math.max(0, Math.round(day - mem));
  var off = day > 0 ? Math.round((1 - mem / day) * 100) : 0;
  set('dayPrice', '¥' + day);
  set('memberPrice', '¥' + mem);
  set('saveAmt', '¥' + save);
  set('offPct', 'OFF ' + off + '%');

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#trio',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd',       0.00,   0, -34, 0.24);
  slam('#eyebrow',  0.12, -24, -20, 0.22);
  slam('#title',    0.22, -28, -24, 0.26);
  /* 三栏错峰从下方各自硬落位，中栏最后落、落得最重 */
  tl.fromTo('#colA', { y: 60 }, { y: 0, duration: .28, ease: 'power4.out' }, 0.44);
  tl.fromTo('#colC', { y: 60 }, { y: 0, duration: .28, ease: 'power4.out' }, 0.54);
  tl.fromTo('#colB', { y: 60 }, { y: 0, duration: .3,  ease: 'power4.out' }, 0.66);
  slam('#dayPrice',    0.82,    0, -24, 0.24);
  slam('#memberPrice', 1.10,    0, -24, 0.24);
  slam('#saveAmt',     1.10,    0, -24, 0.24);
  slam('#dayCap',      0.98,    0, -18, 0.2);
  slam('#memberCap',   1.26,    0, -18, 0.2);
  slam('#offPct',      1.26,    0, -18, 0.2);
  slam('#vipNote',     1.36,    0, -18, 0.2);
  /* 模 9 阴影档位脉冲：会员栏落定后换一次档再换回来 */
  tl.to('#colB', { boxShadow: '8px 8px 0 #0F0F0F', duration: .06, ease: 'steps(2)' }, 1.58);
  tl.to('#colB', { boxShadow: '10px 10px 0 #0F0F0F', duration: .06, ease: 'steps(2)' }, 1.64);
  slam('#foot',    1.72,   0,  28, 0.26);
  slam('#stripe',  1.86,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.10);

  var introEnd = 3.30;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
