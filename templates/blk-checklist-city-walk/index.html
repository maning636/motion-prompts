<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "CITYWALK / 城市"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "用一整天走完一条街"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：公里"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FFD429"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>打钩清单 · 用一整天走完一条街</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:22px}
  .ck{border:var(--bw) solid var(--ink);border-radius:4px;padding:0 30px;
        display:flex;align-items:center;gap:28px;position:relative;min-width:0;
        min-height:0;box-shadow:7px 7px 0 var(--ink);overflow:hidden}
  .ck .bx{flex:0 0 84px;height:84px;border:var(--bw) solid var(--ink);border-radius:4px;
        background:var(--paper);position:relative;overflow:hidden}
  .ck .bx svg{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
        opacity:0}
  .ck .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
  /* 划掉线包在标签这一层里，只划标签。
     原来它横跨整卡（left:142px;right:34px），正好从大数字中间穿过去，
     「18.5」被劈成两半——那不是划掉，那像渲染坏了。
     .nmw 用 align-self:flex-start 收缩到文字宽度：
     若跟着 .tx 拉满，线会横穿卡片右侧一大截空白，又变成长划线。 */
  .ck .nmw{position:relative;display:block;align-self:flex-start;max-width:100%}
  .ck .nm{display:block;font-weight:900;font-size:30px;line-height:1.1;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .ck .sl{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;
        background:var(--ink);width:0;z-index:3;pointer-events:none}
  .ck .vv{font-family:var(--mono);font-weight:700;font-size:52px;line-height:.92;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">CITYWALK / 城市</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">用一整天走完一条街</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：公里</div></div>
  <div class="body"><div class="ck" id="ck0" style="background:var(--orange);color:var(--ink);"><span class="bx" id="bx0"><svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M8 21 L17 30 L33 11" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="square"/></svg></span><span class="tx"><span class="nmw"><span class="nm" id="k0" data-fit-max="30" data-fit-min="16">清晨出发</span><i class="sl" id="sl0"></i></span><span class="vv" id="v0" data-fit-max="52" data-fit-min="26">3.2</span></span></div><div class="ck" id="ck1" style="background:var(--purple);color:var(--ink);"><span class="bx" id="bx1"><svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M8 21 L17 30 L33 11" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="square"/></svg></span><span class="tx"><span class="nmw"><span class="nm" id="k1" data-fit-max="30" data-fit-min="16">正午最热</span><i class="sl" id="sl1"></i></span><span class="vv" id="v1" data-fit-max="52" data-fit-min="26">1.4</span></span></div><div class="ck" id="ck2" style="background:var(--white);color:var(--ink);"><span class="bx" id="bx2"><svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M8 21 L17 30 L33 11" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="square"/></svg></span><span class="tx"><span class="nmw"><span class="nm" id="k2" data-fit-max="30" data-fit-min="16">傍晚折返</span><i class="sl" id="sl2"></i></span><span class="vv" id="v2" data-fit-max="52" data-fit-min="26">4.1</span></span></div><div class="ck" id="ck3" style="background:var(--yellow);color:var(--ink);"><span class="bx" id="bx3"><svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M8 21 L17 30 L33 11" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="square"/></svg></span><span class="tx"><span class="nmw"><span class="nm" id="k3" data-fit-max="30" data-fit-min="16">夜路</span><i class="sl" id="sl3"></i></span><span class="vv" id="v3" data-fit-max="52" data-fit-min="26">2.6</span></span></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  document.querySelectorAll('.ck').forEach(function (c, i) {
    var at = 0.12 + i * 0.08;
    B.in.pop(tl, c, at, { d: 0.42, from: .88, ease: 'power3.out' });
    B.in.pop(tl, c.querySelector('.bx'), at + 0.08, { d: 0.42 * 0.6, from: .6 });
    var tick = c.querySelector('.bx svg');
    tl.fromTo(tick, { opacity: 0, scale: .4 },
      { opacity: 1, scale: 1, duration: 0.42 * 0.5, ease: 'back.out(2.2)' }, at + 0.34);
    var sl = c.querySelector('.sl');
    tl.fromTo(sl, { width: '0%' },
      { width: '100%', duration: 0.42 * 0.7, ease: 'power2.inOut' }, at + 0.44);
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
