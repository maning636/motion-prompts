<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（反白画面上的 mono 字）","default":"LOW STOCK / 告急"},{"id":"alarm","name":"告急大字","type":"string","label":"满宽告急条上的大字","default":"库存告急"},{"id":"leftNum","name":"剩余件数","type":"number","label":"剩余件数","default":12},{"id":"k1","name":"数据 1 键","type":"string","label":"第一格键","default":"已抢比例"},{"id":"v1","name":"数据 1 值","type":"string","label":"第一格值","default":"98%"},{"id":"k2","name":"数据 2 键","type":"string","label":"第二格键","default":"补货批次"},{"id":"v2","name":"数据 2 值","type":"string","label":"第二格值","default":"WB-1130 断"},{"id":"k3","name":"数据 3 键","type":"string","label":"第三格键","default":"下单时限"},{"id":"v3","name":"数据 3 值","type":"string","label":"第三格值","default":"售完即止"},{"id":"note","name":"口径说明","type":"string","label":"底部说明（一行 mono）","default":"口径：剩余件数每 10 秒同步一次 · 以结算页为准"},{"id":"accent","name":"强调色","type":"color","label":"强调色（告急条底 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="满版反白告急构图：整屏近黑底，中部一整条满宽强调色告急条压着巨型告急大字，右接一枚反白剩余件数块，下方三格紧急数据平铺">
<title>库存告急 · 满版告急条</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整屏反白：底与字整块替换（基因 10） */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--white);
    background:repeating-linear-gradient(45deg,var(--white) 0 10px,var(--accent) 10px 20px)}
  .stripe.b{background:repeating-linear-gradient(-45deg,var(--white) 0 10px,var(--accent) 10px 20px)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:34px 72px 28px}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--white)}

  /* 满宽告急条：一整条强调色，不是卡片 */
  .alarm{flex:0 0 auto;display:flex;align-items:center;gap:40px;
    padding:34px 72px 40px;background:var(--accent);color:var(--ink);
    border-top:var(--bw) solid var(--white);border-bottom:var(--bw) solid var(--white)}
  .alarm .a{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;font-weight:900;
    font-size:176px;line-height:1;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
  .alarm .box{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;
    padding:20px 36px 24px;background:var(--ink);color:var(--accent);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .alarm .box .n{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:160px;line-height:.9;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .alarm .box .u{font-family:var(--mono);font-weight:700;font-size:36px;letter-spacing:.06em}

  /* 三格紧急数据：深底上的件用白色描边与 8px 白影（§7.2 规则 B） */
  .gauge{flex:1 1 auto;min-height:0;display:flex;padding:34px 72px 0;overflow:hidden}
  .cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px;
    align-items:flex-start;justify-content:center;padding:26px 32px;
    border:var(--bw) solid var(--white);border-top:0;
    border-right:0;background:var(--ink)}
  .cell:last-child{border-right:var(--bw) solid var(--white)}
  .cell .k{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--white);max-width:100%;overflow:hidden;
    text-overflow:ellipsis}
  .cell .v{white-space:nowrap;font-family:var(--mono);font-weight:900;font-size:60px;
    line-height:1;letter-spacing:0;color:var(--accent);max-width:100%;overflow:hidden;
    text-overflow:ellipsis;font-variant-numeric:tabular-nums}

  .note{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:28px 72px 32px}
  .note .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--white);border-radius:4px}
  .note .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--white)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="stripe anim" id="stripeA"></div>

  <div class="hd anim" id="hd">
    <span class="tag">LOW</span>
    <span class="eb anim" id="eyebrow" data-fit-max="26" data-fit-min="16">LOW STOCK / 告急</span>
  </div>

  <div class="alarm anim" id="alarm">
    <span class="a anim" id="alarmTx" data-fit-max="176" data-fit-min="80">库存告急</span>
    <span class="box anim" id="box">
      <span class="n" id="leftNum">12</span><span class="u">件</span>
    </span>
  </div>

  <div class="gauge anim" id="gauge">
    <div class="cell anim" id="c1"><span class="k anim" id="k1" data-fit-max="24" data-fit-min="15">已抢比例</span><span class="v anim" id="v1" data-fit-max="60" data-fit-min="28">98%</span></div>
    <div class="cell anim" id="c2"><span class="k anim" id="k2" data-fit-max="24" data-fit-min="15">补货批次</span><span class="v anim" id="v2" data-fit-max="60" data-fit-min="28">WB-1130 断</span></div>
    <div class="cell anim" id="c3"><span class="k anim" id="k3" data-fit-max="24" data-fit-min="15">下单时限</span><span class="v anim" id="v3" data-fit-max="60" data-fit-min="28">售完即止</span></div>
  </div>

  <div class="note anim" id="note">
    <span class="sq"></span>
    <span class="tx" id="noteTx" data-fit-max="24" data-fit-min="15">口径：剩余件数每 10 秒同步一次 · 以结算页为准</span>
  </div>

  <div class="stripe b anim" id="stripeB"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'alarmTx', 'k1', 'v1', 'k2', 'v2', 'k3', 'v3', 'noteTx']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var n = Number(v.leftNum);
  if (!isFinite(n)) n = 0;
  set('leftNum', String(Math.max(0, Math.round(n))));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#stripeA',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .1);
    tl.fromTo('#alarm',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .22);
    tl.fromTo('#gauge',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .38);
    tl.fromTo('#note',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .52);
    tl.fromTo('#stripeB',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .64);
    B.hold(tl, 1.4, 1.1);
    return;
  }

  var WHT = '#FFFFFF';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + WHT, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  tl.fromTo('#stripeA', { clipPath: 'inset(0 100% 0 0)' },
      { clipPath: 'inset(0 0% 0 0%)', duration: .34, ease: 'steps(8)' }, 0);
  slam('#hd',     0.12,   0, -28, 0.24);
  slam('#eyebrow',0.24, -24, -20, 0.22);
  /* 满宽告急条自画外左侧整条切入，读起来就是「警报横穿画面」 */
  tl.fromTo('#alarm', { x: -200 },
      { x: 0, duration: .3, ease: 'power4.out' }, 0.44);
  slam('#alarmTx', 0.78,   0, -28, 0.26);
  tl.fromTo('#box', { x: 70, y: -40 },
      { x: 0, y: 0, duration: .28, ease: 'power4.out' }, 0.92);
  shadowBounce('#box', '8px 8px 0 ' + WHT, 1.20);
  /* 模 2 硬着陆：三格自下逐格落位，纯位移，opacity 恒为 1 */
  tl.from('#gauge .cell', { y: 46, duration: .26, ease: 'power4.out', stagger: .11 }, 1.22);
  slam('#note',    1.68,   0,  28, 0.26);
  slam('#noteTx',  1.80, -24, -20, 0.22);
  tl.fromTo('#stripeB', { clipPath: 'inset(0 0 0 100%)' },
      { clipPath: 'inset(0 0% 0 0%)', duration: .34, ease: 'steps(8)' }, 1.86);
  tl.fromTo('.stripe', { backgroundPositionX: '0px' },
      { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.20);

  var introEnd = 3.40;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
