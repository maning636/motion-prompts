<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"METRICS / 三项横排"},
{"id":"title","name":"小标题","type":"string","label":"三张卡上方的小标题（一行，12–18 字）","default":"一周里真正影响播放的只有这三项"},
{"id":"n1","name":"数字 1","type":"number","label":"第 1 个数字（mono 整数跳变）","default":3},
{"id":"u1","name":"单位 1","type":"string","label":"第 1 个单位","default":"条"},
{"id":"l1","name":"标签 1","type":"string","label":"第 1 个标签（中文）","default":"固定节拍的更新条数"},
{"id":"n2","name":"数字 2","type":"number","label":"第 2 个数字（mono 整数跳变）","default":41},
{"id":"u2","name":"单位 2","type":"string","label":"第 2 个单位","default":"秒"},
{"id":"l2","name":"标签 2","type":"string","label":"第 2 个标签（中文）","default":"单条视频的制作耗时"},
{"id":"n3","name":"数字 3","type":"number","label":"第 3 个数字（mono 整数跳变）","default":68},
{"id":"u3","name":"单位 3","type":"string","label":"第 3 个单位","default":"%"},
{"id":"l3","name":"标签 3","type":"string","label":"第 3 个标签（中文）","default":"能删掉的镜头占比"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚（口径）","default":"口径：近 30 天 · 同账号全部作品 · 含未破万播放"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（第 3 张卡 + 斜纹带）","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>三项数据横排 · 一周里真正影响播放的只有这三项</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:44px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文小标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:72px;line-height:1.14;
    letter-spacing:0;margin-top:18px;padding-right:24px}

  /* 三张数据卡横排，规范要求「一排三张必须不同色」（§3.4）：黄 / 白 / 强调色 */
  .row{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:28px;
    padding:34px 88px 0}
  .stat{flex:1 1 0;min-width:0;background:var(--yellow);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    padding:36px 36px 32px}
  .stat.b{background:var(--white)}
  .stat.c{background:var(--accent)}
  .num{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:118px;line-height:1;letter-spacing:0}
  .digits{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .num .u{font-size:34px;margin-left:8px;font-family:var(--sans);font-weight:900}
  .lab{display:block;margin-top:20px;padding-top:18px;border-top:var(--bw) solid var(--ink);
    font-size:30px;font-weight:700;line-height:1.36;letter-spacing:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:32px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">METRICS / 三项横排</div>
    <div class="title anim" id="title" data-fit-max="72" data-fit-min="36">一周里真正影响播放的只有这三项</div>
  </div>

  <div class="row anim" id="row">
    <div class="stat anim" id="stat1">
      <div class="num anim" id="num1" data-fit-max="118" data-fit-min="56"><span class="digits" id="d1">3</span><span class="u" id="u1">条</span></div>
      <div class="lab anim" id="l1" data-fit-max="30" data-fit-min="15">固定节拍的更新条数</div>
    </div>
    <div class="stat b anim" id="stat2">
      <div class="num anim" id="num2" data-fit-max="118" data-fit-min="56"><span class="digits" id="d2">41</span><span class="u" id="u2">秒</span></div>
      <div class="lab anim" id="l2" data-fit-max="30" data-fit-min="15">单条视频的制作耗时</div>
    </div>
    <div class="stat c anim" id="stat3">
      <div class="num anim" id="num3" data-fit-max="118" data-fit-min="56"><span class="digits" id="d3">68</span><span class="u" id="u3">%</span></div>
      <div class="lab anim" id="l3" data-fit-max="30" data-fit-min="15">能删掉的镜头占比</div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">口径：近 30 天 · 同账号全部作品 · 含未破万播放</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'u1', 'l1', 'u2', 'l2', 'u3', 'l3', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  function num(key) {
    var n = Number(v[key]);
    if (!isFinite(n)) n = 0;
    return Math.round(n);
  }
  var targets = [num('n1'), num('n2'), num('n3')];
  var digs = [document.getElementById('d1'), document.getElementById('d2'),
              document.getElementById('d3')];

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：三个数字都直接落终值 */
    for (var i = 0; i < digs.length; i++) digs[i].textContent = String(targets[i]);
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#row',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function count(el, to, at, dur, steps) {
    el.textContent = '0';
    var c = { v: 0 };
    tl.to(c, {
      v: to, duration: dur, ease: 'steps(' + steps + ')',
      onUpdate: function () { el.textContent = String(Math.round(c.v)); },
      onComplete: function () { el.textContent = String(to); }
    }, at);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  slam('#row', 0.32, 0, -24, 0.28);

  /* 三张卡依次自上而下落位，每张落定后自己的数字才开始跳 —— 一帧只动一个焦点 */
  var cards = [['#stat1', '#num1', '#l1'], ['#stat2', '#num2', '#l2'], ['#stat3', '#num3', '#l3']];
  for (var i = 0; i < cards.length; i++) {
    var at = 0.50 + i * 0.16;
    tl.fromTo(cards[i][0], { y: -44 }, { y: 0, duration: 0.26, ease: 'power4.out' }, at);
    count(digs[i], targets[i], at + 0.16, 0.9, 12);
    tl.fromTo(cards[i][2], { y: -18 }, { y: 0, duration: 0.22, ease: 'power4.out' }, at + 1.06);
  }

  slam('#footrow', 2.60, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.72);
  slam('#note',    2.88, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 3.02);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 3.36);

  var introEnd = 4.16;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
