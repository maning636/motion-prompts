<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "眉标（mono + 大字距，≤12 字）", "default": "AUDIO / 切片"}, {"id": "titleA", "name": "主标题 · 前段", "type": "string", "label": "主标题第一行（普通字，≤6 字）", "default": "这条声音"}, {"id": "titleB", "name": "主标题 · 彩色词块", "type": "string", "label": "主标题第二行（强调色块里的词，≤4 字）", "default": "值得听完"}, {"id": "sub", "name": "副标题", "type": "string", "label": "副标题（一行短句，≤22 字）", "default": "左边是已经响过的，右边是你还没听到的"}, {"id": "episode", "name": "期数标签", "type": "string", "label": "右上角 mono 期数标签（≤8 字）", "default": "EP.118"}, {"id": "peaks", "name": "音频包络", "type": "string", "label": "离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）", "default": "14,1000,397,37,28,274,332,289,14,963,612,77,14,237,360,108,28,880,249,18,262,268,388,14,628,969,234,28,222,209,351,14,757,391,25,305,188,397,14,815,665,83,228,126,545,65,652,145"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色（已播柱 / 播放头 / 进度条填充）", "default": "#FF5FA2"}, {"id": "duration", "name": "总时长", "type": "number", "label": "总时长（秒，须等于音轨长度 5.6）", "default": 5.6}, {"id": "exportMode", "name": "导出格式", "type": "enum", "label": "Format", "default": "mp4", "hidden": true, "options": [{"value": "mp4", "label": "MP4"}, {"value": "webm", "label": "WebM"}, {"value": "transparent", "label": "透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>双色扫过切片封面 · 这条声音值得听完</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让**所有内联样式改动**
       都变成 0.01ms 的过渡——本族每条都有 JS 写死的内联几何（播放头 left/top、
       峰值保持线 bottom），降级分支里会卡在 CSS 旧值不动，渲染出错误位置，
       而 motion-qc 只看最终帧出框、不看降级分支的几何正确性，全绿也照样错。
       补上 transition-property:none 与 animation-name:none 才是完整写法。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }

  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#8E8E8E; --bw:3px;
    --ghost:rgba(255,255,255,.22);
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--accent);color:var(--ink);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--ink);color:var(--yellow);padding:3px 14px;border-radius:9999px}
  .promo .parw{font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:40px 72px 34px}

  .hd{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:22px;line-height:32px}
  .hd .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hd .ep{margin-left:auto;flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.1em;padding:4px 16px;border:var(--bw) solid var(--white);border-radius:9999px;
    background:var(--yellow);color:var(--ink);white-space:nowrap}

  .stack{flex:0 0 auto;margin-top:30px}
  .line{display:block;font-size:88px;font-weight:900;line-height:1.05;white-space:nowrap}
  .chip{display:inline-block;line-height:1;padding:0 20px;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .sub{min-width:0;margin-top:16px;font-size:30px;font-weight:700;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 波形区：40 根柱。柱高 = peaks 采样（纯函数）；柱色 = 播放头扫到没有（也是纯函数） */
  .wave{flex:0 0 auto;height:300px;margin-top:40px;display:flex;align-items:flex-end;
    justify-content:space-between;background:rgba(255,255,255,.05);
    border:var(--bw) solid var(--white);border-radius:4px;padding:0 18px;overflow:hidden}
  .wave i{display:block;width:26px;height:10px;border-radius:9999px;background:var(--ghost)}

  #head{position:absolute;left:72px;top:0;width:5px;height:300px;background:var(--white);z-index:6}
  #head .cap{position:absolute;left:-8px;top:-9px;width:21px;height:21px;background:var(--accent);
    border:var(--bw) solid var(--white);border-radius:4px}

  .legend{flex:0 0 auto;margin-top:16px;display:flex;align-items:center;gap:34px}
  .lg{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;white-space:nowrap}
  .lg .sw{display:block;width:26px;height:14px;border-radius:9999px;background:var(--ghost)}
  .lg .sw.on{background:var(--accent)}
  .lg.mono{font-family:var(--mono);letter-spacing:.12em;margin-left:auto;color:var(--yellow)}

  .prog{flex:0 0 auto;margin-top:auto}
  .track{position:relative;height:22px;background:rgba(255,255,255,.14);
    border:var(--bw) solid var(--white);border-radius:4px;overflow:hidden}
  .track .fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent)}
  .meta{display:flex;align-items:center;gap:20px;margin-top:14px}
  .tc{font-family:var(--mono);font-weight:900;font-size:28px;letter-spacing:.08em;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .tc.dim{color:var(--mute)}
  .ticks{flex:1 1 auto;display:flex;justify-content:space-between;min-width:0}
  .ticks i{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.06em;
    color:var(--mute);font-style:normal;white-space:nowrap}

  .stripe{flex:0 0 auto;height:20px;
    background:repeating-linear-gradient(45deg,var(--accent) 0 10px,var(--ink) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--white);color:var(--ink)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--pink)}
  .foot .fc{font-size:25px;font-weight:700;white-space:nowrap}

  /* 播放头的位置由 JS 按波形区实测盒子写死，绝不能是过渡 */
  #head,#head .cap,.fill{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">SLICE</span><span class="ptx">口播切片 · 已播 / 未播双色扫过</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="hd">
      <span class="eyebrow anim" id="eyebrow">AUDIO / 切片</span>
      <span class="ep anim" id="episode">EP.118</span>
    </div>
    <div class="stack">
      <span class="line anim" id="titleA" data-fit-max="88" data-fit-min="44">这条声音</span>
      <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="88" data-fit-min="44">值得听完</span></span>
      <p class="sub anim" id="sub" data-fit-max="30" data-fit-min="16">左边是已经响过的，右边是你还没听到的</p>
    </div>
    <div class="wave" id="wave"></div>
    <div class="legend">
      <span class="lg"><i class="sw on"></i>已播</span>
      <span class="lg"><i class="sw"></i>未播</span>
      <span class="lg mono" id="pk">PEAK 000</span>
    </div>
    <div class="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="meta">
        <span class="tc anim" id="tc">00:00</span>
        <span class="ticks"><i>0s</i><i>1s</i><i>2s</i><i>3s</i><i>4s</i><i>5s</i></span>
        <span class="tc dim anim" id="tcend">00:05</span>
      </div>
    </div>
  </div>

  <div id="head"><span class="cap"></span></div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fm">AUD / 2026</span><span class="fc">柱色跟着播放头走，不是装饰色</span>
  </div></div>
<!-- [公开版] 原音轨 音轨 voice-03.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* ---------- 音频包络：offline RMS，烘在 peaks 变量里 ----------
     这份数组来自 音轨 voice-03.wav（未随仓分发） 的离线解码（RMS，48 桶，归一到 0–1000），
     由 离线包络脚本（未随仓分发） 算出，同时落一份
     assets/voice-03.peaks.json 作溯源。
     换音轨：换 wav → 重跑离线脚本 → 把新数组填进 peaks → 同步 duration 与
     <audio data-duration>。这是一条显式的、算一次的步骤，不是缺陷。
     为什么绝不接实时 AnalyserNode：无头渲染是逐帧 seek 采样，媒体在采集模式下
     是 seek 不是 play（hyperframes runtime 的 allowLiveTimelineSeek 在
     __HF_RENDER_CAPTURE_MODE 下为 false），探针接在暂停的元素上读到的不是
     「此刻在放什么」；motion-qc 的探针同样是无序 seek。 */
  var FALLBACK_PEAKS = '14,1000,397,37,28,274,332,289,14,963,612,77,14,237,360,108,28,880,249,18,262,268,388,14,628,969,234,28,222,209,351,14,757,391,25,305,188,397,14,815,665,83,228,126,545,65,652,145';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);
  function peakAt(k) {
    return PEAKS[Math.max(0, Math.min(PEAKS.length - 1, k))];
  }

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','episode','titleA','titleB','sub'].forEach(function (k) { set(k, v[k]); });


  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 音频窗口：时间轴总长严格等于音轨长度，尾部留 0.6s 静音 + 定格。
     禁止用变量值推算总长（数值填大会撞 SMOKE_TOO_LONG）。 */
  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var N = PEAKS.length;

  var BARS = 40, MAXH = 236, MINH = 10, STEPS = N;
  var SEG = WIN / STEPS, SPREAD = N / BARS;
  var ACC = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#FF5FA2';
  var GHOST = 'rgba(255,255,255,.22)';

  /* 柱高只看柱序号 i 与时间桶 k。柱色只看播放头扫到哪儿——两者都是 t 的纯函数。 */
  function heightAt(i, k) {
    var idx = Math.floor(k + i * SPREAD) % N;
    return Math.max(MINH, Math.round(PEAKS[idx] / 1000 * MAXH));
  }
  function colorAt(i, k) {
    var hi = Math.floor(k * BARS / N - 0.5);
    return i <= hi ? ACC : GHOST;
  }

  var wave = document.getElementById('wave');
  var bars = [];
  for (var i = 0; i < BARS; i++) {
    var b = document.createElement('i');
    wave.appendChild(b); bars.push(b);
  }

  B.fitAll();

  var head = document.getElementById('head');
  var wr = wave.getBoundingClientRect();
  var sr = document.getElementById('stage').getBoundingClientRect();
  var SPAN = Math.max(10, wr.width - 5);
  head.style.left = (wr.left - sr.left) + 'px';
  head.style.top = (wr.top - sr.top) + 'px';
  head.style.height = wr.height + 'px';

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function press(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }
  function fadeInReduce(ids, start) {
    for (var i = 0; i < ids.length; i++) {
      tl.fromTo(ids[i], { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: i === ids.length - 1 ? .6 : .5, ease: 'power3.out' },
        start + i * 0.08);
    }
  }

  if (reduce) {
    /* 降级：柱高定格在 62% 处那一帧的向量，柱色也定格成「已播 62%」；
       播放头停 62%，时间码停 00:03。只保留 ≤8px 微位移淡入。 */
    var still = Math.round(N * 0.62);
    gsap.set(bars, {
      height: (function (k) { return function (i) { return heightAt(i, k); }; })(still),
      backgroundColor: (function (k) { return function (i) { return colorAt(i, k); }; })(still)
    });
    gsap.set('#pk', { textContent: 'PEAK ' + peakAt(still) });
    gsap.set('#fill', { width: '62%' });
    gsap.set('#tc', { textContent: '00:03' });
    gsap.set('#head', { x: SPAN * 0.62, y: 0, opacity: 1 });
    fadeInReduce(['#promo', '#main', '#head', '#stripe', '#foot'], 0);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#eyebrow', 0.14, 0, -20, 0.22);
  slam('#episode', 0.22, 24, -20, 0.22);
  slam('#titleA', 0.38, -34, -34, 0.28);
  slam('#lineB', 0.56, -34, -34, 0.28);
  press('#titleB', '8px 8px 0 ' + '#FFFFFF', 0.84);
  slam('#sub', 0.78, 0, -20, 0.24);
  slam('#wave', 0.92, 0, 22, 0.26);

  /* ---- 音频驱动三段，同一个自变量 t ---- */
  var pkEl = document.getElementById('pk');
  for (var k = 0; k < STEPS; k++) {
    tl.to(bars, {
      height: (function (kk) { return function (i) { return heightAt(i, kk); }; })(k),
      backgroundColor: (function (kk) { return function (i) { return colorAt(i, kk); }; })(k),
      duration: SEG, ease: 'none'
    }, k * SEG);
    tl.set(pkEl, { textContent: 'PEAK ' + peakAt(k) }, k * SEG);
  }
  tl.fromTo('#head', { x: 0 }, { x: SPAN, duration: WIN, ease: 'none' }, 0);
  tl.fromTo('#fill', { width: '0%' }, { width: '100%', duration: WIN, ease: 'none' }, 0);
  var tcEl = document.getElementById('tc');
  for (var s = 0; s <= Math.floor(WIN); s++) {
    tl.set(tcEl, { textContent: '00:' + (s < 10 ? '0' + s : String(s)) }, s);
  }
  tl.set(tcEl, { textContent: '00:0' + Math.ceil(WIN) }, WIN);

  slam('#foot', 0.98, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.10);

  /* 收尾：音频窗口走完后补一段静止，时间轴总长恰好等于音轨长度，
     样片视频与音轨严丝合缝，最后一拍是「已播完」的定格画面。 */
  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
