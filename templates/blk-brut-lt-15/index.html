<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"an","name":"甲队名","type":"string","label":"左侧队名（2–8 字）","default":"主队"},{"id":"av","name":"甲队分","type":"string","label":"左侧比分（1–3 位数）","default":"128"},{"id":"bn","name":"乙队名","type":"string","label":"右侧队名（2–8 字）","default":"客队"},{"id":"bv","name":"乙队分","type":"string","label":"右侧比分（1–3 位数）","default":"96"},{"id":"vs","name":"中段标签","type":"string","label":"中段 mono 标签（2–6 字）","default":"VS"},{"id":"note","name":"回合说明","type":"string","label":"中段下方说明（2–8 字）","default":"第 3 回合"},{"id":"accent","name":"强调色","type":"color","label":"强调色（领先方色块）","default":"#FFD429"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="比分贴：左右两块等宽队伍卡加中间一根更高的 ink 竖柱，双方比分 steps 整数跳到位，中柱自上压下后三块做错峰微位移">
<title>比分贴 · 主队 对 客队</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 左右两块几何完全对称：宽 660 / 高 288，中柱夹在 766–1154 之间 */
  .side{position:absolute;bottom:200px;width:660px;height:288px;
    display:flex;flex-direction:column;justify-content:center;padding:26px 34px;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #ta{left:96px}
  #tb{left:1164px;background:var(--accent)}
  .nm{display:block;font-family:var(--mono);font-weight:700;font-size:32px;letter-spacing:.1em;
    line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden}
  /* 比分：mono + tabular-nums，字号是队名的 4 倍以上（基因 8 极限字号跳跃） */
  .sc{display:block;margin-top:14px;font-family:var(--mono);font-weight:900;font-size:140px;
    line-height:.92;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;white-space:nowrap;overflow:hidden}

  /* 中柱：ink 底白字，比两侧高出一截，整块反白而不是叠蒙版（基因 10） */
  #sc{position:absolute;left:766px;bottom:200px;width:388px;height:400px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:var(--ink);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #vs{display:block;font-family:var(--mono);font-weight:900;font-size:76px;line-height:1;
    letter-spacing:.06em;color:var(--yellow);white-space:nowrap;overflow:hidden}
  #sc .rule{width:180px;height:3px;background:var(--white)}
  #note{display:block;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.12em;
    line-height:1;color:var(--white);white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div class="side" id="ta">
    <span class="nm" id="an" data-fit-max="32" data-fit-min="20">主队</span>
    <span class="sc" id="av" data-fit-max="140" data-fit-min="72">128</span>
  </div>
  <div id="sc">
    <span id="vs" data-fit-max="76" data-fit-min="40">VS</span>
    <div class="rule"></div>
    <span id="note" data-fit-max="26" data-fit-min="16">第 3 回合</span>
  </div>
  <div class="side" id="tb">
    <span class="nm" id="bn" data-fit-max="32" data-fit-min="20">客队</span>
    <span class="sc" id="bv" data-fit-max="140" data-fit-min="72">96</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['an', 'av', 'bn', 'bv', 'vs', 'note'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：比分直接给终值，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#ta', { x: 0, y: 0, opacity: 1 });
    gsap.set('#sc', { x: 0, y: 0, opacity: 1 });
    gsap.set('#tb', { x: 0, y: 0, opacity: 1 });
    gsap.set('#av', { textContent: v.av });
    gsap.set('#bv', { textContent: v.bv });

    tl.fromTo('#ta', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#sc', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 2 · 对撞入位：左右两块自两侧拍入，中柱自上压下，三块错峰 0.1s */
  tl.fromTo('#ta', { x: -80 },
      { x: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#ta', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#ta', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#tb', { x: 80 },
      { x: 0, duration: .26, ease: 'power4.out' }, .12)
    .fromTo('#tb', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#tb', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#sc', { y: -70 },
      { y: 0, duration: .28, ease: 'power4.out' }, .06)
    .fromTo('#sc', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#sc', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  tl.fromTo('#an', { x: -22 }, { x: 0, duration: .2, ease: 'power4.out' }, .22);
  tl.fromTo('#bn', { x: 22 },  { x: 0, duration: .2, ease: 'power4.out' }, .34);

  /* 模 4 · 整数跳数：比分 steps 跳到位，展示窗口写死 1.1s，两边同时起跳。
     onUpdate 只写 textContent，绝不做 DOM 测量（规范 §15 回调专项）。 */
  var na = { v: 0 }, nb = { v: 0 };
  var ta = parseInt(String(v.av || '0').replace(/\D/g, ''), 10) || 0;
  var tb = parseInt(String(v.bv || '0').replace(/\D/g, ''), 10) || 0;
  var ea = document.getElementById('av');
  var eb = document.getElementById('bv');
  tl.to(na, { v: ta, duration: 1.1, ease: 'steps(11)',
      onUpdate: function () { if (ea) ea.textContent = String(Math.round(na.v)); } }, .4);
  tl.to(nb, { v: tb, duration: 1.1, ease: 'steps(11)',
      onUpdate: function () { if (eb) eb.textContent = String(Math.round(nb.v)); } }, .4);

  /* 中段两件错峰跟位 */
  tl.fromTo('#vs', { y: -24 }, { y: 0, duration: .2, ease: 'power4.out' }, .3);
  tl.fromTo('#sc .rule', { scaleX: .2 }, { scaleX: 1, duration: .24, ease: 'power4.out' }, .38);
  tl.fromTo('#note', { y: 24 }, { y: 0, duration: .2, ease: 'power4.out' }, .46);

  /* 三块错峰微位移：每块起步时间互不相同，匀速往返，零回弹 */
  var T0 = 2.0;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#ta', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#sc', { y: 5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);
  tl.to('#tb', { y: -4, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
