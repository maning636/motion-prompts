<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "LEARNING / 90 天"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "九十天学一件事的账"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：小时"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FFD429"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>排序条形榜 · 九十天学一件事的账</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{display:flex;flex-direction:column;gap:14px}
  .brow{flex:1 1 0;min-height:0;display:flex;align-items:stretch;gap:20px}
  .brow .rk{flex:0 0 96px;display:flex;align-items:center;justify-content:center;
        font-family:var(--mono);font-weight:700;font-size:46px;letter-spacing:-.03em;
        border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--ink);
        font-variant-numeric:tabular-nums}
  .brow .nm{flex:0 0 300px;display:flex;align-items:center;font-weight:900;font-size:28px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .tr{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;
        border:var(--bw) solid var(--ink);border-radius:4px;background:var(--paper)}
  .brow .tr i{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
  .brow .vv{flex:0 0 210px;display:flex;align-items:center;justify-content:flex-end;
        font-family:var(--mono);font-weight:700;font-size:64px;line-height:.9;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">LEARNING / 90 天</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">九十天学一件事的账</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：小时</div></div>
  <div class="body"><div class="brow" id="br3"><span class="rk" style="background:var(--pink);color:var(--ink)">01</span><span class="nm" id="k3" data-fit-max="28" data-fit-min="15">第 4 月</span><span class="tr"><i id="bf3" style="background:var(--pink)"></i></span><span class="vv" id="v3" data-fit-max="64" data-fit-min="32">52</span></div><div class="brow" id="br2"><span class="rk" style="background:var(--orange);color:var(--ink)">02</span><span class="nm" id="k2" data-fit-max="28" data-fit-min="15">第 3 月</span><span class="tr"><i id="bf2" style="background:var(--orange)"></i></span><span class="vv" id="v2" data-fit-max="64" data-fit-min="32">41</span></div><div class="brow" id="br1"><span class="rk" style="background:var(--purple);color:var(--ink)">03</span><span class="nm" id="k1" data-fit-max="28" data-fit-min="15">第 2 月</span><span class="tr"><i id="bf1" style="background:var(--purple)"></i></span><span class="vv" id="v1" data-fit-max="64" data-fit-min="32">34</span></div><div class="brow" id="br0"><span class="rk" style="background:var(--white);color:var(--ink)">04</span><span class="nm" id="k0" data-fit-max="28" data-fit-min="15">第 1 月</span><span class="tr"><i id="bf0" style="background:var(--white)"></i></span><span class="vv" id="v0" data-fit-max="64" data-fit-min="32">28</span></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  var sh = [1.0, 0.788, 0.654, 0.538];
  document.querySelectorAll('.brow').forEach(function (r, i) {
    tl.from(r, { opacity: 0, x: -46, duration: 0.42 * 0.8, ease: 'power3.out' }, 0.1 + i * 0.08);
    B.in.pop(tl, r.querySelector('.rk'), 0.16 + i * 0.08, { d: 0.42 * 0.6, from: .7 });
    var f = r.querySelector('.tr i');
    B.in.grow(tl, f, Math.max(5, Math.round((sh[i] || 0) * 100)) + '%', 0.34 + i * 0.08, { d: 0.42 });
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
