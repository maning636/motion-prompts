<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（顶部黑条上的 mono 字）","default":"7 DAYS / 无理由"},{"id":"days","name":"天数","type":"number","label":"无理由天数（天）","default":7},{"id":"title","name":"大字标语","type":"string","label":"巨型数字右侧的大字标语","default":"天无理由退换"},{"id":"subText","name":"副句","type":"string","label":"大字下方的一行副句","default":"退货运费由平台承担，不用来回扯皮"},{"id":"t1","name":"条款 1","type":"string","label":"条款第一行","default":"签收次日起 7 天内可发起退货"},{"id":"t2","name":"条款 2","type":"string","label":"条款第二行","default":"商品不影响二次销售即可退回"},{"id":"t3","name":"条款 3","type":"string","label":"条款第三行","default":"退货运费由平台先行垫付"},{"id":"note","name":"底部说明","type":"string","label":"底部说明（一行 mono）","default":"口径：以签收时间起算 · 定制类商品不适用"},{"id":"accent","name":"强调色","type":"color","label":"强调色（巨型数字块 / 斜纹带）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="上数字下条款构图：上半部一整块强调色巨型天数额，右接 900 大字标语；下半部三行条款横条逐行落位，格间 3px 实线分隔">
<title>七天无理由 · 天数 + 三条条款</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .top{flex:0 0 auto;height:66px;display:flex;align-items:center;gap:22px;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .top .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .top .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}

  /* 上半部：一整块强调色，巨型数字左置、标语右置 */
  .big{flex:0 0 auto;display:flex;align-items:center;gap:44px;
    padding:34px 72px 38px;background:var(--accent);color:var(--ink);
    border-bottom:var(--bw) solid var(--ink)}
  .big .num{flex:0 0 auto;display:flex;align-items:baseline;gap:12px;
    padding:12px 34px 16px;background:var(--ink);color:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .big .num .n{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:248px;line-height:.9;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .big .num .u{font-family:var(--mono);font-weight:700;font-size:44px;letter-spacing:.06em}
  .big .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:16px}
  .big .tt{display:block;white-space:nowrap;font-weight:900;font-size:88px;
    line-height:1.04;letter-spacing:0;max-width:100%;overflow:hidden;
    text-overflow:ellipsis}
  .big .sb{display:block;white-space:nowrap;font-size:32px;font-weight:700;
    letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}

  /* 下半部：三行条款横条 */
  .terms{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    padding:34px 72px 30px;overflow:hidden}
  .term{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:28px;
    padding:0 28px;background:var(--white);border:var(--bw) solid var(--ink);
    border-bottom:0;min-width:0}
  .term:last-child{border-bottom:var(--bw) solid var(--ink)}
  .term .no{flex:0 0 auto;width:64px;height:64px;display:flex;align-items:center;
    justify-content:center;background:var(--ink);color:var(--yellow);
    border-radius:4px;font-family:var(--mono);font-weight:900;font-size:28px}
  .term .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:36px;font-weight:700;letter-spacing:0}
  .term .mk{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.12em;color:var(--mute);white-space:nowrap}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:0 72px 22px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.08em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="tag">NO ASK</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">7 DAYS / 无理由</span>
  </div>

  <div class="big anim" id="big">
    <span class="num anim" id="numBox">
      <span class="n" id="n">7</span><span class="u">天</span>
    </span>
    <span class="tx">
      <span class="tt anim" id="title" data-fit-max="88" data-fit-min="44">天无理由退换</span>
      <span class="sb anim" id="subText" data-fit-max="32" data-fit-min="18">退货运费由平台承担，不用来回扯皮</span>
    </span>
  </div>

  <div class="terms anim" id="terms">
    <div class="term anim" id="term1"><span class="no">01</span><span class="tx anim" id="t1" data-fit-max="36" data-fit-min="20">签收次日起 7 天内可发起退货</span><span class="mk">CHECK / 时效</span></div>
    <div class="term anim" id="term2"><span class="no">02</span><span class="tx anim" id="t2" data-fit-max="36" data-fit-min="20">商品不影响二次销售即可退回</span><span class="mk">CHECK / 条件</span></div>
    <div class="term anim" id="term3"><span class="no">03</span><span class="tx anim" id="t3" data-fit-max="36" data-fit-min="20">退货运费由平台先行垫付</span><span class="mk">CHECK / 运费</span></div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：以签收时间起算 · 定制类商品不适用</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'subText', 't1', 't2', 't3', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var d = Number(v.days);
  if (!isFinite(d)) d = 7;
  d = Math.max(1, Math.round(d));
  set('n', String(d));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#top',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#big',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#terms', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .5);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .65);
    B.hold(tl, 1.3, 1.1);
    return;
  }

  var INK = '#0F0F0F', WHT = '#FFFFFF';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + WHT, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#top',     0.00,   0, -66, 0.26);
  slam('#eyebrow', 0.14, -24, -20, 0.22);
  slam('#big',     0.26,   0,  34, 0.28);
  slam('#numBox',  0.44, -28, -28, 0.26);
  shadowBounce('#numBox', '8px 8px 0 ' + WHT, 0.74);
  slam('#title',     0.62,   0, -24, 0.26);
  slam('#subText',   0.76,   0, -20, 0.22);
  /* 三行条款自左画外依次切入 */
  tl.fromTo('#term1', { x: -110 }, { x: 0, duration: .26, ease: 'power4.out' }, 0.94);
  tl.fromTo('#term2', { x: -110 }, { x: 0, duration: .26, ease: 'power4.out' }, 1.10);
  tl.fromTo('#term3', { x: -110 }, { x: 0, duration: .26, ease: 'power4.out' }, 1.26);
  slam('#t1',   1.08,   0, -20, 0.22);
  slam('#t2',   1.24,   0, -20, 0.22);
  slam('#t3',   1.40,   0, -20, 0.22);
  slam('#foot',   1.54,   0,  28, 0.26);
  slam('#note',   1.66, -24, -20, 0.22);
  slam('#stripe', 1.76,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.00);

  var introEnd = 3.20;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
