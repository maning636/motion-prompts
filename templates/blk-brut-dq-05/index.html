<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"BARS / 柱状图"},
{"id":"title","name":"小标题","type":"string","label":"柱状图上方的小标题（一行，12–18 字）","default":"同一批选题，五种开头的完播率"},
{"id":"c1","name":"类别 1","type":"string","label":"第 1 根柱的类别（2–5 字）","default":"提问"},
{"id":"v1","name":"数值 1","type":"number","label":"第 1 根柱的数值","default":22},
{"id":"c2","name":"类别 2","type":"string","label":"第 2 根柱的类别","default":"反常识"},
{"id":"v2","name":"数值 2","type":"number","label":"第 2 根柱的数值","default":41},
{"id":"c3","name":"类别 3","type":"string","label":"第 3 根柱的类别","default":"数字"},
{"id":"v3","name":"数值 3","type":"number","label":"第 3 根柱的数值","default":35},
{"id":"c4","name":"类别 4","type":"string","label":"第 4 根柱的类别","default":"故事"},
{"id":"v4","name":"数值 4","type":"number","label":"第 4 根柱的数值","default":28},
{"id":"c5","name":"类别 5","type":"string","label":"第 5 根柱的类别","default":"清单"},
{"id":"v5","name":"数值 5","type":"number","label":"第 5 根柱的数值","default":17},
{"id":"unit","name":"单位","type":"string","label":"柱顶数值单位","default":"%"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚（口径）","default":"口径：完播率 · 样本每类 12 条 · 取中位数"},
{"id":"accent","name":"强调色","type":"color","label":"最高那根柱 + 斜纹带","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>简易柱状图 · 五种开头的完播率</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:42px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文小标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:68px;line-height:1.14;
    letter-spacing:0;margin-top:16px;padding-right:24px}

  /* 柱状图：纯 div 柱，不引任何图表库。柱区固定高度，柱高按数值 / 最大值换算 */
  .chart{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;gap:34px;
    padding:28px 88px 0;border-bottom:var(--bw) solid var(--ink)}
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;height:100%;gap:14px}
  .pv{flex:0 0 auto;font-family:var(--mono);font-weight:900;font-size:40px;line-height:1;
    letter-spacing:0}
  .pv .u{font-size:20px;margin-left:2px}
  /* 柱体初始 height:0，时间轴补 height；柱色一色一变，最高那根用强调色 */
  .bar{display:block;width:100%;height:0;background:var(--yellow);
    border:var(--bw) solid var(--ink);border-bottom:0}
  .bar.c2{background:var(--white)}
  .bar.c3{background:var(--green)}
  .bar.c4{background:var(--blue)}
  .bar.c5{background:var(--paper)}
  .bar.top{background:var(--accent)}
  .cl{flex:0 0 auto;padding-bottom:14px;display:block;white-space:nowrap;font-size:30px;
    font-weight:700;line-height:1.2;letter-spacing:0}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">BARS / 柱状图</div>
    <div class="title anim" id="title" data-fit-max="68" data-fit-min="34">同一批选题，五种开头的完播率</div>
  </div>

  <div class="chart anim" id="chart">
    <div class="col anim"><span class="pv" id="pv1"><span class="n" id="v1">22</span><span class="u" id="unit">%</span></span><span class="bar c1" id="bar1"></span><span class="cl" id="c1" data-fit-max="30" data-fit-min="15">提问</span></div>
    <div class="col anim"><span class="pv"><span class="n" id="v2">41</span><span class="u">%</span></span><span class="bar c2" id="bar2"></span><span class="cl" id="c2" data-fit-max="30" data-fit-min="15">反常识</span></div>
    <div class="col anim"><span class="pv"><span class="n" id="v3">35</span><span class="u">%</span></span><span class="bar c3" id="bar3"></span><span class="cl" id="c3" data-fit-max="30" data-fit-min="15">数字</span></div>
    <div class="col anim"><span class="pv"><span class="n" id="v4">28</span><span class="u">%</span></span><span class="bar c4" id="bar4"></span><span class="cl" id="c4" data-fit-max="30" data-fit-min="15">故事</span></div>
    <div class="col anim"><span class="pv"><span class="n" id="v5">17</span><span class="u">%</span></span><span class="bar c5" id="bar5"></span><span class="cl" id="c5" data-fit-max="30" data-fit-min="15">清单</span></div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">口径：完播率 · 样本每类 12 条 · 取中位数</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'c1', 'c2', 'c3', 'c4', 'c5', 'unit', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  function val(key) {
    var n = Number(v[key]);
    if (!isFinite(n) || n < 0) n = 0;
    return Math.round(n * 10) / 10;
  }
  var vals = [val('v1'), val('v2'), val('v3'), val('v4'), val('v5')];
  var max = 0;
  for (var i = 0; i < vals.length; i++) if (vals[i] > max) max = vals[i];
  if (max <= 0) max = 1;
  var topIdx = 0;
  for (var i = 0; i < vals.length; i++) if (vals[i] === max) topIdx = i;

  /* 柱区可用高度：chart 容器高 − 柱顶数值行 − 类别行 − 两条间距 */
  var MAXH = 430;
  var heights = vals.map(function (n) { return Math.max(8, Math.round(n / max * MAXH)); });
  for (var i = 0; i < vals.length; i++) set('v' + (i + 1), String(vals[i]));

  var bars = ['#bar1', '#bar2', '#bar3', '#bar4', '#bar5'];

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：柱高直接给终值，不做生长 */
    for (var i = 0; i < bars.length; i++) gsap.set(bars[i], { height: heights[i] + 'px' });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#chart',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var cols = document.querySelectorAll('#chart .col');
  var pvs = document.querySelectorAll('#chart .pv');

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  slam('#chart', 0.30, 0, -24, 0.28);

  /* 五根柱依次自基线生长，柱高用像素补间（柱是纵向件，grow 只补 width） */
  for (var i = 0; i < bars.length; i++) {
    var at = 0.56 + i * 0.14;
    tl.fromTo(bars[i], { height: 0 },
      { height: heights[i], duration: 0.46, ease: 'power3.out' }, at);
    tl.fromTo(pvs[i], { y: 16 }, { y: 0, duration: 0.22, ease: 'power4.out' }, at + 0.30);
    tl.fromTo(cols[i], { x: 0 }, { x: 0, duration: 0.01, ease: 'none' }, at);
  }
  /* 最高那根换强调色，1 帧硬切（模 8 色块闪切） */
  tl.set(bars[topIdx], { className: 'bar top', immediateRender: false }, 1.30);
  /* 模 9 阴影档位脉冲：最高那根换一次阴影档再换回来 */
  tl.to(bars[topIdx], { boxShadow: '10px 10px 0 #0F0F0F', duration: 0.06, ease: 'steps(2)' }, 1.36);
  tl.to(bars[topIdx], { boxShadow: 'none', duration: 0.06, ease: 'steps(2)' }, 1.42);

  slam('#footrow', 2.10, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.22);
  slam('#note',    2.38, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.52);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 2.86);

  var introEnd = 3.66;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
