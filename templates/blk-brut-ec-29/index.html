<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="中央方章构图：画面正中一枚 640px 见方的近黑印章压着认证主文与报告编号，下方一排三枚小徽章收尾">
<title>权威背书方章 · 这份检测报告可以自己查</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:26px;
    padding:36px 72px 28px;border-bottom:var(--bw) solid var(--ink)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--white);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--mute)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:900;font-size:64px;letter-spacing:0;text-align:right}

  /* 中央方章：正方 + 3px 黑边 + 10px 硬阴影，印文分四层 */
  .stamp{flex:1 1 auto;min-height:0;display:flex;align-items:center;
    justify-content:center;padding:36px 72px;overflow:hidden}
  .seal{flex:0 1 auto;width:620px;height:620px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;padding:44px 56px;
    background:var(--ink);color:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:10px 10px 0 var(--accent)}
  .seal .top3{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.16em;color:var(--white)}
  .seal .main{display:block;white-space:nowrap;font-weight:900;font-size:88px;
    line-height:1.06;letter-spacing:0;color:var(--accent);max-width:100%}
  .seal .no{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:30px;
    letter-spacing:.12em;color:var(--white);max-width:100%;overflow:hidden;
    text-overflow:ellipsis}
  .seal .org{white-space:nowrap;font-size:26px;font-weight:700;letter-spacing:0;
    color:var(--white);max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .seal .bar{flex:0 0 auto;width:100%;height:3px;background:var(--accent)}

  /* 底部三枚小徽章 */
  .badges{flex:0 0 auto;display:flex;gap:26px;padding:0 72px 30px}
  .badge{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;
    gap:18px;padding:24px 28px;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink)}
  .badge .sq{flex:0 0 auto;width:28px;height:28px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .badge .tx{display:block;white-space:nowrap;font-size:34px;font-weight:900;
    letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:0 72px 22px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="tag">CERT</span>
    <span class="eb anim" id="eyebrow" data-fit-max="26" data-fit-min="16">CERTIFIED / 权威背书</span>
    <span class="tt anim" id="title" data-fit-max="64" data-fit-min="32">这份检测报告可以自己查</span>
  </div>

  <div class="stamp anim" id="stamp">
    <div class="seal anim" id="seal">
      <span class="top3 anim" id="stampTop" data-fit-max="26" data-fit-min="16">第三方检测</span>
      <span class="bar"></span>
      <span class="main anim" id="stampMain" data-fit-max="88" data-fit-min="44">A 类婴幼儿级</span>
      <span class="bar"></span>
      <span class="no anim" id="stampNo" data-fit-max="30" data-fit-min="18">SN2026-0417</span>
      <span class="org anim" id="stampOrg" data-fit-max="26" data-fit-min="16">中纺标检测 · CMA 资质</span>
    </div>
  </div>

  <div class="badges anim" id="badges">
    <div class="badge anim" id="bd1"><span class="sq"></span><span class="tx anim" id="b1" data-fit-max="34" data-fit-min="19">甲醛 未检出</span></div>
    <div class="badge anim" id="bd2"><span class="sq"></span><span class="tx anim" id="b2" data-fit-max="34" data-fit-min="19">pH 值 6.8</span></div>
    <div class="badge anim" id="bd3"><span class="sq"></span><span class="tx anim" id="b3" data-fit-max="34" data-fit-min="19">可燃物 1 级</span></div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：检测样品与在售批次一致 · 报告可凭编号官网查询</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'stampTop', 'stampMain', 'stampNo', 'stampOrg',
   'b1', 'b2', 'b3', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#stamp',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#badges', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#foot',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .5);
    tl.fromTo('#stripe', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .62);
    B.hold(tl, 1.4, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, off, at) {
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: off + 'px ' + off + 'px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',       0.00,   0, -34, 0.24);
  slam('#eyebrow',  0.12, -24, -20, 0.22);
  slam('#title',    0.20,  24, -20, 0.24);
  /* 模 1 拍进来：方章从画外斜向砸入，落定后阴影压 2 帧再弹回 10px 档 */
  tl.fromTo('#seal', { x: -70, y: -70 },
      { x: 0, y: 0, duration: .3, ease: 'power4.out' }, 0.42);
  shadowBounce('#seal', 10, 0.76);
  slam('#stampTop', 0.76,   0, -22, 0.22);
  slam('#stampMain',0.88,   0, -26, 0.26);
  slam('#stampNo',  1.02,   0, -20, 0.22);
  slam('#stampOrg', 1.12,   0, -20, 0.22);
  /* 三枚小徽章自下错峰落位 */
  tl.from('#badges .badge', { y: 50, duration: .26, ease: 'power4.out', stagger: .11 }, 1.24);
  slam('#foot',    1.68,   0,  28, 0.26);
  slam('#note',    1.80, -24, -20, 0.22);
  slam('#stripe',  1.90,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.14);

  var introEnd = 3.34;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
