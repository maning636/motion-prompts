<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "眉标（mono + 大字距，≤12 字）", "default": "CAPTION / 逐句"}, {"id": "titleA", "name": "主标题 · 前段", "type": "string", "label": "主标题第一行（普通字，≤6 字）", "default": "把原话，"}, {"id": "titleB", "name": "主标题 · 彩色词块", "type": "string", "label": "主标题第二行（强调色块里的词，≤4 字）", "default": "一句句放"}, {"id": "lines", "name": "字幕句", "type": "string", "label": "四句字幕，用全角竖线｜分隔（每句≤18 字，如 我不是在讲工具｜我是在讲省下来的时间｜…）", "default": "先说结论：这套流程三步就能跑完｜第二步最花时间，但它决定后面顺不顺｜工具不是重点，节奏才是｜下期讲怎么把它变成习惯"}, {"id": "lineIdx", "name": "起始句", "type": "number", "label": "从第几句开始念（0–3，超过 3 自动回到 0）", "default": 0}, {"id": "peaks", "name": "音频包络", "type": "string", "label": "离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）", "default": "591,447,705,346,907,401,629,857,464,586,646,764,371,662,857,333,637,1000,388,637,840,388,608,658,684,342,620,835,346,603,1000,354,608,835,392,612,747,603,401,624,835,350,620,996,354,679,743,515"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色（当前句底衬 / 能量条 / 进度填充）", "default": "#FF5FA2"}, {"id": "duration", "name": "总时长", "type": "number", "label": "总时长（秒，须等于音轨长度 5.6）", "default": 5.6}, {"id": "exportMode", "name": "导出格式", "type": "enum", "label": "Format", "default": "mp4", "hidden": true, "options": [{"value": "mp4", "label": "MP4"}, {"value": "webm", "label": "WebM"}, {"value": "transparent", "label": "透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>逐句字幕卡 · 一句一屏，配一条能量条</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让**所有内联样式改动**
       都变成 0.01ms 的过渡——本族每条都有 JS 写死的内联几何（播放头 left/top、
       峰值保持线 bottom），降级分支里会卡在 CSS 旧值不动，渲染出错误位置，
       而 motion-qc 只看最终帧出框、不看降级分支的几何正确性，全绿也照样错。
       补上 transition-property:none 与 animation-name:none 才是完整写法。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }

  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--ink);color:var(--white);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--yellow);color:var(--ink);padding:3px 14px;border-radius:9999px}
  .promo .parw{color:var(--accent);font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:40px 72px 34px}

  .hd{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:22px;line-height:32px}
  .hd .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hd .lc{margin-left:auto;flex:0 0 auto;font-family:var(--mono);font-weight:900;font-size:24px;
    letter-spacing:.1em;padding:4px 16px;border:var(--bw) solid var(--ink);border-radius:9999px;
    background:var(--yellow);white-space:nowrap}

  .stack{flex:0 0 auto;margin-top:28px}
  .line{display:block;font-size:80px;font-weight:900;line-height:1.05;white-space:nowrap}
  .chip{display:inline-block;line-height:1;padding:0 18px;background:var(--accent);color:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--ink)}
  .sub{min-width:0;margin-top:14px;font-size:29px;font-weight:700;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 字幕台：当前句 58px 撑满，句子位置由时间桶算 */
  .capwrap{flex:0 0 auto;position:relative;margin-top:32px;height:222px;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;display:flex;align-items:center;
    padding:0 40px;overflow:hidden}
  .capno{position:absolute;left:24px;top:16px;font-family:var(--mono);font-weight:900;
    font-size:22px;letter-spacing:.12em;color:var(--mute)}
  .cap{min-width:0;font-size:58px;font-weight:900;line-height:1.42;letter-spacing:0;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .capbar{position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--accent)}

  .energy{flex:0 0 auto;margin-top:28px;height:170px;display:flex;align-items:flex-end;
    justify-content:space-between;padding:0 4px;border-bottom:var(--bw) solid var(--ink);
    overflow:hidden}
  .energy i{display:block;width:20px;height:8px;border-radius:9999px;background:var(--ink)}

  .prog{flex:0 0 auto;margin-top:auto}
  .track{position:relative;height:20px;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;overflow:hidden}
  .track .fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent)}
  .meta{display:flex;align-items:center;gap:20px;margin-top:14px}
  .tc{font-family:var(--mono);font-weight:900;font-size:28px;letter-spacing:.08em;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .tc.dim{color:var(--mute)}
  .ticks{flex:1 1 auto;display:flex;justify-content:space-between;min-width:0}
  .ticks i{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.06em;
    color:var(--mute);font-style:normal;white-space:nowrap}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow)}
  .foot .fc{font-size:25px;font-weight:700;white-space:nowrap}
  .track .fill{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">CAP</span><span class="ptx">逐句字幕卡 · 一句一屏 + 能量条</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="hd">
      <span class="eyebrow anim" id="eyebrow">CAPTION / 逐句</span>
      <span class="lc anim" id="lctag">LINE 1 / 4</span>
    </div>
    <div class="stack">
      <span class="line anim" id="titleA" data-fit-max="80" data-fit-min="40">把原话，</span>
      <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="80" data-fit-min="40">一句句放</span></span>
      <p class="sub anim" id="sub" data-fit-max="29" data-fit-min="15">下面这一条不是装饰，是这句话说得多重</p>
    </div>
    <div class="capwrap anim" id="capwrap">
      <span class="capno" id="capno">01</span>
      <span class="cap" id="cap">先说结论：这套流程三步就能跑完</span>
      <div class="capbar" id="capbar"></div>
    </div>
    <div class="energy anim" id="energy"></div>
    <div class="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="meta">
        <span class="tc anim" id="tc">00:00</span>
        <span class="ticks"><i>0s</i><i>1s</i><i>2s</i><i>3s</i><i>4s</i><i>5s</i></span>
        <span class="tc dim anim" id="tcend">00:05</span>
      </div>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fm">AUD / 2026</span><span class="fc">字幕切换点由音频窗口推导，不手填</span>
  </div></div>
<!-- [公开版] 原音轨 音轨 voice-04.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* ---------- 音频包络：offline RMS，烘在 peaks 变量里 ----------
     这份数组来自 音轨 voice-04.wav（未随仓分发） 的离线解码（RMS，48 桶，归一到 0–1000），
     由 离线包络脚本（未随仓分发） 算出，同时落一份
     assets/voice-04.peaks.json 作溯源。
     换音轨：换 wav → 重跑离线脚本 → 把新数组填进 peaks → 同步 duration 与
     <audio data-duration>。这是一条显式的、算一次的步骤，不是缺陷。
     为什么绝不接实时 AnalyserNode：无头渲染是逐帧 seek 采样，媒体在采集模式下
     是 seek 不是 play（hyperframes runtime 的 allowLiveTimelineSeek 在
     __HF_RENDER_CAPTURE_MODE 下为 false），探针接在暂停的元素上读到的不是
     「此刻在放什么」；motion-qc 的探针同样是无序 seek。 */
  var FALLBACK_PEAKS = '591,447,705,346,907,401,629,857,464,586,646,764,371,662,857,333,637,1000,388,637,840,388,608,658,684,342,620,835,346,603,1000,354,608,835,392,612,747,603,401,624,835,350,620,996,354,679,743,515';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);
  function peakAt(k) {
    return PEAKS[Math.max(0, Math.min(PEAKS.length - 1, k))];
  }

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','titleA','titleB'].forEach(function (k) { set(k, v[k]); });
  var LN = String(v.lines == null || v.lines === ''
    ? '先说结论：这套流程三步就能跑完｜第二步最花时间，但它决定后面顺不顺｜工具不是重点，节奏才是｜下期讲怎么把它变成习惯'
    : v.lines).split('｜').map(function (s) { return s.trim(); });
  while (LN.length < 4) LN.push('第' + (LN.length + 1) + '句');
  var LI0 = ((Math.round(Number(v.lineIdx) || 0) % LN.length) + LN.length) % LN.length;


  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 音频窗口：时间轴总长严格等于音轨长度，尾部留 0.6s 静音 + 定格。
     禁止用变量值推算总长（数值填大会撞 SMOKE_TOO_LONG）。 */
  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var N = PEAKS.length;

  var SENTS = 4, BARS = 64, MAXH = 152, MINH = 8;
  var STEPS = N, SEG = WIN / STEPS, SPREAD = N / BARS;
  var SENTSEG = WIN / SENTS;

  function heightAt(i, k) {
    var idx = Math.floor(k + i * SPREAD) % N;
    return Math.max(MINH, Math.round(PEAKS[idx] / 1000 * MAXH));
  }
  function sentAt(t) {
    var s = Math.floor(t / SENTSEG);
    return ((LI0 + Math.max(0, Math.min(SENTS - 1, s))) % SENTS);
  }

  var energy = document.getElementById('energy'), bars = [];
  for (var i = 0; i < BARS; i++) {
    var b = document.createElement('i');
    energy.appendChild(b); bars.push(b);
  }

  B.fitAll();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function press(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }
  function fadeInReduce(ids, start) {
    for (var i = 0; i < ids.length; i++) {
      tl.fromTo(ids[i], { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: i === ids.length - 1 ? .6 : .5, ease: 'power3.out' },
        start + i * 0.08);
    }
  }

  var capEl = document.getElementById('cap'), capNo = document.getElementById('capno');
  var capBar = document.getElementById('capbar'), lcTag = document.getElementById('lctag');
  function paintLine(t) {
    var s = sentAt(t);
    var txt = LN[s];
    if (capEl.textContent !== txt) capEl.textContent = txt;
    capNo.textContent = (s < 9 ? '0' : '') + (s + 1);
    lcTag.textContent = 'LINE ' + (s + 1) + ' / ' + SENTS;
    /* 这一句自己的进度条：只在这句话的时间窗内从 0 走到 100 */
    var p = Math.max(0, Math.min(1, (t - (s === 0 ? 0 : 0)) / SENTSEG - Math.floor(t / SENTSEG)));
    capBar.style.width = ((t / SENTSEG - Math.floor(t / SENTSEG)) * 100) + '%';
  }

  if (reduce) {
    var still = Math.round(N * 0.62);
    gsap.set(bars, { height: (function (k) { return function (i) { return heightAt(i, k); }; })(still) });
    paintLine(still * SEG);
    gsap.set('#fill', { width: '62%' });
    gsap.set('#tc', { textContent: '00:03' });
    fadeInReduce(['#promo', '#main', '#stripe', '#foot'], 0);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#eyebrow', 0.14, 0, -20, 0.22);
  slam('#lctag', 0.22, 24, -20, 0.22);
  slam('#titleA', 0.36, -34, -34, 0.28);
  slam('#lineB', 0.52, -34, -34, 0.28);
  press('#titleB', '8px 8px 0 ' + '#0F0F0F', 0.80);
  slam('#sub', 0.70, 0, -20, 0.24);
  slam('#capwrap', 0.84, 0, 22, 0.26);
  slam('#energy', 0.94, 0, 20, 0.24);
  paintLine(0);

  for (var k = 0; k < STEPS; k++) {
    tl.to(bars, { height: (function (kk) { return function (i) { return heightAt(i, kk); }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.call((function (kk) { return function () { paintLine(kk * SEG); }; })(k), null, k * SEG);
  }
  tl.fromTo('#fill', { width: '0%' }, { width: '100%', duration: WIN, ease: 'none' }, 0);
  var tcEl = document.getElementById('tc');
  for (var s2 = 0; s2 <= Math.floor(WIN); s2++) {
    tl.set(tcEl, { textContent: '00:' + (s2 < 10 ? '0' + s2 : String(s2)) }, s2);
  }
  tl.set(tcEl, { textContent: '00:0' + Math.ceil(WIN) }, WIN);

  slam('#foot', 0.98, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.10);

  /* 收尾：音频窗口走完后补一段静止，时间轴总长恰好等于音轨长度，
     样片视频与音轨严丝合缝，最后一拍是「已播完」的定格画面。 */
  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
