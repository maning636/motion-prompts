<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"STEPS / 步骤条"},
{"id":"title","name":"主标题","type":"string","label":"主标题（一行，12–18 字）","default":"把一条口播拆成四步，就不容易讲乱"},
{"id":"s1","name":"步骤 1 标题","type":"string","label":"第 1 步标题（4–8 字）","default":"先定一句话"},
{"id":"d1","name":"步骤 1 说明","type":"string","label":"第 1 步说明（10–18 字）","default":"写不出这一句就别开机"},
{"id":"s2","name":"步骤 2 标题","type":"string","label":"第 2 步标题","default":"再拆三个动作"},
{"id":"d2","name":"步骤 2 说明","type":"string","label":"第 2 步说明","default":"每个动作只干一件事"},
{"id":"s3","name":"步骤 3 标题","type":"string","label":"第 3 步标题","default":"挑一个能拍的"},
{"id":"d3","name":"步骤 3 说明","type":"string","label":"第 3 步说明","default":"拍不了的整段删掉"},
{"id":"s4","name":"步骤 4 标题","type":"string","label":"第 4 步标题","default":"最后才配画面"},
{"id":"d4","name":"步骤 4 说明","type":"string","label":"第 4 步说明","default":"顺序反了就会返工"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"步骤 3–4 步 · 每步一个动作"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（当前步编号块 + 斜纹带）","default":"#2FD07A"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>步骤条 · 把一条口播拆成四步</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:44px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文主标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:72px;line-height:1.14;
    letter-spacing:0;margin-top:18px;padding-right:24px}

  /* 步骤条：横向四步，步与步之间是 3px 实线连接条，不是留白（基因 7） */
  .steps{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;
    margin:40px 88px 0;border-top:var(--bw) solid var(--ink)}
  .step{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px;
    justify-content:center;padding:26px 24px;border-right:var(--bw) solid var(--ink)}
  .step:last-child{border-right:0;padding-right:0}
  .step:first-child{padding-left:0}
  /* 编号块：52×52 白底方块（流程卡编号块语法，浅底用 ink 阴影） */
  .no{flex:0 0 auto;width:52px;height:52px;display:flex;align-items:center;
    justify-content:center;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    font-family:var(--mono);font-weight:700;font-size:22px}
  .step.on .no{background:var(--accent)}
  .st{display:block;white-space:nowrap;font-weight:900;font-size:40px;line-height:1.2;
    letter-spacing:0;padding-right:12px}
  .dt{display:block;white-space:nowrap;font-size:26px;font-weight:700;line-height:1.4;
    letter-spacing:0;color:var(--ink-70);padding-right:12px}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:32px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">STEPS / 步骤条</div>
    <div class="title anim" id="title" data-fit-max="72" data-fit-min="36">把一条口播拆成四步，就不容易讲乱</div>
  </div>

  <div class="steps anim" id="steps">
    <div class="step on anim" id="step1">
      <span class="no anim" id="no1">01</span>
      <span class="st anim" id="s1" data-fit-max="40" data-fit-min="20">先定一句话</span>
      <span class="dt anim" id="d1" data-fit-max="26" data-fit-min="13">写不出这一句就别开机</span>
    </div>
    <div class="step anim" id="step2">
      <span class="no anim" id="no2">02</span>
      <span class="st anim" id="s2" data-fit-max="40" data-fit-min="20">再拆三个动作</span>
      <span class="dt anim" id="d2" data-fit-max="26" data-fit-min="13">每个动作只干一件事</span>
    </div>
    <div class="step anim" id="step3">
      <span class="no anim" id="no3">03</span>
      <span class="st anim" id="s3" data-fit-max="40" data-fit-min="20">挑一个能拍的</span>
      <span class="dt anim" id="d3" data-fit-max="26" data-fit-min="13">拍不了的整段删掉</span>
    </div>
    <div class="step anim" id="step4">
      <span class="no anim" id="no4">04</span>
      <span class="st anim" id="s4" data-fit-max="40" data-fit-min="20">最后才配画面</span>
      <span class="dt anim" id="d4" data-fit-max="26" data-fit-min="13">顺序反了就会返工</span>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">步骤 3–4 步 · 每步一个动作</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 's1', 'd1', 's2', 'd2', 's3', 'd3', 's4', 'd4', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#steps',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  /* 模 7 分格揭示：步骤条顶边从左逐格画出 */
  tl.fromTo('#steps', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.36, ease: 'steps(8)' }, 0.34);

  /* 四步依次自上而下落位，每步内部再错峰，跟全族的「拍进来」节奏一致 */
  var ids = [['#step1', '#no1', '#s1', '#d1'], ['#step2', '#no2', '#s2', '#d2'],
             ['#step3', '#no3', '#s3', '#d3'], ['#step4', '#no4', '#s4', '#d4']];
  for (var i = 0; i < ids.length; i++) {
    var at = 0.60 + i * 0.22;
    tl.fromTo(ids[i][0], { y: -32 }, { y: 0, duration: 0.26, ease: 'power4.out' }, at);
    tl.fromTo(ids[i][1], { x: -24 }, { x: 0, duration: 0.22, ease: 'power4.out' }, at + 0.06);
    tl.fromTo(ids[i][2], { y: -18 }, { y: 0, duration: 0.22, ease: 'power4.out' }, at + 0.10);
    tl.fromTo(ids[i][3], { y: -18 }, { y: 0, duration: 0.22, ease: 'power4.out' }, at + 0.14);
    tl.set(ids[i][1], { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, at + 0.28);
    tl.to(ids[i][1], { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.32);
  }

  slam('#footrow', 1.86, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.98);
  slam('#note',    2.12, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.26);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.60);

  var introEnd = 3.60;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
