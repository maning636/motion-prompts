<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"YES NO / 两行对比"},
{"id":"leftLab","name":"左侧标签","type":"string","label":"左侧列头（mono + 中文，2–8 字）","default":"以前 / BEFORE"},
{"id":"leftMark","name":"左侧符号","type":"string","label":"左侧符号（1 字）","default":"✕"},
{"id":"leftBig","name":"左侧大字","type":"string","label":"左侧大字（一行，4–7 字）","default":"先剪画面"},
{"id":"leftNote","name":"左侧说明","type":"string","label":"左侧说明（一行，10–18 字）","default":"素材齐了才开始想说什么"},
{"id":"rightLab","name":"右侧标签","type":"string","label":"右侧列头","default":"现在 / NOW"},
{"id":"rightMark","name":"右侧符号","type":"string","label":"右侧符号（1 字）","default":"✓"},
{"id":"rightBig","name":"右侧大字","type":"string","label":"右侧大字（一行，4–7 字）","default":"先写句子"},
{"id":"rightNote","name":"右侧说明","type":"string","label":"右侧说明（一行，10–18 字）","default":"写完一句话，剩下的画面才有取舍标准"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"两栏同宽同字号 · 只换内容不换版式"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（斜纹带）","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>对比两行字 · 以前先剪画面，现在先写句子</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-l{box-shadow:8px 8px 0 var(--ink)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}

  /* 对比区：两栏同宽，中间隔 3px 实线；左右用不同底的色卡区分（不是 opacity，基因 5） */
  .duo{flex:1 1 auto;min-height:0;display:flex;align-items:center;
    padding:36px 88px 0;gap:0}
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:20px;
    padding:34px 44px 32px;border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:6px 6px 0 var(--ink);background:var(--white)}
  .col.r{margin-left:-3px}
  .chead{display:flex;align-items:center;gap:18px}
  .mark{flex:0 0 auto;width:64px;height:64px;display:flex;align-items:center;
    justify-content:center;border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:4px 4px 0 var(--ink);background:var(--ink);color:var(--white);
    font-family:var(--mono);font-weight:900;font-size:34px;line-height:1}
  .col.r .mark{background:var(--green);color:var(--ink)}
  .clab{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.08em}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .cbig{display:block;white-space:nowrap;font-weight:900;font-size:76px;line-height:1.16;
    letter-spacing:0;padding-right:16px}
  .cnote{display:block;white-space:nowrap;font-size:28px;font-weight:700;line-height:1.4;
    letter-spacing:0;padding-top:18px;border-top:var(--bw) solid var(--ink)}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:32px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">YES NO / 两行对比</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="duo anim" id="duo">
    <div class="col anim" id="colL">
      <div class="chead anim" id="headL">
        <span class="mark anim" id="leftMark" data-fit-max="34" data-fit-min="17">✕</span>
        <span class="clab anim" id="leftLab" data-fit-max="24" data-fit-min="14">以前 / BEFORE</span>
      </div>
      <div class="cbig anim" id="leftBig" data-fit-max="76" data-fit-min="38">先剪画面</div>
      <div class="cnote anim" id="leftNote" data-fit-max="28" data-fit-min="14">素材齐了才开始想说什么</div>
    </div>
    <div class="col r anim" id="colR">
      <div class="chead anim" id="headR">
        <span class="mark anim" id="rightMark" data-fit-max="34" data-fit-min="17">✓</span>
        <span class="clab anim" id="rightLab" data-fit-max="24" data-fit-min="14">现在 / NOW</span>
      </div>
      <div class="cbig anim" id="rightBig" data-fit-max="76" data-fit-min="38">先写句子</div>
      <div class="cnote anim" id="rightNote" data-fit-max="28" data-fit-min="14">写完一句话，画面才有取舍标准</div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">两栏同宽同字号 · 只换内容不换版式</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'leftLab', 'leftMark', 'leftBig', 'leftNote',
   'rightLab', 'rightMark', 'rightBig', 'rightNote', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#duo',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';
  function press(sel, at) {
    tl.set(sel, { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);

  /* 对撞：左栏从左撞入、右栏从右撞入，在中间那一拍同时落定 */
  slam('#duo',   0.20,   0, -24, 0.28);
  slam('#colL', 0.34, -80, 0, 0.28);
  slam('#colR', 0.34,  80, 0, 0.28);
  slam('#headL', 0.52, -24, -24, 0.24);
  slam('#headR', 0.52,  24, -24, 0.24);
  press('#leftMark', 0.76);
  press('#rightMark', 0.76);
  slam('#leftBig',  0.80, -28, 0, 0.24);
  slam('#rightBig', 0.80,  28, 0, 0.24);
  slam('#leftNote', 0.96, -24, 0, 0.22);
  slam('#rightNote',0.96,  24, 0, 0.22);

  slam('#footrow', 1.36, 0, 24, 0.26);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.48);
  slam('#note',    1.62, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.76);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.10);

  var introEnd = 3.10;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
