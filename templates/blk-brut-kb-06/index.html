<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"BODY / 段落揭示"},
{"id":"title","name":"段落主题","type":"string","label":"段落主题（一行，12–18 字）","default":"一条视频能不能留人，看前三秒讲没讲明白"},
{"id":"no","name":"序号","type":"string","label":"左侧段落序号（mono，两到三位）","default":"01"},
{"id":"p1","name":"正文第一行","type":"string","label":"正文第 1 行","default":"先说结论，再说过程，这是口播最省时间的顺序"},
{"id":"p2","name":"正文第二行","type":"string","label":"正文第 2 行","default":"观众没耐心等你铺垫，他只等一个能带走的结论"},
{"id":"p3","name":"正文第三行","type":"string","label":"正文第 3 行","default":"铺垫不是不能有，是要压到一句话之内"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（序号 + 斜纹带）","default":"#FFD429"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>逐行揭示段落 · 一条视频能不能留人，看前三秒讲没讲明白</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整块换底色（基因 10）：ink 底 + white 字，反白是整块替换，不叠蒙版 */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--white)}
  .sh-m{box-shadow:6px 6px 0 var(--white)}

  .hd{flex:0 0 auto;padding:52px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--accent);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .title{display:block;white-space:nowrap;font-weight:900;font-size:56px;line-height:1.14;
    letter-spacing:0;color:var(--white)}

  /* 主体：左序号 + 右三行遮罩揭示 */
  .bd{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:56px;padding:0 88px}
  .no{flex:0 0 auto;width:220px;height:220px;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    font-family:var(--mono);font-weight:900;font-size:112px;line-height:1;letter-spacing:0}

  .lines{flex:1 1 0;min-width:0}
  /* 遮罩揭示：父级 overflow:hidden，子级从 110% 落到 0 —— 无模糊、纯机械 */
  .rev{overflow:hidden;padding:6px 0}
  .rev .ln{display:block;white-space:nowrap;font-size:40px;font-weight:700;line-height:1.34;
    letter-spacing:0;color:var(--white);padding-right:24px}

  /* 深底专用阴影档位（规则 B：承载底色是深色，阴影换成白） */
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--paper);
    border-bottom:var(--bw) solid var(--paper);
    background:repeating-linear-gradient(45deg,var(--paper) 0 10px,var(--accent) 10px 20px)}

  .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:24px 88px;background:var(--paper);color:var(--ink)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em}
  .foot .fc{font-size:26px;font-weight:700;letter-spacing:0}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">BODY / 段落揭示</span>
    <div class="title anim" id="title" data-fit-max="56" data-fit-min="28">一条视频能不能留人，看前三秒讲没讲明白</div>
  </div>

  <div class="bd anim" id="bd">
    <div class="no anim" id="no" data-fit-max="112" data-fit-min="56">01</div>
    <div class="lines anim" id="lines">
      <div class="rev"><div class="ln anim" id="p1" data-fit-max="40" data-fit-min="20">先说结论，再说过程，这是口播最省时间的顺序</div></div>
      <div class="rev"><div class="ln anim" id="p2" data-fit-max="40" data-fit-min="20">观众没耐心等你铺垫，他只等一个能带走的结论</div></div>
      <div class="rev"><div class="ln anim" id="p3" data-fit-max="40" data-fit-min="20">铺垫不是不能有，是要压到一句话之内</div></div>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>

  <div class="foot anim" id="foot">
    <span class="fm">REVEAL / 2026</span><span class="fc">积木社 · 先搭骨架再上色</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'no', 'p1', 'p2', 'p3'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：遮罩揭示整体落终态，只留透明度 + ≤8px 微位移 */
    gsap.set('#p1', { yPercent: 0, y: 0 });
    gsap.set('#p2', { yPercent: 0, y: 0 });
    gsap.set('#p3', { yPercent: 0, y: 0 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#bd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.14);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.3);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd', 0.00, -28, -20, 0.26);
  /* 模 7 分格揭示：底部斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 0.06);
  slam('#bd',    0.22,   0, -24, 0.28);
  slam('#no',    0.34, -40, -40, 0.26);

  /* 遮罩揭示：子级 translateY 110% → 0，整段逐行错峰 0.16s，
     零模糊伪影、零回弹（iart §7.9 的遮罩揭示标准做法）。 */
  tl.fromTo('#p1', { yPercent: 112 },
    { yPercent: 0, duration: 0.5, ease: 'power4.out' }, 0.66);
  tl.fromTo('#p2', { yPercent: 112 },
    { yPercent: 0, duration: 0.5, ease: 'power4.out' }, 0.82);
  tl.fromTo('#p3', { yPercent: 112 },
    { yPercent: 0, duration: 0.5, ease: 'power4.out' }, 0.98);

  /* 模 9 阴影档位脉冲：三行落定瞬间换一次档再换回来，只在档位间 steps 跳 */
  tl.to('#no', { boxShadow: '8px 11px 0 #FFFFFF', duration: 0.06, ease: 'steps(2)' }, 0.62);
  tl.to('#no', { boxShadow: '8px 8px 0 #FFFFFF', duration: 0.06, ease: 'steps(2)' }, 0.68);

  slam('#foot', 1.40, 0, 24, 0.26);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.3, ease: 'none' }, 1.55);

  var introEnd = 2.85;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
