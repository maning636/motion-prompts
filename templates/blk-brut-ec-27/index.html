<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"ORIGIN / 产地"},{"id":"place","name":"产地名","type":"string","label":"产地名称（大方块里的超大字）","default":"新疆阿克苏"},{"id":"coord","name":"坐标","type":"string","label":"坐标（mono 一行）","default":"41.17°N / 80.26°E"},{"id":"alt","name":"海拔","type":"number","label":"海拔（米）","default":1650},{"id":"rain","name":"年降水","type":"number","label":"年降水量（毫米）","default":62},{"id":"sun","name":"年日照","type":"number","label":"年日照时长（小时）","default":2802},{"id":"altLabel","name":"海拔标签","type":"string","label":"数据格一标签","default":"ALTITUDE / 海拔"},{"id":"rainLabel","name":"降水标签","type":"string","label":"数据格二标签","default":"RAIN / 年降水"},{"id":"sunLabel","name":"日照标签","type":"string","label":"数据格三标签","default":"SUN / 年日照"},{"id":"note","name":"口径说明","type":"string","label":"口径说明（一行 mono）","default":"口径：数据取自当地气象站近十年均值 · 非营销话术"},{"id":"accent","name":"强调色","type":"color","label":"强调色（斜纹带 / 坐标字）","default":"#2FD07A"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="整版换色构图：满版强调黄底上居中一枚近黑大方块压着产地超大字与坐标，底部一条反白数据带平铺海拔、降水、日照三格">
<title>产地卖点档案 · 新疆阿克苏</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整版换色：满版底只允许 yellow / pink，整块替换不叠蒙版（基因 10 / §1.2） */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--yellow);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;height:66px;display:flex;align-items:center;gap:22px;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--white);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .hd .nt{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-size:24px;font-weight:700;
    color:var(--white)}

  /* 中央：近黑大方块压着产地超大字与坐标 */
  .place{flex:1 1 auto;min-height:0;display:flex;align-items:center;
    justify-content:center;padding:40px 72px;overflow:hidden}
  .block{flex:0 1 auto;max-width:1400px;display:flex;flex-direction:column;
    align-items:center;gap:22px;padding:44px 96px 48px;
    background:var(--ink);color:var(--yellow);
    border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:10px 10px 0 var(--white)}
  .block .nm{display:block;white-space:nowrap;font-weight:900;font-size:172px;
    line-height:1;letter-spacing:0;color:var(--yellow);max-width:100%}
  .block .co{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:32px;
    letter-spacing:.14em;color:var(--white);max-width:100%;overflow:hidden;
    text-overflow:ellipsis}

  /* 底部反白数据带：三格白块压在 ink 条上，白底用 ink 阴影（阴影色随承载底色走） */
  .data{flex:0 0 auto;display:flex;gap:24px;padding:30px 72px 34px;
    background:var(--ink)}
  .dcard{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px;
    align-items:flex-start;padding:22px 28px;background:var(--white);color:var(--ink);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--yellow)}
  .dcard .k{display:block;white-space:nowrap;font-family:var(--mono);font-weight:700;
    font-size:22px;letter-spacing:.14em;color:var(--mute);max-width:100%;
    overflow:hidden;text-overflow:ellipsis}
  .dcard .v{display:flex;align-items:baseline;gap:10px}
  .dcard .v b{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:88px;line-height:1;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .dcard .v i{font-family:var(--mono);font-style:normal;font-weight:700;font-size:32px;
    letter-spacing:.04em}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--white) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="hd anim" id="hd">
    <span class="tag">ORIGIN</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">ORIGIN / 产地</span>
    <span class="nt anim" id="note" data-fit-max="24" data-fit-min="15">口径：数据取自当地气象站近十年均值 · 非营销话术</span>
  </div>

  <div class="place anim" id="place">
    <div class="block anim" id="block">
      <span class="nm anim" id="place" data-fit-max="172" data-fit-min="80">新疆阿克苏</span>
      <span class="co anim" id="coord" data-fit-max="32" data-fit-min="20">41.17°N / 80.26°E</span>
    </div>
  </div>

  <div class="data anim" id="data">
    <div class="dcard anim" id="dc1">
      <span class="k anim" id="altLabel" data-fit-max="22" data-fit-min="14">ALTITUDE / 海拔</span>
      <span class="v"><b class="anim" id="alt" data-fit-max="88" data-fit-min="40">1650</b><i>m</i></span>
    </div>
    <div class="dcard anim" id="dc2">
      <span class="k anim" id="rainLabel" data-fit-max="22" data-fit-min="14">RAIN / 年降水</span>
      <span class="v"><b class="anim" id="rain" data-fit-max="88" data-fit-min="40">62</b><i>mm</i></span>
    </div>
    <div class="dcard anim" id="dc3">
      <span class="k anim" id="sunLabel" data-fit-max="22" data-fit-min="14">SUN / 年日照</span>
      <span class="v"><b class="anim" id="sun" data-fit-max="88" data-fit-min="40">2802</b><i>h</i></span>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'place', 'coord', 'altLabel', 'rainLabel', 'sunLabel', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  ['alt', 'rain', 'sun'].forEach(function (id) {
    var n = Number(v[id]);
    set(id, String(isFinite(n) ? Math.max(0, Math.round(n)) : 0));
  });

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#place', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#data',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var WHT = '#FFFFFF';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, off, at) {
    /* 深底上的硬阴影换白 */
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + WHT, immediateRender: false }, at);
    tl.to(sel, { boxShadow: off + 'px ' + off + 'px 0 ' + WHT, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',     0.00,   0, -66, 0.26);
  slam('#eyebrow',0.14, -24, -20, 0.22);
  slam('#note',   0.20,  24, -20, 0.22);
  /* 大方块：power3.out + from:.86，面积单调涨到末帧 */
  tl.fromTo('#block', { scale: .86, opacity: 0 },
      { scale: 1, opacity: 1, duration: .3, ease: 'power3.out' }, 0.36);
  slam('#place',  0.54, -28, -28, 0.26);
  slam('#coord',  0.70,   0, -20, 0.22);
  shadowBounce('#block', 10, 0.90);
  /* 三格数据卡自下错峰落位 */
  tl.from('#data .dcard', { y: 56, duration: .28, ease: 'power4.out', stagger: .11 }, 0.98);
  shadowBounce('#dc1', 8, 1.32);
  shadowBounce('#dc2', 8, 1.40);
  shadowBounce('#dc3', 8, 1.48);
  slam('#stripe',  1.62,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 1.86);

  var introEnd = 3.06;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
