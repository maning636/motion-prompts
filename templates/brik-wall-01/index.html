<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"titleA","name":"左墙标题","type":"string","label":"左墙标题（进这一场之前，≤10 字）","default":"正在收尾的一期"},
{"id":"titleB","name":"右墙标题","type":"string","label":"右墙标题（进这一场之后，≤10 字）","default":"下一期正在拆的题"},
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono 标签，≤8 字）","default":"SERIES"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（左墙标题块底色）","default":"#FF5FA2"},
{"id":"brickColor","name":"配色包","type":"enum","label":"配色包（块墙的起转色，决定整面墙的色序）","default":"mixed","options":[{"value":"yellow","label":"暖黄起转"},{"value":"pink","label":"桃粉起转"},{"value":"green","label":"薄荷起转"},{"value":"blue","label":"靛蓝起转"},{"value":"mixed","label":"暖黄起转"}]},
{"id":"layout","name":"合拢","type":"enum","label":"合拢（两墙同步合拢 / 右墙错开半拍）","default":"split","options":[{"value":"split","label":"同步合拢"},{"value":"stagger","label":"右墙错峰"}]},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，转场档 6）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>块墙合拢落印</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 积木风 · 转场与镜头 · 块墙合拢落印（6s）
     满版 ink 底（全族唯一允许的满版例外，《规范》§7.3），两列块墙从左右向中间合拢
     （power4.inOut，全族唯一可用的一档 inOut），接缝合拢的瞬间落下一枚 104×104 黄底白影的
     品牌方块，方块落定即定格。块墙铺满 100% 画布，远超 80% 底线。
     墙上的块一律 sh-w（8px 白影）——深底专用阴影档。块宽只用 480，块高只用 120。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --mod:240px; --mod-h:120px; --shadow:#FFFFFF; --background:var(--ink); --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--background);color:var(--white);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  /* 深底专用硬阴影：8px 白影，X 恒等于 Y，第三值恒 0 */
  .sh-w{box-shadow:8px 8px 0 var(--white)}
  .sh-s{box-shadow:4px 4px 0 var(--white)}

  /* 两列块墙：每列 960×1080 = 2×9 块 480×120，合计铺满 1920×1080 */
  .wall{position:absolute;top:0;width:960px;height:1080px;overflow:hidden;
    display:grid;grid-template-columns:repeat(2,480px);grid-auto-rows:120px;
    background:var(--ink)}
  .wall.l{left:0}
  .wall.r{left:960px}
  .br{border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    gap:8px;padding:0 28px;overflow:hidden}
  /* 左墙标题块（grid 第 5 行第 1 列）承载眉标 + 标题 */
  .wall.l .ta{grid-column:1;grid-row:5}
  .wall.r .tb{grid-column:1;grid-row:5}
  .br .eb{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.14em;
    line-height:1;white-space:nowrap}
  .br .ti{font-size:44px;font-weight:900;line-height:1.1;letter-spacing:0;white-space:nowrap}
  .br .ti2{font-size:48px;font-weight:900;line-height:1.1;letter-spacing:0;white-space:nowrap}

  /* 品牌方块：104×104（52×52 在 1920 画布上放大一倍），黄底白影，落在两墙接缝正中 */
  .mark{position:absolute;left:908px;top:488px;width:104px;height:104px;
    display:flex;align-items:center;justify-content:center;background:var(--yellow);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:0;color:var(--ink)}

  /* 凸点 2 联，扣在落印方块顶面上（width/height 必须同时写） */
  .studs{position:absolute;left:880px;top:428px;width:160px;height:60px}
</style>
</head>
<body>
<div id="stage">
  <div class="wall l" id="wallL">
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br ta">
      <span class="eb" id="eyebrow" data-fit-max="24" data-fit-min="14">SERIES</span>
      <span class="ti" id="titleA" data-fit-max="44" data-fit-min="18">正在收尾的一期</span>
    </div>
    <div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div>
  </div>

  <div class="wall r" id="wallR">
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br tb">
      <span class="ti2" id="titleB" data-fit-max="48" data-fit-min="20">下一期正在拆的题</span>
    </div>
    <div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div><div class="br"></div><div class="br"></div>
    <div class="br"></div><div class="br"></div>
  </div>

  <div class="mark" id="mark">B</div>

  <div class="studs" id="studs">
    <svg width="160" height="60" viewBox="0 0 160 60" fill="none" aria-hidden="true">
      <circle class="sc" id="s1" cx="44"  cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      <circle class="sc" id="s2" cx="116" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
    </svg>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['eyebrow', 'titleA', 'titleB'].forEach(function (k) { set(k, v[k]); });

  var rs = document.documentElement.style;
  if (v.accent) rs.setProperty('--accent', v.accent);
  var ACC = v.accent || '#FF5FA2';

  /* 块墙色序：固定四色轮转（黄 → 粉 → 蓝 → 绿），brickColor 只决定从哪一色起转。
     单色档与 mixed 同义时仍按同一拼写返回，值域不漂。 */
  var ROT = ['#FFD429', '#FF5FA2', '#3D7BFF', '#2FD07A'];
  var START = { yellow: 0, mixed: 0, pink: 1, blue: 2, green: 3 };
  var s0 = START[v.brickColor] == null ? 0 : START[v.brickColor];
  function inkOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return '#0F0F0F';
    var f = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * f(parseInt(h.slice(0, 2), 16)) +
            0.7152 * f(parseInt(h.slice(2, 4), 16)) +
            0.0722 * f(parseInt(h.slice(4, 6), 16));
    return L > 0.42 ? '#0F0F0F' : '#FFFFFF';
  }
  /* 右墙标题块取轮转里既不是强调色、也不是品牌方块黄的那个色，撞色就退成白块 */
  var tbFace = ROT[(s0 + 2) % 4];
  if (tbFace === ACC || tbFace === '#FFD429') tbFace = '#FFFFFF';

  function paintWall(id, offset) {
    var wall = document.getElementById(id);
    if (!wall) return 0;
    var list = wall.querySelectorAll('.br');
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      var face;
      if (el.classList.contains('ta')) face = ACC;
      else if (el.classList.contains('tb')) face = tbFace;
      else face = ROT[(s0 + offset + i) % 4];
      el.style.background = face;
      ['eb', 'ti', 'ti2'].forEach(function (c) {
        var t = el.querySelector('.' + c);
        if (t) t.style.color = inkOn(face);
      });
    }
    return list.length;
  }
  var nL = paintWall('wallL', 0);
  var nR = paintWall('wallR', 1);

  /* 品牌方块的字由眉标首字母现算，用户不用多填一个字段 */
  var mark = document.getElementById('mark');
  var studs = [].slice.call(document.querySelectorAll('#studs .sc'));
  if (mark) {
    var eb = String(v.eyebrow == null ? '' : v.eyebrow).trim();
    mark.textContent = eb ? eb.charAt(0).toUpperCase() : 'B';
  }

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：块墙平移与落印砸落全撤掉，直接给合拢后的定格画面 */
    gsap.set('#wallL', { x: 0, opacity: 1 });
    gsap.set('#wallR', { x: 0, opacity: 1 });
    gsap.set('#mark', { x: 0, y: 0, opacity: 1, boxShadow: '8px 8px 0 #FFFFFF' });
    gsap.set('#studs', { x: 0, y: 0, opacity: 1 });
    gsap.set(studs, { attr: { fill: ACC } });
    tl.fromTo('#wallL', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 0);
    tl.fromTo('#wallR', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, .14);
    tl.fromTo('#mark',  { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .30);
    tl.fromTo('#studs', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .36);
    B.hold(tl, 1.15, 1.05);
    return;
  }

  var stageRect = document.getElementById('stage').getBoundingClientRect();
  var markEl = document.getElementById('mark');
  var markTop = Math.round(markEl.getBoundingClientRect().top - stageRect.top);

  /* 式 10 块墙合拢：两列墙沿水平长距离向中间合拢。power4.inOut 是全族唯一可用的一档
     inOut，专供 ≥200px 的搬移。合拢完成后全程定格（落定红线 4.56s，这里 1.5s 就收干净）。 */
  var CLOSE = 0.80, STAG = (v.layout === 'stagger') ? 0.14 : 0;
  var wallL = document.getElementById('wallL');
  var wallR = document.getElementById('wallR');
  var half = Math.round(wallL.getBoundingClientRect().width);

  tl.fromTo('#wallL', { x: -half }, { x: 0, duration: CLOSE, ease: 'power4.inOut' }, 0.00);
  tl.fromTo('#wallR', { x: half }, { x: 0, duration: CLOSE, ease: 'power4.inOut' }, STAG);

  /* 接缝合拢 → 品牌方块自画布上沿正上方落进接缝正中，落定压 2 帧后定格 */
  tl.fromTo('#mark', { y: -markTop },
    { y: 0, duration: 0.26, ease: 'power4.out' }, CLOSE + STAG + 0.20);
  tl.set('#mark', { boxShadow: '8px 11px 0 #FFFFFF', immediateRender: false }, CLOSE + STAG + 0.46);
  tl.to('#mark', { boxShadow: '8px 8px 0 #FFFFFF', duration: 0.04, ease: 'steps(2)' }, CLOSE + STAG + 0.50);

  /* 落印扣上 → 凸点随印同落，随后两枚硬切成强调色（式 8） */
  tl.fromTo('#studs', { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.26, ease: 'power4.out' }, CLOSE + STAG + 0.22);
  tl.set(studs, { attr: { fill: ACC }, immediateRender: false }, CLOSE + STAG + 0.50);

  var introEnd = tl.duration();
  var TOTAL = Math.min(6.5, Math.max(5.5, Number(v.duration) || 6));
  var holdAt = Math.min(introEnd, TOTAL - 1.2);
  B.hold(tl, holdAt, Math.max(1.2, TOTAL - holdAt));
})();
</script>
</body></html>
