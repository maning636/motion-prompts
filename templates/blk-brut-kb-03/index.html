<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"badge","name":"徽标","type":"string","label":"左上角徽章（mono 胶囊）","default":"SLOGAN / 标语"},{"id":"titleA","name":"标语 · 第一行","type":"string","label":"标语第一行","default":"不圆滑，也不好惹"},{"id":"titleB","name":"标语 · 第二行","type":"string","label":"标语第二行","default":"但一定好记"},{"id":"st1","name":"贴纸 1","type":"string","label":"第一枚贴纸文案","default":"拒绝圆润"},{"id":"st2","name":"贴纸 2","type":"string","label":"第二枚贴纸文案","default":"只做硬边"},{"id":"accent","name":"强调色","type":"color","label":"强调色（斜纹带 + 落款方块）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>标语贴纸组合 · 不圆滑，也不好惹，但一定好记</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0
     （风格规范 §8 交付骨架自己就把眉标写成 26px = 13×2），即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--ink);color:var(--white);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--yellow);color:var(--ink);padding:3px 14px;border-radius:9999px}
  .promo .parw{color:var(--yellow);font-weight:900}

  .hero{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    padding:52px 88px 56px}

  /* 徽章（§3.2）：mono + 胶囊 + 微档阴影 3px */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:22px}
  .badge{display:inline-block;border-radius:9999px;padding:8px 20px;
    font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    background:var(--pink);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);white-space:nowrap;flex:0 1 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .tagline{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}

  /* 中文大字：一行一块、nowrap，交给 B.fit() 按容器实测缩放，绝不写死 font-size。
     字距取 0——中文收紧会粘连（iart 拆解 §7.9 明确要求推翻负字距）。 */
  .stack{flex:0 0 auto;width:100%;padding-right:28px;margin-top:auto}
  .line{display:block;white-space:nowrap;font-weight:900;font-size:152px;
    line-height:1.06;letter-spacing:0}

  /* 3px 实线当分隔（基因 7），不靠留白分段 */
  .rule{flex:0 0 auto;width:100%;margin:40px 0 36px;border-top:var(--bw) solid var(--ink)}

  /* 贴纸群（§3.11）：两个胶囊 + 一个裸字符重音，一排只允许有一个裸字符件。
     胶囊是 flex 行里的 nowrap 件，B.fit 量的是父容器宽、量不出一行里两枚加起来超宽，
     所以这里必须自己带收缩护栏——否则长文案会把 ★ 顶出画布。 */
  .stickers{flex:0 0 auto;display:flex;align-items:center;gap:20px;min-width:0}
  .st{display:inline-block;flex:0 1 auto;min-width:0;max-width:600px;
    overflow:hidden;text-overflow:ellipsis;
    padding:10px 24px;font-size:28px;font-weight:700;
    border-radius:9999px;border:var(--bw) solid var(--ink);background:var(--pink);
    color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  .st.g{background:var(--green)}
  .star{flex:0 0 auto;font-size:68px;line-height:1;color:var(--blue);font-weight:900;
    text-shadow:2px 2px 0 var(--ink)}

  .markrow{flex:0 0 auto;margin-top:auto;display:flex;align-items:center;gap:22px}
  .mark{width:52px;height:52px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    font-family:var(--mono);font-weight:700;font-size:22px}
  .names{display:flex;align-items:baseline;gap:14px}
  .names .cn{font-weight:900;font-size:34px}
  .names .en{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em}
  .year{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:8px 20px;border-radius:9999px;
    background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);white-space:nowrap;flex:0 1 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}

  /* 斜纹带：45° repeating，周期 10+10=20px（基因 4 唯一合法渐变） */
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:22px 88px;background:var(--ink);color:var(--white)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow)}
  .foot .fc{font-size:26px;font-weight:700;letter-spacing:0}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="promo anim" id="promo">
    <span class="ptag">STICKER</span><span class="ptx">标语贴纸组合 · 依次拍入 + 斜纹带收尾</span><span class="parw">→</span>
  </div>

  <div class="hero anim" id="hero">
    <div class="top">
      <span class="badge anim" id="badge" data-fit-max="22" data-fit-min="14">SLOGAN / 标语</span>
      <span class="tagline anim" id="tagline" data-fit-max="22" data-fit-min="14">RULE / 规矩写在前面</span>
    </div>

    <div class="stack">
      <div class="line anim" id="titleA" data-fit-max="152" data-fit-min="76">不圆滑，也不好惹</div>
      <div class="line anim" id="titleB" data-fit-max="152" data-fit-min="76">但一定好记</div>
    </div>

    <div class="rule anim" id="rule"></div>

    <div class="stickers">
      <span class="st anim" id="st1" data-fit-max="28" data-fit-min="16">拒绝圆润</span>
      <span class="st g anim" id="st2" data-fit-max="28" data-fit-min="16">只做硬边</span>
      <span class="star anim" id="star" aria-hidden="true">★</span>
    </div>

    <div class="markrow">
      <div class="mark anim" id="mark">BB</div>
      <div class="names anim" id="brand"><span class="cn">积木社</span><span class="en">BLOCKBRUT</span></div>
      <div class="year anim" id="year" data-fit-max="22" data-fit-min="14">2017 — 2026</div>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>

  <div class="foot anim" id="foot">
    <span class="fm">STICKER / 2026</span><span class="fc">积木社 · 一条规矩一个动作</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['badge', 'titleA', 'titleB', 'st1', 'st2'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('.promo', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('.hero',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.15);
    tl.fromTo('.stripe', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.35);
    tl.fromTo('.foot',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  /* 模 1 拍进来：落定瞬间阴影压 2 帧再弹回原档，总阴影回弹 ≤0.12s */
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#promo',   0.00,   0, -56, 0.26);
  slam('#badge',   0.18, -28, -28, 0.24);
  shadowBounce('#badge', '3px 3px 0 ' + INK, 0.42);
  slam('#tagline', 0.28,   0, -20, 0.22);
  slam('#titleA',   0.44, -28, -28, 0.26);
  slam('#titleB',   0.60, -28, -28, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.26, ease: 'power4.out' }, 0.82);
  slam('#st1',     0.96, -28, -28, 0.24);
  shadowBounce('#st1', '4px 4px 0 ' + INK, 1.20);
  slam('#st2',     1.06, -28, -28, 0.24);
  shadowBounce('#st2', '4px 4px 0 ' + INK, 1.30);
  slam('#star',    1.16, -28, -28, 0.24);
  slam('#mark',    1.30, -28, -28, 0.24);
  shadowBounce('#mark', '4px 4px 0 ' + INK, 1.54);
  slam('#brand',   1.38,   0, -20, 0.22);
  slam('#year',    1.46,  28, -28, 0.24);
  slam('#foot',    1.58,   0,  24, 0.26);
  /* 模 7 分格揭示：斜纹带作为收尾的一拍，从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.36, ease: 'steps(8)' }, 1.70);
  /* 模 6：条纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.06);

  var introEnd = 3.26;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
