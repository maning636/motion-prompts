<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"no","name":"章节编号","type":"string","label":"章节编号（mono，两位）","default":"03"},{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"CHAPTER / 章节"},{"id":"title","name":"反白大标题","type":"string","label":"反白大标题（一行）","default":"组件语法"},{"id":"sub","name":"副标题","type":"string","label":"副标题（一行短句）","default":"从描边到阴影的十条硬规矩"},{"id":"ground","name":"换色后的底","type":"color","label":"整块换色后的满版底色","default":"#3D7BFF"},{"id":"accent","name":"强调色","type":"color","label":"强调色（斜纹带 + 落款方块）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>章节转场卡 · 03 组件语法</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0
     （风格规范 §8 交付骨架自己就把眉标写成 26px = 13×2），即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429; --ground:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 满版色块：整块换底色（基因 10），不叠半透明蒙版 */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* 深底专用阴影档位（规则 B：承载底色是深色，阴影换成白） */
  .sh-w{box-shadow:8px 8px 0 var(--white)}

  /* 斜纹带：深底上把 ink 那档换成 paper，整块反白（基因 10） */
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--paper);
    border-bottom:var(--bw) solid var(--paper)}
  .stripe.a{background:repeating-linear-gradient(45deg,var(--paper) 0 10px,var(--accent) 10px 20px)}
  .stripe.b{background:repeating-linear-gradient(-45deg,var(--paper) 0 10px,var(--pink) 10px 20px)}

  .hd{flex:0 0 auto;padding:48px 88px 0;display:flex;align-items:baseline;gap:30px}
  .no{font-family:var(--mono);font-weight:900;font-size:152px;line-height:1;
    letter-spacing:0;white-space:nowrap;flex:0 0 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    text-transform:uppercase;white-space:nowrap;flex:0 1 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}

  /* 中文大字：一行一块、nowrap，交给 B.fit() 按容器实测缩放，绝不写死 font-size。
     字距取 0——中文收紧会粘连（iart 拆解 §7.9 明确要求推翻负字距）。 */
  .stack{flex:0 0 auto;padding:0 88px;margin-top:auto}
  .tline{display:block;white-space:nowrap;font-weight:900;font-size:152px;line-height:1.06;
    letter-spacing:0}

  .mid{flex:0 0 auto;padding:0 88px;margin-top:auto}
  .rule{width:100%;margin:36px 0 30px;border-top:var(--bw) solid var(--paper)}
  .sub{display:block;white-space:nowrap;font-size:34px;font-weight:700;line-height:1.5;
    letter-spacing:0;color:var(--white)}
  /* 章节进度格：当前章用强调色实心，其余只留 3px 白边（无 opacity，基因 5） */
  .ticks{display:flex;gap:14px;margin-top:34px}
  .ticks i{display:block;width:88px;height:16px;border:var(--bw) solid var(--paper)}
  .ticks i.on{background:var(--accent)}

  .markrow{flex:0 0 auto;padding:0 88px 48px;margin-top:auto;display:flex;align-items:center;gap:22px}
  .mark{width:52px;height:52px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--paper);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    font-family:var(--mono);font-weight:700;font-size:22px}
  .names{display:flex;align-items:baseline;gap:14px}
  .names .cn{font-weight:900;font-size:34px;color:var(--white)}
  .names .en{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--white)}
  .year{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:8px 20px;border-radius:9999px;
    background:var(--white);color:var(--ink);border:var(--bw) solid var(--paper);
    box-shadow:6px 6px 0 var(--paper);white-space:nowrap;flex:0 1 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="stripe a anim" id="stripeA"></div>

  <div class="hd anim" id="hd">
    <span class="no anim" id="no" data-fit-max="152" data-fit-min="76">03</span>
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">CHAPTER / 章节</span>
  </div>

  <div class="stack anim" id="stack">
    <div class="tline anim" id="title" data-fit-max="152" data-fit-min="76">组件语法</div>
  </div>

  <div class="mid anim" id="mid">
    <div class="rule anim" id="rule"></div>
    <div class="sub anim" id="sub" data-fit-max="34" data-fit-min="18">从描边到阴影的十条硬规矩</div>
    <div class="ticks anim" id="ticks"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="stripe b anim" id="stripeB"></div>

  <div class="markrow anim" id="markrow">
    <div class="mark anim" id="mark">BB</div>
    <div class="names anim" id="brand"><span class="cn">积木社</span><span class="en">BLOCKBRUT</span></div>
    <div class="year anim" id="year" data-fit-max="22" data-fit-min="14">2017 — 2026</div>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['no', 'eyebrow', 'title', 'sub'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  if (v.ground) document.documentElement.style.setProperty('--ground', v.ground);

  /* 章节进度格：按编号点亮对应的一格，编号越界就全部留空框 */
  var idx = parseInt(String(v.no == null ? '' : v.no).replace(/[^0-9]/g, ''), 10);
  var ticks = document.querySelectorAll('#ticks i');
  if (idx >= 1 && idx <= ticks.length) ticks[idx - 1].className = 'on';

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0,
      clipPath: 'inset(0 0% 0 0%)' });
    /* 降级分支直接给换色后的成品画面：不做整块换色转场，也不做斜纹带擦出 */
    gsap.set('#stage', { backgroundColor: v.ground || '#3D7BFF' });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#stack',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.15);
    tl.fromTo('#mid',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.3);
    tl.fromTo('#markrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.45);
    tl.fromTo('#stripeA', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.15);
    tl.fromTo('#stripeB', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.3);
    B.hold(tl, 1.25, 1.05);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  /* 模 1 拍进来：落定瞬间阴影压 2 帧再弹回原档，总阴影回弹 ≤0.12s */
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + rest.split(' ')[3],
      immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripeA', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 0);

  slam('#no',        0.10, -28, -28, 0.26);
  slam('#eyebrow',  0.24,   0, -20, 0.22);
  slam('#title',    0.40, -28, -28, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.26, ease: 'power4.out' }, 0.66);
  slam('#sub',      0.74,   0, -20, 0.24);
  /* 模 2 硬着陆：进度格只走位移，opacity 保持 1 */
  tl.from('#ticks i', { y: -20, duration: 0.2, ease: 'power4.out', stagger: 0.06 }, 0.86);
  slam('#mark',     1.00, -28, -28, 0.24);
  shadowBounce('#mark', '8px 8px 0 #FFFFFF', 1.24);
  slam('#brand',    1.06,   0, -20, 0.22);
  slam('#year',     1.14,  28, -28, 0.24);

  /* 整块换色式转场：模 8 色块闪切，1 帧硬切，不做渐变过渡 */
  tl.set('#stage', { backgroundColor: '#0F0F0F', immediateRender: false }, 0);
  tl.set('#stage', { backgroundColor: v.ground || '#3D7BFF', immediateRender: false }, 1.44);
  tl.fromTo('#stripeB', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.52);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('.stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 1.94);

  var introEnd = 2.94;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
