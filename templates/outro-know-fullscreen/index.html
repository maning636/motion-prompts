<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"main","type":"string","label":"主文案","default":"我们下期见"},{"id":"tail","type":"string","label":"尾部细条","default":"记得点赞 · 收藏 · 关注"},{"id":"accent","type":"color","label":"强调色","default":"#3D7BFF"},{"id":"background","type":"color","label":"背景色","default":"#0B0D12"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

  <body>
      <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <h1 class="big" id="main"></h1>
        <div class="bar" id="bar"></div>
        <p class="tail" id="tail"></p>
        <div class="strip-l"></div><div class="strip" id="strip"></div>
      </section>
      </div>
    <script>
      const fallback = {main: "我们下期见", tail: "记得点赞 · 收藏 · 关注", accent: "#3D7BFF", background: "#0B0D12", foreground: "#F4EFE7"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      const root = document.getElementById("root");
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#0B0D12");
      root.style.backgroundColor = v.background;
      root.style.setProperty("--accent", v.accent ?? "#3D7BFF");
      root.style.setProperty("--fg", v.foreground ?? "#F4EFE7");
      root.style.setProperty("--ink", v.background ?? "#0B0D12");
      document.getElementById("main").textContent = v.main;
      document.getElementById("tail").textContent = v.tail;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".big", { opacity: 0, scale: 0.86, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.7)" }, 0.1);
      tl.fromTo(".bar", { scaleX: 0 }, { scaleX: 1, duration: 0.62, ease: "power3.out", transformOrigin: "center" }, 0.7);
      tl.fromTo(".tail", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.05);
      tl.fromTo(".strip", { scaleX: 0 }, { scaleX: 1, duration: 3.0, ease: "none", transformOrigin: "left" }, 0.5);
      tl.to(".bar", { scaleX: 1.32, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.8);
      tl.to(".big", { scale: 1.03, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.6);
      tl.to(".scene", { opacity: 0, duration: 0.42, ease: "power2.in" }, 4.55);
      window.__timelines.main = tl;
    </script>
  </body>
