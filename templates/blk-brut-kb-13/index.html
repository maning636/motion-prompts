<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"note","name":"顶部注脚","type":"string","label":"顶部极小 mono 注脚（出处 / 期号）","default":"VOICE / 口播 · 第 12 期 · 02:41 处"},
{"id":"titleA","name":"大标题上","type":"string","label":"大标题第一行（6–9 字，右对齐）","default":"你缺的不是"},
{"id":"titleB","name":"大标题下","type":"string","label":"大标题第二行（6–9 字，右对齐）","default":"第二个账号"},
{"id":"tag","name":"标签","type":"string","label":"底部胶囊标签（2–6 字）","default":"START OVER"},
{"id":"byline","name":"落款","type":"string","label":"底部落款（中文短句）","default":"同一个选题，第一条总是最像样"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（标签 + 右侧竖条纹）","default":"#3D7BFF"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>小字注脚加大标题 · 你缺的不是第二个账号</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0。
     这一件把层级拉到两端：注脚 22px，标题 176px，中间没有过渡层（基因 8）。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .sq{flex:0 0 auto;margin-left:auto;width:22px;height:22px;background:var(--ink)}

  /* 主体：左侧留大空白，标题整块右对齐 —— 与其他件的左对齐版式拉开距离 */
  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;align-items:flex-end;padding:0 88px}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .dl{display:block;white-space:nowrap;font-weight:900;font-size:176px;line-height:1.08;
    letter-spacing:0;text-align:right;max-width:1400px}
  .tagrow{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;
    gap:22px;padding:0 88px 46px}
  .tag{display:inline-block;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:9px 22px;border-radius:9999px;white-space:nowrap;
    background:var(--accent);color:var(--white);border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--ink)}
  .byline{display:block;white-space:nowrap;font-size:30px;font-weight:700;letter-spacing:0}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}

  /* 竖条纹带：45° repeating，周期 10+10=20px。绝对定位贴右侧收边，
     不进 flex 流（height:100% 在 flex 列里会占掉一整行、把正文顶出画布）。 */
  .vstripe{position:absolute;top:0;right:0;width:28px;height:100%;
    border-left:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">VOICE / 口播 · 第 12 期 · 02:41 处</span>
    <span class="sq anim" id="sq"></span>
  </div>

  <div class="main anim" id="main">
    <div class="dl anim" id="titleA" data-fit-max="176" data-fit-min="86">你缺的不是</div>
    <div class="dl anim" id="titleB" data-fit-max="176" data-fit-min="86">第二个账号</div>
  </div>

  <div class="tagrow anim" id="tagrow">
    <span class="rule anim" id="rule"></span>
    <span class="byline anim" id="byline" data-fit-max="30" data-fit-min="15">同一个选题，第一条总是最像样</span>
    <span class="tag anim" id="tag" data-fit-max="22" data-fit-min="14">START OVER</span>
  </div>

  <div class="vstripe anim" id="vstripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['note', 'titleA', 'titleB', 'tag', 'byline'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#top',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#main',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#tagrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#vstripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#top', 0.00, -28, -20, 0.24);
  slam('#sq',  0.14, 28, -28, 0.22);

  /* 大字从右侧硬撞入：这一件是右对齐版式，入场方向也与全族相反 */
  slam('#main',   0.26,   0, -24, 0.28);
  slam('#titleA', 0.40,  56, -48, 0.28);
  slam('#titleB', 0.58,  56, -48, 0.28);

  slam('#tagrow', 0.94,   0,  24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.3, ease: 'power4.out' }, 1.06);
  slam('#byline', 1.20,  40, 0, 0.24);
  slam('#tag',    1.34,  40, 0, 0.24);

  /* 模 7 分格揭示：右侧竖条纹带自右向左逐格推出 */
  tl.fromTo('#vstripe', { clipPath: 'inset(0 0 0 100%)' },
    { clipPath: 'inset(0 0 0 0%)', duration: 0.36, ease: 'steps(8)' }, 1.50);
  /* 模 6：条纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#vstripe', { backgroundPositionY: '0px' },
    { backgroundPositionY: '40px', duration: 1.1, ease: 'none' }, 1.86);

  var introEnd = 2.96;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
