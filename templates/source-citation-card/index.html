    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5" data-track-index="1">

        <div class="gridbg"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div id="doc" style="position:relative;width:1300px;padding:70px 80px 50px;background:#131316;border:1px solid #2A2A2E;border-radius:20px;">
            <span class="num" style="position:absolute;top:-50px;left:40px;font-size:220px;color:var(--accent,#00FF00);line-height:1;">“</span>
            <p id="claim" class="num" style="margin:30px 0 40px;font-size:46px;line-height:1.6;"></p>
            <div style="display:flex;align-items:flex-end;justify-content:space-between;">
              <div style="display:flex;align-items:baseline;gap:14px;">
                <span class="num" id="value" style="font-size:150px;line-height:1;color:var(--accent,#00FF00);">0</span>
                <span class="num" id="unit" style="font-size:56px;color:var(--accent,#00FF00);"></span>
              </div>
              <div style="text-align:right;color:#9CA3AF;font-size:22px;line-height:1.8;">
                <div id="source"></div><div id="date"></div>
              </div>
            </div>
            <hr style="border:none;border-top:1px solid #2A2A2E;margin:36px 0 20px;" />
            <p id="note" style="margin:0;font-size:20px;color:#6B7280;"></p>
          </div>
        </div>

      </section>
    </div>
    <script>
      const fallback = {"source": "数据来源：项目复盘记录", "date": "2026.07", "claim": "模板化之后，重复动效制作时间明显下降", "value": 68, "unit": "%", "note": "统计口径：同类型知识视频中的数据展示片段。", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("claim").textContent = v.claim; $("unit").textContent = v.unit;
      $("source").textContent = v.source; $("date").textContent = v.date; $("note").textContent = v.note;
      tl.fromTo("#doc", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo("#claim", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "power3.out" }, 0.6);
      countTo($("value"), v.value, 1.2, 1.2);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.4);
      tl.to(".scene", { opacity: 0, y: -30, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
