<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "眉标（mono + 大字距，≤12 字）", "default": "METER / 竖格"}, {"id": "titleA", "name": "主标题 · 前段", "type": "string", "label": "主标题第一行（普通字，≤6 字）", "default": "峰值卡住，"}, {"id": "titleB", "name": "主标题 · 彩色词块", "type": "string", "label": "主标题第二行（强调色块里的词，≤4 字）", "default": "下不来"}, {"id": "level", "name": "参考电平", "type": "number", "label": "参考电平（dBFS，0 到 0；只改刻度线位置，不改柱高逻辑）", "default": -6}, {"id": "peakHold", "name": "峰值保持", "type": "number", "label": "峰值保持秒数（0.3–1.5，只影响保持线的停留时长）", "default": 0.7}, {"id": "peaks", "name": "音频包络", "type": "string", "label": "离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）", "default": "99,252,78,277,18,362,21,376,39,465,131,351,358,138,638,67,603,298,213,830,106,613,582,14,1000,408,25,996,142,560,989,135,798,443,287,777,99,546,181,404,273,135,277,131,202,71,152,14"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色（电平柱 / 峰值保持线 / 词块）", "default": "#FF5FA2"}, {"id": "duration", "name": "总时长", "type": "number", "label": "总时长（秒，须等于音轨长度 5.6）", "default": 5.6}, {"id": "exportMode", "name": "导出格式", "type": "enum", "label": "Format", "default": "mp4", "hidden": true, "options": [{"value": "mp4", "label": "MP4"}, {"value": "webm", "label": "WebM"}, {"value": "transparent", "label": "透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>竖向电平格 · 峰值卡在上面下不来</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让**所有内联样式改动**
       都变成 0.01ms 的过渡——本族每条都有 JS 写死的内联几何（播放头 left/top、
       峰值保持线 bottom），降级分支里会卡在 CSS 旧值不动，渲染出错误位置，
       而 motion-qc 只看最终帧出框、不看降级分支的几何正确性，全绿也照样错。
       补上 transition-property:none 与 animation-name:none 才是完整写法。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }

  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--ink);color:var(--white);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--yellow);color:var(--ink);padding:3px 14px;border-radius:9999px}
  .promo .parw{color:var(--accent);font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:76px;
    padding:20px 72px 30px}

  .left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:26px}
  .hd .eyebrow{min-width:0;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stack .line{display:block;font-size:88px;font-weight:900;line-height:1.05;white-space:nowrap}
  .stack .chip{display:inline-block;line-height:1;padding:0 18px;background:var(--accent);
    color:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--ink)}
  .stack .sub{min-width:0;font-size:30px;font-weight:700;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .readout{display:flex;align-items:baseline;gap:22px;padding-top:18px;
    border-top:var(--bw) solid var(--ink)}
  .readout .big{font-family:var(--mono);font-weight:900;font-size:104px;line-height:1;
    letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .readout .unit{font-family:var(--mono);font-weight:700;font-size:28px;letter-spacing:.14em}
  .readout .ref{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.08em;
    color:var(--mute);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* 竖格电平井：26 个格子的网格是静态的，电平柱与保持线在其上动 */
  .right{flex:0 0 auto;display:flex;align-items:flex-end;gap:18px}
  .well{position:relative;width:330px;height:640px;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;overflow:hidden;
    background:repeating-linear-gradient(0deg,rgba(15,15,15,.13) 0 2px,transparent 2px 24.6px)}
  .well .vbar{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--accent)}
  .well .refline{position:absolute;left:0;right:0;height:var(--bw);background:var(--ink);z-index:3}
  .well .refline span{position:absolute;right:6px;top:-26px;font-family:var(--mono);
    font-weight:700;font-size:19px;letter-spacing:.06em;white-space:nowrap}
  #hold{position:absolute;left:0;right:0;height:7px;background:var(--ink);z-index:4}
  #hold span{position:absolute;left:6px;top:-28px;font-family:var(--mono);font-weight:900;
    font-size:19px;letter-spacing:.1em;color:var(--accent);white-space:nowrap}
  .scales{display:flex;flex-direction:column;justify-content:space-between;height:640px;
    padding-bottom:2px}
  .scales i{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.06em;
    color:var(--mute);font-style:normal;white-space:nowrap;line-height:1}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow)}
  .foot .fc{font-size:25px;font-weight:700;white-space:nowrap}
  #hold{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">PEAK</span><span class="ptx">竖向电平格 · 电平柱 + 峰值保持线</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="left">
      <div class="hd">
        <span class="eyebrow anim" id="eyebrow">METER / 竖格</span>
      </div>
      <div class="stack">
        <span class="line anim" id="titleA" data-fit-max="88" data-fit-min="44">峰值卡住，</span>
        <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="88" data-fit-min="44">下不来</span></span>
        <p class="sub anim" id="sub" data-fit-max="30" data-fit-min="16">电平掉下去了，保持线还站在原地</p>
      </div>
      <div class="readout anim" id="readout">
        <span class="big" id="db">-60</span><span class="unit">dBFS</span>
        <span class="ref" id="refdb">REF -6 dB</span>
      </div>
    </div>
    <div class="right anim" id="right">
      <div class="well" id="well">
        <div class="vbar" id="vbar"></div>
        <div class="refline" id="refline"><span>REF</span></div>
        <div id="hold"><span id="holdtx">PK 000</span></div>
      </div>
      <div class="scales">
        <i>0</i><i>-12</i><i>-24</i><i>-36</i><i>-48</i><i>-60</i>
      </div>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fm">AUD / 2026</span><span class="fc">保持线是滑动最大值，不是累加器</span>
  </div></div>
<!-- [公开版] 原音轨 音轨 voice-05.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* ---------- 音频包络：offline RMS，烘在 peaks 变量里 ----------
     这份数组来自 音轨 voice-05.wav（未随仓分发） 的离线解码（RMS，48 桶，归一到 0–1000），
     由 离线包络脚本（未随仓分发） 算出，同时落一份
     assets/voice-05.peaks.json 作溯源。
     换音轨：换 wav → 重跑离线脚本 → 把新数组填进 peaks → 同步 duration 与
     <audio data-duration>。这是一条显式的、算一次的步骤，不是缺陷。
     为什么绝不接实时 AnalyserNode：无头渲染是逐帧 seek 采样，媒体在采集模式下
     是 seek 不是 play（hyperframes runtime 的 allowLiveTimelineSeek 在
     __HF_RENDER_CAPTURE_MODE 下为 false），探针接在暂停的元素上读到的不是
     「此刻在放什么」；motion-qc 的探针同样是无序 seek。 */
  var FALLBACK_PEAKS = '99,252,78,277,18,362,21,376,39,465,131,351,358,138,638,67,603,298,213,830,106,613,582,14,1000,408,25,996,142,560,989,135,798,443,287,777,99,546,181,404,273,135,277,131,202,71,152,14';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);
  function peakAt(k) {
    return PEAKS[Math.max(0, Math.min(PEAKS.length - 1, k))];
  }

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','titleA','titleB'].forEach(function (k) { set(k, v[k]); });
  var REFDB = Math.max(-24, Math.min(0, Number(v.level) || -6));
  var HOLD = Math.max(0.3, Math.min(1.5, Number(v.peakHold) || 0.7));


  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 音频窗口：时间轴总长严格等于音轨长度，尾部留 0.6s 静音 + 定格。
     禁止用变量值推算总长（数值填大会撞 SMOKE_TOO_LONG）。 */
  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var N = PEAKS.length;

  var WELLH = 640, MAXH = 604, MINH = 10, STEPS = N, SEG = WIN / STEPS;

  /* 电平柱高度只看时间桶 k。井里的格子是静态的——动的是柱子，不是格子。 */
  function barAt(k) {
    return Math.max(MINH, Math.round(peakAt(k) / 1000 * MAXH));
  }
  function dbAt(k) { return -60 + Math.round(60 * peakAt(k) / 1000); }
  /* 峰值保持：对 [k−HOLD/SEG, k] 取滑动最大值。固定输入 + 固定窗口 = t 的纯函数，
     乱序 seek 与顺序播放给同一个答案（写成 Math.max(prev,cur) 就不成立了）。 */
  function holdAt(k) {
    var back = Math.round(HOLD / SEG);
    var m = 0;
    for (var j = Math.max(0, k - back); j <= k; j++) if (peakAt(j) > m) m = peakAt(j);
    return Math.max(MINH, Math.round(m / 1000 * MAXH));
  }

  B.fitAll();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  var well = document.getElementById('well');
  var wr = well.getBoundingClientRect();
  var refline = document.getElementById('refline');
  refline.style.bottom = Math.round(MAXH * (REFDB + 60) / 60) + 'px';
  refline.firstChild.textContent = 'REF ' + REFDB;
  document.getElementById('refdb').textContent = 'REF ' + REFDB + ' dB';

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function press(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }
  function fadeInReduce(ids, start) {
    for (var i = 0; i < ids.length; i++) {
      tl.fromTo(ids[i], { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: i === ids.length - 1 ? .6 : .5, ease: 'power3.out' },
        start + i * 0.08);
    }
  }

  var dbEl = document.getElementById('db'), holdEl = document.getElementById('hold');
  var holdTx = document.getElementById('holdtx');

  if (reduce) {
    var still = Math.round(N * 0.62);
    gsap.set('#vbar', { height: barAt(still) + 'px' });
    gsap.set(dbEl, { textContent: String(dbAt(still)) });
    gsap.set(holdEl, { height: '7px' });
    holdEl.style.bottom = holdAt(still) + 'px';
    holdTx.textContent = 'PK ' + peakAt(still);
    fadeInReduce(['#promo', '#main', '#stripe', '#foot'], 0);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#main', 0.12, 0, 24, 0.30);
  slam('#eyebrow', 0.30, 0, -20, 0.22);
  slam('#titleA', 0.44, -34, -34, 0.28);
  slam('#lineB', 0.58, -34, -34, 0.28);
  press('#titleB', '8px 8px 0 ' + '#0F0F0F', 0.86);
  slam('#sub', 0.74, 0, -20, 0.24);
  slam('#readout', 0.82, 0, 16, 0.24);
  slam('#right', 0.90, 40, 0, 0.30);

  for (var k = 0; k < STEPS; k++) {
    tl.to('#vbar', { height: (function (kk) { return function () { return barAt(kk) + 'px'; }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.set(dbEl, { textContent: String(dbAt(k)) }, k * SEG);
    tl.to(holdEl, { bottom: (function (kk) { return function () { return holdAt(kk) + 'px'; }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.set(holdTx, { textContent: (function (kk) {
      return function () { return 'PK ' + peakAt(kk); }; })(k) }, k * SEG);
  }
  slam('#foot', 0.98, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.10);

  /* 收尾：音频窗口走完后补一段静止，时间轴总长恰好等于音轨长度，
     样片视频与音轨严丝合缝，最后一拍是「已播完」的定格画面。 */
  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
