<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（本期主题标签）","default":"数据不说谎"},
{"id":"title","name":"主标题","type":"string","label":"主标题（8–16 字）","default":"这个月我们把四件事跑通了"},
{"id":"note","name":"口径","type":"string","label":"口径说明（单位与统计范围，必填）","default":"口径：2026 上半年 · 全渠道 · 单位 人"},
{"id":"v1","name":"数值一","type":"string","label":"数值一（数字部分即可，允许 128 / 128+ / 98%）","default":"128"},
{"id":"l1","name":"标签一","type":"string","label":"标签一（≤6 字）","default":"有效选题"},
{"id":"v2","name":"数值二","type":"string","label":"数值二","default":"46"},
{"id":"l2","name":"标签二","type":"string","label":"标签二（≤6 字）","default":"成片交付"},
{"id":"v3","name":"数值三","type":"string","label":"数值三","default":"12"},
{"id":"l3","name":"标签三","type":"string","label":"标签三（≤6 字）","default":"新增渠道"},
{"id":"v4","name":"数值四","type":"string","label":"数值四","default":"98"},
{"id":"l4","name":"标签四","type":"string","label":"标签四（≤6 字）","default":"复用率"},
{"id":"unit","name":"单位","type":"string","label":"单位（2–4 字，不拼进数字串）","default":"人"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（单位 pill / 凸点亮起色 / 页脚计数色）","default":"#FFD429"},
{"id":"brickColor","name":"配色包","type":"enum","label":"配色包（四块数据卡的轮转顺序）","default":"mixed","options":[{"value":"yellow","label":"暖黄主调"},{"value":"pink","label":"桃粉主调"},{"value":"green","label":"薄荷主调"},{"value":"blue","label":"靛蓝主调"},{"value":"mixed","label":"四色轮转"}]},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>四块顶出数据</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 积木风 · 数据汇报 · 四块顶出数据
     四块数据块从下方 120px 逐个顶起落位（式 4），112px mono 数字用 steps(22) 整数跳到目标值，
     跳完后下方凸点阵四枚同时硬切点亮。块宽只用 480，块高只用 240。
     数据带按原型 .stats 的做法通栏到底，四块一色一变。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --mod:240px; --mod-h:120px; --shadow:#0F0F0F; --background:var(--paper); --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--background);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  .blk-noise{background-image:radial-gradient(rgba(15,15,15,.12) 1px,transparent 1px);
    background-size:10px 10px}
  .sh-s{box-shadow:4px 4px 0 var(--shadow)}
  .sh-l{box-shadow:8px 8px 0 var(--shadow)}

  .promo{position:absolute;left:0;top:0;width:1920px;height:56px;display:flex;
    align-items:center;justify-content:space-between;padding:0 72px;
    background:var(--ink);color:var(--white);font-family:var(--mono);
    font-size:24px;font-weight:700;letter-spacing:.14em}
  .promo .pc{color:var(--accent)}

  .head{position:absolute;left:120px;top:128px;width:1680px;display:flex;
    flex-direction:column;gap:16px}
  .head .eb{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.14em;
    color:var(--ink);white-space:nowrap}
  .head .ti{font-size:60px;font-weight:900;line-height:1.2;letter-spacing:0;
    color:var(--ink);white-space:nowrap}
  .head .meta{display:flex;align-items:center;gap:20px;margin-top:4px}
  .head .note{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.04em;
    color:var(--ink);white-space:nowrap}
  .head .unit{flex:0 0 auto;padding:8px 20px;border:var(--bw) solid var(--ink);
    border-radius:9999px;background:var(--accent);color:var(--ink);
    font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.14em;
    white-space:nowrap}

  /* 数据带：四块 480×240 通栏。相邻块用 margin-left:-3px 让两条 3px 描边重叠成一条单线缝，
     合缝后整条带宽 1911px，用 justify-content:center 居中，两侧各留 4.5px 桌面。 */
  .band{position:absolute;left:0;top:420px;width:1920px;height:240px;display:flex;
    justify-content:center}
  .stat{flex:0 0 480px;width:480px;height:240px;display:flex;flex-direction:column;
    justify-content:center;gap:8px;padding:0 40px;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--shadow)}
  .stat + .stat{margin-left:-3px}
  .stat .n{font-family:var(--mono);font-size:112px;font-weight:900;line-height:1;
    letter-spacing:0;color:inherit;white-space:nowrap}
  .stat .l{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:0;
    color:inherit;white-space:nowrap}

  /* 凸点阵 4 联：跳完后四枚同时硬切亮起 */
  .studbar{position:absolute;left:720px;top:736px;width:480px;height:60px}

  .foot{position:absolute;left:0;bottom:0;width:1920px;height:64px;display:flex;
    align-items:center;justify-content:space-between;padding:0 72px;
    background:var(--ink);color:var(--white);font-family:var(--mono);
    font-size:26px;font-weight:700;letter-spacing:.1em}
  .foot em{font-style:normal;color:var(--accent)}
  .divline{position:absolute;left:0;bottom:64px;width:1920px;height:20px;
    border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="promo">
    <span class="pc">BRICK / 积木风</span>
    <span>结论先行 · 四块顶出数据</span>
  </div>

  <div class="head" id="head">
    <span class="eb" id="eyebrow" data-fit-max="30" data-fit-min="16">数据不说谎</span>
    <h1 class="ti" id="title" data-fit-max="60" data-fit-min="28">这个月我们把四件事跑通了</h1>
    <div class="meta">
      <span class="note" id="note" data-fit-max="26" data-fit-min="16">口径：2026 上半年 · 全渠道 · 单位 人</span>
      <span class="unit" id="unit">人</span>
    </div>
  </div>

  <div class="band" id="band">
    <div class="stat" id="s1">
      <span class="n" id="n1" data-fit-max="112" data-fit-min="40">0</span>
      <span class="l" id="l1" data-fit-max="30" data-fit-min="16">有效选题</span>
    </div>
    <div class="stat" id="s2">
      <span class="n" id="n2" data-fit-max="112" data-fit-min="40">0</span>
      <span class="l" id="l2" data-fit-max="30" data-fit-min="16">成片交付</span>
    </div>
    <div class="stat" id="s3">
      <span class="n" id="n3" data-fit-max="112" data-fit-min="40">0</span>
      <span class="l" id="l3" data-fit-max="30" data-fit-min="16">新增渠道</span>
    </div>
    <div class="stat" id="s4">
      <span class="n" id="n4" data-fit-max="112" data-fit-min="40">0</span>
      <span class="l" id="l4" data-fit-max="30" data-fit-min="16">复用率</span>
    </div>
  </div>

  <div class="studbar" id="studbar">
    <svg width="480" height="60" viewBox="0 0 480 60" fill="none" aria-hidden="true">
      <circle class="sc" id="c1" cx="60"  cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      <circle class="sc" id="c2" cx="180" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      <circle class="sc" id="c3" cx="300" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
      <circle class="sc" id="c4" cx="420" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
    </svg>
  </div>

  <div class="divline"></div>
  <div class="foot">
    <span>DQ / 数据汇报</span>
    <span id="meta">指标 4 · 凸点 4</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['eyebrow', 'title', 'note', 'unit', 'l1', 'l2', 'l3', 'l4']
    .forEach(function (k) { set(k, v[k]); });

  var rs = document.documentElement.style;
  if (v.accent) rs.setProperty('--accent', v.accent);
  var ACC = v.accent || '#FFD429';

  var PACK = {
    yellow: ['#FFD429', '#FFFFFF', '#3D7BFF', '#FF5FA2'],
    pink:   ['#FF5FA2', '#FFFFFF', '#FFD429', '#3D7BFF'],
    green:  ['#2FD07A', '#FFFFFF', '#FF5FA2', '#3D7BFF'],
    blue:   ['#3D7BFF', '#FFFFFF', '#FFD429', '#2FD07A'],
    mixed:  ['#FFD429', '#FFFFFF', '#2FD07A', '#FF5FA2']
  };
  function inkOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return '#0F0F0F';
    var f = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * f(parseInt(h.slice(0, 2), 16)) +
            0.7152 * f(parseInt(h.slice(2, 4), 16)) +
            0.0722 * f(parseInt(h.slice(4, 6), 16));
    return L > 0.42 ? '#0F0F0F' : '#FFFFFF';
  }
  var pack = PACK[v.brickColor] || PACK.mixed;
  var STATS = ['#s1', '#s2', '#s3', '#s4'];
  STATS.forEach(function (id, i) {
    var el = document.querySelector(id);
    if (!el) return;
    el.style.background = pack[i];
    var fg = inkOn(pack[i]);
    ['n', 'l'].forEach(function (c) {
      var t = el.querySelector('.' + c);
      if (t) t.style.color = fg;
    });
  });

  /* 数值解析：把前缀 / 数字 / 后缀分开，跳变只动数字那段，
     「128+」「98%」「¥199」都按原样显示，不会被改写成别的样子。 */
  function splitVal(s) {
    var raw = String(s == null ? '' : s).trim();
    var m = raw.match(/(-?[\d,]*\.?\d+)/);
    if (!m) return { pre: raw, num: 0, suf: '' };
    var pre = raw.slice(0, m.index);
    var suf = raw.slice(m.index + m[0].length);
    var num = parseFloat(m[0].replace(/,/g, ''));
    if (!isFinite(num)) num = 0;
    return { pre: pre, num: Math.round(num), suf: suf };
  }
  var VALS = [splitVal(v.v1), splitVal(v.v2), splitVal(v.v3), splitVal(v.v4)];
  VALS.forEach(function (p, i) {
    var el = document.getElementById('n' + (i + 1));
    if (el) el.textContent = p.pre + '0' + p.suf;
  });

  /* 派生量：指标条数 / 凸点枚数 / 合计值，页脚结论条全部现算 */
  var studs = [].slice.call(document.querySelectorAll('#studbar .sc'));
  var sum = VALS.reduce(function (a, p) { return a + p.num; }, 0);
  var meta = document.getElementById('meta');
  if (meta) {
    meta.innerHTML = '指标 <em>' + STATS.length + '</em> · 凸点 <em>' + studs.length +
      '</em> · 合计 <em>' + sum + '</em>';
  }

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  /* 数字终态先给到（降级分支与正常分支共用），避免「对着空页面验空状态」 */
  VALS.forEach(function (p, i) {
    var el = document.getElementById('n' + (i + 1));
    if (el) el.textContent = p.pre + p.num + p.suf;
  });

  if (reduce) {
    /* 降级：顶起与整数跳都撤掉，直接给终值 + ≤8px 微位移淡入。
       终态文字必须由 gsap.set 之外的静态写入给到，回扫时不能退回 0。 */
    gsap.set('#head', { x: 0, y: 0, opacity: 1 });
    gsap.set('#band', { x: 0, y: 0, opacity: 1 });
    gsap.set('#studbar', { x: 0, y: 0, opacity: 1 });
    if (studs.length) gsap.set(studs, { attr: { fill: ACC } });
    tl.fromTo('#head',    { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 0);
    tl.fromTo('#band',    { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .60, ease: 'power3.out' }, .16);
    tl.fromTo('#studbar', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .30);
    B.hold(tl, 1.15, 1.05);
    return;
  }

  /* 式 4 顶出：每块从下方 120px 顶起落位，落定压 2 帧。
     数字跳的展示窗口写死 RUN=1.1s（22 格），变量只决定显示的数值，
     绝不用变量推算时间轴长度（数值填大就会把时间轴撑爆）。 */
  var RUN = 1.1;
  var SHADOW = '8px 8px 0 #0F0F0F';
  var stageRect = document.getElementById('stage').getBoundingClientRect();
  var promoEl = document.querySelector('.promo');
  var CEIL = promoEl ? Math.round(promoEl.getBoundingClientRect().bottom - stageRect.top) : 0;

  tl.fromTo('#head', { y: CEIL - Math.round(document.getElementById('head').getBoundingClientRect().top - stageRect.top) },
    { y: 0, duration: 0.26, ease: 'power4.out' }, 0.00);

  var lastEnd = 0;
  STATS.forEach(function (sel, i) {
    var at = 0.40 + i * 0.22;
    tl.fromTo(sel, { y: 120 }, { y: 0, duration: 0.26, ease: 'power4.out' }, at);
    tl.set(sel, { boxShadow: '8px 11px 0 #0F0F0F', immediateRender: false }, at + 0.26);
    tl.to(sel, { boxShadow: SHADOW, duration: 0.04, ease: 'steps(2)' }, at + 0.30);

    /* 回调类终态：onUpdate 只写 textContent，绝不做 DOM 测量 */
    var el = document.getElementById('n' + (i + 1));
    var p = VALS[i];
    if (!el) return;
    var st = { n: 0 };
    el.textContent = p.pre + '0' + p.suf;
    tl.to(st, { n: p.num, duration: RUN, ease: 'steps(22)',
      onUpdate: function () {
        el.textContent = p.pre + Math.round(st.n) + p.suf;
      } }, at + 0.10);
    lastEnd = Math.max(lastEnd, at + 0.10 + RUN);
  });

  /* 跳完后凸点阵四枚同时硬切亮起（式 8） */
  tl.set(studs, { attr: { fill: ACC }, immediateRender: false }, lastEnd + 0.18);

  var introEnd = tl.duration();
  var TOTAL = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  var holdAt = Math.min(introEnd, TOTAL - 0.8);
  B.hold(tl, holdAt, Math.max(0.8, TOTAL - holdAt));
})();
</script>
</body></html>
