<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"CRAFT / 工艺卖点"},{"id":"title","name":"主标题","type":"string","label":"主标题（中文大字，一行）","default":"三道工序，每道都要过一遍手"},{"id":"s1","name":"工序 1 名","type":"string","label":"第一道工序名","default":"预缩定型"},{"id":"s1d","name":"工序 1 说明","type":"string","label":"第一道工序说明","default":"整片高温预缩，把缩水提前吃完"},{"id":"s1t","name":"工序 1 参数","type":"string","label":"第一道工序参数","default":"120℃ / 40min"},{"id":"s2","name":"工序 2 名","type":"string","label":"第二道工序名","default":"手工锁边"},{"id":"s2d","name":"工序 2 说明","type":"string","label":"第二道工序说明","default":"袖口与下摆双线包缝，机检之后仍过一遍手"},{"id":"s2t","name":"工序 2 参数","type":"string","label":"第二道工序参数","default":"双线 / 3.5mm"},{"id":"s3","name":"工序 3 名","type":"string","label":"第三道工序名","default":"水洗做旧"},{"id":"s3d","name":"工序 3 说明","type":"string","label":"第三道工序说明","default":"低温慢洗，第一次上身就是最终手感"},{"id":"s3t","name":"工序 3 参数","type":"string","label":"第三道工序参数","default":"40℃ / 3 遍"},{"id":"note","name":"口径说明","type":"string","label":"口径说明（一行 mono）","default":"口径：三道工序在同一条产线完成 · 全程留影像可查"},{"id":"accent","name":"强调色","type":"color","label":"强调色（工序参数片 / 斜纹带）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":6},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="横向工序轴构图：三道工序左中右并排，工序之间各嵌一枚箭头方块，每道工序含序号方块、名称、说明与一枚参数片">
<title>工艺卖点工序轴 · 三道工序，每道都要过一遍手</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .top{flex:0 0 auto;height:66px;display:flex;align-items:center;gap:22px;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .top .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .top .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .top .note{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:24px;font-weight:700;color:var(--white)}

  .head{flex:0 0 auto;padding:28px 72px 24px;border-bottom:var(--bw) solid var(--ink)}
  .head .tt{display:block;white-space:nowrap;font-weight:900;font-size:64px;
    line-height:1.04;letter-spacing:0}

  /* 横向工序轴：三段工序 + 两枚箭头方块，整体一行铺开 */
  .flow{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;
    padding:34px 72px 38px;overflow:hidden}
  .step{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    border:var(--bw) solid var(--ink);border-radius:4px;overflow:hidden;
    background:var(--white);box-shadow:8px 8px 0 var(--ink)}
  .step .top2{flex:0 0 auto;display:flex;align-items:center;gap:20px;
    padding:20px 26px;border-bottom:var(--bw) solid var(--ink);
    background:var(--paper)}
  .step .no{flex:0 0 auto;width:88px;height:88px;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    font-family:var(--mono);font-weight:900;font-size:38px}
  .step .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:40px;font-weight:900;letter-spacing:0}
  .step .in{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;gap:20px;padding:26px}
  .step .ds{display:block;white-space:normal;font-size:28px;font-weight:500;
    line-height:1.6;letter-spacing:0;color:var(--mute)}
  .step .par{align-self:flex-start;padding:10px 20px;background:var(--ink);
    color:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:4px 4px 0 var(--accent);
    font-family:var(--mono);font-weight:900;font-size:26px;letter-spacing:0;
    white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

  .arrow{flex:0 0 132px;display:flex;align-items:center;justify-content:center}
  .arrow .ar{width:104px;height:104px;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    font-family:var(--mono);font-weight:900;font-size:52px;line-height:1}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:0 72px 22px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="tag">CRAFT</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">CRAFT / 工艺卖点</span>
    <span class="note anim" id="topNote" data-fit-max="24" data-fit-min="15">同一条产线 · 全程留影像</span>
  </div>

  <div class="head anim" id="head">
    <span class="tt anim" id="title" data-fit-max="64" data-fit-min="32">三道工序，每道都要过一遍手</span>
  </div>

  <div class="flow anim" id="flow">
    <div class="step anim" id="step1">
      <div class="top2">
        <span class="no anim" id="no1">01</span>
        <span class="nm anim" id="s1" data-fit-max="40" data-fit-min="22">预缩定型</span>
      </div>
      <div class="in">
        <span class="ds anim" id="s1d" data-fit-max="28" data-fit-min="16">整片高温预缩，把缩水提前吃完</span>
        <span class="par anim" id="s1t" data-fit-max="26" data-fit-min="15">120℃ / 40min</span>
      </div>
    </div>

    <div class="arrow anim" id="arrow1"><span class="ar anim" id="ar1">→</span></div>

    <div class="step anim" id="step2">
      <div class="top2">
        <span class="no anim" id="no2">02</span>
        <span class="nm anim" id="s2" data-fit-max="40" data-fit-min="22">手工锁边</span>
      </div>
      <div class="in">
        <span class="ds anim" id="s2d" data-fit-max="28" data-fit-min="16">袖口与下摆双线包缝，机检之后仍过一遍手</span>
        <span class="par anim" id="s2t" data-fit-max="26" data-fit-min="15">双线 / 3.5mm</span>
      </div>
    </div>

    <div class="arrow anim" id="arrow2"><span class="ar anim" id="ar2">→</span></div>

    <div class="step anim" id="step3">
      <div class="top2">
        <span class="no anim" id="no3">03</span>
        <span class="nm anim" id="s3" data-fit-max="40" data-fit-min="22">水洗做旧</span>
      </div>
      <div class="in">
        <span class="ds anim" id="s3d" data-fit-max="28" data-fit-min="16">低温慢洗，第一次上身就是最终手感</span>
        <span class="par anim" id="s3t" data-fit-max="26" data-fit-min="15">40℃ / 3 遍</span>
      </div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：三道工序在同一条产线完成 · 全程留影像可查</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'topNote', 'title', 's1', 's1d', 's1t',
   's2', 's2d', 's2t', 's3', 's3d', 's3t', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#top',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#head', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .12);
    tl.fromTo('#flow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .26);
    tl.fromTo('#foot', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .44);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .58);
    B.hold(tl, 1.35, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#top',      0.00,   0, -66, 0.26);
  slam('#eyebrow',  0.14, -24, -20, 0.22);
  slam('#topNote',  0.20,  24, -20, 0.22);
  slam('#head',     0.30,   0, -26, 0.26);
  slam('#title',    0.40, -28, -24, 0.26);
  /* 三道工序自左右画外依次切入，箭头跟在工序之后 */
  tl.fromTo('#step1', { x: -120 }, { x: 0, duration: .3, ease: 'power4.out' }, 0.58);
  tl.fromTo('#step2', { x: -120 }, { x: 0, duration: .3, ease: 'power4.out' }, 0.82);
  tl.fromTo('#step3', { x: -120 }, { x: 0, duration: .3, ease: 'power4.out' }, 1.06);
  slam('#ar1',  0.76,   0, -28, 0.26);
  slam('#ar2',  1.00,   0, -28, 0.26);
  shadowBounce('#ar1', '6px 6px 0 ' + INK, 1.04);
  shadowBounce('#ar2', '6px 6px 0 ' + INK, 1.28);
  slam('#no1', 0.74, -28, -28, 0.24);
  slam('#no2', 0.98, -28, -28, 0.24);
  slam('#no3', 1.22, -28, -28, 0.24);
  tl.from('#flow .nm', { y: -20, duration: .2, ease: 'power4.out', stagger: .12 }, 0.90);
  tl.from('#flow .ds', { y: -18, duration: .2, ease: 'power4.out', stagger: .12 }, 1.02);
  tl.from('#flow .par', { x: -30, duration: .22, ease: 'power4.out', stagger: .12 }, 1.14);
  slam('#foot',    1.62,   0,  28, 0.26);
  slam('#note',    1.74, -24, -20, 0.22);
  slam('#stripe',  1.84,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.08);

  var introEnd = 3.28;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
