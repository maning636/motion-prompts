<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"QUOTE / 金句"},
{"id":"no","name":"编号","type":"string","label":"右上角 mono 编号","default":"Nº07"},
{"id":"q1","name":"金句上","type":"string","label":"金句第一行（8–10 字）","default":"所有工具都在变快"},
{"id":"q2","name":"金句下 · 前半","type":"string","label":"金句第二行前半（会自动接住彩块词）","default":"只有你的判断"},
{"id":"kw","name":"彩块词","type":"string","label":"压在彩块里的词（2–4 字）","default":"变慢"},
{"id":"byline","name":"署名","type":"string","label":"底部署名行","default":"讲稿第 41 页 · 这一句我改了三遍"},
{"id":"accent","name":"强调色","type":"color","label":"彩块色 + 右侧方块","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>大字压屏金句 · 所有工具都在变快，只有你的判断在变慢</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，
     金句再上一档到 176px，是这一件唯一允许越级的地方。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-l{box-shadow:8px 8px 0 var(--ink)}
  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .topbar .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .no{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    white-space:nowrap;flex:0 0 auto;padding:7px 18px;border-radius:9999px;
    background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--ink)}

  /* 金句区：右侧压一枚 200×200 的实心方块当压屏重音，撞 3px 黑边 */
  .quote{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:0 88px}
  .qbox{flex:1 1 0;min-width:0}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .ql{display:block;white-space:nowrap;font-weight:900;font-size:168px;
    line-height:1.1;letter-spacing:0;padding-right:20px}
  .chip{display:inline-block;padding:0 26px;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--ink);
    line-height:1.06}
  .sideblock{flex:0 0 auto;width:176px;height:176px;margin-left:48px;
    background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--ink)}

  .byline{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 88px 44px}
  .byline .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .btx{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-size:26px;font-weight:700;letter-spacing:0}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="topbar anim" id="topbar">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">QUOTE / 金句</span>
    <span class="rule anim" id="ruleTop"></span>
    <span class="no anim" id="no" data-fit-max="22" data-fit-min="14">Nº07</span>
  </div>

  <div class="quote anim" id="quote">
    <div class="qbox">
      <div class="ql anim" id="q1" data-fit-max="168" data-fit-min="84">所有工具都在变快</div>
      <div class="ql anim" id="q2" data-fit-max="168" data-fit-min="84"><span id="q2t">只有你的判断</span><span class="chip" id="chip"><span id="kw">变慢</span></span></div>
    </div>
    <div class="sideblock anim" id="sideblock"></div>
  </div>

  <div class="byline anim" id="byline">
    <span class="btx anim" id="bylineTx" data-fit-max="26" data-fit-min="14">讲稿第 41 页 · 这一句我改了三遍</span>
    <span class="rule anim" id="ruleBot"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'no', 'q1', 'q2t', 'kw', 'byline'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    gsap.set('#ruleTop', { scaleX: 1 });
    gsap.set('#ruleBot', { scaleX: 1 });
    tl.fromTo('#topbar', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#quote',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#byline', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  /* 模 1 拍进来：落定瞬间阴影压 2 帧再弹回原档，总阴影回弹 ≤0.12s */
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#eyebrow', 0.00, -28, -28, 0.24);
  shadowBounce('#no', '4px 4px 0 ' + INK, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.3, ease: 'power4.out' }, 0.12);
  slam('#no', 0.14, 28, -28, 0.24);

  /* 大字压屏：两行都是从画外硬位移进画，逐行错峰 0.16s，零回弹 */
  slam('#q1', 0.36, -48, -48, 0.28);
  slam('#q2', 0.52, -48, -48, 0.28);

  /* 大面积彩块用 power3.out + from:.86，面积单调涨到末帧 */
  tl.fromTo('#chip', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, 0.80);
  shadowBounce('#chip', '8px 8px 0 ' + INK, 1.06);
  tl.fromTo('#sideblock', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, 0.92);
  shadowBounce('#sideblock', '8px 8px 0 ' + INK, 1.18);

  slam('#bylineTx', 1.30, 0, -16, 0.22);
  tl.fromTo('#ruleBot', { scaleX: 0, transformOrigin: 'right center' },
    { scaleX: 1, duration: 0.3, ease: 'power4.out' }, 1.42);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.58);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 1.92);

  var introEnd = 3.12;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
