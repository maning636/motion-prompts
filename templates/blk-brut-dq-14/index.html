<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"NEXT EP. / 下期预告"},
{"id":"t1","name":"预告标题上","type":"string","label":"预告标题第一行（8–12 字）","default":"下一期我们把"},
{"id":"t2","name":"预告标题下","type":"string","label":"预告标题第二行（8–12 字）","default":"镜头顺序拆开讲"},
{"id":"date","name":"日期","type":"string","label":"更新日期（mono）","default":"2026.10.20 周二 20:00"},
{"id":"hook","name":"看点句","type":"string","label":"看点句（一行，16–24 字）","default":"带上你那条改到第八版的片子，我们一起对着看"},
{"id":"tag1","name":"标签 1","type":"string","label":"底部标签 1（mono）","default":"EP.013"},
{"id":"tag2","name":"标签 2","type":"string","label":"底部标签 2（mono）","default":"直播连麦"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"关注后可提前一天收到提醒"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（NEXT 方块 + 斜纹带）","default":"#FFD429"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>下期预告卡 · 下一期我们把镜头顺序拆开讲</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 满版 pink：整版底只允许 yellow 和 pink（风格规范基因表） */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--pink);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-xl{box-shadow:10px 10px 0 var(--ink)}
  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-s{box-shadow:4px 4px 0 var(--ink)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:44px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  .hd .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}

  /* 预告卡：白底方块压在满版粉上，卡自身是浅底 → 阴影用 ink（规则 B） */
  .card{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:32px 88px 0}
  .ncard{flex:1 1 auto;min-width:0;background:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:10px 10px 0 var(--ink);padding:46px 56px 40px;
    display:flex;gap:44px;align-items:flex-start}
  /* NEXT 方块：ink 底 + 强调色字，深底反白件（基因 10） */
  .next{flex:0 0 auto;width:200px;height:200px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;background:var(--ink);
    color:var(--accent);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--accent)}
  .next b{font-family:var(--mono);font-weight:900;font-size:52px;line-height:1;letter-spacing:.04em}
  .next span{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em}

  .nbody{flex:1 1 auto;min-width:0}
  /* 中文预告标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .tl{display:block;white-space:nowrap;font-weight:900;font-size:104px;line-height:1.14;
    letter-spacing:0;padding-right:20px}
  .hook{display:block;margin-top:28px;padding-top:24px;border-top:var(--bw) solid var(--ink);
    font-size:32px;font-weight:700;line-height:1.36;letter-spacing:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .datepill{display:inline-block;margin-top:24px;font-family:var(--mono);font-weight:700;
    font-size:26px;letter-spacing:.10em;padding:9px 22px;border-radius:9999px;
    white-space:nowrap;background:var(--yellow);color:var(--ink);
    border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink)}

  .foot{flex:0 0 auto;padding:0 88px 44px;display:flex;align-items:center;gap:20px}
  .tag{display:inline-block;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:8px 20px;border-radius:9999px;white-space:nowrap;
    background:var(--white);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:4px 4px 0 var(--ink)}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    margin-left:auto;white-space:nowrap;min-width:0;overflow:hidden;
    text-overflow:ellipsis}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">NEXT EP. / 下期预告</span>
    <span class="rule anim" id="ruleTop"></span>
  </div>

  <div class="card anim" id="card">
    <div class="ncard anim" id="ncard">
      <div class="next anim" id="next"><b>NEXT</b><span>EP.013</span></div>
      <div class="nbody anim" id="nbody">
        <div class="tl anim" id="t1" data-fit-max="104" data-fit-min="50">下一期我们把</div>
        <div class="tl anim" id="t2" data-fit-max="104" data-fit-min="50">镜头顺序拆开讲</div>
        <div class="hook anim" id="hook" data-fit-max="32" data-fit-min="16">带上你那条改到第八版的片子，我们一起对着看</div>
        <span class="datepill anim" id="date" data-fit-max="26" data-fit-min="14">2026.10.20 周二 20:00</span>
      </div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="tag anim" id="tag1" data-fit-max="22" data-fit-min="14">EP.013</span>
    <span class="tag anim" id="tag2" data-fit-max="22" data-fit-min="14">直播连麦</span>
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">关注后可提前一天收到提醒</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 't1', 't2', 'hook', 'date', 'tag1', 'tag2', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#card', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#foot', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd', 0.00, -28, -20, 0.24);
  tl.fromTo('#ruleTop', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 0.12);

  slam('#card', 0.20,   0, -24, 0.28);
  /* 大面积预告卡：power3.out + from:.86，零过冲 */
  tl.fromTo('#ncard', { scale: 0.86 },
    { scale: 1, duration: 0.3, ease: 'power3.out' }, 0.32);
  tl.fromTo('#next', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, 0.56);
  /* 模 1 拍进来：NEXT 方块落定瞬间阴影压 2 帧再弹回原档 */
  tl.set('#next', { boxShadow: '8px 11px 0 #FFD429', immediateRender: false }, 0.82);
  tl.to('#next', { boxShadow: '8px 8px 0 #FFD429', duration: 0.04, ease: 'steps(2)' }, 0.86);

  slam('#t1',  0.70, -40, -40, 0.28);
  slam('#t2',  0.86, -40, -40, 0.28);
  slam('#hook', 1.10,   0, -20, 0.24);
  slam('#date', 1.26, -28, -28, 0.24);
  tl.set('#date', { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, 1.50);
  tl.to('#date', { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, 1.54);

  slam('#foot', 1.66, 0, 24, 0.26);
  slam('#tag1', 1.78, -28, -28, 0.24);
  slam('#tag2', 1.88, -28, -28, 0.24);
  slam('#note', 2.02, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.16);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.50);

  var introEnd = 3.50;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
