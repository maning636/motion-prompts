    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

    <style>

@font-face{font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;src:local('MiSans');font-weight:100 1000;font-display:swap}

*{ box-sizing: border-box;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .header{ text-align: center; margin-bottom: 56px;font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;}
      .header-title{ margin: 0; font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-size: 22px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.45; }
      .compare{ display: grid; grid-template-columns: 1fr 80px 1fr; gap: 0; border-top: 1px solid rgba(244,239,231,0.14);font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .col{ display: flex; flex-direction: column;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}

      .col-title{ font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-size: 42px; font-weight: 700; letter-spacing: -0.02em; }
      .col-sub{ font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif; font-size: 16px; font-weight: 500; opacity: 0.45; margin-top: 6px; }
      .cell{ padding: 28px 0; text-align: center; border-bottom: 1px solid rgba(244,239,231,0.10); font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif; font-size: 28px; font-weight: 500; }
      .vs{ display: flex; align-items: center; justify-content: center; font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif; font-size: 32px; font-weight: 700; opacity: 0.35; border-left: 1px solid rgba(244,239,231,0.14); border-right: 1px solid rgba(244,239,231,0.14); }
      .winner{ color: var(--accent);font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .winner-badge{ display: inline-block; margin-left: 12px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 2px;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}

  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <div class="header-title">VERSUS</div>
        </div>
        <div class="compare">
          <div class="col" id="leftCol">
            <div class="col-header">
              <div class="col-title" id="leftTitle"></div>
              <div class="col-sub" id="leftSub"></div>
            </div>
            <div id="leftCells"></div>
          </div>
          <div class="vs">vs</div>
          <div class="col" id="rightCol">
            <div class="col-header">
              <div class="col-title" id="rightTitle"></div>
              <div class="col-sub" id="rightSub"></div>
            </div>
            <div id="rightCells"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { leftTitle: "预训练", rightTitle: "微调", dimensions: "数据需求,成本,灵活性,上线周期", leftValues: "极大,低,差,短", rightValues: "小,中,好,中", recommendedSide: "right", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("leftTitle").textContent = v.leftTitle;
      document.getElementById("rightTitle").textContent = v.rightTitle;
      document.getElementById("leftSub").textContent = "方案 A";
      document.getElementById("rightSub").textContent = "方案 B";
      const dims = String(v.dimensions).split(",").map(s => s.trim());
      const leftVals = String(v.leftValues).split(",").map(s => s.trim());
      const rightVals = String(v.rightValues).split(",").map(s => s.trim());
      const leftCells = document.getElementById("leftCells");
      const rightCells = document.getElementById("rightCells");
      const rec = v.recommendedSide;
      dims.forEach((dim, i) => {
        const lw = document.createElement("div"); lw.className = "cell" + (rec === "left" ? " winner" : ""); lw.textContent = leftVals[i] || ""; leftCells.appendChild(lw);
        const rw = document.createElement("div"); rw.className = "cell" + (rec === "right" ? " winner" : ""); rw.textContent = rightVals[i] || ""; rightCells.appendChild(rw);
      });
      if (rec === "left") document.getElementById("leftTitle").innerHTML += '<span class="winner-badge">推荐</span>';
      if (rec === "right") document.getElementById("rightTitle").innerHTML += '<span class="winner-badge">推荐</span>';
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".header-title", { opacity: 0, y: -16 }, { opacity: 0.45, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
      tl.fromTo(".col-header", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.3);
      document.querySelectorAll("#leftCells .cell, #rightCells .cell").forEach((cell, i) => {
        tl.fromTo(cell, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.7 + i * 0.1);
      });
      tl.fromTo(".vs", { opacity: 0, scale: 0.8 }, { opacity: 0.35, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.9);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
