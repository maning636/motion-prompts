<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（顶部黑条上的 mono 字）","default":"INSURANCE / 运费险"},{"id":"title","name":"主标题","type":"string","label":"主标题（黑条上的一行 900 白字）","default":"运费险到底赔哪几种"},{"id":"k1","name":"要点 1 标题","type":"string","label":"第一格标题","default":"自动投保"},{"id":"d1","name":"要点 1 说明","type":"string","label":"第一格说明","default":"下单即自动投保，无需手动勾选与付费"},{"id":"k2","name":"要点 2 标题","type":"string","label":"第二格标题","default":"理赔路径"},{"id":"d2","name":"要点 2 说明","type":"string","label":"第二格说明","default":"上传面单与破损照片，48 小时内出结论"},{"id":"k3","name":"要点 3 标题","type":"string","label":"第三格标题","default":"覆盖范围"},{"id":"d3","name":"要点 3 说明","type":"string","label":"第三格说明","default":"丢件、破损、错发三类均在保障范围内"},{"id":"k4","name":"要点 4 标题","type":"string","label":"第四格标题","default":"赔付标准"},{"id":"d4","name":"要点 4 说明","type":"string","label":"第四格说明","default":"按运费实报实销，最高不超过 200 元"},{"id":"note","name":"底部说明","type":"string","label":"底部说明（一行 mono）","default":"口径：以订单实付运费为限 · 理赔由平台统一处理"},{"id":"accent","name":"强调色","type":"color","label":"强调色（四格序号块 / 斜纹带）","default":"#3D7BFF"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="四象限网格构图：2×2 四格售后说明，每格一枚强调色序号方块压着标题与说明行，格与格之间靠 3px 实线分隔">
<title>运费险四格 · 运费险到底赔哪几种</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 72px;height:82px;
    background:var(--ink);color:var(--white)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--white);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:40px;font-weight:900;letter-spacing:0;text-align:right}

  /* 2×2 网格：格与格之间靠 3px 实线，不靠留白分段（基因 7） */
  .grid{flex:1 1 auto;min-height:0;display:grid;
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    border-bottom:var(--bw) solid var(--ink)}
  .cell{display:flex;align-items:center;gap:30px;padding:34px 56px;
    border-bottom:var(--bw) solid var(--ink);border-right:var(--bw) solid var(--ink);
    background:var(--white);overflow:hidden}
  .cell:nth-child(2n){border-right:0}
  .cell:nth-child(n+3){border-bottom:0}
  /* 序号方块：白底 3px 黑边 + 4px 硬阴影，形状不许换（§3.7 纪律） */
  .cell .num{flex:0 0 auto;width:104px;height:104px;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    font-family:var(--mono);font-weight:900;font-size:44px;letter-spacing:0}
  .cell .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px}
  .cell .k{display:block;white-space:nowrap;font-weight:900;font-size:44px;
    letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .cell .d{display:block;white-space:nowrap;font-size:28px;font-weight:500;
    letter-spacing:0;color:var(--mute);max-width:100%;overflow:hidden;
    text-overflow:ellipsis}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:22px 72px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.08em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="tag anim" id="tag">SAFE</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">INSURANCE / 运费险</span>
    <span class="tt anim" id="title" data-fit-max="40" data-fit-min="22">运费险到底赔哪几种</span>
  </div>

  <div class="grid anim" id="grid">
    <div class="cell anim" id="c1">
      <span class="num anim" id="n1">01</span>
      <span class="tx">
        <span class="k anim" id="k1" data-fit-max="44" data-fit-min="24">自动投保</span>
        <span class="d anim" id="d1" data-fit-max="28" data-fit-min="17">下单即自动投保，无需手动勾选与付费</span>
      </span>
    </div>
    <div class="cell anim" id="c2">
      <span class="num anim" id="n2">02</span>
      <span class="tx">
        <span class="k anim" id="k2" data-fit-max="44" data-fit-min="24">理赔路径</span>
        <span class="d anim" id="d2" data-fit-max="28" data-fit-min="17">上传面单与破损照片，48 小时内出结论</span>
      </span>
    </div>
    <div class="cell anim" id="c3">
      <span class="num anim" id="n3">03</span>
      <span class="tx">
        <span class="k anim" id="k3" data-fit-max="44" data-fit-min="24">覆盖范围</span>
        <span class="d anim" id="d3" data-fit-max="28" data-fit-min="17">丢件、破损、错发三类均在保障范围内</span>
      </span>
    </div>
    <div class="cell anim" id="c4">
      <span class="num anim" id="n4">04</span>
      <span class="tx">
        <span class="k anim" id="k4" data-fit-max="44" data-fit-min="24">赔付标准</span>
        <span class="d anim" id="d4" data-fit-max="28" data-fit-min="17">按运费实报实销，最高不超过 200 元</span>
      </span>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：以订单实付运费为限 · 理赔由平台统一处理</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'k1', 'd1', 'k2', 'd2', 'k3', 'd3', 'k4', 'd4', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#grid', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',     0.00,   0, -82, 0.26);
  slam('#eyebrow',0.14, -24, -20, 0.22);
  slam('#title',  0.20,  24, -20, 0.24);
  /* 模 7 分格揭示：四格按左上→右上→左下→右下依次斜向拍入 */
  tl.fromTo('#c1', { x: -70, y: -46 },
      { x: 0, y: 0, duration: .28, ease: 'power4.out' }, 0.44);
  tl.fromTo('#c2', { x: 70, y: -46 },
      { x: 0, y: 0, duration: .28, ease: 'power4.out' }, 0.58);
  tl.fromTo('#c3', { x: -70, y: 46 },
      { x: 0, y: 0, duration: .28, ease: 'power4.out' }, 0.72);
  tl.fromTo('#c4', { x: 70, y: 46 },
      { x: 0, y: 0, duration: .28, ease: 'power4.out' }, 0.86);
  slam('#n1',  0.60, -28, -28, 0.24);
  slam('#k1',  0.70,    0, -20, 0.22);
  slam('#d1',  0.78,    0, -18, 0.2);
  slam('#n2',  0.74, -28, -28, 0.24);
  slam('#k2',  0.84,    0, -20, 0.22);
  slam('#d2',  0.92,    0, -18, 0.2);
  slam('#n3',  0.88, -28, -28, 0.24);
  slam('#k3',  0.98,    0, -20, 0.22);
  slam('#d3',  1.06,    0, -18, 0.2);
  slam('#n4',  1.02, -28, -28, 0.24);
  slam('#k4',  1.12,    0, -20, 0.22);
  slam('#d4',  1.20,    0, -18, 0.2);
  slam('#foot',    1.34,   0,  28, 0.26);
  slam('#note',    1.46, -24, -20, 0.22);
  slam('#stripe',  1.56,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 1.80);

  var introEnd = 3.00;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
