<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "num", "type": "string", "label": "里程碑数字", "default": "1,000,000"}, {"id": "cap", "type": "string", "label": "数字说明", "default": "次渲染达成"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

    <style>
@font-face{font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;src:local('MiSans');font-weight:100 1000;font-display:swap}
@font-face{font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;src:local('MEBHeiHeiTi');font-weight:100 1000;font-display:swap}
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif; }
.num{ font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; }

#num{ position:absolute; left:50%; top:42%; translate:-50% -50%; font-size:190px; font-weight:900;
  color:var(--fg); will-change:transform; }
#num em{ color:var(--accent); font-style:normal; }
#cap{ position:absolute; left:50%; top:60%; translate:-50% 0; font-size:38px; opacity:.6;
  font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; }
.cf{ position:absolute; left:0; top:0; width:12px; height:18px; will-change:transform,opacity; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
<div id="num"><em>■</em> <span id="n"></span></div><div id="cap"></div><div id="cfBox"></div>
    </div>
    <script>
      const FB = {"num": "1,000,000", "cap": "次渲染达成", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#n').textContent=v.num||'';$('#cap').textContent=v.cap||'';
// 数字揭晓
tl.fromTo('#num',{scale:.6,opacity:0},{scale:1,opacity:1,duration:F(10),ease:'back.out(1.6)'},F(8));
tl.fromTo('#cap',{opacity:0,y:20},{opacity:.6,y:0,duration:F(8)},F(14));
// 双炮各 50 颗：闭式弹道（初速+衰减+重力），帧确定
const box=$('#cfBox'), N=50, FIRE=12;
const parts=[];
function s(i,k){ const x=Math.sin(i*127.1+k*311.7)*43758.5453; return x-Math.floor(x); }
for(let side=0;side<2;side++){
  for(let i=0;i<N;i++){
    const d=document.createElement('div'); d.className='cf';
    const gray=s(i,side*7+1);
    d.style.background=(i%3===0)?'var(--accent)':(gray<0.5?'#5A5A66':'#9A9AA6');
    box.appendChild(d);
    const v0=90+s(i,2)*60;                    // 90-150 px/f
    const dir=side===0?1:-1;
    const ang=(-58+(s(i,3)-0.5)*55)*Math.PI/180;
    parts.push({
      el:d, side,
      x0:side===0?120:1800, y0:960,
      vx:Math.cos(ang)*v0*dir, vy:Math.sin(ang)*v0,
      spin:(8+s(i,4)*7)*(i%2?1:-1), rot0:s(i,5)*360,
      dec:0.9, g:2.2, delay:s(i,6)*4
    });
  }
}
const sim={n:0};
function paintCf(){
  for(const pt of parts){
    const n=Math.max(0,sim.n-pt.delay);
    if(n<=0){ pt.el.style.opacity=0; continue; }
    const dn=Math.pow(pt.dec,n);
    const x=pt.x0+pt.vx*(1-dn)/(1-pt.dec);
    const y=pt.y0+pt.vy*n+0.5*pt.g*n*n;
    let op=1;
    if(n>55) op=Math.max(0,1-(n-55)/30);
    pt.el.style.opacity=op.toFixed(3);
    pt.el.style.transform='translate('+x+'px,'+y+'px) rotate('+(pt.rot0+pt.spin*n)+'deg)';
  }
}
paintCf();
tl.to(sim,{n:95,duration:F(95),ease:'none',onUpdate:paintCf},F(FIRE));
// 收尾真静止（粒子寿命耗尽；补齐到 105f）
tl.to({},{duration:F(10)},F(95));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
