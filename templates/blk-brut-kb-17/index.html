<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"TWIST / 反差点题"},
{"id":"big","name":"预期大字","type":"string","label":"观众预期的大字（一行，7–10 字）","default":"涨粉慢了，就是内容不行"},
{"id":"realLab","name":"真相眉标","type":"string","label":"真相区 mono 眉标","default":"ACTUALLY / 真相是"},
{"id":"realTx","name":"真相句","type":"string","label":"反过来的真相句（一行，14–22 字）","default":"内容没问题，是开头三秒全在自我介绍，没人停下来"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"反转句先落地再解释 · 顺序反了就没有落差"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（底部斜纹带）","default":"#FF5FA2"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>反差点题 · 涨粉慢了，不是内容不行</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 满版 yellow：整版底只允许 yellow 和 pink（风格规范基因表） */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--yellow);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-w{box-shadow:8px 8px 0 var(--white)}

  .top{flex:0 0 auto;padding:44px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}

  /* 预期大字区：整块居中，字号 160px */
  .bigwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;padding:0 88px}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .big{display:block;white-space:nowrap;font-weight:900;font-size:160px;line-height:1.1;
    letter-spacing:0;text-align:center;padding-right:24px}
  .hint{display:block;margin-top:28px;text-align:center;font-size:28px;font-weight:700;
    letter-spacing:0}

  /* 真相区：整块换底色（基因 10），ink 底 + white 字 */
  .real{flex:0 0 auto;background:var(--ink);color:var(--white);padding:36px 88px 40px}
  .rlab{display:block;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--accent);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-bottom:18px}
  .rtx{display:block;white-space:nowrap;font-weight:900;font-size:46px;line-height:1.3;
    letter-spacing:0;color:var(--white);padding-right:24px}
  .rrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;
    padding:26px 88px 34px;background:var(--ink);color:var(--white)}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--paper)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="top anim" id="top">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">TWIST / 反差点题</span>
  </div>

  <div class="bigwrap anim" id="bigwrap">
    <div class="big anim" id="big" data-fit-max="160" data-fit-min="80">涨粉慢了，就是内容不行</div>
    <div class="hint anim" id="hint" data-fit-max="28" data-fit-min="14">——这是大多数人的第一反应</div>
  </div>

  <div class="real anim" id="realBox">
    <span class="rlab anim" id="realLab" data-fit-max="26" data-fit-min="16">ACTUALLY / 真相是</span>
    <div class="rtx anim" id="realTx" data-fit-max="46" data-fit-min="23">内容没问题，是开头三秒全在自我介绍</div>
  </div>

  <div class="rrow anim" id="rrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">反转句先落地再解释 · 顺序反了就没有落差</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'big', 'hint', 'realLab', 'realTx', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#top',     { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#bigwrap', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#realBox', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.3);
    tl.fromTo('#rrow',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.46);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.6);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#top', 0.00, -28, -20, 0.24);
  slam('#big', 0.14,   0, -36, 0.28);
  slam('#hint', 0.36,  0, -16, 0.22);

  /* 反差的那一拍：整块换底色，1 帧硬切（模 8 色块闪切），不做渐变过渡 */
  var SWAP = 1.00;
  tl.set('#stage', { backgroundColor: '#0F0F0F', immediateRender: false }, 0);
  tl.set('#stage', { backgroundColor: '#FFD429', immediateRender: false }, SWAP);
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, SWAP);

  slam('#realBox', 1.10, 0, 40, 0.28);
  slam('#realLab', 1.26, 0, -16, 0.22);
  slam('#realTx',  1.40, 0, -20, 0.26);
  slam('#rrow',    1.66, 0,  24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.78);
  slam('#note',    1.92, 0, -16, 0.22);

  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.20);

  var introEnd = 3.40;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
