<head>
<meta charset="utf-8">

<title>赠品堆叠封顶</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 积木风 · 电商带货 · 赠品堆叠封顶
     顶部一条 720×120 主商品块先落位，三块 480×120 赠品块随后零间隙并排落位（式 2），每块各带一枚凸点；主商品块顶面落 2 联凸点，全部齐了到手价块自下顶出收口。
     块宽只用 120/240/480/720，块高只用 120/240/360/480；普通块恒 8px 硬影，
     承重件 10px；相邻块用 margin -3px 合流成单线缝；凸点是内联 SVG circle。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --mod:240px; --mod-h:120px; --shadow:#0F0F0F; --background:var(--paper); --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--background);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  /* 纸面网点：全族唯一允许的 rgba 例外，必须铺满 #stage */
  .blk-noise{background-image:radial-gradient(rgba(15,15,15,.12) 1px,transparent 1px);
    background-size:10px 10px}
  .sh-s{box-shadow:4px 4px 0 var(--shadow)}
  .sh-l{box-shadow:8px 8px 0 var(--shadow)}
  .sh-xl{box-shadow:10px 10px 0 var(--shadow)}

  /* 桌沿铭牌：贴在桌面之外，不许浮在块上面 */
  .promo{position:absolute;left:0;top:0;width:1920px;height:56px;display:flex;
    align-items:center;justify-content:space-between;padding:0 72px;
    background:var(--ink);color:var(--white);font-family:var(--mono);
    font-size:24px;font-weight:700;letter-spacing:.14em}
  .promo .pc{color:var(--accent)}
  .foot{position:absolute;left:0;bottom:0;width:1920px;height:64px;display:flex;
    align-items:center;justify-content:space-between;padding:0 72px;
    background:var(--ink);color:var(--white);font-family:var(--mono);
    font-size:26px;font-weight:700;letter-spacing:.1em}
  .foot em{font-style:normal;color:var(--accent)}
  /* 斜纹带：全族唯一合法渐变，周期 10+10=20px */
  .divline{position:absolute;left:0;bottom:64px;width:1920px;height:20px;
    border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  .head{position:absolute;left:240px;top:120px;width:1440px;display:flex;
    flex-direction:column;gap:12px}
  .head .eb{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.14em;
    color:var(--ink);white-space:nowrap}
  .head .ti{font-size:52px;font-weight:900;line-height:1.2;letter-spacing:0;
    color:var(--ink);white-space:nowrap}

  /* 主商品块 720×120，10px 承重件 */
  .main{position:absolute;left:600px;top:360px;width:720px;min-width:0;height:120px;
    display:flex;align-items:center;justify-content:center;gap:24px;box-sizing:border-box;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:10px 10px 0 var(--shadow)}
  .main .m{font-size:40px;font-weight:900;line-height:1.2;letter-spacing:0;color:var(--ink);
    white-space:nowrap}
  .stM{position:absolute;left:900px;top:300px;width:240px;height:60px}

  /* 赠品三块 480×120，零间隙并排 */
  .gifts{position:absolute;left:240px;top:497px;width:1440px;height:120px;display:flex;
    justify-content:center}
  .gf{flex:0 0 480px;min-width:0;height:120px;display:flex;align-items:center;gap:20px;
    padding:0 28px;box-sizing:border-box;border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--shadow)}
  .gf + .gf{margin-left:-3px}
  .gf .no{flex:0 0 auto;width:44px;font-family:var(--mono);font-size:26px;font-weight:700;
    letter-spacing:.1em;color:inherit}
  .gf .x{flex:0 1 auto;min-width:0;font-size:30px;font-weight:900;line-height:1.2;
    letter-spacing:0;color:inherit;white-space:nowrap}
  .gf .st{flex:0 0 auto;margin-left:auto;width:60px;height:60px;display:block}

  .pricebox{position:absolute;left:600px;top:634px;width:720px;min-width:0;height:120px;
    display:flex;align-items:center;justify-content:center;gap:20px;box-sizing:border-box;
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:10px 10px 0 var(--shadow)}
  .pricebox .p{font-family:var(--mono);font-size:56px;font-weight:900;line-height:1;
    letter-spacing:0;color:inherit}
  .pricebox .u{font-size:28px;font-weight:700;letter-spacing:.12em;color:inherit}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="promo">
    <span class="pc">BRICK / 积木风</span>
    <span>电商带货 · 赠品堆叠封顶</span>
  </div>

  <div class="head" id="head">
    <span class="eb" id="eyebrow" data-fit-max="30" data-fit-min="16">买一送三</span>
    <h1 class="ti" id="title" data-fit-max="52" data-fit-min="26">主商品一样，赠品三份</h1>
  </div>

  <div class="main" id="main">
    <span class="m" id="mainTx" data-fit-max="40" data-fit-min="20">同款外套</span>

  <div class="stM" id="stM">
    <svg width="180" height="60" viewBox="0 0 180 60" fill="none" aria-hidden="true"><circle class="sc" id="c1" cx="60" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/><circle class="sc" id="c2" cx="180" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/></svg>

  <div class="gifts" id="gifts">
    <div class="gf" id="gf1"><span class="no">01</span>
      <span class="x" id="gift1" data-fit-max="30" data-fit-min="16">同色帽子</span>
      <svg class="st" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle class="sc" id="c1" cx="30" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/></svg></div>
    <div class="gf" id="gf2"><span class="no">02</span>
      <span class="x" id="gift2" data-fit-max="30" data-fit-min="16">同色围巾</span>
      <svg class="st" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle class="sc" id="c2" cx="30" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/></svg></div>
    <div class="gf" id="gf3"><span class="no">03</span>
      <span class="x" id="gift3" data-fit-max="30" data-fit-min="16">收纳袋</span>
      <svg class="st" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle class="sc" id="c3" cx="30" cy="30" r="22" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/></svg></div>
  </div>

  <div class="pricebox" id="pricebox">
    <span class="p" id="price" data-fit-max="56" data-fit-min="28">¥199</span>
    <span class="u" id="unit" data-fit-max="28" data-fit-min="16">件</span>
  </div>

  <div class="divline"></div>
  <div class="foot">
    <span>EC / 电商带货</span>
    <span id="meta">主商品 1 · 赠品 3 · 凸点 5</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
['eyebrow', 'title', 'main', 'gift1', 'gift2', 'gift3', 'price', 'unit'].forEach(function (k) { set(k, v[k]); });

  var rs = document.documentElement.style;
  if (v.accent) rs.setProperty('--accent', v.accent);
  var ACC = v.accent || '#FFD429';

  /* 配色包：yellow → pink → blue → green 是全族轮转序，同屏不重色 */
  var PACK = {
    yellow: ['#FFD429', '#FF5FA2', '#3D7BFF', '#2FD07A'],
    pink:   ['#FF5FA2', '#FFD429', '#2FD07A', '#3D7BFF'],
    green:  ['#2FD07A', '#3D7BFF', '#FFD429', '#FF5FA2'],
    blue:   ['#3D7BFF', '#2FD07A', '#FF5FA2', '#FFD429'],
    mixed:  ['#FFD429', '#FF5FA2', '#3D7BFF', '#2FD07A']
  };
  /* 明度判定：亮底压墨字、暗底压白字，不造灰色阶 */
  function inkOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return '#0F0F0F';
    var f = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * f(parseInt(h.slice(0, 2), 16)) +
            0.7152 * f(parseInt(h.slice(2, 4), 16)) +
            0.0722 * f(parseInt(h.slice(4, 6), 16));
    return L > 0.42 ? '#0F0F0F' : '#FFFFFF';
  }
  var pack = PACK[v.brickColor] || PACK.mixed;
  var GFS = ['#gf1', '#gf2', '#gf3'];
  GFS.forEach(function (sel, i) {
    var el = document.querySelector(sel);
    if (!el) return;
    el.style.background = pack[i];
    var fg = inkOn(pack[i]);
    ['no', 'x'].forEach(function (c) {
      var t = el.querySelector('.' + c);
      if (t) t.style.color = fg;
    });
  });
  var pb = document.getElementById('pricebox');
  if (pb) pb.style.background = pack[3];
  if (pb) {
    var fg2 = inkOn(pack[3]);
    ['p', 'u'].forEach(function (c) {
      var t = pb.querySelector('.' + c);
      if (t) t.style.color = fg2;
    });
  }

  var studs = [].slice.call(document.querySelectorAll('#stM .sc, #gifts .sc'));
  var studMode = v.studMode || 'scan';
  if (studMode === 'none') {
    var sw = document.getElementById('stM');
    if (sw) sw.style.display = 'none';
    document.querySelectorAll('#gifts .st').forEach(function (e) { e.style.display = 'none'; });
  }
  var meta = document.getElementById('meta');
  if (meta) {
    meta.innerHTML = '主商品 <em>1</em> · 赠品 <em>' + GFS.length + '</em> · 凸点 <em>' +
      studs.length + '</em>';
  }

  /* reduce 短路：这一行必须逐字节保持不变，QC 工具靠字符串匹配把它替换成常量 true */
  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：搬移与压影全撤掉，只给终态 + 一段 8px 微位移淡入 */
    gsap.set('#head',     { x: 0, y: 0, opacity: 1 });
    gsap.set('#main',     { x: 0, y: 0, opacity: 1 });
    gsap.set('#stM',      { x: 0, y: 0, opacity: 1 });
    gsap.set('#gifts',    { x: 0, y: 0, opacity: 1 });
    gsap.set('#pricebox', { x: 0, y: 0, opacity: 1 });
    if (studMode !== 'none' && studs.length) gsap.set(studs, { attr: { fill: ACC } });
    tl.fromTo('#head',     { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 0);
    tl.fromTo('#main',     { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .60, ease: 'power3.out' }, .16);
    tl.fromTo('#stM',      { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .24);
    tl.fromTo('#gifts',    { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, .32);
    tl.fromTo('#pricebox', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .50, ease: 'power3.out' }, .42);
    B.hold(tl, 1.15, 1.05);
    return;
  }

  var SHADOW = '8px 8px 0 #0F0F0F';
  var stageRect = document.getElementById('stage').getBoundingClientRect();
  var promoEl = document.querySelector('.promo');
  var CEIL = promoEl ? Math.round(promoEl.getBoundingClientRect().bottom - stageRect.top) : 0;

  /* 起跳点一律现算，保证任何一帧都不越框；onUpdate 里绝不做 DOM 测量 */
  function topOf(sel) {
    var e = document.querySelector(sel);
    return e ? Math.round(e.getBoundingClientRect().top - stageRect.top) : 0;
  }
  function bottomOf(sel) {
    var e = document.querySelector(sel);
    return e ? Math.round(stageRect.bottom - e.getBoundingClientRect().bottom) : 0;
  }
  function leftOf(sel) {
    var e = document.querySelector(sel);
    return e ? Math.round(stageRect.left - e.getBoundingClientRect().left) : 0;
  }
  function rightOf(sel) {
    var e = document.querySelector(sel);
    return e ? Math.round(stageRect.right - e.getBoundingClientRect().right) : 0;
  }
  function fromCeil(sel) { return CEIL - topOf(sel); }

  /* 式 1/2/4/6 通用落位：单轴直落或顶出，零 overshoot，落定沿 Y 多压 3px 打 2 帧再回原档 */
  function slam(sel, at, from, dur, shadow) {
    var S = shadow || SHADOW;
    var d = dur || 0.24;
    var p = String(S).split(' ');
    var press = p[0] + ' ' + (parseFloat(p[1]) + 3) + 'px 0 ' + p.slice(3).join(' ');
    tl.fromTo(sel, { x: from.x || 0, y: from.y || 0 },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
    tl.set(sel, { boxShadow: press, immediateRender: false }, at + d);
    tl.to(sel, { boxShadow: S, duration: 0.04, ease: 'steps(2)' }, at + d + 0.04);
    return at + d + 0.04;
  }
  /* 式 8 凸点扫描：单枚间隔 ≥0.12s，fill 硬切，不补间 */
  function scanStuds(list, at, mode) {
    if (mode === 'none' || !list.length) return;
    list.forEach(function (c, i) {
      tl.set(c, { attr: { fill: ACC }, immediateRender: false },
        mode === 'top' ? at : at + i * 0.12);
    });
  }

  slam('#head', 0.00, { x: 0, y: fromCeil('#head') }, 0.26);

  /* 主商品块先自桌沿铭牌下方直落（式 1） */
  var mAt = 0.50;
  slam('#main', mAt, { x: 0, y: fromCeil('#main') }, 0.24, '10px 10px 0 #0F0F0F');

  /* 凸点落进主商品块顶面并硬切 */
  var sAt = mAt + 0.40;
  slam('#stM', sAt, { x: 0, y: -60 }, 0.24);
  var mainStuds = [].slice.call(document.querySelectorAll('#stM .sc'));
  if (studMode !== 'none') {
    mainStuds.forEach(function (c, i) {
      tl.set(c, { attr: { fill: ACC }, immediateRender: false },
        studMode === 'top' ? sAt + 0.60 : sAt + 0.30 + i * 0.12);
    });
  }

  /* 式 2 堆叠：三块赠品逐块自画布右沿推入合位（零间隙并排） */
  var AT = [0.96, 1.16, 1.36];
  GFS.forEach(function (sel, i) {
    slam(sel, AT[i], { x: rightOf(sel), y: 0 }, 0.24);
    if (studMode !== 'none') {
      tl.set(sel + ' .sc', { attr: { fill: ACC }, immediateRender: false },
        studMode === 'top' ? AT[AT.length - 1] + 0.34 : AT[i] + 0.30);
    }
  });

  /* 全部齐了 → 到手价块自下顶出封口，10px 影 */
  slam('#pricebox', AT[AT.length - 1] + 0.44, { x: 0, y: bottomOf('#pricebox') }, 0.24, '10px 10px 0 #0F0F0F');

  var introEnd = tl.duration();
  var TOTAL = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  var holdAt = Math.min(introEnd, TOTAL - 0.8);
  B.hold(tl, holdAt, Math.max(0.8, TOTAL - holdAt));
})();
</script>
