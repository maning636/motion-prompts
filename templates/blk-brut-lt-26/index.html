<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"蓝卡上的 mono 眉标（4–12 字）","default":"SOURCE / 出处"},{"id":"quote","name":"引文","type":"string","label":"引文（12–22 字，单行）","default":"知识密度决定复购，不决定涨粉"},{"id":"by","name":"原始出处","type":"string","label":"原始出处（8–20 字）","default":"2026 内容行业访谈 · 第 7 位受访者"},{"id":"src","name":"来源块标签","type":"string","label":"来源块标签（2–6 字）","default":"来源"},{"id":"srcname","name":"来源名","type":"string","label":"来源名（4–12 字）","default":"新榜研究院"},{"id":"accent","name":"强调色","type":"color","label":"强调色（蓝卡上的引号 / 来源块）","default":"#3D7BFF"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="来源引用贴：蓝色整卡内 mono 眉标 + 900 引文 + 3px 规则 + 原始出处行，右侧 ink 出处块分格擦出后引号与出处块做反向微位移">
<title>来源引用贴 · 新榜研究院</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 引文卡：整块蓝底 + 白字，是本族少数「整块换底」的贴片（基因 10）；
     明度中，上面放字必须用 white（§1.2 blue 纪律） */
  #qc{position:absolute;left:120px;bottom:200px;width:1180px;height:320px;
    display:flex;flex-direction:column;justify-content:center;padding:0 40px;
    background:var(--blue);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #eyebrow{display:block;font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.14em;
    line-height:1;color:var(--white);white-space:nowrap;overflow:hidden}
  /* 引号：蓝底上必须用 white（§1.2 blue 纪律「明度中，上面放字必须用 --white」），
     靠文字硬投影补足笔画厚度（§3.8 / §7.3.4） */
  #qt{display:block;margin-top:12px;font-family:var(--mono);font-weight:900;font-size:40px;
    line-height:1;letter-spacing:0;color:var(--white);text-shadow:2px 2px 0 var(--ink)}
  #quote{display:block;margin-top:6px;font-size:56px;font-weight:900;line-height:1.12;
    letter-spacing:0;color:var(--white);white-space:nowrap;overflow:hidden}
  #qc .rule{height:3px;background:var(--white);margin:20px 0 14px;flex:0 0 3px}
  #by{display:block;font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.04em;
    line-height:1;color:var(--white);white-space:nowrap;overflow:hidden}

  /* 出处块：ink 底黄字，与蓝卡并排；块自身是深色，阴影走白（§7.2 规则 B） */
  #sc{position:absolute;left:1336px;bottom:200px;width:364px;height:320px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--ink);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--white)}
  #src{display:block;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.18em;
    line-height:1;color:var(--yellow);white-space:nowrap;overflow:hidden}
  .dash{width:150px;height:3px;border-top:3px dashed var(--yellow)}
  #srcname{display:block;font-size:44px;font-weight:900;line-height:1.14;letter-spacing:0;
    color:var(--white);text-align:center;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="qc">
    <span id="eyebrow" data-fit-max="24" data-fit-min="14">SOURCE / 出处</span>
    <span id="qt">「</span>
    <span id="quote" data-fit-max="56" data-fit-min="28">知识密度决定复购，不决定涨粉</span>
    <div class="rule"></div>
    <span id="by" data-fit-max="24" data-fit-min="14">2026 内容行业访谈 · 第 7 位受访者</span>
  </div>
  <div id="sc">
    <span id="src" data-fit-max="26" data-fit-min="16">来源</span>
    <div class="dash"></div>
    <span id="srcname" data-fit-max="44" data-fit-min="24">新榜研究院</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['eyebrow', 'quote', 'by', 'src', 'srcname'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉入位与反向微位移，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#qc', { x: 0, y: 0, opacity: 1 });
    gsap.set('#sc', { x: 0, y: 0, opacity: 1 });
    gsap.set('#quote', { x: 0 });
    gsap.set('#by', { x: 0 });

    tl.fromTo('#qc', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#sc', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 1 · 拍进来：引文卡自左 80px 拍入，落定瞬间阴影压 2 帧再弹回原档 */
  tl.fromTo('#qc', { x: -80 },
      { x: 0, duration: .28, ease: 'power4.out' }, 0)
    .fromTo('#qc', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#qc', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });

  /* 模 2 · 零件装上去：眉标、引号、引文、规则、出处错峰跟位，纯位移 */
  tl.fromTo('#eyebrow', { x: -22 }, { x: 0, duration: .2, ease: 'power4.out' }, .18);
  tl.fromTo('#qt', { y: -20 }, { y: 0, duration: .2, ease: 'power4.out' }, .26);
  tl.fromTo('#quote', { x: -28 }, { x: 0, duration: .24, ease: 'power4.out' }, .32);
  tl.fromTo('#qc .rule', { x: -28 }, { x: 0, duration: .24, ease: 'power4.out' }, .42);
  tl.fromTo('#by', { x: -22 }, { x: 0, duration: .2, ease: 'power4.out' }, .48);

  /* 模 7 · 分格擦出：出处块自右分六格推出来 */
  tl.fromTo('#sc', { clipPath: 'inset(0 0 0 100%)' },
      { clipPath: 'inset(0 0 0 0%)', duration: .32, ease: 'steps(6)' }, .3)
    .fromTo('#sc', { boxShadow: '8px 8px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F') },
      { boxShadow: '8px 11px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F'), duration: .04, ease: 'steps(2)' }, '<')
    .to('#sc', { boxShadow: '8px 8px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F'), duration: .04, ease: 'steps(2)' });
  tl.fromTo('#srcname', { y: 24 }, { y: 0, duration: .22, ease: 'power4.out' }, .5);

  /* 模 8 · 色块闪切：来源名在 ink 底上按固定节奏白↔黄硬切，收尾停在白。
     引号是蓝底上的白字，不参与闪切——蓝底放黄字对比度不够（§1.2 blue 纪律）。 */
  tl.set('#srcname', { color: '#FFD429', duration: 0 }, 1.7)
    .set('#srcname', { color: '#FFFFFF', duration: 0 }, 2.5)
    .set('#srcname', { color: '#FFD429', duration: 0 }, 3.3)
    .set('#srcname', { color: '#FFFFFF', duration: 0 }, 4.0);

  /* 两块反向微位移：引文卡下压、出处块上抬，匀速往返 */
  var T0 = 1.9;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('#qc', { y: 6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#sc', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
