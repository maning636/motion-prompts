<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"TIMELINE / 推进轴"},
{"id":"title","name":"小标题","type":"string","label":"时间线上方的小标题（一行，12–18 字）","default":"这个账号真正转型的四个节点"},
{"id":"y1","name":"节点 1 年份","type":"string","label":"节点 1 年份（mono）","default":"2024.03"},
{"id":"e1","name":"节点 1 事件","type":"string","label":"节点 1 事件（6–10 字）","default":"开始日更"},
{"id":"y2","name":"节点 2 年份","type":"string","label":"节点 2 年份（mono）","default":"2024.11"},
{"id":"e2","name":"节点 2 事件","type":"string","label":"节点 2 事件","default":"第一次破万粉"},
{"id":"y3","name":"节点 3 年份","type":"string","label":"节点 3 年份（mono）","default":"2025.08"},
{"id":"e3","name":"节点 3 事件","type":"string","label":"节点 3 事件","default":"砍掉日更"},
{"id":"y4","name":"节点 4 年份","type":"string","label":"节点 4 年份（mono）","default":"2026.10"},
{"id":"e4","name":"节点 4 事件","type":"string","label":"节点 4 事件","default":"固定两条一周"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"节点 3–4 个 · 上下交错排布"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（节点方块 + 斜纹带）","default":"#3D7BFF"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":6},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>时间线 · 这个账号真正转型的四个节点</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#3D7BFF;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-m{box-shadow:6px 6px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:42px 88px 0;display:flex;align-items:center;gap:22px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文小标题：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{display:block;white-space:nowrap;font-weight:900;font-size:68px;line-height:1.14;
    letter-spacing:0;margin-top:16px;padding-right:24px}

  /* 时间线：三行结构 = 上排文字 / 轴线 + 节点 / 下排文字，四个格子等宽 */
  .tl{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;padding:20px 88px 0}
  .trow{display:flex;gap:0;height:200px}
  .cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;padding:0 20px}
  .trow.a .cell{align-items:flex-end;justify-content:flex-end;text-align:right}
  .trow.b .cell{align-items:flex-start;justify-content:flex-start;text-align:left}
  .yr{display:block;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.10em;color:var(--mute);white-space:nowrap}
  .ev{display:block;margin-top:12px;white-space:nowrap;font-size:44px;font-weight:900;
    line-height:1.2;letter-spacing:0;padding-right:14px}

  /* 轴线：一条 3px 实线 + 四个节点方块，节点压在轴上（基因 7） */
  .axis{position:relative;height:34px;display:flex;align-items:center}
  .axis .ln{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;
    background:var(--ink)}
  .acell{flex:1 1 0;min-width:0;display:flex;justify-content:center}
  .dot{flex:0 0 auto;width:34px;height:34px;background:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink)}
  .acell.on .dot{background:var(--accent)}

  .footrow{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:30px 88px 44px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--ink)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <div class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">TIMELINE / 推进轴</div>
    <div class="title anim" id="title" data-fit-max="68" data-fit-min="34">这个账号真正转型的四个节点</div>
  </div>

  <div class="tl anim" id="tl">
    <div class="trow a anim">
      <div class="cell anim" id="ca1"></div>
      <div class="cell anim" id="ca2"><span class="yr anim" id="y2" data-fit-max="26" data-fit-min="14">2024.11</span><span class="ev anim" id="e2" data-fit-max="44" data-fit-min="22">第一次破万粉</span></div>
      <div class="cell anim" id="ca3"><span class="yr anim" id="y3" data-fit-max="26" data-fit-min="14">2025.08</span><span class="ev anim" id="e3" data-fit-max="44" data-fit-min="22">砍掉日更</span></div>
      <div class="cell anim" id="ca4"></div>
    </div>

    <div class="axis anim" id="axis">
      <span class="ln"></span>
      <div class="acell anim" id="n1"><span class="dot"></span></div>
      <div class="acell on anim" id="n2"><span class="dot"></span></div>
      <div class="acell anim" id="n3"><span class="dot"></span></div>
      <div class="acell on anim" id="n4"><span class="dot"></span></div>
    </div>

    <div class="trow b anim">
      <div class="cell anim" id="cb1"><span class="yr anim" id="y1" data-fit-max="26" data-fit-min="14">2024.03</span><span class="ev anim" id="e1" data-fit-max="44" data-fit-min="22">开始日更</span></div>
      <div class="cell anim" id="cb2"></div>
      <div class="cell anim" id="cb3"></div>
      <div class="cell anim" id="cb4"><span class="yr anim" id="y4" data-fit-max="26" data-fit-min="14">2026.10</span><span class="ev anim" id="e4" data-fit-max="44" data-fit-min="22">固定两条一周</span></div>
    </div>
  </div>

  <div class="footrow anim" id="footrow">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">节点 3–4 个 · 上下交错排布</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'y1', 'e1', 'y2', 'e2', 'y3', 'e3', 'y4', 'e4', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#tl',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  var INK = '#0F0F0F';

  slam('#hd', 0.00, -28, -20, 0.24);
  slam('#title', 0.14, -28, -28, 0.26);
  slam('#tl', 0.30,   0, -24, 0.28);

  /* 轴线从左向右画出（模 7 分格揭示），节点随后逐个落位 */
  tl.fromTo('#axis .ln', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.5, ease: 'steps(8)' }, 0.52);

  var dots = [];
  ['#n1', '#n2', '#n3', '#n4'].forEach(function (sel) {
    var n = document.querySelector(sel);
    dots.push(n ? n.querySelector('.dot') : null);
  });
  var ups = ['#ca2', '#ca3', '#ca4'];
  var dns = ['#cb1', '#cb2', '#cb3', '#cb4'];
  for (var i = 0; i < dots.length; i++) {
    var at = 0.80 + i * 0.18;
    tl.fromTo(dots[i], { scale: 0.86 },
      { scale: 1, duration: 0.22, ease: 'power3.out' }, at);
    tl.set(dots[i], { boxShadow: '4px 7px 0 ' + INK, immediateRender: false }, at + 0.22);
    tl.to(dots[i], { boxShadow: '4px 4px 0 ' + INK, duration: 0.04, ease: 'steps(2)' }, at + 0.26);
    if (i < ups.length) tl.fromTo(ups[i], { y: -24 },
      { y: 0, duration: 0.24, ease: 'power4.out' }, at + 0.10);
    if (i < dns.length) tl.fromTo(dns[i], { y: 24 },
      { y: 0, duration: 0.24, ease: 'power4.out' }, at + 0.10);
  }

  slam('#footrow', 2.00, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 2.12);
  slam('#note',    2.28, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 2.42);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.76);

  var introEnd = 3.76;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
