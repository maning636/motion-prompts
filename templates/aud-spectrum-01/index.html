<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "眉标（mono + 大字距，≤12 字）", "default": "SPECTRUM / 节拍"}, {"id": "titleA", "name": "主标题 · 前段", "type": "string", "label": "主标题第一行（普通字，≤6 字）", "default": "每小节四拍，"}, {"id": "titleB", "name": "主标题 · 彩色词块", "type": "string", "label": "主标题第二行（强调色块里的词，≤4 字）", "default": "柱子在跳"}, {"id": "bpm", "name": "节拍", "type": "number", "label": "节拍数（60–180），决定节拍闪块的间隔", "default": 96}, {"id": "beatsPerBar", "name": "每小节拍数", "type": "number", "label": "每小节拍数（2 / 4 / 8），只改闪块分段", "default": 4}, {"id": "peaks", "name": "音频包络", "type": "string", "label": "离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）", "default": "825,570,345,300,892,135,327,296,973,314,309,184,969,341,300,457,839,363,318,915,511,381,327,906,170,345,305,1000,215,336,291,946,345,314,390,951,386,341,686,628,354,309,960,260,377,327,996,283"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色（柱阵 / 节拍闪块 / 页脚标签）", "default": "#2FD07A"}, {"id": "duration", "name": "总时长", "type": "number", "label": "总时长（秒，须等于音轨长度 5.6）", "default": 5.6}, {"id": "exportMode", "name": "导出格式", "type": "enum", "label": "Format", "default": "mp4", "hidden": true, "options": [{"value": "mp4", "label": "MP4"}, {"value": "webm", "label": "WebM"}, {"value": "transparent", "label": "透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>BPM 节拍频谱 · 柱阵跟着拍子走</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让**所有内联样式改动**
       都变成 0.01ms 的过渡——本族每条都有 JS 写死的内联几何（播放头 left/top、
       峰值保持线 bottom），降级分支里会卡在 CSS 旧值不动，渲染出错误位置，
       而 motion-qc 只看最终帧出框、不看降级分支的几何正确性，全绿也照样错。
       补上 transition-property:none 与 animation-name:none 才是完整写法。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }

  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#9A9A9A; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#2FD07A;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--accent);color:var(--ink);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--ink);color:var(--white);padding:3px 14px;border-radius:9999px}
  .promo .parw{font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:40px 72px 34px}

  .hd{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:22px;line-height:32px}
  .hd .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hd .bpm{margin-left:auto;flex:0 0 auto;font-family:var(--mono);font-weight:900;font-size:24px;
    letter-spacing:.1em;padding:4px 16px;border:var(--bw) solid var(--white);border-radius:9999px;
    background:var(--yellow);color:var(--ink);white-space:nowrap}

  .stack{flex:0 0 auto;margin-top:26px}
  .line{display:block;font-size:84px;font-weight:900;line-height:1.05;white-space:nowrap}
  .chip{display:inline-block;line-height:1;padding:0 18px;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .sub{min-width:0;margin-top:14px;font-size:29px;font-weight:700;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 节拍闪块：一行方块，谁踩在拍上谁填色 */
  .beats{flex:0 0 auto;margin-top:26px;display:flex;gap:12px}
  .beats .bt{flex:1 1 0;min-width:0;height:46px;border-radius:4px;
    border:var(--bw) solid var(--white);background:rgba(255,255,255,.06)}
  .beats .bt.on{background:var(--accent)}

  /* 柱阵：64 根细柱，柱高 = peaks 采样（纯函数） */
  .bars{flex:0 0 auto;margin-top:30px;height:300px;display:flex;align-items:flex-end;
    justify-content:space-between;padding:0 4px;border-bottom:var(--bw) solid var(--white);
    overflow:hidden}
  .bars i{display:block;width:16px;height:8px;border-radius:9999px;background:var(--accent)}
  #head{position:absolute;left:72px;top:0;width:4px;height:300px;background:var(--white);z-index:6}
  #head .cap{position:absolute;left:-8px;top:-9px;width:20px;height:20px;background:var(--yellow);
    border-radius:4px}

  .footrow{flex:0 0 auto;margin-top:auto;display:flex;align-items:center;gap:24px;
    border-top:var(--bw) solid var(--white);padding-top:20px}
  .footrow .fm{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.14em;
    color:var(--accent);white-space:nowrap}
  .footrow .ticks{flex:1 1 auto;display:flex;justify-content:space-between;min-width:0;
    border-bottom:var(--bw) dashed rgba(255,255,255,.55);padding-bottom:8px}
  .footrow .ticks i{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.06em;
    color:var(--mute);font-style:normal;white-space:nowrap}
  .footrow .tc{font-family:var(--mono);font-weight:900;font-size:28px;letter-spacing:.08em;
    font-variant-numeric:tabular-nums;white-space:nowrap}

  .stripe{flex:0 0 auto;height:20px;
    background:repeating-linear-gradient(45deg,var(--accent) 0 10px,var(--ink) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--white);color:var(--ink)}
  .foot .fl{font-size:25px;font-weight:700;white-space:nowrap}
  .foot .fr{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--blue)}

  #head,#head .cap{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">BPM</span><span class="ptx">节拍频谱 · 闪块 + 64 根柱阵</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="hd">
      <span class="eyebrow anim" id="eyebrow">SPECTRUM / 节拍</span>
      <span class="bpm anim" id="bpmtag">96 BPM · 4/4</span>
    </div>
    <div class="stack">
      <span class="line anim" id="titleA" data-fit-max="84" data-fit-min="42">每小节四拍，</span>
      <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="84" data-fit-min="42">柱子在跳</span></span>
      <p class="sub anim" id="sub" data-fit-max="29" data-fit-min="15">闪块踩在拍上，柱阵踩在这条声音上</p>
    </div>
    <div class="beats anim" id="beats"></div>
    <div class="bars anim" id="bars"></div>
    <div class="footrow anim" id="footrow">
      <span class="fm" id="fmn">96 BPM · 4/4 · 48 BUCKETS</span>
      <span class="ticks"><i>0s</i><i>1s</i><i>2s</i><i>3s</i><i>4s</i><i>5s</i></span>
      <span class="tc" id="tc">00:00</span>
    </div>
  </div>

  <div id="head"><span class="cap"></span></div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fl">闪块按 BPM 走，柱高按包络走，两条时间轴同一个 t</span>
    <span class="fr">AUD / 2026</span>
  </div></div>
<!-- [公开版] 原音轨 音轨 voice-06.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* ---------- 音频包络：offline RMS，烘在 peaks 变量里 ----------
     这份数组来自 音轨 voice-06.wav（未随仓分发） 的离线解码（RMS，48 桶，归一到 0–1000），
     由 离线包络脚本（未随仓分发） 算出，同时落一份
     assets/voice-06.peaks.json 作溯源。
     换音轨：换 wav → 重跑离线脚本 → 把新数组填进 peaks → 同步 duration 与
     <audio data-duration>。这是一条显式的、算一次的步骤，不是缺陷。
     为什么绝不接实时 AnalyserNode：无头渲染是逐帧 seek 采样，媒体在采集模式下
     是 seek 不是 play（hyperframes runtime 的 allowLiveTimelineSeek 在
     __HF_RENDER_CAPTURE_MODE 下为 false），探针接在暂停的元素上读到的不是
     「此刻在放什么」；motion-qc 的探针同样是无序 seek。 */
  var FALLBACK_PEAKS = '825,570,345,300,892,135,327,296,973,314,309,184,969,341,300,457,839,363,318,915,511,381,327,906,170,345,305,1000,215,336,291,946,345,314,390,951,386,341,686,628,354,309,960,260,377,327,996,283';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);
  function peakAt(k) {
    return PEAKS[Math.max(0, Math.min(PEAKS.length - 1, k))];
  }

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','titleA','titleB'].forEach(function (k) { set(k, v[k]); });
  var BPM = Math.max(60, Math.min(180, Math.round(Number(v.bpm) || 96)));
  var BPB = [2, 4, 8].indexOf(Math.round(Number(v.beatsPerBar) || 4)) >= 0
    ? Math.round(Number(v.beatsPerBar)) : 4;


  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 音频窗口：时间轴总长严格等于音轨长度，尾部留 0.6s 静音 + 定格。
     禁止用变量值推算总长（数值填大会撞 SMOKE_TOO_LONG）。 */
  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var N = PEAKS.length;

  var BARS = 64, MAXH = 250, MINH = 8, STEPS = N, SEG = WIN / STEPS, SPREAD = N / BARS;

  function heightAt(i, k) {
    var idx = Math.floor(k + i * SPREAD) % N;
    return Math.max(MINH, Math.round(PEAKS[idx] / 1000 * MAXH));
  }
  /* 闪块：拍长 60/BPM 秒，第 b 块的「相位」= (t − b·拍长) 对拍长取模。
     完全由 t 决定，不累计、不 setInterval。 */
  function beatPhase(t, b) {
    var per = 60 / BPM;
    var u = ((t - b * per) % per + per) % per;
    return u / per;                       // 0 = 刚踩上拍，1 = 快到下一拍
  }

  var beats = document.getElementById('beats'), beatEls = [];
  for (var b = 0; b < BPB; b++) {
    var d = document.createElement('span'); d.className = 'bt';
    beats.appendChild(d); beatEls.push(d);
  }
  var barsRoot = document.getElementById('bars'), bars = [];
  for (var i = 0; i < BARS; i++) {
    var el = document.createElement('i');
    barsRoot.appendChild(el); bars.push(el);
  }
  document.getElementById('bpmtag').textContent = BPM + ' BPM · ' + BPB + '/4';
  document.getElementById('fmn').textContent = BPM + ' BPM · ' + BPB + '/4 · ' + N + ' BUCKETS';

  B.fitAll();

  var head = document.getElementById('head');
  var wr = barsRoot.getBoundingClientRect();
  var sr = document.getElementById('stage').getBoundingClientRect();
  var SPAN = Math.max(10, wr.width - 4);
  head.style.left = (wr.left - sr.left) + 'px';
  head.style.top = (wr.top - sr.top) + 'px';
  head.style.height = wr.height + 'px';

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function press(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }
  function fadeInReduce(ids, start) {
    for (var i = 0; i < ids.length; i++) {
      tl.fromTo(ids[i], { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: i === ids.length - 1 ? .6 : .5, ease: 'power3.out' },
        start + i * 0.08);
    }
  }

  function paintBeats(t) {
    for (var b = 0; b < BPB; b++) beatEls[b].className = beatPhase(t, b) < 0.28 ? 'bt on' : 'bt';
  }

  if (reduce) {
    var still = Math.round(N * 0.62);
    gsap.set(bars, { height: (function (k) { return function (i) { return heightAt(i, k); }; })(still) });
    paintBeats(still * SEG);
    gsap.set('#head', { x: SPAN * 0.62, y: 0, opacity: 1 });
    gsap.set('#tc', { textContent: '00:03' });
    fadeInReduce(['#promo', '#main', '#head', '#stripe', '#foot'], 0);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#eyebrow', 0.14, 0, -20, 0.22);
  slam('#bpmtag', 0.22, 24, -20, 0.22);
  slam('#titleA', 0.38, -34, -34, 0.28);
  slam('#lineB', 0.54, -34, -34, 0.28);
  press('#titleB', '8px 8px 0 ' + '#FFFFFF', 0.82);
  slam('#sub', 0.74, 0, -20, 0.24);
  slam('#beats', 0.86, 0, -16, 0.24);
  slam('#bars', 0.94, 0, 22, 0.26);

  for (var k = 0; k < STEPS; k++) {
    tl.to(bars, { height: (function (kk) { return function (i) { return heightAt(i, kk); }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.call((function (kk) { return function () { paintBeats(kk * SEG); }; })(k), null, k * SEG);
  }
  tl.fromTo('#head', { x: 0 }, { x: SPAN, duration: WIN, ease: 'none' }, 0);
  var tcEl = document.getElementById('tc');
  for (var s = 0; s <= Math.floor(WIN); s++) {
    tl.set(tcEl, { textContent: '00:' + (s < 10 ? '0' + s : String(s)) }, s);
  }
  tl.set(tcEl, { textContent: '00:0' + Math.ceil(WIN) }, WIN);

  slam('#foot', 0.98, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.10);

  /* 收尾：音频窗口走完后补一段静止，时间轴总长恰好等于音轨长度，
     样片视频与音轨严丝合缝，最后一拍是「已播完」的定格画面。 */
  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
