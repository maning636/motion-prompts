<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"PRICE UP / 即将涨价"},{"id":"todayLabel","name":"今日标签","type":"string","label":"今日行的标签","default":"今日价格"},{"id":"nextLabel","name":"明日标签","type":"string","label":"明日行的标签","default":"明日恢复原价"},{"id":"todayPrice","name":"今日价","type":"number","label":"今日价（元）","default":99},{"id":"nextPrice","name":"明日价","type":"number","label":"明日价（元）","default":199},{"id":"cdLabel","name":"倒计时标题","type":"string","label":"倒计时条上的标题","default":"距恢复原价还剩"},{"id":"note","name":"口径说明","type":"string","label":"口径说明（一行 mono）","default":"口径：涨价以次日 0 点生效 · 已下单订单不受影响"},{"id":"accent","name":"强调色","type":"color","label":"强调色（倒计时条底 / 明日行 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="左时间轴右价格构图：左侧竖向时间轴两个节点标出今天与明天，右侧两行价格并置，下方一整条满宽倒计时条压缩归零">
<title>涨价倒计时 · 距恢复原价还剩</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .top{flex:0 0 auto;height:66px;display:flex;align-items:center;gap:22px;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .top .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .top .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}

  /* 主体：左侧竖向时间轴 + 右侧两行价格 */
  .mid{flex:1 1 auto;min-height:0;display:flex;padding:34px 72px 30px;overflow:hidden}

  .axis{flex:0 0 340px;display:flex;flex-direction:column;gap:26px;
    padding-right:30px;position:relative}
  .axis .spine{position:absolute;left:52px;top:34px;bottom:34px;width:3px;
    background:var(--ink)}
  .node{flex:1 1 0;display:flex;align-items:center;gap:24px;min-height:0;
    position:relative}
  .node .sq{flex:0 0 auto;width:72px;height:72px;display:flex;align-items:center;
    justify-content:center;background:var(--white);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
    font-family:var(--mono);font-weight:900;font-size:28px;z-index:2}
  .node.two .sq{background:var(--accent)}
  .node .tx{display:flex;flex-direction:column;gap:8px;min-width:0}
  .node .k{white-space:nowrap;font-size:36px;font-weight:900;letter-spacing:0;
    max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .node .d{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.08em;color:var(--mute);max-width:100%;overflow:hidden;
    text-overflow:ellipsis}

  .rows{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:24px;
    border-left:var(--bw) solid var(--ink);padding-left:48px}
  .row{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:space-between;
    gap:30px;padding:0 44px;background:var(--white);border:var(--bw) solid var(--ink);
    border-left:0;border-radius:0 4px 4px 0;min-width:0;overflow:hidden}
  .row.next{background:var(--accent);box-shadow:10px 10px 0 var(--ink)}
  .row .k{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:38px;font-weight:900;letter-spacing:0}
  .row .p{flex:0 0 auto;display:block;white-space:nowrap;font-family:var(--mono);
    font-weight:900;font-size:118px;line-height:1;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .row.today .p{color:var(--mute)}
  .row .rise{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:34px;letter-spacing:0;padding:8px 18px;background:var(--ink);
    color:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:4px 4px 0 var(--white)}

  /* 满宽倒计时条 */
  .cd{flex:0 0 auto;display:flex;align-items:center;gap:36px;padding:26px 72px;
    background:var(--accent);color:var(--ink);border-top:var(--bw) solid var(--ink)}
  .cd .k{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:34px;font-weight:900;letter-spacing:0}
  .cd .numrow{flex:0 0 auto;display:flex;align-items:baseline;gap:18px;padding:10px 30px;
    background:var(--ink);color:var(--accent);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .cd .numrow .h{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:120px;line-height:.9;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .cd .numrow .u{font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:.06em}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:20px 72px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="tag">RISE</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">PRICE UP / 即将涨价</span>
  </div>

  <div class="mid anim" id="mid">
    <div class="axis">
      <div class="spine"></div>
      <div class="node anim" id="nodeA">
        <span class="sq anim" id="sqA">01</span>
        <span class="tx">
          <span class="k anim" id="todayLabel" data-fit-max="36" data-fit-min="19">今日价格</span>
          <span class="d anim" id="dA">TODAY / 现在可下单</span>
        </span>
      </div>
      <div class="node two anim" id="nodeB">
        <span class="sq anim" id="sqB">02</span>
        <span class="tx">
          <span class="k anim" id="nextLabel" data-fit-max="36" data-fit-min="19">明日恢复原价</span>
          <span class="d anim" id="dB">TOMORROW / 次日 0 点生效</span>
        </span>
      </div>
    </div>

    <div class="rows">
      <div class="row today anim" id="rowA">
        <span class="k anim" id="rowAK" data-fit-max="38" data-fit-min="20">今日价格</span>
        <span class="p anim" id="todayPrice" data-fit-max="118" data-fit-min="54">¥99</span>
      </div>
      <div class="row next anim" id="rowB">
        <span class="k anim" id="rowBK" data-fit-max="38" data-fit-min="20">明日恢复原价</span>
        <span class="p anim" id="nextPrice" data-fit-max="118" data-fit-min="54">¥199</span>
        <span class="rise anim" id="rise">+¥100</span>
      </div>
    </div>
  </div>

  <div class="cd anim" id="cd">
    <span class="k anim" id="cdLabel" data-fit-max="34" data-fit-min="19">距恢复原价还剩</span>
    <span class="numrow anim" id="cdBox">
      <span class="h" id="h">06</span><span class="u">小时</span>
    </span>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：涨价以次日 0 点生效 · 已下单订单不受影响</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'todayLabel', 'nextLabel', 'rowAK', 'rowBK', 'cdLabel', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 涨额与倒计时小时都由价格/上限推导或写死起点，倒计时走完即归零 */
  var today = Number(v.todayPrice), next = Number(v.nextPrice);
  if (!isFinite(today)) today = 0;
  if (!isFinite(next)) next = 0;
  var rise = Math.max(0, Math.round(next - today));
  set('todayPrice', '¥' + today);
  set('nextPrice', '¥' + next);
  set('rise', '+¥' + rise);

  var H0 = 6, RUN = 2.0;        // 展示窗口固定，倒计时从 H0 小时压到 0
  var hEl = document.getElementById('h');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  hEl.textContent = pad(H0);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    hEl.textContent = pad(H0);
    tl.fromTo('#top',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#mid',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#cd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .5);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .62);
    B.hold(tl, 1.3, 1.1);
    return;
  }

  var INK = '#0F0F0F', WHT = '#FFFFFF';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + WHT, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#top',     0.00,   0, -66, 0.26);
  slam('#eyebrow', 0.14, -24, -20, 0.22);
  /* 左时间轴自上落下竖轴，两行价格自右画外依次切入 */
  tl.fromTo('#nodeA', { y: -60 }, { y: 0, duration: .26, ease: 'power4.out' }, 0.36);
  tl.fromTo('#nodeB', { y: 60 },  { y: 0, duration: .26, ease: 'power4.out' }, 0.50);
  slam('#sqA', 0.54, -28, -28, 0.24);
  slam('#sqB', 0.68, -28, -28, 0.24);
  slam('#todayLabel', 0.66,   0, -20, 0.22);
  slam('#nextLabel',  0.80,   0, -20, 0.22);
  tl.fromTo('#rowA', { x: 120 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.58);
  tl.fromTo('#rowB', { x: 120 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.76);
  slam('#todayPrice', 0.78,   0, -24, 0.24);
  slam('#nextPrice',  0.96,   0, -24, 0.24);
  slam('#rise',       1.10,   0, -20, 0.22);
  /* 倒计时条自下硬落位，数字走完后立刻进入静止 hold */
  tl.fromTo('#cd', { y: 80 }, { y: 0, duration: .28, ease: 'power4.out' }, 1.18);
  shadowBounce('#cdBox', '8px 8px 0 ' + WHT, 1.46);
  var T0 = 1.46;
  var c = { v: H0 };
  tl.to(c, {
    v: 0, duration: RUN, ease: 'none',
    onUpdate: function () { hEl.textContent = pad(Math.max(0, Math.round(c.v))); },
    onComplete: function () { hEl.textContent = '00'; }
  }, T0);
  slam('#foot',   T0 + RUN + 0.06,   0,  28, 0.26);
  slam('#note',   T0 + RUN + 0.18, -24, -20, 0.22);
  slam('#stripe', T0 + RUN + 0.28,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.1, ease: 'none' }, T0 + RUN + 0.52);

  var introEnd = T0 + RUN + 1.64;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
