<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"WARNING / 警示"},
{"id":"mark","name":"警示符","type":"string","label":"警示方块里的字符（1 字）","default":"!"},
{"id":"lab","name":"警示标签","type":"string","label":"警示方块下方 mono 标签","default":"MOST COMMON MISTAKE"},
{"id":"warn","name":"警示语","type":"string","label":"超大警示语（一行，8–12 字）","default":"别把特效当内容"},
{"id":"r1","name":"说明 1","type":"string","label":"说明第 1 行","default":"转场越多，观众越记不住你说了什么"},
{"id":"r2","name":"说明 2","type":"string","label":"说明第 2 行","default":"一帧里有两个重心，两个都记不住"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚","default":"警示件只留一条落点 · 不叠三条以上"},
{"id":"accent","name":"强调色","type":"color","label":"强调色（警示块 + 斜纹带）","default":"#FFD429"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>警示语画面 · 别把特效当内容</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整块换底色（基因 10）：ink 底 + white 字，反白是整块替换，不叠蒙版 */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* 深底专用阴影档位（规则 B：承载底色是深色，阴影换成白） */
  .sh-w{box-shadow:8px 8px 0 var(--white)}
  .sh-s{box-shadow:4px 4px 0 var(--white)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:46px 88px 0}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    color:var(--accent);white-space:nowrap;flex:0 0 auto}
  .blink{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:14px}
  .blink i{display:block;width:24px;height:24px;background:var(--accent);
    border:var(--bw) solid var(--white)}

  .body{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:64px;padding:0 88px}
  /* 警示方块：120×120 强调色块 + 超大字符，撞 3px 白边（深底专用描边色换成 paper） */
  .mark{flex:0 0 auto;width:150px;height:150px;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:var(--ink);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    font-family:var(--mono);font-weight:900;font-size:104px;line-height:1}
  .mlab{flex:0 0 auto;width:150px;font-family:var(--mono);font-weight:700;font-size:20px;
    letter-spacing:.06em;line-height:1.35;color:var(--white);word-break:break-all}

  .warnbox{flex:1 1 auto;min-width:0}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .warn{display:block;white-space:nowrap;font-weight:900;font-size:132px;line-height:1.14;
    letter-spacing:0;color:var(--white);padding-right:24px}
  .rules{margin-top:34px;border-top:var(--bw) solid var(--paper)}
  .rl{display:flex;align-items:center;gap:18px;padding:16px 0;
    border-bottom:var(--bw) solid var(--paper)}
  .rl .sq{flex:0 0 auto;width:26px;height:26px;background:var(--accent);
    border:var(--bw) solid var(--paper)}
  .rt{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;font-size:34px;
    font-weight:700;line-height:1.3;letter-spacing:0;color:var(--white)}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:26px 88px 42px}
  .note{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em;
    color:var(--white);white-space:nowrap;flex:0 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis}
  .rule{flex:1 1 auto;border-top:var(--bw) solid var(--paper)}
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--paper);
    border-bottom:var(--bw) solid var(--paper);
    background:repeating-linear-gradient(45deg,var(--paper) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">WARNING / 警示</span>
    <span class="blink anim" id="blink"><i></i><i></i><i></i></span>
  </div>

  <div class="body anim" id="body">
    <div>
      <div class="mark anim" id="mark" data-fit-max="104" data-fit-min="48">!</div>
      <div class="mlab anim" id="lab" data-fit-max="20" data-fit-min="12">MOST COMMON MISTAKE</div>
    </div>
    <div class="warnbox anim" id="warnbox">
      <div class="warn anim" id="warn" data-fit-max="132" data-fit-min="66">别把特效当内容</div>
      <div class="rules anim" id="rules">
        <div class="rl anim"><span class="sq"></span><span class="rt" id="r1" data-fit-max="34" data-fit-min="17">转场越多，观众越记不住你说了什么</span></div>
        <div class="rl anim"><span class="sq"></span><span class="rt" id="r2" data-fit-max="34" data-fit-min="17">一帧里有两个重心，两个都记不住</span></div>
      </div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">警示件只留一条落点 · 不叠三条以上</span>
    <span class="rule anim" id="rule"></span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'mark', 'lab', 'warn', 'r1', 'r2', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    gsap.set('#blink i', { x: 0, opacity: 1 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#body',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.12);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.46);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd', 0.00, -28, -20, 0.24);
  /* 警示信号灯：三个方块错峰硬闪（模 8 色块闪切，1 帧硬切，不做渐变） */
  tl.set('#blink i', { backgroundColor: '#0F0F0F', immediateRender: false }, 0.16);
  tl.set('#blink i', { backgroundColor: '#FFD429', immediateRender: false }, 0.32);
  tl.set('#blink i', { backgroundColor: '#0F0F0F', immediateRender: false }, 0.48);

  slam('#body', 0.16,   0, -24, 0.28);
  /* 大面积警示块：power3.out + from:.86，零过冲 */
  tl.fromTo('#mark', { scale: 0.86 },
    { scale: 1, duration: 0.26, ease: 'power3.out' }, 0.30);
  slam('#lab',  0.44, -28, 0, 0.24);
  slam('#warn', 0.30,   0, -32, 0.28);
  slam('#rules', 0.72,  0, -20, 0.26);
  slam('#r1',   0.84, -32, 0, 0.22);
  slam('#r2',   0.98, -32, 0, 0.22);

  slam('#foot', 1.36, 0, 24, 0.26);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.28, ease: 'power4.out' }, 1.48);
  slam('#note', 1.62, 0, -16, 0.22);
  /* 模 7 分格揭示：斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.76);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.10);

  var introEnd = 3.10;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
