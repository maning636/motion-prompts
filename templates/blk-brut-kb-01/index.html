<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"OPENING / 开场标题"},{"id":"badge","name":"徽标","type":"string","label":"左上角徽章文案","default":"新开场"},{"id":"titleA","name":"主标题 · 前段","type":"string","label":"主标题第一行（普通字）","default":"把品牌做成"},{"id":"titleB","name":"主标题 · 彩色词块","type":"string","label":"主标题第二行（彩色积木块里的词）","default":"积木"},{"id":"sub","name":"副标题","type":"string","label":"副标题（一行短句）","default":"能拆、能改、能复用的视觉零件"},{"id":"accent","name":"强调色","type":"color","label":"强调色（黄/粉/绿/蓝）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>大标题拍入 · 把品牌做成积木</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0
     （风格规范 §8 交付骨架自己就把眉标写成 26px = 13×2），即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* 阴影四档：X 恒等于 Y，第三值恒 0（基因 2） */
  .sh-s{box-shadow:4px 4px 0 var(--ink)}
  .sh-m{box-shadow:6px 6px 0 var(--ink)}
  .sh-l{box-shadow:8px 8px 0 var(--ink)}

  /* 通告条：ink 底 + white 字，mono 标签无描边无阴影（§3.1） */
  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--ink);color:var(--white);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--yellow);color:var(--ink);padding:3px 14px;border-radius:9999px}
  .promo .parw{color:var(--yellow);font-weight:900}

  .hero{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    padding:60px 88px 56px}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:24px}
  .badge{display:inline-block;border-radius:9999px;padding:8px 20px;
    font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.10em;
    background:var(--accent);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);white-space:nowrap;flex:0 1 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    text-transform:uppercase;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}

  /* 中文大字：一行一块、nowrap，交给 B.fit() 按容器实测缩放，绝不写死 font-size。
     字距取 0——中文收紧会粘连（iart 拆解 §7.9 明确要求推翻负字距）。 */
  .stack{flex:0 0 auto;width:100%;padding-right:28px;margin-top:auto}
  .line{display:block;white-space:nowrap;font-weight:900;font-size:152px;
    line-height:1.06;letter-spacing:0}
  .chip{display:inline-block;line-height:1;padding:0 22px;
    background:var(--blue);color:var(--white);border:var(--bw) solid var(--ink);
    border-radius:4px;box-shadow:8px 8px 0 var(--ink)}

  .sub{flex:0 0 auto;margin-top:30px;font-size:34px;font-weight:700;line-height:1.5;
    letter-spacing:0;white-space:nowrap}
  /* 3px 实线当分隔：把标题区和落款区分开（基因 7），不靠留白分段 */
  .rule{flex:0 0 auto;width:100%;margin-top:auto;margin-bottom:34px;
    border-top:var(--bw) solid var(--ink)}

  .meta{flex:0 0 auto;display:flex;align-items:center;gap:22px}
  .mark{width:52px;height:52px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;background:var(--yellow);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink);
    font-family:var(--mono);font-weight:700;font-size:22px}
  .names{display:flex;align-items:baseline;gap:14px}
  .names .cn{font-weight:900;font-size:34px}
  .names .en{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em}
  .year{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.10em;padding:8px 20px;border-radius:9999px;
    background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);white-space:nowrap;flex:0 1 auto;
    min-width:0;overflow:hidden;text-overflow:ellipsis;}

  /* 斜纹带：45° repeating，周期 10+10=20px（基因 4 唯一合法渐变） */
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:22px 88px;background:var(--ink);color:var(--white)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow)}
  .foot .fc{font-size:26px;font-weight:700;letter-spacing:0}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="promo anim" id="promo">
    <span class="ptag">NEW</span><span class="ptx">开场标题件 · 逐行拍入 + 彩色词块</span><span class="parw">→</span>
  </div>

  <div class="hero anim" id="hero">
    <div class="top">
      <span class="badge anim" id="badge" data-fit-max="22" data-fit-min="14">新开场</span>
      <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">OPENING / 开场标题</span>
    </div>

    <div class="stack">
      <div class="line anim" id="titleA" data-fit-max="152" data-fit-min="76">把品牌做成</div>
      <div class="line anim" id="lineB" data-fit-max="152" data-fit-min="76"><span class="chip sh-l" id="titleB">积木</span></div>
    </div>

    <p class="sub anim" id="sub" data-fit-max="34" data-fit-min="18">能拆、能改、能复用的视觉零件</p>
    <div class="rule anim" id="rule"></div>

    <div class="meta">
      <div class="mark anim" id="mark">BB</div>
      <div class="names anim" id="brand"><span class="cn">积木社</span><span class="en">BLOCKBRUT</span></div>
      <div class="year anim" id="year" data-fit-max="22" data-fit-min="14">2017 — 2026</div>
    </div>
  </div>

  <div class="stripe anim" id="stripe"></div>

  <div class="foot anim" id="foot">
    <span class="fm">BUILD / 2026</span><span class="fc">积木社 · 一条规矩一个动作</span>
  </div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'badge', 'titleA', 'titleB', 'sub'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    tl.fromTo('.promo', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('.hero',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.15);
    tl.fromTo('.stripe', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.35);
    tl.fromTo('.foot',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  /* 模 1 拍进来：power4.out 位移 ≤0.3s 硬着陆，落定后阴影压 2 帧再弹回原档 */
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var press = rest.replace(/(\d+)px\s+(\d+)px/, '$1px ' + (parseInt(RegExp.$1, 10) + 3) + 'px');
    tl.set(sel, { boxShadow: press, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#promo',  0.00,   0, -56, 0.26);
  slam('#badge',  0.18, -28, -28, 0.24);
  shadowBounce('#badge', '3px 3px 0 ' + INK, 0.42);
  slam('#eyebrow', 0.28,   0, -20, 0.22);
  slam('#titleA', 0.42,  -28, -28, 0.26);
  slam('#lineB', 0.58,  -28, -28, 0.26);
  shadowBounce('#titleB', '8px 8px 0 ' + INK, 0.84);
  slam('#sub',   0.96,    0, -20, 0.24);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.26, ease: 'power4.out' }, 1.10);
  slam('#mark',  1.26, -28, -28, 0.24);
  shadowBounce('#mark', '4px 4px 0 ' + INK, 1.50);
  slam('#brand', 1.34,   0, -20, 0.22);
  slam('#year',  1.42,  28, -28, 0.24);
  slam('#foot',  1.56,   0,  24, 0.26);
  /* 模 6：条纹带匀速滚动，位移取 20px 整周期，ease:none（不做无限循环，避免时间轴长度发散） */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.9, ease: 'none' }, 1.72);

  var introEnd = 2.62;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
