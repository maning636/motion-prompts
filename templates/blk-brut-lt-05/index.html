<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"note","name":"左端标签","type":"string","label":"左端 mono 标签（2–8 字）","default":"KEY POINT"},{"id":"text","name":"字幕文案","type":"string","label":"字幕文案（口播原句，10–20 字，单行）","default":"真正拉开差距的，是能不能把话说明白"},{"id":"tag","name":"字幕标记","type":"string","label":"右下角 mono 标记（2–8 字）","default":"CC"},{"id":"accent","name":"强调色","type":"color","label":"强调色（左端竖条）","default":"#FFD429"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","hidden":true,"default":"transparent","options":[{"value":"transparent","label":"透明底"},{"value":"mp4","label":"MP4 纯底"},{"value":"webm","label":"WebM 纯底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="口播字幕条：强调色竖条 + 白底 900 大字卡 + 右下角 ink 字幕标记，整条自下方硬落位后竖条做机械位差呼吸">
<title>口播字幕条 · KEY POINT</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 透明底贴片：--paper 全程不出现，底色与阴影色收进变量（风格规范 §7.1 / §7.2 规则 A） */
  :root{ --shadow:#FFFFFF; --background:transparent; }

  html,body{margin:0;padding:0;background:var(--background)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--background);color:var(--ink);font-family:var(--sans)}

  /* 主卡：白底填充 + 3px ink 描边 + 8px 硬阴影（基因 1 / 2 / 6） */
  #sub{position:absolute;left:220px;right:420px;bottom:168px;display:flex;align-items:stretch;
    background:var(--white);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  /* 左端竖条：高饱和实色块，永远带 3px 边（§7.3.2 透明底首选填充） */
  .bar{flex:0 0 22px;background:var(--accent);border-right:var(--bw) solid var(--ink)}
  .body{flex:1 1 auto;min-width:0;padding:26px 44px 30px}
  #note{display:block;font-family:var(--mono);font-weight:700;font-size:22px;
    letter-spacing:.14em;line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden}
  /* 中文大字：字距恒 0，靠 data-fit 收口而不是负字距（规范 §15） */
  #text{display:block;margin-top:14px;font-size:62px;font-weight:900;line-height:1.16;
    letter-spacing:0;color:var(--ink);white-space:nowrap;overflow:hidden}
  /* 字幕标记：ink 底黄字，压在 footage 上也读得清（基因 10 / §7.3.3） */
  #cc{position:absolute;right:120px;bottom:168px;padding:18px 30px;
    background:var(--ink);color:var(--yellow);border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:8px 8px 0 var(--shadow)}
  #tag{display:block;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.12em;line-height:1;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="sub">
    <div class="bar"></div>
    <div class="body">
      <div id="note" data-fit-max="22" data-fit-min="14">KEY POINT</div>
      <div id="text" data-fit-max="62" data-fit-min="30">真正拉开差距的，是能不能把话说明白</div>
    </div>
  </div>
  <div id="cc"><span id="tag" data-fit-max="26" data-fit-min="14">CC</span></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* 透明底分支（风格规范 §7.5） */
  var isT = (v.exportMode || 'transparent') === 'transparent';
  var r = document.documentElement.style;
  r.setProperty('--background', isT ? 'transparent' : '#0F0F0F');
  r.setProperty('--shadow', isT ? '#FFFFFF' : '#0F0F0F');
  if (v.accent) r.setProperty('--accent', v.accent);

  function set(id, val) {
    var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val;
  }
  ['note', 'text', 'tag'].forEach(function (k) { set(k, v[k]); });

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  B.fitAll();
  var tl = B.tl();

  if (reduce) {
    /* 降级：去掉落位与位差呼吸，只留终态 + ≤8px 微位移淡入（规范 §13.5） */
    gsap.set('#sub', { x: 0, y: 0, opacity: 1, boxShadow: '8px 8px 0 ' + (isT ? '#FFFFFF' : '#0F0F0F') });
    gsap.set('#cc',  { x: 0, y: 0, opacity: 1 });
    gsap.set('#note', { x: 0 });
    gsap.set('#text', { x: 0 });

    tl.fromTo('#sub', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, 0);
    tl.fromTo('#cc', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, .45);

    B.hold(tl, 1.6, 1.2);
    return;
  }

  var TOTAL = parseFloat(v.duration) > 0 ? parseFloat(v.duration) : 5;
  var HOLD = 0.5;
  var WIN = Math.max(1.6, TOTAL - HOLD);
  var SH = isT ? '#FFFFFF' : '#0F0F0F';

  /* 模 1 · 硬着陆：字幕条自下方 44px 落位，落定瞬间阴影压 2 帧再弹回原档。零 overshoot。 */
  tl.fromTo('#sub', { y: 44 },
      { y: 0, duration: .26, ease: 'power4.out' }, 0)
    .fromTo('#sub', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#sub', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });
  /* 模 2 · 零件装上去：左端竖条与文字错峰跟位，纯位移，opacity 恒为 1 */
  tl.fromTo('.bar', { y: 26 }, { y: 0, duration: .22, ease: 'power4.out' }, .18);
  tl.fromTo('#note', { x: -22 }, { x: 0, duration: .2, ease: 'power4.out' }, .24);
  tl.fromTo('#text', { x: -30 }, { x: 0, duration: .24, ease: 'power4.out' }, .3);
  /* 右下角字幕标记：自右拍入，位移量与阴影偏移同量级 */
  tl.fromTo('#cc', { x: 48, y: 20 },
      { x: 0, y: 0, duration: .24, ease: 'power4.out' }, .2)
    .fromTo('#cc', { boxShadow: '8px 8px 0 ' + SH },
      { boxShadow: '8px 11px 0 ' + SH, duration: .04, ease: 'steps(2)' }, '<')
    .to('#cc', { boxShadow: '8px 8px 0 ' + SH, duration: .04, ease: 'steps(2)' });

  /* 机械位差呼吸：竖条与标记各走一段匀速往返，不碰 scale。
     严禁 sine.inOut + repeat:-1 + yoyo（规范 §4.4），repeat 必须是有限值：
     repeat:-1 会把 tl.duration() 撑到 1e10s，云渲染 settle 取帧直接失效。 */
  var T0 = .95;
  var REP = Math.max(1, Math.round((WIN - T0) / .9));
  var half = (WIN - T0) / (REP * 2);
  tl.to('.bar', { y: -6, duration: half, ease: 'none', repeat: REP * 2 - 1, yoyo: true }, T0);
  tl.to('#cc', { y: -5, duration: half, ease: 'none', repeat: REP * 2 - 2, yoyo: true }, T0 + half);

  var end = tl.duration();
  B.hold(tl, end, Math.max(HOLD, TOTAL - end));
})();
</script>
</body></html>
