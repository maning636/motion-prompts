<!doctype html>
<html lang="zh-CN" data-composition-variables='[
{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（mono + 大字距）","default":"KEYWORD / 关键词"},
{"id":"title","name":"主标题","type":"string","label":"主标题（两行拼一段，不超 22 字）","default":"先把话说清楚，再把画面做满"},
{"id":"pa","name":"正文前半","type":"string","label":"正文 · 关键词之前","default":"口播视频最容易翻车的地方不是剪辑，是观众"},
{"id":"kw","name":"关键词","type":"string","label":"被高亮的关键词（2–6 字）","default":"没听懂"},
{"id":"pb","name":"正文后半","type":"string","label":"正文 · 关键词之后","default":"就已经划走了，后面做得再认真也没人看。"},
{"id":"note","name":"注脚","type":"string","label":"底部 mono 注脚（口径 / 出处）","default":"关键词高亮不超过 2 处 · 本片 1 处"},
{"id":"accent","name":"强调色","type":"color","label":"高亮色 + 斜纹带","default":"#FFD429"},
{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–8）","default":5.5},
{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>关键词高亮扫过 · 先把话说清楚，再把画面做满</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  /* 字号阶梯 = 风格规范基因 8 的 76/48/24/17/13/11 在 1920×1080 画布上等比放大 2.0，即 152/96/48/34/26/22。 */
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .sh-s{box-shadow:4px 4px 0 var(--ink)}

  .hd{flex:0 0 auto;padding:50px 88px 0;display:flex;align-items:baseline;gap:24px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;flex:0 0 auto}
  /* 中文大字：块级 + nowrap，交给 B.fit() 按容器实测缩放，字距 0 */
  .title{flex:0 1 auto;min-width:0;display:block;white-space:nowrap;font-weight:900;
    font-size:76px;line-height:1.1;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}

  .rule1{flex:0 0 auto;margin:34px 88px 0;border-top:var(--bw) solid var(--ink)}

  /* 正文区：高亮块用真实元素而不是伪元素，GSAP 才能补间它 */
  .para{flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:0 88px}
  .ptext{font-size:52px;font-weight:700;line-height:1.62;letter-spacing:0;
    color:var(--ink)}
  .ptext > span{display:inline}
  /* isolation:isolate 把高亮块关进自己的层叠上下文，压在字下面而不压到别的元素上 */
  .hl{position:relative;isolation:isolate;display:inline}
  .hl i{position:absolute;left:-10px;right:-10px;bottom:.10em;height:.66em;
    background:var(--accent);z-index:-1;display:block}

  .footrow{flex:0 0 auto;padding:0 88px 44px}
  .rule2{width:100%;border-top:var(--bw) solid var(--ink)}
  .note{display:block;margin-top:20px;font-family:var(--mono);font-weight:700;
    font-size:22px;letter-spacing:.12em;color:var(--mute);white-space:nowrap;
    min-width:0;overflow:hidden;text-overflow:ellipsis}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="eyebrow anim" id="eyebrow" data-fit-max="26" data-fit-min="16">KEYWORD / 关键词</span>
    <div class="title anim" id="title" data-fit-max="76" data-fit-min="38">先把话说清楚，再把画面做满</div>
  </div>

  <div class="rule1 anim" id="rule1"></div>

  <div class="para anim" id="para">
    <p class="ptext" id="ptext"><span id="pa">口播视频最容易翻车的地方不是剪辑，是观众</span><span class="hl" id="hl"><i class="anim" id="mark"></i><span id="kw">没听懂</span></span><span id="pb">就已经划走了，后面做得再认真也没人看。</span></p>
  </div>

  <div class="footrow anim" id="footrow">
    <div class="rule2 anim" id="rule2"></div>
    <span class="note anim" id="note" data-fit-max="22" data-fit-min="14">关键词高亮不超过 2 处 · 本片 1 处</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'pa', 'kw', 'pb', 'note'].forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scaleX: 1, scale: 1, rotate: 0 });
    /* 降级：高亮块直接给满幅成品状态，不做扫过 */
    gsap.set('#mark', { scaleX: 1, transformOrigin: 'left center' });
    tl.fromTo('#hd',      { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0);
    tl.fromTo('#rule1',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.12);
    tl.fromTo('#para',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.24);
    tl.fromTo('#footrow', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.4);
    tl.fromTo('#stripe',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.54);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }

  slam('#hd',    0.00, -28, -20, 0.24);
  tl.fromTo('#rule1', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.26, ease: 'power4.out' }, 0.16);
  slam('#para',  0.30,   0,  24, 0.28);

  /* 模 7 分格揭示：高亮块从左逐格扫过关键词，steps(6) 是「一格一格推进」的机械感，
     不用连续补间——连续扫会读成荧光笔的软擦，破坏硬边语言。 */
  tl.fromTo('#mark', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.36, ease: 'steps(6)' }, 0.86);

  slam('#footrow', 1.34, 0, 24, 0.26);
  tl.fromTo('#rule2', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.26, ease: 'power4.out' }, 1.46);
  slam('#note',     1.62, 0, -16, 0.22);
  /* 模 7 分格揭示：底部斜纹带从左逐格推出 */
  tl.fromTo('#stripe', { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0%)', duration: 0.34, ease: 'steps(8)' }, 1.76);
  /* 模 6：斜纹带匀速滚动，位移取 20px 整周期，ease:none */
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 1.0, ease: 'none' }, 2.10);

  var introEnd = 3.10;
  var total = Math.min(8, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
