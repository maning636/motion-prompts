<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"front","type":"string","label":"正面主文案","default":"限时 5 折"},{"id":"back","type":"string","label":"背面 CTA","default":"立即抢购"},{"id":"note","type":"string","label":"背面小字","default":"仅剩最后 200 份"},{"id":"accent","type":"color","label":"强调色","default":"#FFD429"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

    <style>

@font-face{font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;src:local('MiSans');font-weight:100 1000;font-display:swap}

*{ box-sizing: border-box;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .big{ font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-weight: 900; color: var(--accent);
        line-height: 1.06; letter-spacing: -.03em; margin: 0;font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;}
      .sub{ font-size: 38px; color: rgba(244,239,231,.7); margin: 0;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .cta{ display: inline-flex; align-items: center; gap: 20px; background: var(--accent); color: var(--ink);
        border-radius: 18px; padding: 28px 60px; box-shadow: 0 0 0 5px var(--accent), 0 0 0 9px var(--ink), 14px 14px 0 rgba(0,0,0,.55);font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif; font-weight: 900; color: var(--ink);font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;}
      .frame{ position: absolute; width: 88px; height: 88px; border: 7px solid var(--accent); opacity: .85;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .frame.tl{ left: 54px; top: 54px; border-right: none; border-bottom: none;}
      .frame.br{ right: 54px; bottom: 54px; border-left: none; border-top: none;}
      .scene{ display: flex; align-items: center; justify-content: center; perspective: 2200px; }
      .flip{ position: relative; width: 860px; height: 560px; transform-style: preserve-3d; }
      .face{ position: absolute; inset: 0; backface-visibility: hidden; border-radius: 26px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        box-shadow: 18px 18px 0 rgba(0,0,0,.55);}
      .front{ background: var(--accent); color: var(--ink); }
      .back{ background: var(--ink); color: var(--accent); transform: rotateY(180deg);
        border: 7px solid var(--accent); box-shadow: 18px 18px 0 rgba(0,0,0,.55), 0 0 0 7px var(--accent);}
      .big{ font-size: 150px; color: var(--ink);}
      .back .b{ font-size: 88px; color: var(--accent);}
      .note{ font-size: 34px; color: rgba(244,239,231,.66); }

    </style>
  </head>
  <body>
      <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="flip" id="flip">
          <div class="face front">
            <span class="big" id="front"></span>
            <span class="chip" id="note"></span>
          </div>
          <div class="face back">
            <span class="b" id="back"></span>
          </div>
        </div>
      </section>
      </div>
    <script>
      const fallback = {front: "限时 5 折", back: "立即抢购", note: "仅剩最后 200 份", accent: "#FFD429", background: "#12100E", foreground: "#F4EFE7"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      const root = document.getElementById("root");
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      root.style.backgroundColor = v.background;
      root.style.setProperty("--accent", v.accent ?? "#FFD429");
      root.style.setProperty("--fg", v.foreground ?? "#F4EFE7");
      root.style.setProperty("--ink", v.background ?? "#12100E");
      document.getElementById("front").textContent = v.front;
      document.getElementById("back").textContent = v.back;
      document.getElementById("note").textContent = v.note;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".flip", { opacity: 0, scale: 0.8, y: 50 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.9)" }, 0.08);
      tl.to(".flip", { rotationY: 180, duration: 0.95, ease: "power3.inOut" }, 1.65);
      tl.fromTo(".b", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(2.6)" }, 2.15);
      tl.to(".flip", { scale: 1.05, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, 2.7);
      tl.to(".scene", { opacity: 0, duration: 0.42, ease: "power2.in" }, 4.55);
      window.__timelines.main = tl;
    </script>
  </body>
