<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"2ND HALF / 第二件半价"},{"id":"title","name":"主标题","type":"string","label":"主标题（右上角的一行字）","default":"同一件买两件，第二件直接半价"},{"id":"dayLabel","name":"第一件标签","type":"string","label":"第一行标签","default":"第 1 件 · 按原价"},{"id":"halfLabel","name":"第二件标签","type":"string","label":"第二行标签","default":"第 2 件 · 半价"},{"id":"dayPrice","name":"单件原价","type":"number","label":"单件原价（元）","default":99},{"id":"note","name":"规则说明","type":"string","label":"底部规则说明（一行 mono）","default":"同 SKU 同规格自动配对 · 优惠后价自动分摊"},{"id":"accent","name":"强调色","type":"color","label":"强调色（第二行底 / 斜纹带）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="满宽上下两格构图：第一件原价白底、第二件半价压强调色，右下角一枚半价方章压住画面，反白规则条收尾">
<title>第二件半价 · 同一件买两件，第二件直接半价</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:22px;
    padding:26px 72px;background:var(--ink);color:var(--white)}
  .top .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .top .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .top .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:34px;font-weight:900;letter-spacing:0;text-align:right}

  /* 满宽上下两格，格间 3px 实线（基因 7） */
  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    position:relative;overflow:hidden}
  .line{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:36px;
    padding:0 72px;overflow:hidden}
  .line.one{background:var(--white);border-bottom:var(--bw) solid var(--ink)}
  .line.two{background:var(--accent);color:var(--ink)}
  .line .k{flex:0 0 auto;display:inline-flex;align-items:center;padding:10px 24px;
    border-radius:9999px;border:var(--bw) solid var(--ink);
    font-size:30px;font-weight:900;white-space:nowrap;
    max-width:620px;overflow:hidden;text-overflow:ellipsis}
  .line.one .k{background:var(--paper);color:var(--ink)}
  .line.two .k{background:var(--ink);color:var(--accent)}
  .line .cur{flex:0 0 auto;font-family:var(--mono);font-weight:900;font-size:64px;
    line-height:1}
  .line .p{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:184px;line-height:.94;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .line.one .p{color:var(--mute)}
  .line .tail{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:30px;font-weight:700;letter-spacing:0}

  /* 右下半价方章：压在第二行上，白影（承载底色是深色件） */
  .stamp{position:absolute;right:88px;bottom:52px;z-index:5;
    width:200px;height:200px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;
    background:var(--ink);color:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--white)}
  .stamp .n{font-family:var(--mono);font-weight:900;font-size:96px;line-height:1;
    letter-spacing:0}
  .stamp .t{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.12em}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:20px 72px;
    border-top:var(--bw) solid var(--ink);background:var(--ink);color:var(--white)}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--white);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.08em}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="tag anim" id="tag">HALF</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">2ND HALF / 第二件半价</span>
    <span class="tt anim" id="title" data-fit-max="34" data-fit-min="18">同一件买两件，第二件直接半价</span>
  </div>

  <div class="main anim" id="main">
    <div class="line one">
      <span class="k anim" id="dayLabel" data-fit-max="30" data-fit-min="17">第 1 件 · 按原价</span>
      <span class="cur">¥</span>
      <span class="p anim" id="dayPrice" data-fit-max="184" data-fit-min="80">99</span>
      <span class="tail anim" id="tailOne">按日常价结算，不参与优惠</span>
    </div>
    <div class="line two">
      <span class="k anim" id="halfLabel" data-fit-max="30" data-fit-min="17">第 2 件 · 半价</span>
      <span class="cur">¥</span>
      <span class="p anim" id="halfPrice" data-fit-max="248" data-fit-min="104">49</span>
      <span class="tail anim" id="tailTwo">系统自动匹配，不需要手动选</span>
    </div>
    <div class="stamp anim" id="stamp">
      <span class="n">½</span>
      <span class="t">OFF</span>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">同 SKU 同规格自动配对 · 优惠后价自动分摊</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'dayLabel', 'halfLabel', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 半价是从原价算出来的，绝不单独再填一次 */
  var day = Number(v.dayPrice);
  if (!isFinite(day)) day = 0;
  var half = day / 2;
  set('dayPrice', String(Math.round(day)));
  set('halfPrice', half % 1 === 0 ? String(half) : half.toFixed(2));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#top',   { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#main',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F', WHT = '#FFFFFF';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + WHT, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#top',      0.00,   0, -60, 0.26);
  slam('#eyebrow',  0.14, -24, -20, 0.22);
  slam('#title',    0.20,  24, -20, 0.22);
  /* 第一行自左画外、第二行自右画外对向切入 */
  tl.fromTo('.line.one', { x: -120 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.44);
  tl.fromTo('.line.two', { x: 120 },  { x: 0, duration: .28, ease: 'power4.out' }, 0.60);
  slam('#dayLabel',  0.78,   0, -24, 0.24);
  slam('#dayPrice',  0.88,   0, -28, 0.26);
  slam('#halfLabel', 0.98,   0, -24, 0.24);
  slam('#halfPrice', 1.08,   0, -28, 0.26);
  slam('#tailOne',   1.22,  24, -20, 0.22);
  slam('#tailTwo',   1.28,  24, -20, 0.22);
  /* 模 1 拍进来：方章斜向砸入，落定后阴影压 2 帧再弹回 8px 白影 */
  tl.fromTo('#stamp', { x: -40, y: 44 },
      { x: 0, y: 0, duration: .28, ease: 'power4.out' }, 1.46);
  shadowBounce('#stamp', '8px 8px 0 ' + WHT, 1.74);
  slam('#foot',      1.90,   0,  28, 0.26);
  slam('#note',      2.02, -24, -20, 0.22);
  slam('#stripe',    2.12,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.36);

  var introEnd = 3.56;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
