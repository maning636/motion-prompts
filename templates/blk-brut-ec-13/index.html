<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（反白画面上的 mono 字）","default":"FLASH / 整点秒杀"},{"id":"title","name":"主标题","type":"string","label":"主标题（中文大字，两行）","default":"今晚 20:00"},{"id":"titleB","name":"倒计时格标签","type":"string","label":"倒计时归零后三格内显示的字（同步修改）","default":"开抢"},{"id":"seconds","name":"起始倒计时","type":"number","label":"起始倒计时秒数（秒）","default":180},{"id":"cta","name":"按钮文案","type":"string","label":"按钮文案（唯一一处 CTA）","default":"提前进直播间蹲守"},{"id":"note","name":"口径说明","type":"string","label":"底部口径说明（一行 mono）","default":"口径：同一场次 · 每人限购 1 件 · 售完即止"},{"id":"accent","name":"强调色","type":"color","label":"强调色（斜纹带 / CTA 底）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="整屏反白倒计时卡：顶部斜纹带压住画面，中部三格白底倒计时格逐秒跳数归零后整排闪切成开抢态，底部一枚绿色 CTA">
<title>整点秒杀倒计时 · 今晚 20:00 整点开抢</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 整屏反白：底与字整块替换，不叠半透明蒙版（基因 10） */
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--ink);color:var(--white);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* 深底上把描边与斜纹里的 ink 换成 white，整块反白 */
  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--white);
    background:repeating-linear-gradient(45deg,var(--white) 0 10px,var(--accent) 10px 20px)}
  .stripe.b{border-top:var(--bw) solid var(--white);
    background:repeating-linear-gradient(-45deg,var(--white) 0 10px,var(--accent) 10px 20px)}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;
    padding:40px 88px 30px}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:26px;
    letter-spacing:.14em;color:var(--accent)}
  .hd .tt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:44px;font-weight:900;letter-spacing:0;color:var(--white)}

  /* 三格倒计时格：白底 ink 字 + 8px 白影（深底规则 B） */
  .cells{flex:1 1 auto;min-height:0;display:flex;align-items:center;
    justify-content:center;gap:22px;padding:0 72px;overflow:hidden}
  .cell{flex:0 0 auto;width:352px;display:flex;flex-direction:column;align-items:center;
    gap:14px}
  .cell .box{width:352px;height:280px;display:flex;align-items:center;
    justify-content:center;background:var(--white);color:var(--ink);
    border:var(--bw) solid var(--white);border-radius:4px;box-shadow:8px 8px 0 var(--white);
    overflow:hidden}
  .cell .box span{font-family:var(--mono);font-weight:900;font-size:180px;
    line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1}
  .cell .box b{display:none;font-size:88px;font-weight:900;letter-spacing:0;line-height:1}
  /* 归零后整排闪切成开抢态：模 8 色块闪切，1 帧硬切不做渐变 */
  .cells.over .box span{display:none}
  .cells.over .box b{display:block}
  .cell .cap{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--accent)}
  .colon{flex:0 0 auto;align-self:center;font-family:var(--mono);font-weight:900;
    font-size:96px;line-height:1;color:var(--accent);padding-bottom:56px}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:28px;padding:0 88px 36px}
  .cta{flex:0 0 auto;display:inline-flex;align-items:center;gap:16px;padding:18px 40px;
    background:var(--green);color:var(--ink);border:var(--bw) solid var(--white);
    border-radius:4px;box-shadow:8px 8px 0 var(--white);
    font-size:34px;font-weight:900;letter-spacing:0;white-space:nowrap}
  .note{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--white)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="stripe anim" id="stripeA"></div>

  <div class="hd anim" id="hd">
    <span class="tag">FLASH</span>
    <span class="eb anim" id="eyebrow" data-fit-max="26" data-fit-min="16">FLASH / 整点秒杀</span>
    <span class="tt anim" id="title" data-fit-max="44" data-fit-min="24">今晚 20:00</span>
  </div>

  <div class="cells anim" id="cells">
    <div class="cell anim" id="c0">
      <div class="box"><span id="hh">00</span><b class="lab">开抢</b></div>
      <span class="cap">HOUR / 时</span>
    </div>
    <span class="colon" id="colon">:</span>
    <div class="cell anim" id="c1">
      <div class="box"><span id="mm">03</span><b class="lab">开抢</b></div>
      <span class="cap">MIN / 分</span>
    </div>
    <span class="colon" id="colon2">:</span>
    <div class="cell anim" id="c2">
      <div class="box"><span id="ss">00</span><b class="lab">开抢</b></div>
      <span class="cap">SEC / 秒</span>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="cta anim" id="cta" data-fit-max="34" data-fit-min="19">提前进直播间蹲守</span>
    <span class="note anim" id="note" data-fit-max="24" data-fit-min="15">口径：同一场次 · 每人限购 1 件 · 售完即止</span>
  </div>

  <div class="stripe b anim" id="stripeB"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'cta', 'note']
    .forEach(function (k) { set(k, v[k]); });
  /* 倒计时归零后三格内显示的字同步改（一扇多出，跟 lt-04 跑马灯同款写法） */
  Array.prototype.forEach.call(document.querySelectorAll('.box b.lab'), function (e) {
    if (v.titleB != null && v.titleB !== '') e.textContent = v.titleB; });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 倒计时是时间轴位置的纯函数：不用 setInterval、不用 Date.now。
     剩余秒数 = 起始秒数 ×(1 − 进度)，一段固定窗口内压完，再进 hold。
     所以 RUN 是写死的展示窗口，不随起始秒数增长。 */
  var START = Number(v.seconds);
  if (!isFinite(START)) START = 180;
  START = Math.max(3, Math.min(359999, Math.round(START)));
  var RUN = 1.8;                // 倒计时走完所用的时间轴长度（秒）

  var hh = document.getElementById('hh'),
      mm = document.getElementById('mm'),
      ss = document.getElementById('ss');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function paint(r) {
    r = Math.max(0, Math.round(r));
    hh.textContent = pad(Math.floor(r / 3600) % 100);
    mm.textContent = pad(Math.floor(r / 60) % 60);
    ss.textContent = pad(r % 60);
  }
  paint(START);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    /* 降级：数字直接给起始值，不做跳数与闪切 */
    paint(START);
    gsap.set('#cells', { className: 'cells' });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#cells', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripeA',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    tl.fromTo('#stripeB',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .6);
    B.hold(tl, 1.4, 1.1);
    return;
  }

  var WHT = '#FFFFFF';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + WHT, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  tl.fromTo('#stripeA', { clipPath: 'inset(0 100% 0 0)' },
      { clipPath: 'inset(0 0% 0 0%)', duration: .34, ease: 'steps(8)' }, 0);
  slam('#hd',      0.12,   0, -28, 0.24);
  slam('#eyebrow', 0.24, -24, -20, 0.22);
  slam('#title',   0.30, -28, -20, 0.24);
  /* 三格自左右对向切入 */
  tl.fromTo('#c0', { x: -80 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.52);
  tl.fromTo('#c2', { x: 80 },  { x: 0, duration: .28, ease: 'power4.out' }, 0.52);
  slam('#c1',     0.66,   0, -28, 0.26);
  slam('#colon',  0.80,   0, -18, 0.2);
  slam('#colon2', 0.84,   0, -18, 0.2);
  shadowBounce('#c0 .box', '8px 8px 0 ' + WHT, 1.00);
  shadowBounce('#c1 .box', '8px 8px 0 ' + WHT, 1.06);
  shadowBounce('#c2 .box', '8px 8px 0 ' + WHT, 1.12);

  /* 倒计时推进：ease:none 匀速，onUpdate 里只写 textContent，不做任何 DOM 测量 */
  var c = { v: START };
  var T0 = 1.20;
  tl.to(c, {
    v: 0, duration: RUN, ease: 'none',
    onUpdate: function () { paint(c.v); },
    onComplete: function () { paint(0); }
  }, T0);
  /* 模 8 色块闪切：归零那一帧整排硬切成「开抢」，不做渐变过渡 */
  tl.call(function () { document.getElementById('cells').className = 'cells over'; },
      null, T0 + RUN);

  slam('#foot',    T0 + RUN + 0.04,   0,  28, 0.26);
  slam('#cta',     T0 + RUN + 0.16,   0, -24, 0.24);
  slam('#note',    T0 + RUN + 0.24,  24, -18, 0.2);
  tl.fromTo('.stripe', { backgroundPositionX: '0px' },
      { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, T0 + RUN + 0.34);
  tl.fromTo('#stripeB', { clipPath: 'inset(0 0 0 100%)' },
      { clipPath: 'inset(0 0% 0 0%)', duration: .34, ease: 'steps(8)' }, T0 + RUN + 0.10);

  var introEnd = T0 + RUN + 1.60;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
