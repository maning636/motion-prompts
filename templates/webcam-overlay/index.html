<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"position","type":"string","label":"位置（top-left/top-right/bottom-left/bottom-right）","default":"top-right"},{"id":"size","type":"number","label":"圆形直径（px）","default":240},{"id":"borderWidth","type":"number","label":"边框宽度（px）","default":4},{"id":"showPip","type":"string","label":"是否显示小三角指示器（true/false）","default":"true"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

    <style>

@font-face{font-family:'MiSans SemiBold','MiSans','PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif;src:local('MiSans');font-weight:100 1000;font-display:swap}
@font-face{font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;src:local('MEBHeiHeiTi');font-weight:100 1000;font-display:swap}

*{ box-sizing: border-box;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 48px; overflow: hidden;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .webcam{ position: absolute; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .ring{ position: absolute; inset: 0; border-radius: 50%; border: solid var(--accent);font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .pip{ position: absolute; width: 0; height: 0; border-style: solid;font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif;}
      .placeholder{ font-family:'MEBHeiHeiTi','Hanzipen SC','KaiTi','STKaiti','楷体','Kaiti SC','STHeiti','Microsoft YaHei',system-ui,sans-serif; font-size: 18px; color: var(--fg); opacity: 0.35; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="webcam" id="webcam">
          <div class="ring" id="ring"></div>
          <div class="placeholder" id="placeholder">camera<br/>mask</div>
          <div class="pip" id="pip"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { position: "top-right", size: 240, borderWidth: 4, showPip: "true", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--bg", v.background);
      root.style.setProperty("--fg", v.foreground);
      root.style.backgroundColor = v.background;

      const size = Number(v.size) || 240;
      const margin = 48;
      const positions = {
        "top-left": { left: margin, top: margin },
        "top-right": { right: margin, top: margin },
        "bottom-left": { left: margin, bottom: margin },
        "bottom-right": { right: margin, bottom: margin }
      };
      const pos = positions[v.position] || positions["top-right"];
      const webcam = document.getElementById("webcam");
      webcam.style.width = size + "px";
      webcam.style.height = size + "px";
      Object.assign(webcam.style, pos);

      const ring = document.getElementById("ring");
      ring.style.borderWidth = (Number(v.borderWidth) || 4) + "px";

      const placeholder = document.getElementById("placeholder");
      placeholder.style.color = v.foreground;

      const pip = document.getElementById("pip");
      const showPip = String(v.showPip).toLowerCase() === "true";
      if (showPip) {
        const bw = 10;
        pip.style.borderWidth = bw + "px";
        pip.style.borderColor = "transparent transparent transparent " + v.accent;
        // position pip on the outer edge based on corner
        if (v.position === "top-right") { pip.style.right = (size * 0.15) + "px"; pip.style.bottom = (size * 0.08) + "px"; pip.style.transform = "rotate(-15deg)"; }
        else if (v.position === "top-left") { pip.style.left = (size * 0.15) + "px"; pip.style.bottom = (size * 0.08) + "px"; pip.style.transform = "rotate(15deg) scaleX(-1)"; }
        else if (v.position === "bottom-right") { pip.style.right = (size * 0.15) + "px"; pip.style.top = (size * 0.08) + "px"; pip.style.transform = "rotate(15deg)"; }
        else { pip.style.left = (size * 0.15) + "px"; pip.style.top = (size * 0.08) + "px"; pip.style.transform = "rotate(-15deg) scaleX(-1)"; }
      } else {
        pip.style.display = "none";
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".webcam", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.2);
      tl.fromTo(".ring", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.to(".ring", { scale: 1.03, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
      tl.fromTo(".pip", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.9);
      tl.to(".scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 5.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
