<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"DEADLINE / 今日截止"},{"id":"month","name":"月份","type":"string","label":"日历卡顶部月份（如「11 月」）","default":"11 月"},{"id":"day","name":"日期","type":"number","label":"日历卡上的日期","default":13},{"id":"weekday","name":"星期","type":"string","label":"星期（如「星期五」）","default":"星期五"},{"id":"title","name":"主标题","type":"string","label":"右侧主标题（中文大字）","default":"今天 24:00 准时收摊"},{"id":"deadline","name":"截止时间","type":"string","label":"截止时间戳","default":"今日 24:00"},{"id":"desc","name":"截止说明","type":"string","label":"截止说明（一行）","default":"过了这一档，明天恢复日常价，不追加不延期"},{"id":"note","name":"口径说明","type":"string","label":"底部口径说明（一行 mono）","default":"口径：以服务器时间为准 · 时区 GMT+8"},{"id":"accent","name":"强调色","type":"color","label":"强调色（日历顶条 / 斜纹带）","default":"#FF5FA2"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":5.5},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="日历物件构图：左侧一张 520px 宽的日历卡，顶部强调色月头条压着巨型日期数字，右侧截止大字与截止时间并排，反白说明条收尾">
<title>今日截止日历卡 · 今天 24:00 准时收摊</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .top{flex:0 0 auto;height:68px;display:flex;align-items:center;gap:22px;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .top .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .top .eb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}

  .main{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:64px;
    padding:34px 72px 40px;overflow:hidden}

  /* 日历卡：顶部月头条 + 主体巨型日期 */
  .cal{flex:0 0 520px;display:flex;flex-direction:column;
    border:var(--bw) solid var(--ink);border-radius:4px;
    box-shadow:10px 10px 0 var(--ink);overflow:hidden;background:var(--white)}
  .calTop{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    padding:20px 0;background:var(--accent);color:var(--ink);
    border-bottom:var(--bw) solid var(--ink)}
  .calTop .m{white-space:nowrap;font-family:var(--mono);font-weight:900;font-size:52px;
    letter-spacing:.1em;max-width:100%;overflow:hidden}
  .calBody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px 20px}
  .calBody .d{display:block;white-space:nowrap;font-family:var(--mono);font-weight:900;
    font-size:260px;line-height:.9;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .calBody .w{white-space:nowrap;font-size:34px;font-weight:900;letter-spacing:0;
    padding:8px 22px;background:var(--ink);color:var(--yellow);
    border:var(--bw) solid var(--ink);border-radius:9999px}

  /* 右侧截止文案 */
  .side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:30px;
    overflow:hidden}
  .side .tt{display:block;white-space:nowrap;font-weight:900;font-size:96px;
    line-height:1.06;letter-spacing:0;max-width:100%;overflow:hidden;
    text-overflow:ellipsis}
  .side .dl{align-self:flex-start;display:inline-flex;align-items:center;gap:18px;
    padding:16px 34px;background:var(--ink);color:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--accent);
    font-family:var(--mono);font-weight:900;font-size:40px;letter-spacing:.04em;
    white-space:nowrap}
  .side .ds{display:block;white-space:nowrap;font-size:32px;font-weight:700;
    letter-spacing:0;color:var(--mute);max-width:100%;overflow:hidden;
    text-overflow:ellipsis}
  .rule{border-top:var(--bw) solid var(--ink)}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:0 72px 24px}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.08em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="top anim" id="top">
    <span class="tag">TODAY</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">DEADLINE / 今日截止</span>
  </div>

  <div class="main anim" id="main">
    <div class="cal anim" id="cal">
      <div class="calTop"><span class="m anim" id="month" data-fit-max="52" data-fit-min="28">11 月</span></div>
      <div class="calBody">
        <span class="d anim" id="day" data-fit-max="260" data-fit-min="110">13</span>
        <span class="w anim" id="weekday" data-fit-max="34" data-fit-min="20">星期五</span>
      </div>
    </div>

    <div class="side">
      <span class="tt anim" id="title" data-fit-max="96" data-fit-min="42">今天 24:00 准时收摊</span>
      <span class="dl anim" id="deadline" data-fit-max="40" data-fit-min="22">今日 24:00</span>
      <span class="ds anim" id="desc" data-fit-max="32" data-fit-min="18">过了这一档，明天恢复日常价，不追加不延期</span>
      <div class="rule"></div>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：以服务器时间为准 · 时区 GMT+8</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'month', 'weekday', 'title', 'deadline', 'desc', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  var d = Number(v.day);
  if (!isFinite(d)) d = 1;
  d = Math.max(1, Math.min(31, Math.round(d)));
  set('day', String(d));

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#top',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#main', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .15);
    tl.fromTo('#foot', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .35);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .5);
    B.hold(tl, 1.2, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#top',     0.00,   0, -68, 0.26);
  slam('#eyebrow', 0.14, -24, -20, 0.22);
  /* 日历卡整张从左侧斜向拍入 */
  tl.fromTo('#cal', { x: -80, y: -40 },
      { x: 0, y: 0, duration: .3, ease: 'power4.out' }, 0.36);
  shadowBounce('#cal', '10px 10px 0 ' + INK, 0.70);
  slam('#month',   0.70,   0, -24, 0.24);
  slam('#day',     0.82,   0, -28, 0.26);
  slam('#weekday', 1.00,   0, -20, 0.22);
  /* 右侧截止文案自右画外切入 */
  tl.fromTo('#title', { x: 90 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.66);
  slam('#deadline', 0.94,   0, -24, 0.24);
  slam('#desc',     1.10,   0, -20, 0.22);
  tl.fromTo('.rule', { scaleX: 0, transformOrigin: 'left center' },
      { scaleX: 1, duration: .26, ease: 'power4.out' }, 1.26);
  slam('#foot',      1.40,   0,  28, 0.26);
  slam('#note',      1.52, -24, -20, 0.22);
  slam('#stripe',    1.62,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 1.86);

  var introEnd = 3.06;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 5.5));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
