<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "眉标（mono + 大字距，≤12 字）", "default": "EQ / 两行对比"}, {"id": "titleA", "name": "主标题 · 前段", "type": "string", "label": "主标题第一行（普通字，≤6 字）", "default": "压掉的那一段，"}, {"id": "titleB", "name": "主标题 · 彩色词块", "type": "string", "label": "主标题第二行（强调色块里的词，≤4 字）", "default": "就是答案"}, {"id": "sub", "name": "副标题", "type": "string", "label": "副标题（一行短句，≤24 字）", "default": "上排原声，下排压过：底噪抬起来，峰顶削下去"}, {"id": "deck", "name": "频段说明", "type": "string", "label": "底部 mono 说明（≤18 字）", "default": "RAW 0–1000 · COMP 动态压缩"}, {"id": "peaks", "name": "音频包络", "type": "string", "label": "离线 RMS 包络（JSON 数组，整数 0–1000；换音轨后用离线脚本重算）", "default": "591,447,705,346,907,401,629,857,464,586,646,764,371,662,857,333,637,1000,388,637,840,388,608,658,684,342,620,835,346,603,1000,354,608,835,392,612,747,603,401,624,835,350,620,996,354,679,743,515"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色（下排处理后柱 / 中线 / 斜纹带）", "default": "#FF5FA2"}, {"id": "duration", "name": "总时长", "type": "number", "label": "总时长（秒，须等于音轨长度 5.6）", "default": 5.6}, {"id": "exportMode", "name": "导出格式", "type": "enum", "label": "Format", "default": "mp4", "hidden": true, "options": [{"value": "mp4", "label": "MP4"}, {"value": "webm", "label": "WebM"}, {"value": "transparent", "label": "透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>两行对比均衡 · 原声和处理后</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  @media (prefers-reduced-motion: reduce){
    /* transition-property 的初始值是 all，只压 duration 会让**所有内联样式改动**
       都变成 0.01ms 的过渡——本族每条都有 JS 写死的内联几何（播放头 left/top、
       峰值保持线 bottom），降级分支里会卡在 CSS 旧值不动，渲染出错误位置，
       而 motion-qc 只看最终帧出框、不看降级分支的几何正确性，全绿也照样错。
       补上 transition-property:none 与 animation-name:none 才是完整写法。 */
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important;
      transition-property:none !important;animation-name:none !important}
  }

  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FF5FA2;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .promo{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:center;
    gap:14px;background:var(--accent);color:var(--ink);font-size:22px;font-weight:700;
    letter-spacing:.06em}
  .promo .ptag{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;
    background:var(--ink);color:var(--yellow);padding:3px 14px;border-radius:9999px}
  .promo .parw{font-weight:900}

  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:40px 72px 34px}

  .hd{flex:0 0 auto;height:32px;line-height:32px}
  .hd .eyebrow{min-width:0;font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.14em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stack{flex:0 0 auto;margin-top:26px}
  .line{display:block;font-size:86px;font-weight:900;line-height:1.05;white-space:nowrap}
  .chip{display:inline-block;line-height:1;padding:0 18px;background:var(--blue);color:var(--white);
    border:var(--bw) solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--ink)}
  .sub{min-width:0;margin-top:14px;font-size:29px;font-weight:700;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 两行对比：上排原声（墨柱）、下排处理后（强调色柱），中间 3px 黑线是唯一分隔 */
  .eqwrap{flex:0 0 auto;position:relative;margin-top:34px;height:390px}
  .row{position:absolute;left:0;right:0;display:flex;align-items:flex-end;
    justify-content:space-between;padding:0 6px}
  .row i{display:block;width:22px;height:8px;border-radius:9999px}
  .row.up{top:0;height:190px}
  .row.up i{background:var(--ink)}
  .row.dn{bottom:0;height:190px}
  .row.dn i{background:var(--accent)}
  .axis{position:absolute;left:0;right:0;top:50%;height:var(--bw);background:var(--ink);
    transform:translateY(-1.5px);z-index:4}
  .tagrow{position:absolute;left:0;right:0;display:flex;justify-content:space-between;
    font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.14em;color:var(--mute)}
  .tagrow.up{top:-2px}
  .tagrow.dn{bottom:-2px}

  #head{position:absolute;left:72px;top:0;width:5px;height:390px;background:var(--ink);z-index:6}
  #head .cap{position:absolute;left:-8px;top:-9px;width:21px;height:21px;background:var(--yellow);
    border:var(--bw) solid var(--ink);border-radius:4px}

  .deck{flex:0 0 auto;margin-top:auto;display:flex;align-items:center;gap:24px;
    border-top:var(--bw) solid var(--ink);padding-top:20px}
  .deck .dm{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.12em;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck .ticks{flex:1 1 auto;display:flex;justify-content:space-between;min-width:0;
    border-bottom:var(--bw) dashed var(--ink);padding-bottom:8px}
  .deck .ticks i{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.06em;
    color:var(--mute);font-style:normal;white-space:nowrap}
  .deck .tc{font-family:var(--mono);font-weight:900;font-size:26px;letter-spacing:.08em;
    font-variant-numeric:tabular-nums;white-space:nowrap}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    border-bottom:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  .foot{flex:0 0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:var(--ink);color:var(--white)}
  .foot .fm{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.14em;
    color:var(--yellow)}
  .foot .fc{font-size:25px;font-weight:700;white-space:nowrap}

  #head,#head .cap{transition:none}
</style>
<style>
/* [公开版] 原实拍视频未随仓分发，此处为占位块 */
.pub-media-placeholder{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.11) 12px 24px),
    rgba(120,120,130,.22);
  border:1px dashed rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
}
.pub-media-placeholder::after{
  content:"公开版未包含实拍素材";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font:400 20px/1.4 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
</style>
</head>
<body>
<div id="stage">
  <div class="promo anim" id="promo">
    <span class="ptag">COMP</span><span class="ptx">两行对比均衡 · 原声 / 压缩后</span><span class="parw">→</span>
  </div>

  <div class="main anim" id="main">
    <div class="hd">
      <span class="eyebrow anim" id="eyebrow">EQ / 两行对比</span>
    </div>
    <div class="stack">
      <span class="line anim" id="titleA" data-fit-max="86" data-fit-min="43">压掉的那一段，</span>
      <span class="line anim" id="lineB"><span class="chip" id="titleB" data-fit-max="86" data-fit-min="43">就是答案</span></span>
      <p class="sub anim" id="sub" data-fit-max="29" data-fit-min="15">上排原声，下排压过：底噪抬起来，峰顶削下去</p>
    </div>
    <div class="eqwrap" id="eqwrap">
      <span class="tagrow up"><span>RAW</span><span>0–1000</span></span>
      <div class="row up" id="rowUp"></div>
      <div class="axis"></div>
      <div class="row dn" id="rowDn"></div>
      <span class="tagrow dn"><span>COMP</span><span>0.30–0.82</span></span>
    </div>
    <div class="deck">
      <span class="dm anim" id="deck" data-fit-max="24" data-fit-min="14">RAW 0–1000 · COMP 动态压缩</span>
      <span class="ticks"><i>0s</i><i>1s</i><i>2s</i><i>3s</i><i>4s</i><i>5s</i></span>
      <span class="tc anim" id="tc">00:00 / 00:05</span>
    </div>
  </div>

  <div id="head"><span class="cap"></span></div>

  <div class="stripe anim" id="stripe"></div>
  <div class="foot anim" id="foot">
    <span class="fm">AUD / 2026</span><span class="fc">两排共用同一条时间轴，不是两张图</span>
  </div></div>
<!-- [公开版] 原音轨 音轨 voice-04.wav（未随仓分发） 未随仓分发（体积/授权原因）。波形与包络数据已内置，动画照常播放。 -->
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  /* ---------- 音频包络：offline RMS，烘在 peaks 变量里 ----------
     这份数组来自 音轨 voice-04.wav（未随仓分发） 的离线解码（RMS，48 桶，归一到 0–1000），
     由 离线包络脚本（未随仓分发） 算出，同时落一份
     assets/voice-04.peaks.json 作溯源。
     换音轨：换 wav → 重跑离线脚本 → 把新数组填进 peaks → 同步 duration 与
     <audio data-duration>。这是一条显式的、算一次的步骤，不是缺陷。
     为什么绝不接实时 AnalyserNode：无头渲染是逐帧 seek 采样，媒体在采集模式下
     是 seek 不是 play（hyperframes runtime 的 allowLiveTimelineSeek 在
     __HF_RENDER_CAPTURE_MODE 下为 false），探针接在暂停的元素上读到的不是
     「此刻在放什么」；motion-qc 的探针同样是无序 seek。 */
  var FALLBACK_PEAKS = '591,447,705,346,907,401,629,857,464,586,646,764,371,662,857,333,637,1000,388,637,840,388,608,658,684,342,620,835,346,603,1000,354,608,835,392,612,747,603,401,624,835,350,620,996,354,679,743,515';
  function parsePeaks(src) {
    var raw = String(src == null ? '' : src).replace(/[\s\[\]]/g, '');
    var parts = raw ? raw.split(',') : [];
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i]);
      if (isFinite(n)) out.push(Math.max(0, Math.min(1000, n)));
    }
    return out.length >= 8 ? out : parsePeaks(FALLBACK_PEAKS);
  }
  var PEAKS = parsePeaks(v.peaks);
  function peakAt(k) {
    return PEAKS[Math.max(0, Math.min(PEAKS.length - 1, k))];
  }

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow','titleA','titleB','sub','deck'].forEach(function (k) { set(k, v[k]); });


  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  /* 音频窗口：时间轴总长严格等于音轨长度，尾部留 0.6s 静音 + 定格。
     禁止用变量值推算总长（数值填大会撞 SMOKE_TOO_LONG）。 */
  var TOTAL = Math.min(6.5, Math.max(5, Number(v.duration) || 5.6));
  var AUDIO_LEN = 5.6;
  var WIN = Math.max(1.2, Math.min(TOTAL - 0.6, AUDIO_LEN));
  var N = PEAKS.length;

  var COLS = 36, MAXH = 190, MINH = 10, STEPS = N, SEG = WIN / STEPS, SPREAD = N / COLS;

  /* 压缩曲线：把动态范围往中间收——x=0 抬到 0.30（底噪不消失），x=1 压到 0.82（峰顶不削爆）。
     两排读同一个 peaks、同一个时间桶 k，差别只有这条曲线。 */
  function comp(x) { return 0.30 + 0.52 * Math.pow(x, 0.55); }
  function upAt(c, k) {
    var idx = Math.floor(k + c * SPREAD) % N;
    return Math.max(MINH, Math.round(PEAKS[idx] / 1000 * MAXH));
  }
  function dnAt(c, k) {
    var idx = Math.floor(k + c * SPREAD) % N;
    return Math.max(MINH, Math.round(comp(PEAKS[idx] / 1000) * MAXH));
  }

  var ups = [], dns = [];
  var ru = document.getElementById('rowUp'), rd = document.getElementById('rowDn');
  for (var c = 0; c < COLS; c++) {
    var a = document.createElement('i'); ru.appendChild(a); ups.push(a);
    var b = document.createElement('i'); rd.appendChild(b); dns.push(b);
  }

  B.fitAll();

  var head = document.getElementById('head');
  var wr = document.getElementById('eqwrap').getBoundingClientRect();
  var sr = document.getElementById('stage').getBoundingClientRect();
  var SPAN = Math.max(10, wr.width - 5);
  head.style.left = (wr.left - sr.left) + 'px';
  head.style.top = (wr.top - sr.top) + 'px';
  head.style.height = wr.height + 'px';

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = B.tl();

  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d || 0.26, ease: 'power4.out' }, at);
  }
  function press(sel, rest, at) {
    tl.set(sel, { boxShadow: rest, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest.replace(/(\d+)px (\d+)px/, function (_, a, b) {
      return a + 'px ' + (parseInt(b, 10) + 3) + 'px'; }), duration: 0.04, ease: 'steps(2)' }, at + 0.04);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.08);
  }
  function fadeInReduce(ids, start) {
    for (var i = 0; i < ids.length; i++) {
      tl.fromTo(ids[i], { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: i === ids.length - 1 ? .6 : .5, ease: 'power3.out' },
        start + i * 0.08);
    }
  }

  if (reduce) {
    /* 降级：两排都定格在 62% 处那一帧（上排墨柱、下排强调色柱的对比关系仍然成立），
       播放头停 62%，时间码停 00:03。 */
    var still = Math.round(N * 0.62);
    gsap.set(ups, { height: (function (k) { return function (i) { return upAt(i, k); }; })(still) });
    gsap.set(dns, { height: (function (k) { return function (i) { return dnAt(i, k); }; })(still) });
    gsap.set('#head', { x: SPAN * 0.62, y: 0, opacity: 1 });
    gsap.set('#tc', { textContent: '00:03 / 00:05' });
    fadeInReduce(['#promo', '#main', '#head', '#stripe', '#foot'], 0);
    B.hold(tl, 1.15, 1.15);
    return;
  }

  slam('#promo', 0.00, 0, -56, 0.26);
  slam('#eyebrow', 0.16, 0, -20, 0.22);
  slam('#titleA', 0.34, -34, -34, 0.28);
  slam('#lineB', 0.52, -34, -34, 0.28);
  press('#titleB', '8px 8px 0 ' + '#0F0F0F', 0.80);
  slam('#sub', 0.72, 0, -20, 0.24);
  slam('#eqwrap', 0.88, 0, 24, 0.26);

  /* ---- 音频驱动：两排柱共用同一条时间轴 ---- */
  for (var k = 0; k < STEPS; k++) {
    tl.to(ups, { height: (function (kk) { return function (i) { return upAt(i, kk); }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
    tl.to(dns, { height: (function (kk) { return function (i) { return dnAt(i, kk); }; })(k),
      duration: SEG, ease: 'none' }, k * SEG);
  }
  tl.fromTo('#head', { x: 0 }, { x: SPAN, duration: WIN, ease: 'none' }, 0);
  var tcEl = document.getElementById('tc');
  for (var s = 0; s <= Math.floor(WIN); s++) {
    tl.set(tcEl, { textContent: '00:' + (s < 10 ? '0' + s : String(s)) + ' / 00:0' + Math.ceil(WIN) }, s);
  }
  tl.set(tcEl, { textContent: '00:0' + Math.ceil(WIN) + ' / 00:0' + Math.ceil(WIN) }, WIN);

  slam('#foot', 0.96, 0, 26, 0.26);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '40px', duration: 0.8, ease: 'none' }, 1.08);

  /* 收尾：音频窗口走完后补一段静止，时间轴总长恰好等于音轨长度，
     样片视频与音轨严丝合缝，最后一拍是「已播完」的定格画面。 */
  var introEnd = tl.duration();
  B.hold(tl, introEnd, Math.max(0.4, TOTAL - introEnd));
})();
</script>
</body></html>
