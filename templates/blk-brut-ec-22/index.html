<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","name":"眉标","type":"string","label":"眉标（黑条上的 mono 字）","default":"SPEC / 参数对比"},{"id":"title","name":"主标题","type":"string","label":"主标题（黑条上的一行 900 白字）","default":"四个参数，第三个直接翻倍"},{"id":"leftLabel","name":"左列名","type":"string","label":"表头左列名","default":"参数"},{"id":"rightLabel","name":"右列名","type":"string","label":"表头右列名","default":"旗舰版"},{"id":"k1","name":"参数 1","type":"string","label":"第一行参数名","default":"面料克重"},{"id":"k2","name":"参数 2","type":"string","label":"第二行参数名","default":"口袋数量"},{"id":"k3","name":"参数 3","type":"string","label":"第三行参数名","default":"保温时长"},{"id":"k4","name":"参数 4","type":"string","label":"第四行参数名","default":"整机重量"},{"id":"a1","name":"普通版 1","type":"string","label":"第一行普通版值","default":"180 g"},{"id":"a2","name":"普通版 2","type":"string","label":"第二行普通版值","default":"2 个"},{"id":"a3","name":"普通版 3","type":"string","label":"第三行普通版值","default":"3 小时"},{"id":"a4","name":"普通版 4","type":"string","label":"第四行普通版值","default":"420 g"},{"id":"b1","name":"旗舰版 1","type":"string","label":"第一行旗舰版值","default":"320 g"},{"id":"b2","name":"旗舰版 2","type":"string","label":"第二行旗舰版值","default":"4 个"},{"id":"b3","name":"旗舰版 3","type":"string","label":"第三行旗舰版值","default":"6 小时"},{"id":"b4","name":"旗舰版 4","type":"string","label":"第四行旗舰版值","default":"380 g"},{"id":"hotLabel","name":"高亮标签","type":"string","label":"高亮行的角标","default":"关键项"},{"id":"note","name":"口径说明","type":"string","label":"口径说明（一行 mono）","default":"口径：均为实验室实测值 · 误差 ±3%"},{"id":"accent","name":"强调色","type":"color","label":"强调色（高亮行 / 斜纹带）","default":"#FFD429"},{"id":"duration","name":"总时长","type":"number","label":"总时长（秒，5–6）","default":6},{"id":"exportMode","name":"导出格式","type":"enum","label":"Format","default":"mp4","hidden":true,"options":[{"value":"mp4","label":"MP4"},{"value":"webm","label":"WebM"},{"value":"transparent","label":"透明底"}]}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="满版参数表构图：表头行加四行参数左右两列并置，第三行整行压强调色并带一枚高亮角标，行间 3px 实线分隔">
<title>参数对比表 · 四个参数，第三个直接翻倍</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  :root{
    --ink:#0F0F0F; --paper:#FFF6E5; --pink:#FF5FA2; --yellow:#FFD429;
    --blue:#3D7BFF; --green:#2FD07A; --white:#FFFFFF; --mute:#6B6B6B; --bw:3px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --mono:"Sarasa Gothic SC","JetBrains Mono",Consolas,"Courier New",monospace;
    --accent:#FFD429;
  }
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .hd{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 72px;height:74px;
    background:var(--ink);color:var(--white)}
  .hd .tag{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.12em;padding:4px 18px;background:var(--accent);color:var(--ink);
    border-radius:9999px;white-space:nowrap}
  .hd .eb{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.14em;color:var(--yellow)}
  .hd .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:38px;font-weight:900;letter-spacing:0;text-align:right}

  /* 表头：mono 键名，与数据行的 sans 参数名成对出现（基因 9） */
  .thead{flex:0 0 auto;display:flex;align-items:center;gap:32px;padding:0 72px;
    height:64px;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
  .thead .k1{flex:0 0 620px;white-space:nowrap;font-family:var(--mono);font-weight:700;
    font-size:24px;letter-spacing:.14em;color:var(--mute)}
  .thead .k2{flex:1 1 0;min-width:0;overflow:hidden;text-align:right;
    font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.14em;
    color:var(--mute);white-space:nowrap}

  .table{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .tr{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:32px;
    padding:0 72px;background:var(--white);border-bottom:var(--bw) solid var(--ink);
    position:relative}
  .tr:last-child{border-bottom:0}
  .tr .k{flex:0 1 620px;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:36px;font-weight:900;letter-spacing:0}
  .tr .a{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:right;font-family:var(--mono);font-weight:700;
    font-size:52px;letter-spacing:0;color:var(--mute);
    font-variant-numeric:tabular-nums}
  .tr .b{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:right;font-family:var(--mono);font-weight:900;
    font-size:64px;letter-spacing:0;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  /* 唯一的高亮行：整行换底色 + 8px 硬阴影，是全表唯一重音 */
  .tr.hot{background:var(--accent);box-shadow:10px 10px 0 var(--ink);z-index:2}
  .tr.hot .k{font-size:42px}
  .tr.hot .a{color:var(--ink)}
  .tr.hot .b{font-size:96px}
  /* 角标类名不许叫 .hot —— 会跟高亮行选择器 .tr.hot 撞上，把整行改成绝对定位 */
  .tagmark{flex:0 0 auto;position:absolute;right:0;top:0;background:var(--ink);
    color:var(--accent);border:var(--bw) solid var(--ink);border-top:0;
    box-shadow:6px 6px 0 var(--white);
    font-family:var(--mono);font-weight:900;font-size:22px;padding:8px 18px;
    border-radius:0 0 0 4px;letter-spacing:.08em}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:22px 72px 28px;
    border-top:var(--bw) solid var(--ink)}
  .foot .sq{flex:0 0 auto;width:22px;height:22px;background:var(--accent);
    border:var(--bw) solid var(--ink);border-radius:4px}
  .foot .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:24px;
    letter-spacing:.06em;color:var(--mute)}

  .stripe{flex:0 0 auto;height:20px;border-top:var(--bw) solid var(--ink);
    background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}

  @media (prefers-reduced-motion: reduce){
    .anim{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="hd anim" id="hd">
    <span class="tag">SPEC</span>
    <span class="eb anim" id="eyebrow" data-fit-max="24" data-fit-min="15">SPEC / 参数对比</span>
    <span class="tt anim" id="title" data-fit-max="38" data-fit-min="20">四个参数，第三个直接翻倍</span>
  </div>

  <div class="thead anim" id="thead">
    <span class="k1 anim" id="leftLabel" data-fit-max="24" data-fit-min="15">参数</span>
    <span class="k2 anim" id="rightLabel" data-fit-max="24" data-fit-min="15">旗舰版</span>
  </div>

  <div class="table anim" id="table">
    <div class="tr anim" id="r1">
      <span class="k anim" id="k1" data-fit-max="36" data-fit-min="19">面料克重</span>
      <span class="a anim" id="a1" data-fit-max="52" data-fit-min="26">180 g</span>
      <span class="b anim" id="b1" data-fit-max="64" data-fit-min="32">320 g</span>
    </div>
    <div class="tr anim" id="r2">
      <span class="k anim" id="k2" data-fit-max="36" data-fit-min="19">口袋数量</span>
      <span class="a anim" id="a2" data-fit-max="52" data-fit-min="26">2 个</span>
      <span class="b anim" id="b2" data-fit-max="64" data-fit-min="32">4 个</span>
    </div>
    <div class="tr hot anim" id="r3">
      <span class="k anim" id="k3" data-fit-max="42" data-fit-min="22">保温时长</span>
      <span class="a anim" id="a3" data-fit-max="52" data-fit-min="26">3 小时</span>
      <span class="b anim" id="b3" data-fit-max="96" data-fit-min="44">6 小时</span>
      <span class="tagmark anim" id="hotLabel" data-fit-max="22" data-fit-min="14">关键项</span>
    </div>
    <div class="tr anim" id="r4">
      <span class="k anim" id="k4" data-fit-max="36" data-fit-min="19">整机重量</span>
      <span class="a anim" id="a4" data-fit-max="52" data-fit-min="26">420 g</span>
      <span class="b anim" id="b4" data-fit-max="64" data-fit-min="32">380 g</span>
    </div>
  </div>

  <div class="foot anim" id="foot">
    <span class="sq"></span>
    <span class="tx anim" id="note" data-fit-max="24" data-fit-min="15">口径：均为实验室实测值 · 误差 ±3%</span>
  </div>

  <div class="stripe anim" id="stripe"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script><script>

/* ── 公开版自播引导 ──────────────────────────────────────────────
   模板里的时间轴默认是暂停的（gsap.timeline({paused:true}) 或 blocks.js 的
   B.tl() 默认 paused:true）——这是为 hyperframes 离线渲染设计的：渲染器手动
   seek 时间轴逐帧出片。在站点里由播放器注入脚本启动；但把模板单独拷出来
   双击打开时没人接管，元素会停在 opacity:0 的初始态，看起来是黑屏。

   这里补一个最小播放器：
     1) 接管 blocks.js 的 B.tl()（原封装不注册全局），把时间轴收进 __timelines；
     2) 启动所有「已注册且仍暂停」的时间轴，循环播放。
   不改动模板自身的动画逻辑与参数。
   ────────────────────────────────────────────────────────────── */
(function () {
  var registry = (window.__timelines = window.__timelines || {});

  /* 1) 接管 B.tl() —— blocks.js 导出的是 window.BBlocks */
  try {
    var BB = window.BBlocks;
    if (BB && typeof BB.tl === 'function' && !BB.__publicPatched) {
      var origTl = BB.tl;
      BB.tl = function () {
        var tl = origTl.apply(this, arguments);
        try {
          if (tl && !tl.__publicReg) {
            tl.__publicReg = true;
            registry['b_' + (registry.__n = (registry.__n || 0) + 1)] = tl;
          }
        } catch (e) {}
        return tl;
      };
      BB.__publicPatched = true;
    }
  } catch (e) {}

  /* 2) 启动时间轴 */
  function boot() {
    Object.keys(registry).forEach(function (k) {
      var tl = registry[k];
      try {
        if (!tl || typeof tl.play !== 'function') return;   // 不是 timeline，跳过
        if (typeof tl.paused === 'function' && tl.paused() && tl.duration() > 0) {
          tl.repeat(-1);
          tl.repeatDelay(0.6);
          tl.play(0);
        }
      } catch (e) { /* 单条失败不影响其余 */ }
    });
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  setTimeout(boot, 300);
})();

</script>

<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();

  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  ['eyebrow', 'title', 'leftLabel', 'rightLabel',
   'k1', 'k2', 'k3', 'k4', 'a1', 'a2', 'a3', 'a4', 'b1', 'b2', 'b3', 'b4',
   'hotLabel', 'note']
    .forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);

  B.fitAll();
  var tl = B.tl();

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    gsap.set('.anim', { x: 0, y: 0, scale: 1, scaleX: 1, rotate: 0 });
    tl.fromTo('#hd',    { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 0);
    tl.fromTo('#thead', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .12);
    tl.fromTo('#table', { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .24);
    tl.fromTo('#foot',  { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .42);
    tl.fromTo('#stripe',{ opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .58);
    B.hold(tl, 1.3, 1.1);
    return;
  }

  var INK = '#0F0F0F';
  function slam(sel, at, dx, dy, d) {
    tl.fromTo(sel, { x: dx, y: dy },
      { x: 0, y: 0, duration: d, ease: 'power4.out' }, at);
  }
  function shadowBounce(sel, rest, at) {
    var off = parseInt(rest, 10);
    tl.set(sel, { boxShadow: off + 'px ' + (off + 3) + 'px 0 ' + INK, immediateRender: false }, at);
    tl.to(sel, { boxShadow: rest, duration: 0.04, ease: 'steps(2)' }, at + 0.04);
  }

  slam('#hd',        0.00,   0, -74, 0.26);
  slam('#eyebrow',   0.14, -24, -20, 0.22);
  slam('#title',     0.20,  24, -20, 0.24);
  slam('#thead',     0.32,   0, -20, 0.22);
  slam('#leftLabel', 0.38, -24, -18, 0.2);
  slam('#rightLabel',0.44,  24, -18, 0.2);
  /* 模 7 分格揭示：四行自左画外依次硬切入，第三行高亮行最后落、落得最重 */
  tl.fromTo('#r1', { x: -120 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.56);
  tl.fromTo('#r2', { x: -120 }, { x: 0, duration: .28, ease: 'power4.out' }, 0.72);
  tl.fromTo('#r3', { x: -120 }, { x: 0, duration: .30, ease: 'power4.out' }, 0.88);
  tl.fromTo('#r4', { x: -120 }, { x: 0, duration: .28, ease: 'power4.out' }, 1.06);
  slam('#k1', 0.72,    0, -20, 0.22);
  slam('#k2', 0.88,    0, -20, 0.22);
  slam('#k3', 1.06,    0, -20, 0.22);
  slam('#k4', 1.22,    0, -20, 0.22);
  slam('#a1', 0.80,   24, -18, 0.2);
  slam('#a2', 0.96,   24, -18, 0.2);
  slam('#a3', 1.14,   24, -18, 0.2);
  slam('#a4', 1.30,   24, -18, 0.2);
  slam('#b1', 0.84,   24, -18, 0.2);
  slam('#b2', 1.00,   24, -18, 0.2);
  slam('#b3', 1.18,   24, -18, 0.2);
  slam('#b4', 1.34,   24, -18, 0.2);
  shadowBounce('#r3', '10px 10px 0 ' + INK, 1.48);
  slam('#hotLabel',     1.60,   0, -20, 0.22);
  slam('#foot',       1.74,   0,  28, 0.26);
  slam('#note',       1.86, -24, -20, 0.22);
  slam('#stripe',     1.96,   0,  24, 0.24);
  tl.fromTo('#stripe', { backgroundPositionX: '0px' },
    { backgroundPositionX: '60px', duration: 1.2, ease: 'none' }, 2.20);

  var introEnd = 3.40;
  var total = Math.min(6, Math.max(5, Number(v.duration) || 6));
  B.hold(tl, introEnd, Math.max(0.6, total - introEnd));
})();
</script>
</body></html>
